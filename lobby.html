<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>민민이네 공부방 - 대형 로비</title>

<!-- 모바일 웹 앱 메타 태그 및 PWA 파비콘 -->
<meta name="theme-color" content="#6EC6F5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" type="image/png" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="manifest" href="./manifest.json?v=20260923_v1">

<link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700&family=Jua&family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./kids/css/design-system.css">
<link rel="stylesheet" href="./kids/css/quick-uploader.css">
<link rel="stylesheet" href="./kids/css/fairy-settings-modal.css">
<link rel="stylesheet" href="./kids/css/lobby.css">
</head>
<body>

<div class="bg-floats" id="bgFloats"></div>

<div class="screen" id="screen-subjects" style="display: flex;">
  <!-- 🛠️ 상단 고정 유틸리티 바 (뒤로가기, 5분 퀘스트 퀵 칩, 관리자 스위처, 구석 TTS, 설정) -->
  <div class="lobby-top-bar">
    <div class="lobby-top-left">
      <a href="index.html" class="top-back-btn">← 프로필</a>
      <a href="monster_lab.html" class="top-back-btn monster-lab-quick-chip" id="lobbyMonsterLabBtn" title="3D 몬스터 바이트와 5분 일일 퀘스트 출격!">👾 5분 퀘스트</a>
    </div>
    <div class="admin-child-switcher" id="adminChildSwitcher"></div>
    <div class="lobby-top-right">
      <button type="button" class="qu-trigger-btn" style="padding: 7px 14px; font-size: 0.88rem;" onclick="openQuickUploader({ defaultAuthor: (typeof currentChild !== 'undefined' && currentChild === 'minseo') ? '민서' : '민수' })">
        <span>📸</span> 찰칵! 올리기
      </button>
      <button type="button" class="compact-tts-btn" id="lobbySettingsBtn" onclick="if(typeof SettingsManager !== 'undefined') SettingsManager.openModal();" style="background: linear-gradient(135deg, #3b82f6, #2563eb); color: #fff; border: 1.5px solid #60a5fa;" title="공부방 맞춤 설정">⚙️ 설정</button>
      <button type="button" class="compact-tts-btn" id="ttsToggleBtn" onclick="toggleFairyTtsSetting()">🔊 요정 음성 ON</button>
    </div>
  </div>

  <!-- 💡 메인 타이틀 & 환영 인사 -->
  <h1 class="main-title" id="mainLobbyTitle"><span class="accent2">민민이네</span><br><span class="accent">공부방</span></h1>
  <div class="user-welcome"><span id="welcomeMessage">안녕하세요!</span></div>

  <!-- 🧚 상황별 요정 코코 반응형 인터랙티브 말풍선 배너 -->
  <div class="lobby-speech-bubble" id="lobbySpeechBubble" onclick="handleFairyBubbleClick()">
    <div class="bubble-avatar-box">
      <span class="bubble-avatar" id="bubbleAvatar">🧚</span>
      <span class="bubble-pulse"></span>
    </div>
    <div class="bubble-content">
      <div class="bubble-badge" id="bubbleBadge">☀️ 상쾌한 하루 시작</div>
      <div class="bubble-text" id="bubbleText">
        반가워요! 오늘의 신나는 공부방 모험을 시작해볼까요?
      </div>
    </div>
    <button type="button" class="bubble-voice-btn" id="bubbleVoiceBtn" onclick="speakBubbleMessage(event)" title="요정 목소리로 듣기">
      🔊
    </button>
  </div>

  <!-- 👾 5분 일일 퀘스트 하이라이트 배너 (몬스터 연구실 직결) -->
  <a href="monster_lab.html" class="quest-quick-banner" id="questQuickBanner">
    <div class="quest-quick-content">
      <span class="quest-quick-icon">👾</span>
      <div class="quest-quick-text">
        <div class="quest-quick-title">
          오늘의 5분 퀘스트 출격하기!
          <span class="quest-quick-tag">🔥 불꽃 스트릭</span>
        </div>
        <p class="quest-quick-desc">3D 클레이 몬스터와 함께 나눗셈·영어 5문제 풀고 보상 다이아💎 챙기기!</p>
      </div>
    </div>
    <span class="quest-quick-arrow">➔</span>
  </a>

  <!-- 📦 4대 상단 핵심 히어로 바 (인벤토리 보상 + 폰시간 정산 + 데일리 마음일기 + 시간표) -->
  <div class="status-hero-bar">
    <div class="inventory-card" id="inventoryDisplay">
      <div class="reward-badge"><span style="font-size:1.2rem;">⏳</span> <span style="font-size:1rem; color:#888;">보상 상자 충전 중...</span></div>
    </div>
    <button type="button" class="hero-chip-btn screentime-chip-btn" id="lobbyScreenTimeBtn" onclick="if(typeof openScreenTimeReceiptModal === 'function') openScreenTimeReceiptModal(typeof finalRealName !== 'undefined' ? finalRealName : null);" style="background: linear-gradient(135deg, #10b981, #059669); color: #fff; border: 1.5px solid rgba(255,255,255,0.4); box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25); cursor: pointer;">⏰ 오늘 폰시간 정산</button>
    <button type="button" class="hero-chip-btn diary-chip-btn" id="lobbyDiaryBtn" onclick="openDailyDiaryModal()">📝 마음일기 (+5💎)</button>
    <a href="timetable.html" class="hero-chip-btn timetable-chip-btn" id="timetableLink">📅 오늘 시간표</a>
  </div>

  <!-- 🛠️ 관리자 / 보조 퀵 툴바 (성장 대시보드, 부모 일기장, 교재 이미지 체인저, 관제탑) -->
  <div class="admin-quick-toolbar" id="quickToolbar" style="display: none;">
    <button type="button" class="admin-tool-chip" style="background: linear-gradient(135deg, #10b981, #059669); color: #fff; font-weight: bold; border:none; cursor:pointer;" onclick="openQuickUploader()">📸 성장 사진 퀵 등록</button>
    <button type="button" class="admin-tool-chip" style="background: linear-gradient(135deg, #0284c7, #2563eb); color: #fff; font-weight: bold; border:none; cursor:pointer;" onclick="if(typeof syncAllNotionData==='function') syncAllNotionData();" title="공부방의 모든 노션 캐시를 초기화하고 최신 데이터로 동기화합니다">🔄 노션 전체 최신 동기화</button>
    <a href="parent_diary.html" class="admin-tool-chip diary-btn" id="parentDiaryLink" style="background: linear-gradient(135deg, #ec4899, #8b5cf6); color: #fff; font-weight: bold;">📝 엄마·아빠 일기장</a>
    <a href="parent_dashboard.html" class="admin-tool-chip dashboard-btn" id="dashboardLink">📊 실시간 통합 성장 대시보드</a>
    <a href="admin-image-changer.html" class="admin-tool-chip image-changer-btn" id="imageChangerLink" style="display:none; background: linear-gradient(135deg, #0284c7, #38bdf8); color: #fff; font-weight: bold;">🖼️ 교재 이미지 체인저</a>
    <a href="#" class="admin-tool-chip tower-btn" id="towerLink" style="display:none;" target="_blank" rel="noopener">🏰 Master Tower 관제탑</a>
  </div>

  <!-- 🗂️ 2대 메인 탭 허브 (공부방 월드 vs 나만의 아지트 & 놀이터) -->
  <div class="lobby-tab-bar">
    <button type="button" class="lobby-tab-btn active" id="tabStudy" onclick="switchLobbyTab('study')">🎓 공부방 월드</button>
    <button type="button" class="lobby-tab-btn" id="tabHideout" onclick="switchLobbyTab('hideout')">🏠 나만의 아지트 & 놀이터</button>
  </div>

  <p class="subtitle" id="lobbySubtitle">오늘 탐험하고 싶은 공부방 월드를 선택해봐!</p>

  <div class="world-grid" id="worldGrid"></div>
  
  <a href="index.html" class="back-btn">← 처음 프로필 화면으로</a>
</div>

<script src="kids/config.js"></script>
<script src="./kids/js/lobby_controller.js"></script>
<script src="./kids/core/quick-uploader.js"></script>
</body>
</html>
