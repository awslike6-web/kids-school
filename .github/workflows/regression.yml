# 공부방 회귀 시험: 퀘스트 숙련도·학습일지·일기 동기화·KST 날짜·노션 전송 계약
# 노션 운영 DB에는 접속하지 않는다 (모의 fetch). 빌더는 임시 구조와 Pillow로 검사한다.
name: 공부방 회귀 시험

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # 커밋 메시지 검사가 푸시 범위를 읽는다
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: 갤러리 빌더 시험 의존성 준비
        run: python -m pip install Pillow==12.3.0
      - name: 회귀 시험 실행
        env:
          KIDS_TEST_FULL: '1'  # 연산 스튜디오 1~999 쌍 전수(로컬 기본은 표본, tests/operator-range.mjs)
        run: node --test "tests/**/*.test.mjs"
      - name: 어휘·교재 등록기 시험 (노션 미접속)
        run: python -X utf8 -m unittest scripts/test_register_voca.py scripts/test_register_curriculum.py
      - name: 커밋 메시지 형식 검사 (Agent·교정 줄)
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "$PR_BASE" ]; then RANGE="$PR_BASE..$PR_HEAD"
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then RANGE="$AFTER~1..$AFTER"
          else RANGE="$BEFORE..$AFTER"; fi
          python -X utf8 scripts/check_commit_msg.py --range "$RANGE"
      - name: scripts 허용 목록 검사 (일회성 스크립트 차단)
        run: python -X utf8 scripts/check_scripts_allowlist.py --all
