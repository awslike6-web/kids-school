# 공부방 회귀 시험: 퀘스트 숙련도·학습일지·일기 동기화·KST 날짜·노션 전송 계약
# 노션 운영 DB에는 접속하지 않는다 (모의 fetch). 빌더는 임시 구조와 Pillow로 검사한다.
name: 공부방 회귀 시험

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # 커밋 메시지 검사가 푸시 범위를 읽는다
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: 갤러리 빌더 시험 의존성 준비
        run: python -m pip install Pillow==12.3.0
      - name: 회귀 시험 실행
        env:
          KIDS_TEST_FULL: '1'  # 연산 스튜디오 1~999 쌍 전수(로컬 기본은 표본, tests/operator-range.mjs)
        # 실패하면 시험 이름과 오류를 주석(Annotations)으로 남긴다 — 로그는 로그인해야 보이지만 주석은 공개라
        # 실패 원인을 바로 볼 수 있다(2026-11-21: 로그를 못 봐 실패가 며칠씩 방치됨). 주석은 한 단계에 10개까지 보인다.
        run: |
          if ! node --test --test-reporter=spec --test-reporter-destination=stdout \
               --test-reporter=tap --test-reporter-destination=test-results.tap "tests/**/*.test.mjs"; then
            awk '/^ *not ok/ { if (n) print n; sub(/^ *not ok [0-9]+ - /, ""); n = $0; loc = ""; grab = 0; next }
                 n && /^ +location:/ { loc = $0; sub(/^ +location: */, "", loc); gsub(/\047/, "", loc); sub(/.*\/tests\//, "tests/", loc); next }
                 n && /^ +error: *[|>]-?$/ { grab = 1; next }
                 n && /^ +error:/ { m = $0; sub(/^ +error: */, "", m); print n " (" loc ") — " m; n = ""; next }
                 n && grab && NF { m = $0; sub(/^ +/, "", m); print n " (" loc ") — " m; n = ""; grab = 0; next }
                 END { if (n) print n }' test-results.tap | head -10 |
              while IFS= read -r line; do echo "::error title=회귀 시험 실패::${line}"; done
            exit 1
          fi
      - name: 어휘·교재 등록기 시험 (노션 미접속)
        # 이 목록은 scripts/ci_local.py(PY_UNITTESTS)와 같아야 한다 — 푸시 전 훅이 같은 검사를 로컬에서 돌린다
        run: python -X utf8 -m unittest scripts/test_register_voca.py scripts/test_register_curriculum.py scripts/test_ci_local.py scripts/test_version_stamp.py
      - name: 커밋 메시지 형식 검사 (Agent·교정 줄)
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "$PR_BASE" ]; then RANGE="$PR_BASE..$PR_HEAD"
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then RANGE="$AFTER~1..$AFTER"
          else RANGE="$BEFORE..$AFTER"; fi
          python -X utf8 scripts/check_commit_msg.py --range "$RANGE"
      - name: scripts 허용 목록 검사 (일회성 스크립트 차단)
        run: python -X utf8 scripts/check_scripts_allowlist.py --all
