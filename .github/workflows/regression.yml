# 공부방 회귀 시험: 퀘스트 숙련도·학습일지·일기 동기화·KST 날짜·노션 전송 계약
# 노션 운영 DB에는 접속하지 않는다 (모의 fetch). 빌더는 임시 구조와 Pillow로 검사한다.
name: 공부방 회귀 시험

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: 갤러리 빌더 시험 의존성 준비
        run: python -m pip install Pillow==12.3.0
      - name: 회귀 시험 실행
        run: node --test "tests/**/*.test.mjs"
