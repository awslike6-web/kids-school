<!DOCTYPE html>
<html class="dark" lang="ko">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>Minsu's Monster Lab 👾</title>
  
  <!-- 모바일 웹앱 PWA 메타 & 아이콘 -->
  <meta name="theme-color" content="#130924"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <link rel="icon" type="image/png" href="./icon-192.png"/>
  <link rel="apple-touch-icon" href="./icon-192.png"/>

  <!-- Google Fonts: Jua & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""/>
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Plus+Jakarta+Sans:wght@700;800;900&display=swap" rel="stylesheet"/>
  
  <!-- Material Symbols Outlined -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "lab-bg": "#120924",
            "lab-card": "#1e1338",
            "lab-card-border": "#2d1f4e",
            "neon-green": "#39ff14",
            "neon-green-shadow": "#045300",
            "neon-cyan": "#7df4ff",
            "fire-orange": "#ff7f1c"
          },
          fontFamily: {
            "jua": ["Jua", "sans-serif"],
            "eng": ["Plus Jakarta Sans", "sans-serif"]
          }
        }
      }
    };
  </script>

  <style>
    /* 공통 기본 세팅 */
    * {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body {
      background: radial-gradient(circle at 50% 25%, #241445 0%, #120924 75%);
      min-height: 100dvh;
      font-family: 'Jua', sans-serif;
    }

    .material-symbols-outlined {
      font-variation-settings: 'FILL' 1, 'wght' 700, 'GRAD' 0, 'opsz' 24;
      display: inline-block;
      vertical-align: middle;
      line-height: 1;
    }

    /* 👾 3D 클레이 몬스터 안정적이고 잔잔한 부유 */
    @keyframes floatMonster {
      0%, 100% {
        transform: translateY(0px) rotate(0deg);
      }
      50% {
        transform: translateY(-6px) rotate(1deg);
      }
    }
    .animate-monster-float {
      animation: floatMonster 3.2s ease-in-out infinite;
    }

    /* 발밑 네온 링 펄스 */
    @keyframes ringPulse {
      0%, 100% {
        transform: scale(1);
        opacity: 0.85;
        filter: drop-shadow(0 0 10px rgba(57, 255, 20, 0.7));
      }
      50% {
        transform: scale(0.88);
        opacity: 0.5;
        filter: drop-shadow(0 0 5px rgba(57, 255, 20, 0.3));
      }
    }
    .animate-ring-pulse {
      animation: ringPulse 3.2s ease-in-out infinite;
    }

    /* 몬스터 콕(Poke) 바운스 */
    @keyframes pokeWobble {
      0% { transform: scale(1) translateY(0); }
      25% { transform: scale(1.15, 0.85) translateY(4px); }
      50% { transform: scale(0.92, 1.12) translateY(-12px) rotate(-3deg); }
      75% { transform: scale(1.04, 0.96) translateY(-2px) rotate(2deg); }
      100% { transform: scale(1) translateY(0); }
    }
    .poke-bounce {
      animation: pokeWobble 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) !important;
    }

    /* 3D 젤리 버튼 물리 효과 */
    .jelly-btn {
      position: relative;
      transition: all 0.08s ease;
      cursor: pointer;
    }
    .jelly-btn:active {
      transform: translateY(6px);
      box-shadow: 0 2px 0 0 var(--depth-color, #045300) !important;
    }

    /* 말풍선 팝업 */
    @keyframes popBubble {
      0% { transform: scale(0.6) translateY(10px); opacity: 0; }
      80% { transform: scale(1.05) translateY(-2px); opacity: 1; }
      100% { transform: scale(1) translateY(0); opacity: 1; }
    }
    .animate-bubble {
      animation: popBubble 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    /* 부드러운 바텀시트 슬라이드업 */
    @keyframes sheetUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    .animate-sheet-up {
      animation: sheetUp 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* 🌸 민서 전용 파스텔 피치/핑크 테마 (Dreamy Plushie Lab) */
    body.theme-minseo {
      background: radial-gradient(circle at 50% 20%, #ffffff 0%, #fef8f4 60%, #ffeef3 100%) !important;
      color: #1d1b19 !important;
    }
    body.theme-minseo .bg-lab-card,
    body.theme-minseo .bg-lab-card\/80,
    body.theme-minseo .bg-lab-card\/95,
    body.theme-minseo .bg-lab-card\/70 {
      background-color: rgba(255, 255, 255, 0.95) !important;
      border-color: #ffd1dc !important;
      color: #1d1b19 !important;
      box-shadow: 0 4px 16px rgba(255, 182, 193, 0.25) !important;
    }
    body.theme-minseo .border-lab-card-border {
      border-color: #ffd1dc !important;
    }
    body.theme-minseo .text-white {
      color: #a03a57 !important;
    }
    body.theme-minseo .text-gray-300,
    body.theme-minseo .text-gray-400 {
      color: #887175 !important;
    }
    body.theme-minseo #monsterSpeechBubble {
      background-color: #ffffff !important;
      border-color: #ff85a2 !important;
      box-shadow: 0 4px 16px rgba(255, 133, 162, 0.2) !important;
    }
    body.theme-minseo #monsterSpeechBubble div {
      background-color: #ffffff !important;
      border-color: #ff85a2 !important;
    }
    body.theme-minseo #speechText {
      color: #a03a57 !important;
    }
    body.theme-minseo #mainQuestBtn {
      background: linear-gradient(to bottom, #ff9bb3, #ff7597) !important;
      border-color: #ffffff !important;
      color: #ffffff !important;
      box-shadow: 0 8px 0 0 #f472b6, 0 10px 20px rgba(255, 133, 162, 0.35) !important;
      --depth-color: #f472b6;
    }
    body.theme-minseo #mainQuestBtn div,
    body.theme-minseo #mainQuestBtn span {
      color: #ffffff !important;
    }
    body.theme-minseo #questModal > div {
      background-color: #ffffff !important;
      border-color: #ff85a2 !important;
      box-shadow: 0 16px 36px rgba(255, 133, 162, 0.3) !important;
    }
    body.theme-minseo #modalRecommendBox {
      background-color: #fff0f4 !important;
      border-color: #ff85a2 !important;
      color: #a03a57 !important;
    }
    body.theme-minseo #modalRecommend {
      color: #a03a57 !important;
    }
    body.theme-minseo #questOptionsBox {
      background-color: #fff5f8 !important;
      border-color: #ffd1dc !important;
    }
  </style>

  <!-- 즉시 테마 판별 및 다크모드/클래스 초기화 (깜빡임 방지) -->
  <script>
    (function() {
      const p = new URLSearchParams(window.location.search);
      const u = p.get('user') || localStorage.getItem('currentChild') || 'minsu';
      if (u === 'minseo' || u === 'daughter') {
        document.documentElement.classList.remove('dark');
        document.documentElement.classList.add('theme-minseo');
      } else {
        document.documentElement.classList.add('dark', 'theme-minsu');
      }
    })();
  </script>
</head>

<body class="text-white min-h-[100dvh] flex flex-col justify-between overflow-x-hidden p-4 pb-20 max-w-md mx-auto">

  <!-- ================= 1. 초심플 상단 HUD (로비 복귀 + 3개 칩) ================= -->
  <header class="flex items-center justify-between pt-1">
    <!-- 좌측: 🏠 공부방 로비 복귀 + 민수 아바타 & 레벨 -->
    <div class="flex items-center gap-2">
      <!-- 🚪 처음 프로필 화면 (index.html) 바로가기 -->
      <a 
        href="index.html" 
        class="w-9 h-9 rounded-full bg-lab-card/80 border border-lab-card-border flex items-center justify-center text-gray-300 hover:text-white hover:border-purple-400 active:scale-95 transition-all shadow-lg"
        title="처음 프로필 화면으로 가기"
      >
        <span class="material-symbols-outlined text-base">arrow_back</span>
      </a>

      <!-- 🏠 전체 공부방 로비 (lobby.html) 바로가기 -->
      <a 
        id="headerLobbyLink"
        href="lobby.html" 
        class="w-9 h-9 rounded-full bg-lab-card/80 border border-lab-card-border flex items-center justify-center text-gray-300 hover:text-white hover:border-neon-cyan/60 active:scale-95 transition-all shadow-lg"
        title="전체 공부방 로비로 가기"
      >
        <span class="material-symbols-outlined text-base">home</span>
      </a>

      <!-- 유저 아바타 & 레벨 -->
      <div class="flex items-center gap-2 bg-lab-card/80 border border-lab-card-border px-3 py-1.5 rounded-full shadow-lg cursor-pointer" onclick="pokeSound('level')">
        <div id="userAvatar" class="w-8 h-8 rounded-full bg-purple-700/60 flex items-center justify-center text-lg border border-neon-cyan/50">
          👦
        </div>
        <div class="flex items-center gap-1.5">
          <span id="userName" class="text-sm font-bold text-white">민수</span>
          <span id="userLevel" class="bg-neon-cyan text-lab-bg text-[11px] font-eng font-black px-1.5 py-0.5 rounded-md leading-none">
            Lv.12
          </span>
        </div>
      </div>
    </div>

    <!-- 우측 스트릭 & 코인 & 사운드 칩 -->
    <div class="flex items-center gap-2">
      <!-- 스트릭 칩 (불꽃 / 핑크 하트) -->
      <div class="flex items-center gap-1 bg-lab-card/80 border border-lab-card-border px-3 py-1.5 rounded-full shadow-lg cursor-pointer" onclick="handleStreakClick()">
        <span id="streakIcon" class="text-base animate-pulse">🔥</span>
        <span id="streakText" class="text-sm font-eng font-black text-fire-orange">15일</span>
      </div>

      <!-- 재화 칩 (코인 / 요정가루) -->
      <div class="flex items-center gap-1 bg-lab-card/80 border border-lab-card-border px-3 py-1.5 rounded-full shadow-lg cursor-pointer" onclick="handleCoinClick()">
        <span id="coinIcon" class="text-base">🪙</span>
        <span id="coinText" class="text-sm font-eng font-black text-yellow-300">120</span>
      </div>

      <!-- 🔊 사운드 토글 -->
      <button class="w-9 h-9 rounded-full bg-lab-card/80 border border-lab-card-border flex items-center justify-center text-gray-300 hover:text-white active:scale-95 transition-transform shadow-lg" onclick="toggleSound()">
        <span class="material-symbols-outlined text-lg" id="soundIcon">volume_up</span>
      </button>
    </div>
  </header>

  <!-- ================= 2. 중앙 몬스터 무대 (시원한 여백 & 주인공 몰입) ================= -->
  <main class="flex-1 flex flex-col items-center justify-center relative py-2">
    
    <!-- 상단 심플 말풍선 -->
    <div id="monsterSpeechBubble" class="relative z-30 mb-2 bg-lab-card/95 border-2 border-neon-cyan px-3.5 py-1.5 rounded-2xl shadow-[0_4px_16px_rgba(0,0,0,0.6)] text-center max-w-[270px]">
      <p id="speechText" class="text-xs text-neon-cyan font-bold tracking-wide">
        "민수야! 오늘 5분 퀘스트 깨러 가자! 🚀"
      </p>
      <!-- 말풍선 꼬리 -->
      <div class="absolute -bottom-1.5 left-1/2 -translate-x-1/2 w-3 h-3 bg-lab-card border-r-2 border-b-2 border-neon-cyan rotate-45"></div>
    </div>

    <!-- 1) 👾 민수용: 3D 클레이 몬스터 & 네온 스테이지 발판 -->
    <div id="minsuStageWrap" class="relative w-72 h-64 flex flex-col items-center justify-end cursor-pointer group" onclick="pokeMonster(event)">
      <!-- 은은한 네온 방사광 -->
      <div class="absolute inset-0 bg-gradient-to-t from-neon-green/10 via-transparent to-transparent rounded-full filter blur-xl pointer-events-none"></div>

      <!-- 3D 네온 발판 스테이지 -->
      <img 
        src="./kids/assets/images/monsters/lab_stage_pedestal.png" 
        alt="Neon Pedestal Stage" 
        class="absolute bottom-0 w-64 h-64 object-contain opacity-90 pointer-events-none filter drop-shadow-[0_10px_20px_rgba(0,0,0,0.9)]"
      />

      <!-- 발판 윗면 원형 플레이트의 네온 그림자 링 -->
      <div class="absolute bottom-20 w-24 h-4 bg-neon-green/45 rounded-full blur-sm animate-ring-pulse pointer-events-none"></div>

      <!-- 보라색 클레이 몬스터 -->
      <div class="relative z-20 mb-[88px] flex flex-col items-center">
        <img 
          id="monsterImg" 
          src="./kids/assets/images/monsters/purple_monster.png" 
          alt="클레이 바이트" 
          class="animate-monster-float w-28 h-28 object-contain filter drop-shadow-[0_10px_16px_rgba(0,0,0,0.8)] group-hover:scale-105 transition-transform"
        />
      </div>
    </div>

    <!-- 2) 🧸 민서용: 분홍색 튜브 챔버 & 캐릭터 레이어 (기본 hidden, 민서 접속 시 flex) -->
    <div id="minseoChamberWrap" class="hidden relative rounded-2xl border-4 border-white bg-gradient-to-b from-rose-50 to-pink-100/50 overflow-hidden shadow-[0_8px_24px_rgba(255,133,162,0.25)] aspect-square w-72 max-w-sm mx-auto items-center justify-center p-0 cursor-pointer" onclick="pokeMonster(event)">
      <!-- 튜브 배경 이미지 (사용자 원본 베이스) -->
      <img 
        alt="분홍색 튜브 쿠션 베이스" 
        class="relative z-10 w-full h-full object-cover rounded-xl" 
        src="https://lh3.googleusercontent.com/aida-public/AB6AXuAV-IDp_iDn-WfxdakzUuquXBg47J6J6FCU6ZPIHrVuqK-0ncWASu9Yy6zkPaN6Hm6AMT5YxPIqpTyMD8a1gxRL0XMb7QAMoJN5ZzXrNkqN9o6I6UPw4A4aw1fKXJFdXEh95qHievw9KkjTBUDSYFuyhoZSq3Y6WpgVUvLt7X1pdOHvUoTLbjDZmVAWZfux4CkaKfJs3Bx1uMfMAXqQKNrEMQ3EfDGFG8PVi3AyijSLWbUxBCxJfV1aYw"
      />
      <!-- 튜브 위에 얹어질 민서 캐릭터 투명 레이어 (현재는 비워둠, 둥실 부유 효과 완비) -->
      <div id="minseoCharacterLayer" class="absolute inset-0 z-20 flex items-center justify-center pointer-events-none">
        <div id="characterPlushieWrap" class="relative w-40 h-40 flex items-center justify-center animate-monster-float">
          <!-- 은은한 별빛 반짝임 대기 -->
          <span class="text-3xl text-pink-300 opacity-70">✨</span>
        </div>
      </div>
      <!-- 튜브 하단 쿠션 안내 배너 -->
      <div class="absolute bottom-3 z-30 bg-white/95 backdrop-blur-md px-3 py-1.5 rounded-2xl border-2 border-pink-300 shadow-sm flex items-center gap-1 text-center">
        <span class="text-[11px] font-bold text-[#a03a57]">🧸 분홍 튜브에 민서 인형 친구 준비 중 ✨</span>
      </div>
    </div>

    <!-- 파트너 심플 이름표 -->
    <div id="partnerBadge" class="flex items-center gap-1.5 mt-2 bg-lab-card/70 border border-lab-card-border px-3 py-0.5 rounded-full shadow-md">
      <span id="partnerName" class="text-xs font-bold text-white tracking-wide">클레이 바이트</span>
      <span id="partnerDot" class="w-1.5 h-1.5 rounded-full bg-neon-green animate-pulse"></span>
      <span id="partnerRole" class="text-[11px] text-neon-green font-bold">수호 파트너</span>
    </div>

  </main>

  <!-- ================= 3. 하단 액션 구역: 거대 3D 젤리 버튼 1개만 강조 ================= -->
  <footer class="w-full space-y-3">
    
    <!-- 🟢 메인 3D 젤리 버튼: 누르고 싶어 미치겠는 거대한 크기 -->
    <button 
      id="mainQuestBtn"
      class="jelly-btn w-full bg-neon-green hover:bg-[#45ff22] text-[#023300] py-4 px-6 rounded-2xl text-center shadow-[0_8px_0_0_#045300] active:translate-y-2 active:shadow-[0_2px_0_0_#045300] transition-all flex flex-col items-center justify-center gap-0.5 border-2 border-[#55ff35]"
      style="--depth-color: #045300;"
      onclick="handleStartQuest()"
    >
      <!-- 상단 하이라이트 광택 -->
      <div class="absolute inset-x-0 top-0 h-1/2 bg-white/35 rounded-t-2xl pointer-events-none"></div>
      
      <div class="relative z-10 flex items-center justify-center gap-2 text-xl font-bold tracking-wide">
        <span id="mainQuestTitle">오늘의 5분 퀘스트 출격! 🚀</span>
      </div>
      <div id="mainQuestSub" class="relative z-10 text-xs font-bold text-[#034400]/80">
        🧮 5-2 두 자릿수 나눗셈 던전 · 필수 ⭐
      </div>
    </button>

    <!-- 🔽 부담 없는 보조 텍스트 버튼: [다른 과목 둘러보기] -->
    <div class="text-center pt-0.5">
      <button 
        class="text-xs text-gray-400 hover:text-neon-cyan py-1.5 px-4 rounded-full hover:bg-lab-card/50 transition-colors inline-flex items-center gap-1 font-bold"
        onclick="openDrawer()"
      >
        <span>국·영·수·사·과 다른 과목 보기</span>
        <span class="material-symbols-outlined text-sm">expand_less</span>
      </button>
    </div>

  </footer>

  <!-- ================= 4. 다른 과목 서랍 (바텀시트: 평소엔 숨겨서 시원함 유지) ================= -->
  <div id="drawerOverlay" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden items-end justify-center" onclick="closeDrawer(event)">
    <div class="bg-lab-card border-t-2 border-neon-cyan/40 w-full max-w-md rounded-t-3xl p-5 shadow-2xl animate-sheet-up space-y-3" onclick="event.stopPropagation()">
      
      <!-- 서랍 핸들바 -->
      <div class="w-12 h-1 bg-gray-600 rounded-full mx-auto mb-1"></div>
      
      <div class="flex items-center justify-between">
        <h3 class="text-base font-bold text-white flex items-center gap-1.5">
          <span>📚 5대 교과 마이크로 던전</span>
        </h3>
        <button class="text-gray-400 hover:text-white p-1" onclick="closeDrawer()">
          <span class="material-symbols-outlined text-lg">close</span>
        </button>
      </div>

      <!-- 5대 과목 심플 3D 젤리 버튼 2열 그리드 (아이콘 + 과목명 중심 직관적 단순화) -->
      <div class="grid grid-cols-2 gap-2.5 pt-1.5">
        
        <!-- 🧮 수학 -->
        <button 
          type="button"
          class="jelly-btn bg-lab-bg/95 border-2 border-neon-green/50 hover:border-neon-green p-3.5 rounded-2xl flex items-center justify-center gap-2.5 cursor-pointer text-white shadow-md active:translate-y-1 transition-all"
          onclick="selectSubject('math')"
        >
          <span class="text-2xl">🧮</span>
          <span class="text-base font-bold tracking-wide">수학</span>
        </button>

        <!-- 🔤 영어 -->
        <button 
          type="button"
          class="jelly-btn bg-lab-bg/95 border-2 border-yellow-400/50 hover:border-yellow-400 p-3.5 rounded-2xl flex items-center justify-center gap-2.5 cursor-pointer text-white shadow-md active:translate-y-1 transition-all"
          onclick="selectSubject('english')"
        >
          <span class="text-2xl">🔤</span>
          <span class="text-base font-bold tracking-wide">영어</span>
        </button>

        <!-- 📖 국어 -->
        <button 
          type="button"
          class="jelly-btn bg-lab-bg/95 border-2 border-purple-400/50 hover:border-purple-400 p-3.5 rounded-2xl flex items-center justify-center gap-2.5 cursor-pointer text-white shadow-md active:translate-y-1 transition-all"
          onclick="selectSubject('korean')"
        >
          <span class="text-2xl">📖</span>
          <span class="text-base font-bold tracking-wide">국어</span>
        </button>

        <!-- 🔬 과학 -->
        <button 
          type="button"
          class="jelly-btn bg-lab-bg/95 border-2 border-blue-400/50 hover:border-blue-400 p-3.5 rounded-2xl flex items-center justify-center gap-2.5 cursor-pointer text-white shadow-md active:translate-y-1 transition-all"
          onclick="selectSubject('science')"

  <script>
    let isSoundEnabled = true;
    let audioCtx = null;

    // 브라우저 첫 터치 즉시 AudioContext 자동 언락
    async function unlockAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        await audioCtx.resume();
      }
    }
    window.addEventListener('pointerdown', unlockAudio, { once: true });
    window.addEventListener('touchstart', unlockAudio, { once: true });

    function toggleSound() {
      isSoundEnabled = !isSoundEnabled;
      const icon = document.getElementById('soundIcon');
      if (isSoundEnabled) {
        icon.textContent = 'volume_up';
        pokeSound('level');
      } else {
        icon.textContent = 'volume_off';
      }
    }

    function triggerHaptic(duration = 20) {
      if (navigator.vibrate) {
        try { navigator.vibrate(duration); } catch (e) {}
      }
    }

    // 4대 직관적 신디사이저 사운드
    async function pokeSound(type = 'pop') {
      if (!isSoundEnabled) return;
      await unlockAudio();
      triggerHaptic(type === 'launch' ? [40, 60, 40] : 15);

      if (!audioCtx) return;
      const now = audioCtx.currentTime;

      switch (type) {
        // ① 쫀득한 젤리 팝음
        case 'pop': {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(540, now);
          osc.frequency.exponentialRampToValueAtTime(140, now + 0.08);
          gain.gain.setValueAtTime(0.35, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.09);
          break;
        }

        // ② 출격 워프음
        case 'launch': {
          const osc1 = audioCtx.createOscillator();
          const gain1 = audioCtx.createGain();
          osc1.type = 'triangle';
          osc1.frequency.setValueAtTime(160, now);
          osc1.frequency.exponentialRampToValueAtTime(880, now + 0.3);
          gain1.gain.setValueAtTime(0.3, now);
          gain1.gain.exponentialRampToValueAtTime(0.01, now + 0.32);
          osc1.connect(gain1);
          gain1.connect(audioCtx.destination);
          osc1.start(now);
          osc1.stop(now + 0.33);
          break;
        }

        // ③ 짤랑 코인음
        case 'coin': {
          [987.77, 1318.51].forEach((freq, idx) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now + idx * 0.08);
            gain.gain.setValueAtTime(0.28, now + idx * 0.08);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.25);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now + idx * 0.08);
            osc.stop(now + idx * 0.08 + 0.26);
          });
          break;
        }

        // ④ 몬스터 콕(Poke) 워블음
        case 'monster': {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(280, now);
          osc.frequency.exponentialRampToValueAtTime(620, now + 0.09);
          osc.frequency.exponentialRampToValueAtTime(340, now + 0.22);
          gain.gain.setValueAtTime(0.35, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.24);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.25);
          break;
        }

        // 레벨 / 차임
        case 'level': {
          [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, now + idx * 0.08);
            gain.gain.setValueAtTime(0.25, now + idx * 0.08);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.25);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now + idx * 0.08);
            osc.stop(now + idx * 0.08 + 0.26);
          });
          break;
        }
      }
    }

      pokeSound('pop');
      document.querySelectorAll('.unit-chip').forEach(btn => {
        if (btn.getAttribute('data-unit') === unit) {
          btn.className = isMinseo 
            ? 'unit-chip py-1.5 px-2 rounded-xl text-xs font-bold bg-[#ff85a2]/25 border border-[#ff85a2] text-[#a03a57] text-center transition-all'
            : 'unit-chip py-1.5 px-2 rounded-xl text-xs font-bold bg-neon-green/20 border border-neon-green text-neon-green text-center transition-all';
        } else {
          btn.className = 'unit-chip py-1.5 px-2 rounded-xl text-xs font-bold bg-lab-card border border-lab-card-border text-gray-400 text-center transition-all';
        }
      });
    }

    function setQuestMode(mode) {
      selectedMode = mode;
      pokeSound('pop');
      document.querySelectorAll('.mode-chip').forEach(btn => {
        if (btn.getAttribute('data-mode') === mode) {
          btn.className = isMinseo
            ? 'mode-chip py-1.5 px-2 rounded-xl text-xs font-bold bg-amber-400/25 border border-amber-400 text-amber-700 text-center transition-all'
            : 'mode-chip py-1.5 px-2 rounded-xl text-xs font-bold bg-yellow-400/20 border border-yellow-400 text-yellow-300 text-center transition-all';
        } else {
          btn.className = 'mode-chip py-1.5 px-2 rounded-xl text-xs font-bold bg-lab-card border border-lab-card-border text-gray-400 text-center transition-all';
        }
      });
    }

    // 모달 제어 (과목별 권장 진도 안내 + 과목/학년 맞춤 옵션 칩 동적 주입)
    function openQuestModal(icon, title, desc, subj = 'math', recommend = '') {
      targetSubject = subj;
      document.getElementById('modalIcon').textContent = icon;
      document.getElementById('modalTitle').textContent = title;
      document.getElementById('modalDesc').textContent = desc;

      const recEl = document.getElementById('modalRecommend');
      if (recEl) {
        recEl.textContent = recommend || (SUBJECT_METAS[subj] ? SUBJECT_METAS[subj].recommend : '');
      }

      const optBox = document.getElementById('questOptionsBox');
      const unitContainer = document.getElementById('unitScopeChips');
      const modeContainer = document.getElementById('modeChips');

      if (subj === 'math') {
        optBox.classList.remove('hidden');
        if (isMinseo) {
          selectedUnit = '100num';
          selectedMode = 'speed';
          unitContainer.innerHTML = `
            <button type="button" class="unit-chip py-1.5 px-2 rounded-xl text-xs font-bold bg-[#ff85a2]/25 border border-[#ff85a2] text-[#a03a57] text-center transition-all" data-unit="100num" onclick="setQuestUnit('100num')">100까지 수 ⭐</button>
            <button type="button" class="unit-chip py-1.5 px-2 rounded-xl text-xs font-bold bg-lab-card border border-lab-card-border text-gray-400 text-center transition-all" data-unit="addsub" onclick="setQuestUnit('addsub')">한자리 덧뺄셈</button>
            <button type="button" class="unit-chip py-1.5 px-2 rounded-xl text-xs font-bold bg-lab-card border border-lab-card-border text-gray-400 text-center transition-all" data-unit="shapes" onclick="setQuestUnit('shapes')">여러가지 모양</button>
          `;
          modeContainer.innerHTML = `
            <button type="button" class="mode-chip py-1.5 px-2 rounded-xl text-xs font-bold bg-amber-400/25 border border-amber-400 text-amber-700 text-center transition-all" data-mode="speed" onclick="setQuestMode('speed')">스피드 연산</button>
            <button type="button" class="mode-chip py-1.5 px-2 rounded-xl text-xs font-bold bg-lab-card border border-lab-card-border text-gray-400 text-center transition-all" data-mode="puzzle" onclick="setQuestMode('puzzle')">그림 퀴즈</button>
          `;
        } else {
          selectedUnit = 'division';
          selectedMode = 'mixed';
          unitContainer.innerHTML = `
            <button type="button" class="unit-chip py-1.5 px-2 rounded-xl text-xs font-bold bg-neon-green/20 border border-neon-green text-neon-green text-center transition-all" data-unit="division" onclick="setQuestUnit('division')">두 자릿수 나눗셈 ⭐</button>
            <button type="button" class="unit-chip py-1.5 px-2 rounded-xl text-xs font-bold bg-lab-card border border-lab-card-border text-gray-400 text-center transition-all" data-unit="fraction" onclick="setQuestUnit('fraction')">5-2 분수의 곱셈</button>
            <button type="button" class="unit-chip py-1.5 px-2 rounded-xl text-xs font-bold bg-lab-card border border-lab-card-border text-gray-400 text-center transition-all" data-unit="all" onclick="setQuestUnit('all')">수학 종합 팩</button>
          `;
          modeContainer.innerHTML = `
            <button type="button" class="mode-chip py-1.5 px-2 rounded-xl text-xs font-bold bg-yellow-400/20 border border-yellow-400 text-yellow-300 text-center transition-all" data-mode="mixed" onclick="setQuestMode('mixed')">종합 배틀</button>
            <button type="button" class="mode-chip py-1.5 px-2 rounded-xl text-xs font-bold bg-lab-card border border-lab-card-border text-gray-400 text-center transition-all" data-mode="calc" onclick="setQuestMode('calc')">실전 계산 ⚡</button>
            <button type="button" class="mode-chip py-1.5 px-2 rounded-xl text-xs font-bold bg-lab-card border border-lab-card-border text-gray-400 text-center transition-all" data-mode="principle" onclick="setQuestMode('principle')">원리·검산식 🔍</button>
          `;
        }
      } else if (subj === 'english') {
        optBox.classList.remove('hidden');
        if (isMinseo) {
          selectedUnit = 'phonics';
          selectedMode = 'word';
          unitContainer.innerHTML = `
            <button type="button" class="unit-chip py-1.5 px-2 rounded-xl text-xs font-bold bg-[#ff85a2]/25 border border-[#ff85a2] text-[#a03a57] text-center transition-all" data-unit="phonics" onclick="setQuestUnit('phonics')">파닉스 단어 ⭐</button>
            <button type="button" class="unit-chip py-1.5 px-2 rounded-xl text-xs font-bold bg-lab-card border border-lab-card-border text-gray-400 text-center transition-all" data-unit="abc" onclick="setQuestUnit('abc')">알파벳 소리</button>
            <button type="button" class="unit-chip py-1.5 px-2 rounded-xl text-xs font-bold bg-lab-card border border-lab-card-border text-gray-400 text-center transition-all" data-unit="greetings" onclick="setQuestUnit('greetings')">기초 인사말</button>
          `;
          modeContainer.innerHTML = `
            <button type="button" class="mode-chip py-1.5 px-2 rounded-xl text-xs font-bold bg-amber-400/25 border border-amber-400 text-amber-700 text-center transition-all" data-mode="word" onclick="setQuestMode('word')">단어 🔤</button>
            <button type="button" class="mode-chip py-1.5 px-2 rounded-xl text-xs font-bold bg-lab-card border border-lab-card-border text-gray-400 text-center transition-all" data-mode="listen" onclick="setQuestMode('listen')">듣기 🎧</button>
          `;
        } else {
          selectedUnit = '8';
          selectedMode = 'mixed';
          unitContainer.innerHTML = `
            <button type="button" class="unit-chip py-1.5 px-2 rounded-xl text-xs font-bold bg-neon-green/20 border border-neon-green text-neon-green text-center transition-all" data-unit="8" onclick="setQuestUnit('8')">8단원 ⭐</button>
            <button type="button" class="unit-chip py-1.5 px-2 rounded-xl text-xs font-bold bg-lab-card border border-lab-card-border text-gray-400 text-center transition-all" data-unit="7" onclick="setQuestUnit('7')">7단원 복습</button>
            <button type="button" class="unit-chip py-1.5 px-2 rounded-xl text-xs font-bold bg-lab-card border border-lab-card-border text-gray-400 text-center transition-all" data-unit="7,8" onclick="setQuestUnit('7,8')">7~8단원 팩</button>
          `;
          modeContainer.innerHTML = `
            <button type="button" class="mode-chip py-1.5 px-2 rounded-xl text-xs font-bold bg-yellow-400/20 border border-yellow-400 text-yellow-300 text-center transition-all" data-mode="mixed" onclick="setQuestMode('mixed')">통합(단어+문장)</button>
            <button type="button" class="mode-chip py-1.5 px-2 rounded-xl text-xs font-bold bg-lab-card border border-lab-card-border text-gray-400 text-center transition-all" data-mode="word" onclick="setQuestMode('word')">단어 🔤</button>
            <button type="button" class="mode-chip py-1.5 px-2 rounded-xl text-xs font-bold bg-lab-card border border-lab-card-border text-gray-400 text-center transition-all" data-mode="sentence" onclick="setQuestMode('sentence')">문장 💬</button>
          `;
        }
      } else {
        optBox.classList.add('hidden');
      }

      const modal = document.getElementById('questModal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeQuestModal() {
      pokeSound('pop');
      const modal = document.getElementById('questModal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    function launchQuestNow() {
      pokeSound('launch');
      triggerHaptic([50, 80, 50]);
      setTimeout(() => {
        let targetUrl = `quest_runner.html?subject=${targetSubject}&user=${currentChild}`;
        if (targetSubject === 'english' || targetSubject === 'math') {
          targetUrl += `&unit=${selectedUnit}&mode=${selectedMode}`;
        }
        window.location.href = targetUrl;
      }, 350);
    }

    function handleStreakClick() {
      pokeSound('level');
      if (isMinseo) {
        alert('💖 15일 연속 사랑 충전 중!\n오늘 딱 1개 퀘스트만 완료하면 하트가 유지돼요! ✨');
      } else {
        alert('🔥 15일 연속 학습 성공 중!\n오늘 딱 1개 퀘스트만 완료하면 불꽃이 유지됩니다!');
      }
    }

    function handleCoinClick() {
      pokeSound('coin');
      if (isMinseo) {
        alert('✨ 보유 요정 가루: 2,450개\n퀘스트를 완료하면 반짝이는 요정 가루가 쌓여요!');
      } else {
        alert('🪙 보유 코인: 120개\n퀘스트를 완료하면 코인이 쌓입니다!');
      }
    }

    // 페이지 진입 즉시 테마 적용
    window.addEventListener('DOMContentLoaded', applyTheme);
  </script>
</body>
</html>
