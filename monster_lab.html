<!DOCTYPE html>
<html class="dark" lang="ko">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>Minsu's Monster Lab 👾</title>
  
  <!-- 모바일 웹앱 PWA 메타 & 아이콘 -->
  <meta name="theme-color" content="#130924"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <link rel="icon" type="image/png" href="./icon-192.png"/>
  <link rel="apple-touch-icon" href="./icon-192.png"/>

  <!-- Google Fonts: Jua & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""/>
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Plus+Jakarta+Sans:wght@700;800;900&display=swap" rel="stylesheet"/>
  
  <!-- Material Symbols Outlined -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "lab-bg": "#120924",
            "lab-card": "#1e1338",
            "lab-card-border": "#2d1f4e",
            "neon-green": "#39ff14",
            "neon-green-shadow": "#045300",
            "neon-cyan": "#7df4ff",
            "fire-orange": "#ff7f1c"
          },
          fontFamily: {
            "jua": ["Jua", "sans-serif"],
            "eng": ["Plus Jakarta Sans", "sans-serif"]
          }
        }
      }
    };
  </script>

  <style>
    /* 공통 기본 세팅 */
    * {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body {
      background: radial-gradient(circle at 50% 25%, #241445 0%, #120924 75%);
      min-height: 100dvh;
      font-family: 'Jua', sans-serif;
    }

    .material-symbols-outlined {
      font-variation-settings: 'FILL' 1, 'wght' 700, 'GRAD' 0, 'opsz' 24;
      display: inline-block;
      vertical-align: middle;
      line-height: 1;
    }

    /* 👾 3D 클레이 몬스터 안정적이고 잔잔한 부유 */
    @keyframes floatMonster {
      0%, 100% {
        transform: translateY(0px) rotate(0deg);
      }
      50% {
        transform: translateY(-6px) rotate(1deg);
      }
    }
    .animate-monster-float {
      animation: floatMonster 3.2s ease-in-out infinite;
    }

    /* 발밑 네온 링 펄스 */
    @keyframes ringPulse {
      0%, 100% {
        transform: scale(1);
        opacity: 0.85;
        filter: drop-shadow(0 0 10px rgba(57, 255, 20, 0.7));
      }
      50% {
        transform: scale(0.88);
        opacity: 0.5;
        filter: drop-shadow(0 0 5px rgba(57, 255, 20, 0.3));
      }
    }
    .animate-ring-pulse {
      animation: ringPulse 3.2s ease-in-out infinite;
    }

    /* 몬스터 콕(Poke) 바운스 */
    @keyframes pokeWobble {
      0% { transform: scale(1) translateY(0); }
      25% { transform: scale(1.15, 0.85) translateY(4px); }
      50% { transform: scale(0.92, 1.12) translateY(-12px) rotate(-3deg); }
      75% { transform: scale(1.04, 0.96) translateY(-2px) rotate(2deg); }
      100% { transform: scale(1) translateY(0); }
    }
    .poke-bounce {
      animation: pokeWobble 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) !important;
    }

    /* 3D 젤리 버튼 물리 효과 */
    .jelly-btn {
      position: relative;
      transition: all 0.08s ease;
      cursor: pointer;
    }
    .jelly-btn:active {
      transform: translateY(6px);
      box-shadow: 0 2px 0 0 var(--depth-color, #045300) !important;
    }

    /* 말풍선 팝업 */
    @keyframes popBubble {
      0% { transform: scale(0.6) translateY(10px); opacity: 0; }
      80% { transform: scale(1.05) translateY(-2px); opacity: 1; }
      100% { transform: scale(1) translateY(0); opacity: 1; }
    }
    .animate-bubble {
      animation: popBubble 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    /* 부드러운 바텀시트 슬라이드업 */
    @keyframes sheetUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    .animate-sheet-up {
      animation: sheetUp 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>

<body class="text-white min-h-[100dvh] flex flex-col justify-between overflow-x-hidden p-4 pb-20 max-w-md mx-auto">

  <!-- ================= 6. 직관적 사운드 & 인터랙션 스크립트 ================= -->
  <script>
    let isSoundEnabled = true;
    let audioCtx = null;

    // 브라우저 첫 터치 즉시 AudioContext 자동 언락
    async function unlockAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        await audioCtx.resume();
      }
    }
    window.addEventListener('pointerdown', unlockAudio, { once: true });
    window.addEventListener('touchstart', unlockAudio, { once: true });

    function toggleSound() {
      isSoundEnabled = !isSoundEnabled;
      const icon = document.getElementById('soundIcon');
      if (isSoundEnabled) {
        icon.textContent = 'volume_up';
        pokeSound('level');
      } else {
        icon.textContent = 'volume_off';
      }
    }

    function triggerHaptic(duration = 20) {
      if (navigator.vibrate) {
        try { navigator.vibrate(duration); } catch (e) {}
      }
    }

    // 4대 직관적 신디사이저 사운드
    async function pokeSound(type = 'pop') {
      if (!isSoundEnabled) return;
      await unlockAudio();
      triggerHaptic(type === 'launch' ? [40, 60, 40] : 15);

      if (!audioCtx) return;
      const now = audioCtx.currentTime;

      switch (type) {
        // ① 쫀득한 젤리 팝음
        case 'pop': {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(540, now);
          osc.frequency.exponentialRampToValueAtTime(140, now + 0.08);
          gain.gain.setValueAtTime(0.35, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.09);
          break;
        }

        // ② 출격 워프음
        case 'launch': {
          const osc1 = audioCtx.createOscillator();
          const gain1 = audioCtx.createGain();
          osc1.type = 'triangle';
          osc1.frequency.setValueAtTime(160, now);
          osc1.frequency.exponentialRampToValueAtTime(880, now + 0.3);
          gain1.gain.setValueAtTime(0.3, now);
          gain1.gain.exponentialRampToValueAtTime(0.01, now + 0.32);
          osc1.connect(gain1);
          gain1.connect(audioCtx.destination);
          osc1.start(now);
          osc1.stop(now + 0.33);
          break;
        }

        // ③ 짤랑 코인음
        case 'coin': {
          [987.77, 1318.51].forEach((freq, idx) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now + idx * 0.08);
            gain.gain.setValueAtTime(0.28, now + idx * 0.08);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.25);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now + idx * 0.08);
            osc.stop(now + idx * 0.08 + 0.26);
          });
          break;
        }

        // ④ 몬스터 콕(Poke) 워블음
        case 'monster': {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(280, now);
          osc.frequency.exponentialRampToValueAtTime(620, now + 0.09);
          osc.frequency.exponentialRampToValueAtTime(340, now + 0.22);
          gain.gain.setValueAtTime(0.35, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.24);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.25);
          break;
        }

        // 레벨 / 차임
        case 'level': {
          [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, now + idx * 0.08);
            gain.gain.setValueAtTime(0.25, now + idx * 0.08);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.25);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now + idx * 0.08);
            osc.stop(now + idx * 0.08 + 0.26);
          });
          break;
        }
      }
    }

    // 몬스터 콕 터치 대사
    const simpleDialogues = [
      "민수야! 오늘 5분 퀘스트 깨러 가자! 🚀",
      "오늘 수학 보스 격파하고 치킨 먹자! 🍗",
      "클레이 바이트 에너지 충전 완료! ⚡",
      "오늘 1개만 풀면 불꽃 유지 성공! 🔥",
      "간지러워 크하핫! 몬스터 빔 발사! ✨"
    ];
    let dIndex = 0;

    function pokeMonster(event) {
      if (event) event.stopPropagation();
      pokeSound('monster');
      triggerHaptic(30);

      const monsterImg = document.getElementById('monsterImg');
      const bubble = document.getElementById('monsterSpeechBubble');
      const speechText = document.getElementById('speechText');

      monsterImg.classList.remove('poke-bounce');
      void monsterImg.offsetWidth;
      monsterImg.classList.add('poke-bounce');

      dIndex = (dIndex + 1) % simpleDialogues.length;
      speechText.textContent = simpleDialogues[dIndex];

      bubble.classList.remove('animate-bubble');
      void bubble.offsetWidth;
      bubble.classList.add('animate-bubble');
    }

    // 5대 교과 메타데이터 (아이콘, 과목명, 세부 설명, 알고리즘 권장 진도)
    const SUBJECT_METAS = {
      math: {
        icon: '🧮',
        title: '🧮 수학 5분 퀘스트',
        desc: '민수의 학습 진도에 맞춘 기초 필수 나눗셈 & 분수 배틀!',
        recommend: '💡 오늘의 권장 진도: 두 자릿수 나눗셈 (기초 필수 ⭐)'
      },
      english: {
        icon: '🔤',
        title: '🔤 영어 5분 퀘스트',
        desc: '초5-2 정규 교과 외모·옷차림 묘사 & 원어민 스피킹 훈련!',
        recommend: '💡 오늘의 권장 진도: 8단원 He Has Short Curly Hair ⭐'
      },
      korean: {
        icon: '📖',
        title: '📖 국어 5분 퀘스트',
        desc: '속담, 반의어, 접속사, 3문장 중심 생각 독해 5문제 출제!',
        recommend: '💡 오늘의 배틀 주제: 어휘·속담 & 문맥 독해 아레나'
      },
      science: {
        icon: '🔬',
        title: '🔬 과학 5분 퀘스트',
        desc: '온도와 열의 3대 이동, 물질의 상태변화, 산·염기 지시약 5문제!',
        recommend: '💡 오늘의 탐구 주제: 온도와 열의 이동 & 가상 실험'
      },
      society: {
        icon: '🗺️',
        title: '🗺️ 사회 5분 퀘스트',
        desc: '조선 건국, 한양 4대문, 세종대왕 발명품, 임진왜란 5문제!',
        recommend: '💡 오늘의 역사 주제: 조선의 건국과 발전 & 한양 도성'
      }
    };

    // 메인 시작 버튼 (민수 기본 진도: 두 자릿수 나눗셈 팝업)
    function handleStartQuest() {
      pokeSound('launch');
      triggerHaptic(50);
      selectSubject('math');
    }

    // 서랍 제어
    function openDrawer() {
      pokeSound('pop');
      const overlay = document.getElementById('drawerOverlay');
      overlay.classList.remove('hidden');
      overlay.classList.add('flex');
    }

    function closeDrawer(event) {
      if (event) event.stopPropagation();
      pokeSound('pop');
      const overlay = document.getElementById('drawerOverlay');
      overlay.classList.add('hidden');
      overlay.classList.remove('flex');
    }

    // 과목 선택 (외부 버튼은 [과목/아이콘]만, 세부 내용은 팝업으로 위임)
    function selectSubject(subj = 'math') {
      closeDrawer();
      const meta = SUBJECT_METAS[subj] || SUBJECT_METAS.math;
      openQuestModal(meta.icon, meta.title, meta.desc, subj, meta.recommend);
    }

    let selectedUnit = 'division';
    let selectedMode = 'mixed';

    function setQuestUnit(unit) {
      selectedUnit = unit;
      pokeSound('pop');
      document.querySelectorAll('.unit-chip').forEach(btn => {
        if (btn.getAttribute('data-unit') === unit) {
          btn.className = 'unit-chip py-1.5 px-2 rounded-xl text-xs font-bold bg-neon-green/20 border border-neon-green text-neon-green text-center transition-all';
        } else {
          btn.className = 'unit-chip py-1.5 px-2 rounded-xl text-xs font-bold bg-lab-card border border-lab-card-border text-gray-400 text-center transition-all';
        }
      });
    }

    function setQuestMode(mode) {
      selectedMode = mode;
      pokeSound('pop');
      document.querySelectorAll('.mode-chip').forEach(btn => {
        if (btn.getAttribute('data-mode') === mode) {
          btn.className = 'mode-chip py-1.5 px-2 rounded-xl text-xs font-bold bg-yellow-400/20 border border-yellow-400 text-yellow-300 text-center transition-all';
        } else {
          btn.className = 'mode-chip py-1.5 px-2 rounded-xl text-xs font-bold bg-lab-card border border-lab-card-border text-gray-400 text-center transition-all';
        }
      });
    }

    // 모달 제어 (과목별 권장 진도 안내 + 수학/영어 세부 단원 선택 칩 동적 렌더링)
    function openQuestModal(icon, title, desc, subj = 'math', recommend = '') {
      targetSubject = subj;
      document.getElementById('modalIcon').textContent = icon;
      document.getElementById('modalTitle').textContent = title;
      document.getElementById('modalDesc').textContent = desc;

      const recEl = document.getElementById('modalRecommend');
      if (recEl) {
        recEl.textContent = recommend || (SUBJECT_METAS[subj] ? SUBJECT_METAS[subj].recommend : '');
      }

      const optBox = document.getElementById('questOptionsBox');
      const unitContainer = document.getElementById('unitScopeChips');
      const modeContainer = document.getElementById('modeChips');

      if (subj === 'math') {
        selectedUnit = 'division';
        selectedMode = 'mixed';
        optBox.classList.remove('hidden');

        unitContainer.innerHTML = `
          <button type="button" class="unit-chip py-1.5 px-2 rounded-xl text-xs font-bold bg-neon-green/20 border border-neon-green text-neon-green text-center transition-all" data-unit="division" onclick="setQuestUnit('division')">두 자릿수 나눗셈 ⭐</button>
          <button type="button" class="unit-chip py-1.5 px-2 rounded-xl text-xs font-bold bg-lab-card border border-lab-card-border text-gray-400 text-center transition-all" data-unit="fraction" onclick="setQuestUnit('fraction')">5-2 분수의 곱셈</button>
          <button type="button" class="unit-chip py-1.5 px-2 rounded-xl text-xs font-bold bg-lab-card border border-lab-card-border text-gray-400 text-center transition-all" data-unit="all" onclick="setQuestUnit('all')">수학 종합 팩</button>
        `;

        modeContainer.innerHTML = `
          <button type="button" class="mode-chip py-1.5 px-2 rounded-xl text-xs font-bold bg-yellow-400/20 border border-yellow-400 text-yellow-300 text-center transition-all" data-mode="mixed" onclick="setQuestMode('mixed')">종합 배틀</button>
          <button type="button" class="mode-chip py-1.5 px-2 rounded-xl text-xs font-bold bg-lab-card border border-lab-card-border text-gray-400 text-center transition-all" data-mode="calc" onclick="setQuestMode('calc')">실전 계산 ⚡</button>
          <button type="button" class="mode-chip py-1.5 px-2 rounded-xl text-xs font-bold bg-lab-card border border-lab-card-border text-gray-400 text-center transition-all" data-mode="principle" onclick="setQuestMode('principle')">원리·검산식 🔍</button>
        `;
      } else if (subj === 'english') {
        selectedUnit = '8';
        selectedMode = 'mixed';
        optBox.classList.remove('hidden');

        unitContainer.innerHTML = `
          <button type="button" class="unit-chip py-1.5 px-2 rounded-xl text-xs font-bold bg-neon-green/20 border border-neon-green text-neon-green text-center transition-all" data-unit="8" onclick="setQuestUnit('8')">8단원 ⭐</button>
          <button type="button" class="unit-chip py-1.5 px-2 rounded-xl text-xs font-bold bg-lab-card border border-lab-card-border text-gray-400 text-center transition-all" data-unit="7" onclick="setQuestUnit('7')">7단원 복습</button>
          <button type="button" class="unit-chip py-1.5 px-2 rounded-xl text-xs font-bold bg-lab-card border border-lab-card-border text-gray-400 text-center transition-all" data-unit="7,8" onclick="setQuestUnit('7,8')">7~8단원 팩</button>
        `;

        modeContainer.innerHTML = `
          <button type="button" class="mode-chip py-1.5 px-2 rounded-xl text-xs font-bold bg-yellow-400/20 border border-yellow-400 text-yellow-300 text-center transition-all" data-mode="mixed" onclick="setQuestMode('mixed')">통합(단어+문장)</button>
          <button type="button" class="mode-chip py-1.5 px-2 rounded-xl text-xs font-bold bg-lab-card border border-lab-card-border text-gray-400 text-center transition-all" data-mode="word" onclick="setQuestMode('word')">단어 🔤</button>
          <button type="button" class="mode-chip py-1.5 px-2 rounded-xl text-xs font-bold bg-lab-card border border-lab-card-border text-gray-400 text-center transition-all" data-mode="sentence" onclick="setQuestMode('sentence')">문장 💬</button>
        `;
      } else {
        optBox.classList.add('hidden');
      }

      const modal = document.getElementById('questModal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeQuestModal() {
      pokeSound('pop');
      const modal = document.getElementById('questModal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    function launchQuestNow() {
      pokeSound('launch');
      triggerHaptic([50, 80, 50]);
      setTimeout(() => {
        let targetUrl = `quest_runner.html?subject=${targetSubject}`;
        if (targetSubject === 'english' || targetSubject === 'math') {
          targetUrl += `&unit=${selectedUnit}&mode=${selectedMode}`;
        }
        window.location.href = targetUrl;
      }, 350);
    }

    function handleStreakClick() {
      pokeSound('level');
      alert('🔥 3일 연속 학습 성공 중!\n오늘 딱 1개 퀘스트만 완료하면 불꽃이 유지됩니다!');
    }

    function handleCoinClick() {
      pokeSound('coin');
      alert('🪙 보유 코인: 120개\n퀘스트를 완료하면 코인이 쌓입니다!');
    }
  </script>
</body>
</html>
