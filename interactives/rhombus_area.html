<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>마름모 넓이 공식 유도 🚀</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gaegu:wght@400;700&family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet">
<style>
    :root {
        --bg: #fdfbf7;
        --surface: #ffffff;
        --mint: #B5EAEA;
        --mint-border: #78C4C4;
        --orange: #FFB7B2;
        --orange-border: #FF8A8A;
        --text-main: #4a3352;
        --cyan: #00D4FF;
        --pink: #FF6B9D;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
        font-family: 'Nanum Gothic', sans-serif; 
        background: var(--bg); 
        color: var(--text-main); 
        min-height: 100vh; 
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 20px;
    }

    .header {
        text-align: center;
        margin-bottom: 20px;
        animation: fadeDown 0.6s ease both;
    }

    @keyframes fadeDown { 
        from { opacity:0; transform:translateY(-20px); } 
        to { opacity:1; transform:translateY(0); } 
    }

    .title {
        font-family: 'Jua', sans-serif;
        font-size: 2.5rem;
        color: var(--pink);
        margin-bottom: 10px;
    }

    .subtitle {
        font-size: 1.1rem;
        color: #666;
        font-weight: 700;
    }

    .card {
        background: var(--surface);
        border: 3px solid #ffe7ee;
        border-radius: 30px;
        padding: 30px;
        box-shadow: 0 15px 35px rgba(0,0,0,0.05);
        max-width: 700px;
        width: 100%;
        text-align: center;
    }

    .canvas-container {
        position: relative;
        width: 100%;
        max-width: 500px;
        margin: 0 auto 20px auto;
        background: #fff;
        border-radius: 20px;
        border: 2px dashed #e0e0e0;
        overflow: hidden;
    }

    svg {
        width: 100%;
        height: auto;
        display: block;
    }

    /* 4개의 조각 회전 트랜지션 및 축 설정 */
    .quadrant {
        transition: transform 1.5s cubic-bezier(0.4, 0, 0.2, 1), filter 0.3s ease;
    }
    
    #tr-tri { transform-origin: 200px 37.5px; } /* 우상단 조각 중심축 */
    #br-tri { transform-origin: 200px 112.5px; } /* 우하단 조각 중심축 */
    #bl-tri { transform-origin: 100px 112.5px; } /* 좌하단 조각 중심축 */
    #tl-tri { transform-origin: 100px 37.5px; } /* 좌상단 조각 중심축 */

    .quadrant.moving {
        filter: drop-shadow(0px 0px 8px rgba(255, 107, 53, 0.6));
    }

    .guide-box {
        background: #f8f9fa;
        border-left: 5px solid var(--cyan);
        padding: 20px;
        border-radius: 15px;
        margin-bottom: 25px;
        min-height: 120px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Jua', sans-serif;
        font-size: 1.3rem;
        line-height: 1.6;
        color: #333;
        transition: all 0.3s ease;
    }

    .controls {
        display: flex;
        gap: 15px;
        justify-content: center;
    }

    .btn {
        padding: 15px 30px;
        border: none;
        border-radius: 20px;
        font-family: 'Jua', sans-serif;
        font-size: 1.2rem;
        cursor: pointer;
        transition: all 0.2s ease;
        box-shadow: 0 6px 15px rgba(0,0,0,0.1);
    }
    .btn:hover { transform: translateY(-3px) scale(1.05); }
    .btn:active { transform: translateY(2px) scale(0.95); }
    
    .btn-start { background: linear-gradient(135deg, var(--cyan), #009ffd); color: white; }
    .btn-reset { background: #e0e0e0; color: #555; display: none; }

    .highlight-orange { color: #FF6B35; }
    .highlight-blue { color: #4D96FF; }
    .highlight-pink { color: var(--pink); }

    .grid-pattern { fill: url(#grid); }
</style>
</head>
<body>

<div class="header">
    <div class="title">마름모 넓이 구하기 🔷</div>
    <div class="subtitle">도형을 감싸는 커다란 직사각형을 만들어봐요!</div>
</div>

<div class="card">
    <div class="canvas-container">
        <svg viewBox="-60 -40 420 280" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
                    <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#f0f0f0" stroke-width="1"/>
                </pattern>
            </defs>

            <!-- 배경 모눈종이 -->
            <rect x="-60" y="-40" width="420" height="280" class="grid-pattern" />

            <!-- 외곽 직사각형 (가이드 점선) -->
            <rect x="50" y="0" width="200" height="150" fill="none" stroke="#ccc" stroke-width="3" stroke-dasharray="8,8" />

            <!-- 원본 마름모 (민트색 배경) -->
            <polygon points="150,0 250,75 150,150 50,75" fill="var(--mint)" stroke="var(--mint-border)" stroke-width="2" />

            <!-- 분리되어 회전할 4개의 복사본 삼각형 (주황색) -->
            <polygon id="tr-tri" class="quadrant" points="150,0 250,75 150,75" fill="var(--orange)" stroke="var(--orange-border)" stroke-width="2" />
            <polygon id="br-tri" class="quadrant" points="250,75 150,150 150,75" fill="var(--orange)" stroke="var(--orange-border)" stroke-width="2" />
            <polygon id="bl-tri" class="quadrant" points="150,150 50,75 150,75" fill="var(--orange)" stroke="var(--orange-border)" stroke-width="2" />
            <polygon id="tl-tri" class="quadrant" points="50,75 150,0 150,75" fill="var(--orange)" stroke="var(--orange-border)" stroke-width="2" />

            <!-- 가로 대각선 -->
            <line x1="50" y1="75" x2="250" y2="75" stroke="#333" stroke-width="2" stroke-dasharray="4,4" />
            <!-- 세로 대각선 -->
            <line x1="150" y1="0" x2="150" y2="150" stroke="#333" stroke-width="2" stroke-dasharray="4,4" />

            <!-- 치수선 (한 대각선/가로) -->
            <g id="base-group">
                <line x1="50" y1="175" x2="250" y2="175" stroke="#FF6B35" stroke-width="3" stroke-linecap="round" />
                <line x1="50" y1="170" x2="50" y2="180" stroke="#FF6B35" stroke-width="3" stroke-linecap="round" />
                <line x1="250" y1="170" x2="250" y2="180" stroke="#FF6B35" stroke-width="3" stroke-linecap="round" />
                <text x="150" y="205" text-anchor="middle" font-family="Jua" font-size="20" fill="#FF6B35" id="base-label">한 대각선</text>
            </g>

            <!-- 치수선 (다른 대각선/세로) -->
            <g id="height-group">
                <line x1="30" y1="0" x2="30" y2="150" stroke="#4D96FF" stroke-width="3" stroke-linecap="round" />
                <line x1="25" y1="0" x2="35" y2="0" stroke="#4D96FF" stroke-width="3" stroke-linecap="round" />
                <line x1="25" y1="150" x2="35" y2="150" stroke="#4D96FF" stroke-width="3" stroke-linecap="round" />
                <text x="15" y="80" text-anchor="end" font-family="Jua" font-size="20" fill="#4D96FF" id="height-label">다른 대각선</text>
            </g>
        </svg>
    </div>

    <div class="guide-box" id="guide-text">
        마름모의 넓이를 어떻게 구할까요?<br>
        '공식 유도 시작' 버튼을 눌러보세요!
    </div>

    <div class="controls">
        <button class="btn btn-start" id="start-btn">✨ 공식 유도 시작</button>
        <button class="btn btn-reset" id="reset-btn">🔄 다시 보기</button>
    </div>
</div>

<script>
    const trTri = document.getElementById('tr-tri');
    const brTri = document.getElementById('br-tri');
    const blTri = document.getElementById('bl-tri');
    const tlTri = document.getElementById('tl-tri');
    
    const guideText = document.getElementById('guide-text');
    const startBtn = document.getElementById('start-btn');
    const resetBtn = document.getElementById('reset-btn');
    
    const baseLabel = document.getElementById('base-label');
    const heightLabel = document.getElementById('height-label');

    let animationTimeouts = [];
    const quadrants = [trTri, brTri, blTri, tlTri];

    startBtn.addEventListener('click', () => {
        startBtn.style.display = 'none';
        
        // 1단계: 조각 분리 준비
        quadrants.forEach(q => q.classList.add('moving'));
        guideText.innerHTML = "1. 마름모 안을 채우고 있는 4개의 <span class='highlight-orange'>작은 직각삼각형</span>을 복사해요!";

        // 2단계: 180도 바깥으로 펼치기
        animationTimeouts.push(setTimeout(() => {
            quadrants.forEach(q => {
                q.style.transform = 'rotate(180deg)';
            });
            guideText.innerHTML = "2. 복사한 삼각형들을 바깥쪽 빈 공간으로 180도 휙! 뒤집어 펼쳐줍니다 💥";
        }, 1500));

        // 3단계: 결론 (직사각형의 절반)
        animationTimeouts.push(setTimeout(() => {
            quadrants.forEach(q => q.classList.remove('moving'));
            
            baseLabel.innerHTML = "가로 (한 대각선)";
            heightLabel.innerHTML = "세로 (다른 대각선)";
            
            guideText.innerHTML = `
                3. 커다란 <b>직사각형</b>이 가득 채워졌어요! 🎉<br><br>
                (큰 직사각형 넓이) = <span class='highlight-orange'>(한 대각선)</span> × <span class='highlight-blue'>(다른 대각선)</span><br>
                마름모는 이 직사각형 넓이의 딱 절반이므로<br>
                마름모 넓이 공식 = <b>(한 대각선) × (다른 대각선) <span class='highlight-pink'>÷ 2</span></b>
            `;
            
            resetBtn.style.display = 'inline-block';
        }, 3500));
    });

    resetBtn.addEventListener('click', () => {
        animationTimeouts.forEach(clearTimeout);
        animationTimeouts = [];

        quadrants.forEach(q => {
            q.classList.remove('moving');
            q.style.transform = 'rotate(0deg)';
        });
        
        baseLabel.innerHTML = "한 대각선";
        heightLabel.innerHTML = "다른 대각선";
        
        guideText.innerHTML = "마름모의 넓이를 어떻게 구할까요?<br>'공식 유도 시작' 버튼을 눌러보세요!";
        
        resetBtn.style.display = 'none';
        startBtn.style.display = 'inline-block';
    });
</script>

</body>
</html>
