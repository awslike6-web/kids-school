<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>주아의 공부방 허브</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Jua', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; background: linear-gradient(160deg, #ffe8f5 0%, #fffbe6 100%); color: #2D2D4E; }
  h1 { font-family: 'Gaegu', cursive; font-size: 3rem; margin-bottom: 40px; color: #FF6B9D; text-shadow: 2px 2px 0 #fff; }
  .hub-grid { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; width: 100%; max-width: 600px; padding: 0 20px; }
  .btn { flex: 1; min-width: 200px; padding: 40px 20px; font-size: 1.6rem; border: 4px solid #fff; border-radius: 24px; cursor: pointer; color: white; background: linear-gradient(135deg, #FF9F43, #FFD93D); box-shadow: 0 10px 20px rgba(255,159,67,0.3); transition: transform 0.2s; display: flex; flex-direction: column; align-items: center; gap: 10px; font-family: 'Jua', sans-serif; }
  .btn.math { background: linear-gradient(135deg, #FF6B9D, #A78BFA); box-shadow: 0 10px 20px rgba(255,107,157,0.3); }
  .btn:hover { transform: translateY(-5px); }
  .icon { font-size: 3rem; }
  .back-btn { margin-top: 40px; padding: 10px 24px; border-radius: 16px; border: 2px solid #FF6B9D; background: #fff; color: #FF6B9D; font-family: 'Jua', sans-serif; font-size: 0.95rem; cursor: pointer; transition: 0.2s; font-weight: bold; }
  .back-btn:hover { background: #ffe8f5; }
</style>
</head>
<body>

    <h1>🌟 주아의 공부방</h1>
    <div class="hub-grid">
        <button class="btn math" onclick="location.href='math.html'">
            <div class="icon">📝</div>수학 연산방 입장
        </button>
        <button class="btn" onclick="location.href='gugudan.html'">
            <div class="icon">🚀</div>구구단 탐험대 입장
        </button>
    </div>
    
    <button class="back-btn" onclick="location.href='../multiverse.html'">← 다른 친구 방 고르기</button>

</body>
</html>
