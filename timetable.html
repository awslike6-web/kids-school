<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>민민이네 공부방 · 주간 시간표</title>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700&family=Jua&family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="kids/css/timetable.css">
</head>
<body>

<div class="bg-glow"></div>

<div class="monitor">
  <div class="top-bar">
    <div class="brand-block">
      <h1><span class="accent2">민민이네</span> <span class="accent">공부방</span></h1>
      <p id="brandSubtitle">📺 로비 모니터 · 주간 학교 시간표</p>
    </div>
    <div class="clock-block">
      <div class="clock-time" id="clockTime">--:--</div>
      <div class="clock-date" id="clockDate">로딩 중...</div>
    </div>
  </div>

  <a id="backToLobby" class="back-lobby-btn" href="lobby.html">← 로비로 돌아가기</a>
  <div id="viewerBadge" class="viewer-badge"></div>

  <div class="filter-tabs" id="filterTabs">
    <button class="filter-btn active" data-filter="all" onclick="setChildFilter('all', this)">📋 전체보기</button>
    <button class="filter-btn son" data-filter="민수" onclick="setChildFilter('민수', this)">👦 민수 시간표</button>
    <button class="filter-btn daughter" data-filter="민서" onclick="setChildFilter('민서', this)">👧 민서 시간표</button>
  </div>

  <!-- 🌟 [이벤트 오버레이 ①] 상단 긴급/전체 공지 띠배너 영역 -->
  <div id="topNoticeBannerArea" class="top-notice-banner-area" style="display:none;"></div>

  <div class="dual-track">
    <section class="track-panel">
      <div class="panel-header">
        <h2>📅 <span id="gridTitle">주간 시간표</span></h2>
        <p id="gridSubtitle">월~금 · 1~6교시 고정 격자</p>
      </div>
      <div class="panel-body">
        <div class="panel-scroll">
          <div id="gridContent" class="loading-state">
            <div class="spinner"></div>
            노션 시간표 데이터 연결 중...
          </div>
        </div>
      </div>
    </section>

    <section class="track-panel notice-board">
      <div class="panel-header">
        <h2>📢 <span id="noticeTitle">전체 행정 공지판</span></h2>
        <p id="noticeSubtitle">결석계 · 행사 · 준비물 · 수업 메모</p>
      </div>
      <div class="panel-body">
        <div class="panel-scroll">
          <div class="chalkboard">
            <div id="noticeContent" class="loading-state">
              <div class="spinner"></div>
              공지 불러오는 중...
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>

  <div class="status-bar">
    <span id="syncStatus">⏳ 동기화 대기</span>
    <span id="statusHint">5분마다 자동 새로고침 · F11 전체화면 권장</span>
  </div>
</div>

<div id="overlayModalPortal"></div>

<script src="kids/config.js"></script>
<script src="kids/core/notion-timetable.js"></script>
<script src="kids/js/timetable_controller.js"></script>
</body>
</html>
