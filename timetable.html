<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>민민이네 공부방 · 주간 시간표</title>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700&family=Jua&family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="kids/css/timetable.css">
</head>
<body>

<div class="bg-glow"></div>

<div class="monitor">
  <div class="top-bar">
    <div class="brand-block">
      <h1>🏰 민민이네 공부방</h1>
      <span class="badge">LIVE 시간표</span>
      <span class="badge badge-accent">실시간 동기화</span>
    </div>
    <div id="topNoticeArea"></div>
    <div class="clock-block">
      <div class="clock-time" id="clockTime">--:--:--</div>
      <div class="clock-date" id="clockDate">----년 --월 --일 (-)</div>
    </div>
  </div>

  <div class="filter-panel">
    <div class="filter-tabs">
      <button class="filter-btn active" data-filter="all" onclick="setChildFilter('all')">
        <span class="filter-btn-icon">👥</span>
        <span>민수 · 민서 전체</span>
        <span class="filter-badge" id="badgeAll">-</span>
      </button>
      <button class="filter-btn" data-filter="민수" onclick="setChildFilter('민수')">
        <span class="filter-btn-icon">👦</span>
        <span>민수 (5-2)</span>
        <span class="filter-badge" id="badgeMinsu">-</span>
      </button>
      <button class="filter-btn" data-filter="민서" onclick="setChildFilter('민서')">
        <span class="filter-btn-icon">👧</span>
        <span>민서 (1-2)</span>
        <span class="filter-badge" id="badgeMinseo">-</span>
      </button>
    </div>
  </div>

  <div class="board-grid">
    <div class="panel">
      <div class="panel-header">
        <span class="panel-title">📅 주간 정규 시간표</span>
        <span class="panel-subtitle" id="gridSubtitle">기본 시간표</span>
      </div>
      <div class="panel-body">
        <div class="table-wrap">
          <table class="weekly-grid">
            <thead>
              <tr id="gridHeadRow">
                <th class="period-col">교시</th>
                <th class="day-mon">월</th>
                <th class="day-tue">화</th>
                <th class="day-wed">수</th>
                <th class="day-thu">목</th>
                <th class="day-fri">금</th>
              </tr>
            </thead>
            <tbody id="gridBody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-header">
        <span class="panel-title">📌 알림장 · 학사 일정</span>
        <span class="panel-subtitle" id="noticeSubtitle">이번 주 전체</span>
      </div>
      <div class="panel-body">
        <div class="notice-list" id="noticeList">
          <div class="empty-state">
            <div class="empty-icon">⏳</div>
            <div class="empty-text">알림장 불러오는 중...</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="status-bar">
    <span id="syncStatus">⏳ 동기화 대기</span>
    <span id="statusHint">5분마다 자동 새로고침 · F11 전체화면 권장</span>
  </div>
</div>

<div id="overlayModalPortal"></div>

<script src="kids/config.js"></script>
<script src="kids/core/notion-timetable.js"></script>
<script src="kids/js/timetable_controller.js"></script>
</body>
</html>
