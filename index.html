<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>민민이네 공부방</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --sky: #6EC6F5; --yellow: #FFD93D; --pink: #FF6B9D; --mint: #4ECDC4;
    --purple: #A78BFA; --orange: #FF9F43; --green: #6BCB77;
    --white: #FFFEF7; --dark: #2D2D4E; --card: rgba(255,255,255,0.93);
    --line: rgba(98,84,255,0.14);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Jua', sans-serif;
    background: linear-gradient(160deg, #c8f0ff 0%, #ffe8f5 50%, #fffbe6 100%);
    min-height: 100vh;
    overflow-x: hidden;
    color: var(--dark);
  }

  /* --- 배경 부유 요소 --- */
  .bg-floats { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .float-item {
    position: absolute; font-size: 1.8rem; opacity: 0.13;
    animation: floatUp linear infinite;
    font-family: 'Gaegu', cursive; font-weight: 700; color: var(--purple);
  }
  @keyframes floatUp {
    0%   { transform: translateY(110vh) rotate(0deg);   opacity: 0; }
    10%  { opacity: 0.13; }
    90%  { opacity: 0.13; }
    100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
  }

  /* --- 화면 전환 --- */
  .screen {
    position: relative; z-index: 1; display: none;
    flex-direction: column; align-items: center;
    padding: 36px 16px 60px; min-height: 100vh;
    animation: fadeIn .35s ease;
  }
  .screen.active { display: flex; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }

  /* --- 타이틀 --- */
  .main-title {
    font-family: 'Gaegu', cursive; font-size: clamp(2.2rem, 9vw, 3.8rem);
    font-weight: 700; text-align: center; line-height: 1.2;
    margin-bottom: 6px;
    filter: drop-shadow(2px 3px 0 rgba(0,0,0,0.07));
  }
  .main-title .accent { color: var(--pink); }
  .main-title .accent2 { color: var(--purple); }
  .subtitle {
    font-family: 'Gaegu', cursive; font-size: 1.05rem;
    color: #999; margin-bottom: 32px;
  }

  /* --- 프로필 2x2 그리드 --- */
  .profile-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    width: 100%; max-width: 400px;
  }

  .profile-btn {
    border: none; border-radius: 28px;
    padding: 28px 16px 22px;
    cursor: pointer; font-family: 'Jua', sans-serif;
    font-size: 1.25rem; color: #fff;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    transition: transform .2s, box-shadow .2s;
    position: relative; overflow: hidden;
  }
  .profile-btn::after {
    content: '';
    position: absolute; inset: 0;
    background: rgba(255,255,255,0.12);
    opacity: 0; transition: opacity .18s;
  }
  .profile-btn:hover { transform: translateY(-6px); }
  .profile-btn:hover::after { opacity: 1; }
  .profile-btn:active { transform: scale(0.96); }

  .profile-btn.son      { background: linear-gradient(145deg, #6EC6F5, #A78BFA); box-shadow: 0 10px 28px rgba(110,198,245,0.35); }
  .profile-btn.daughter { background: linear-gradient(145deg, #FF6B9D, #FF9F43); box-shadow: 0 10px 28px rgba(255,107,157,0.35); }
  .profile-btn.dad      { background: linear-gradient(145deg, #4ECDC4, #44A08D); box-shadow: 0 10px 28px rgba(78,205,196,0.35); }
  .profile-btn.mom      { background: linear-gradient(145deg, #FFD93D, #FF6B9D); box-shadow: 0 10px 28px rgba(255,217,61,0.35); }

  .profile-avatar {
    width: 64px; height: 64px; border-radius: 50%;
    background: rgba(255,255,255,0.25);
    display: flex; align-items: center; justify-content: center;
    border: 3px solid rgba(255,255,255,0.5);
  }
  .profile-avatar svg { width: 38px; height: 38px; }
  .profile-role { font-size: 0.82rem; opacity: 0.85; margin-top: -4px; }

  /* --- 과목 선택 화면 --- */
  .user-welcome {
    display: inline-block; padding: 8px 20px; border-radius: 999px;
    background: rgba(255,255,255,0.7); border: 2.5px solid rgba(0,0,0,0.08);
    font-size: 1rem; margin-bottom: 24px;
    backdrop-filter: blur(8px);
  }
  .user-welcome span { color: var(--purple); font-weight: bold; }

  .subject-grid {
    display: flex; flex-direction: column; gap: 14px;
    width: 100%; max-width: 420px;
  }

  .subject-btn {
    display: flex; align-items: center; gap: 18px;
    text-decoration: none;
    padding: 20px 24px; border-radius: 22px;
    font-family: 'Jua', sans-serif; font-size: 1.3rem; color: #fff;
    transition: transform .2s, box-shadow .2s;
    border: none; cursor: pointer;
    position: relative; overflow: hidden;
  }
  .subject-btn::after {
    content: ''; position: absolute; right: 20px; top: 50%;
    transform: translateY(-50%);
    width: 32px; height: 32px; border-radius: 50%;
    background: rgba(255,255,255,0.2);
    transition: all .2s;
  }
  .subject-btn:hover { transform: translateY(-5px); }
  .subject-btn:hover::after { background: rgba(255,255,255,0.35); right: 16px; }
  .subject-btn:active { transform: scale(0.97); }

  .subject-btn .s-icon {
    width: 52px; height: 52px; border-radius: 14px;
    background: rgba(255,255,255,0.22);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; border: 2px solid rgba(255,255,255,0.3);
  }
  .subject-btn .s-icon svg { width: 28px; height: 28px; }
  .subject-btn .s-info { display: flex; flex-direction: column; gap: 2px; }
  .subject-btn .s-label { font-size: 1.2rem; }
  .subject-btn .s-desc { font-size: 0.8rem; opacity: 0.82; font-family: 'Gaegu', cursive; }

  .btn-math    { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); box-shadow: 0 8px 22px rgba(240,147,251,0.35); }
  .btn-english { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); box-shadow: 0 8px 22px rgba(79,172,254,0.35); }
  .btn-korean  { background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%); box-shadow: 0 8px 22px rgba(67,233,123,0.35); color: #1a5c3a; }

  /* --- 뒤로 버튼 --- */
  .back-btn {
    margin-top: 28px; padding: 14px 32px; border-radius: 18px;
    border: 2.5px solid rgba(0,0,0,0.09); background: rgba(255,255,255,0.7);
    font-family: 'Jua', sans-serif; font-size: 1rem; cursor: pointer;
    color: #888; backdrop-filter: blur(6px);
    transition: all .18s;
  }
  .back-btn:hover { background: #fff; color: var(--dark); transform: translateY(-2px); }

  /* --- 비밀번호 팝업 오버레이 --- */
  .pw-overlay {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(45, 45, 78, 0.55);
    backdrop-filter: blur(6px);
    display: none; align-items: center; justify-content: center;
    animation: fadeIn .2s ease;
  }
  .pw-overlay.active { display: flex; }

  .pw-modal {
    background: var(--card); border-radius: 28px;
    padding: 36px 30px 28px; width: 90%; max-width: 360px;
    box-shadow: 0 24px 60px rgba(45,45,78,0.3);
    text-align: center;
    border: 2px solid rgba(255,255,255,0.8);
    animation: popIn .25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  @keyframes popIn {
    from { transform: scale(0.85); opacity: 0; }
    to   { transform: scale(1);    opacity: 1; }
  }
  .pw-modal-title {
    font-family: 'Gaegu', cursive; font-size: 1.5rem;
    font-weight: 700; color: var(--dark); margin-bottom: 6px;
  }
  .pw-modal-sub { font-size: 0.9rem; color: #aaa; margin-bottom: 22px; }

  /* 비밀번호 점 표시기 */
  .pw-dots {
    display: flex; gap: 12px; justify-content: center; margin-bottom: 22px;
  }
  .pw-dot {
    width: 18px; height: 18px; border-radius: 50%;
    border: 3px solid #ddd; background: transparent;
    transition: all .15s;
  }
  .pw-dot.filled { background: var(--purple); border-color: var(--purple); transform: scale(1.15); }
  .pw-dot.error  { background: var(--pink);   border-color: var(--pink);   }

  /* 숫자 키패드 */
  .keypad {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
    margin-bottom: 14px;
  }
  .key-btn {
    padding: 16px 10px; border-radius: 16px;
    border: 2.5px solid #e8e8f0; background: #fff;
    font-family: 'Jua', sans-serif; font-size: 1.4rem;
    cursor: pointer; color: var(--dark);
    transition: all .12s;
  }
  .key-btn:hover { background: var(--purple); color: #fff; border-color: var(--purple); transform: scale(1.05); }
  .key-btn:active { transform: scale(0.94); }
  .key-btn.zero { grid-column: 2; }
  .key-btn.del  { background: #fff0f5; border-color: #ffd6e5; color: var(--pink); font-size: 1rem; }
  .key-btn.del:hover { background: var(--pink); color: #fff; }

  .pw-cancel-btn {
    width: 100%; padding: 12px; border-radius: 14px;
    border: 2px solid #eee; background: #f7f7fa;
    font-family: 'Jua', sans-serif; font-size: 1rem;
    cursor: pointer; color: #aaa; margin-top: 4px;
    transition: all .15s;
  }
  .pw-cancel-btn:hover { background: #eee; color: #888; }

  /* 흔들기 에러 애니메이션 */
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20%       { transform: translateX(-8px); }
    40%       { transform: translateX(8px); }
    60%       { transform: translateX(-6px); }
    80%       { transform: translateX(6px); }
  }
  .pw-modal.shake { animation: shake .35s ease; }
</style>
</head>
<body>

<!-- 배경 부유 요소 -->

<!-- ======================== 화면 1: 프로필 선택 ======================== -->

<!-- ======================== 화면 2: 과목 선택 ======================== -->
<div class="screen" id="screen-subjects">

<div class="pw-overlay" id="pwOverlay">

<script>
  // ============================================================
  // 설정: 부모님 비밀번호 (여기서 변경하세요)
  // ============================================================
  const PARENT_PASSWORD = '1234';

  // ============================================================
  // 배경 부유 글자 생성
  // ============================================================
  (function () {
    const wrap = document.getElementById('bgFloats');
    if (!wrap) return;
    const symbols = ['2', '3', '+', 'A', 'B', '*', '7', 'x', '=', '?', '5', 'C'];
    for (let i = 0; i < 18; i++) {
      const el = document.createElement('div');
      el.className = 'float-item';
      el.textContent = symbols[Math.floor(Math.random() * symbols.length)];
      el.style.left = (Math.random() * 92) + '%';
      el.style.fontSize = (1.2 + Math.random() * 1.4) + 'rem';
      el.style.animationDuration = (12 + Math.random() * 14) + 's';
      el.style.animationDelay = (-Math.random() * 18) + 's';
      wrap.appendChild(el);
    }
  })();

  // ============================================================
  // 화면 전환 헬퍼
  // ============================================================
  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    const target = document.getElementById(id);
    if (target) { target.classList.add('active'); window.scrollTo(0, 0); }
  }

  function goBack() {
    showScreen('screen-profile');
  }

  // ============================================================
  // 아이들 프로필 선택
  // ============================================================
  function selectChild(profileKey, displayName) {
    localStorage.setItem('currentUser', profileKey);
    localStorage.setItem('currentUserName', displayName);
    document.getElementById('welcomeName').textContent = displayName;
    showScreen('screen-subjects');
  }

  // ============================================================
  // 부모님 프로필 선택 → 비밀번호 팝업
  // ============================================================
  let pwBuffer = '';
  let pendingParentKey = '';
  let pendingParentName = '';

  function selectParent(profileKey, displayName) {
    pendingParentKey = profileKey;
    pendingParentName = displayName;
    pwBuffer = '';
    document.getElementById('pwTitle').textContent = displayName + '님, 비밀번호를 입력하세요';
    updateDots();
    document.getElementById('pwOverlay').classList.add('active');
  }

  function closePasswordModal() {
    document.getElementById('pwOverlay').classList.remove('active');
    pwBuffer = '';
    updateDots();
  }

  function keyPress(digit) {
    if (pwBuffer.length >= 4) return;
    pwBuffer += digit;
    updateDots();
    if (pwBuffer.length === 4) {
      setTimeout(checkPassword, 150);
    }
  }

  function keyDel() {
    pwBuffer = pwBuffer.slice(0, -1);
    updateDots();
  }

  function updateDots() {
    for (let i = 0; i < 4; i++) {
      const dot = document.getElementById('dot' + i);
      dot.classList.remove('filled', 'error');
      if (i < pwBuffer.length) dot.classList.add('filled');
    }
  }

  function checkPassword() {
    if (pwBuffer === PARENT_PASSWORD) {
      // 비밀번호 맞음
      localStorage.setItem('currentUser', pendingParentKey);
      localStorage.setItem('currentUserName', pendingParentName);
      closePasswordModal();
      alert('대시보드 준비 중입니다!\n곧 업데이트될 예정이에요.');
    } else {
      // 비밀번호 틀림
      for (let i = 0; i < 4; i++) {
        const dot = document.getElementById('dot' + i);
        dot.classList.remove('filled');
        dot.classList.add('error');
      }
      const modal = document.getElementById('pwModal');
      modal.classList.add('shake');
      modal.addEventListener('animationend', function onEnd() {
        modal.classList.remove('shake');
        modal.removeEventListener('animationend', onEnd);
      });
      setTimeout(() => {
        pwBuffer = '';
        updateDots();
      }, 600);
    }
  }

  // 키보드 입력도 지원
  document.addEventListener('keydown', function (e) {
    if (!document.getElementById('pwOverlay').classList.contains('active')) return;
    if (e.key >= '0' && e.key <= '9') keyPress(e.key);
    if (e.key === 'Backspace') keyDel();
    if (e.key === 'Escape') closePasswordModal();
  });
</script>
</body>
</html>
