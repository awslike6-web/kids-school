<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>민민이네 공부방</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --sky: #6EC6F5; --yellow: #FFD93D; --pink: #FF6B9D; --mint: #4ECDC4;
    --purple: #A78BFA; --orange: #FF9F43; --green: #6BCB77;
    --white: #FFFEF7; --dark: #2D2D4E; --card: rgba(255,255,255,0.93);
    --line: rgba(98,84,255,0.14);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Jua', sans-serif; background: linear-gradient(160deg, #c8f0ff 0%, #ffe8f5 50%, #fffbe6 100%); min-height: 100vh; overflow-x: hidden; color: var(--dark); transition: background 0.5s ease; }
  
  body.theme--minecraft { background: linear-gradient(160deg, #e0f7fa 0%, #b2ebf2 50%, #80deea 100%); }
  body.theme--slime { background: linear-gradient(160deg, #e8f5e9 0%, #c8e6c9 50%, #a5d6a7 100%); }

  .bg-floats { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .float-item { position: absolute; font-size: 1.8rem; opacity: 0.13; animation: floatUp linear infinite; font-family: 'Gaegu', cursive; font-weight: 700; color: var(--purple); }
  @keyframes floatUp { 0% { transform: translateY(110vh) rotate(0deg); opacity: 0; } 10% { opacity: 0.13; } 90% { opacity: 0.13; } 100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; } }

  .screen { position: relative; z-index: 1; display: none; flex-direction: column; align-items: center; padding: 36px 16px 60px; min-height: 100vh; animation: fadeIn .35s ease; }
  .screen.active { display: flex; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }

  .main-title { font-family: 'Gaegu', cursive; font-size: clamp(2.2rem, 9vw, 3.8rem); font-weight: 700; text-align: center; line-height: 1.2; margin-bottom: 6px; filter: drop-shadow(2px 3px 0 rgba(0,0,0,0.07)); }
  .main-title .accent { color: var(--pink); }
  .main-title .accent2 { color: var(--purple); }
  .subtitle { font-family: 'Gaegu', cursive; font-size: 1.05rem; color: #999; margin-bottom: 32px; }

  /* 프로필 버튼 */
  .profile-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; width: 100%; max-width: 400px; margin-bottom: 20px; }
  .profile-btn { border: none; border-radius: 28px; padding: 28px 16px 22px; cursor: pointer; font-family: 'Jua', sans-serif; font-size: 1.25rem; color: #fff; display: flex; flex-direction: column; align-items: center; gap: 10px; transition: transform .2s, box-shadow .2s; position: relative; overflow: hidden; }
  .profile-btn:hover { transform: translateY(-6px); }
  .profile-btn:active { transform: scale(0.96); }
  .profile-btn.son { background: linear-gradient(145deg, #6EC6F5, #A78BFA); box-shadow: 0 10px 28px rgba(110,198,245,0.35); }
  .profile-btn.daughter { background: linear-gradient(145deg, #FF6B9D, #FF9F43); box-shadow: 0 10px 28px rgba(255,107,157,0.35); }
  .profile-btn.dad { background: linear-gradient(145deg, #4ECDC4, #44A08D); box-shadow: 0 10px 28px rgba(78,205,196,0.35); }
  .profile-btn.mom { background: linear-gradient(145deg, #FFD93D, #FF6B9D); box-shadow: 0 10px 28px rgba(255,217,61,0.35); }

  .profile-avatar { width: 64px; height: 64px; border-radius: 50%; background: rgba(255,255,255,0.25); display: flex; align-items: center; justify-content: center; border: 3px solid rgba(255,255,255,0.5); }
  .profile-avatar svg { width: 38px; height: 38px; }
  .profile-role { font-size: 0.82rem; opacity: 0.85; margin-top: -4px; }

  .user-welcome { display: inline-block; padding: 8px 20px; border-radius: 999px; background: rgba(255,255,255,0.7); border: 2.5px solid rgba(0,0,0,0.08); font-size: 1rem; margin-bottom: 14px; backdrop-filter: blur(8px); }
  .user-welcome span { color: var(--purple); font-weight: bold; }

  /* 💎 인벤토리 보상 UI */
  .inventory-card { background: var(--card); border-radius: 20px; padding: 16px; width: 100%; max-width: 420px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 8px 20px rgba(0,0,0,0.08); margin-bottom: 24px; border: 2px solid rgba(255,255,255,0.8); }
  .inventory-card.theme--minecraft { border-color: #4FC3F7; background: #e1f5fe; }
  .inventory-card.theme--slime { border-color: #81C784; background: #e8f5e9; }
  .reward-badge { display: flex; align-items: center; gap: 8px; font-size: 1.4rem; font-weight: bold; }
  .math-level { font-size: 1.1rem; color: #555; background: rgba(0,0,0,0.05); padding: 4px 12px; border-radius: 12px; font-weight: bold; }

  /* 과목 버튼 */
  .subject-grid { display: flex; flex-direction: column; gap: 14px; width: 100%; max-width: 420px; }
  .subject-btn { display: flex; align-items: center; gap: 18px; text-decoration: none; padding: 20px 24px; border-radius: 22px; font-family: 'Jua', sans-serif; font-size: 1.3rem; color: #fff; transition: transform .2s; border: none; cursor: pointer; }
  .subject-btn:hover { transform: translateY(-5px); }
  .subject-btn:active { transform: scale(0.97); }
  .subject-btn .s-icon { width: 52px; height: 52px; border-radius: 14px; background: rgba(255,255,255,0.22); display: flex; align-items: center; justify-content: center; flex-shrink: 0; border: 2px solid rgba(255,255,255,0.3); }
  .subject-btn .s-icon svg { width: 28px; height: 28px; }
  .subject-btn .s-info { display: flex; flex-direction: column; gap: 2px; }
  .subject-btn .s-label { font-size: 1.2rem; }
  .subject-btn .s-desc { font-size: 0.8rem; opacity: 0.82; font-family: 'Gaegu', cursive; }

  .btn-math    { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); box-shadow: 0 8px 22px rgba(240,147,251,0.35); }
  .btn-english { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); box-shadow: 0 8px 22px rgba(79,172,254,0.35); }
  .btn-korean  { background: linear-gradient(135deg, #FFD93D 0%, #FF9F43 100%); box-shadow: 0 8px 22px rgba(255,217,61,0.35); }

  .back-btn { margin-top: 28px; padding: 14px 32px; border-radius: 18px; border: 2.5px solid rgba(0,0,0,0.09); background: rgba(255,255,255,0.7); font-family: 'Jua', sans-serif; font-size: 1rem; cursor: pointer; color: #888; }

  /* --- 🔒 비밀번호 모달 UI --- */
  .pw-overlay { position: fixed; inset: 0; background: rgba(35, 40, 60, 0.6); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 100; opacity: 0; transition: opacity 0.3s; }
  .pw-overlay.active { display: flex; opacity: 1; }
  .pw-modal { background: #fff; width: 90%; max-width: 320px; border-radius: 30px; padding: 30px 20px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.2); }
  .pw-title { font-size: 1.3rem; color: var(--dark); margin-bottom: 20px; }
  
  .pw-dots { display: flex; justify-content: center; gap: 12px; margin-bottom: 30px; }
  .dot { width: 16px; height: 16px; border-radius: 50%; background: #e0e0e0; transition: all 0.2s; }
  .dot.filled { background: var(--purple); transform: scale(1.2); }
  .dot.error { background: var(--pink); }
  
  .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; max-width: 240px; margin: 0 auto; }
  .key-btn { background: #f5f5f5; border: none; border-radius: 20px; height: 60px; font-size: 1.5rem; font-family: 'Jua', sans-serif; color: var(--dark); cursor: pointer; transition: all 0.1s; }
  .key-btn:active { background: #e0e0e0; transform: scale(0.95); }
  .key-btn.del { background: transparent; color: var(--pink); font-size: 1.2rem; }
  
  .shake { animation: shake 0.4s; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20%, 60% { transform: translateX(-8px); }
    40%, 80% { transform: translateX(8px); }
  }
</style>
</head>
<body>

<div class="bg-floats" id="bgFloats"></div>

<div class="screen active" id="screen-profile">
  <h1 class="main-title"><span class="accent2">민민이네</span><br><span class="accent">공부방</span></h1>
  <p class="subtitle">누가 접속할까요?</p>

  <div class="profile-grid">
    <button class="profile-btn son" onclick="selectChild('son', '민수')">
      <div class="profile-avatar"><svg viewBox="0 0 38 38" fill="none"><circle cx="19" cy="14" r="8" fill="white"/><ellipse cx="19" cy="33" rx="12" ry="8" fill="white"/><circle cx="16" cy="13" r="1.5" fill="#6EC6F5"/><circle cx="22" cy="13" r="1.5" fill="#6EC6F5"/></svg></div>
      <div>오빠</div><div class="profile-role">민수</div>
    </button>
    <button class="profile-btn daughter" onclick="selectChild('daughter', '민서')">
      <div class="profile-avatar"><svg viewBox="0 0 38 38" fill="none"><circle cx="19" cy="14" r="8" fill="white"/><ellipse cx="19" cy="33" rx="12" ry="8" fill="white"/><circle cx="16" cy="13" r="1.5" fill="#FF6B9D"/><circle cx="22" cy="13" r="1.5" fill="#FF6B9D"/></svg></div>
      <div>동생</div><div class="profile-role">민서</div>
    </button>
    <button class="profile-btn dad" onclick="openPasswordModal('dad', '아빠')">
      <div class="profile-avatar" style="font-size:1.8rem;">👨</div>
      <div>아빠</div>
    </button>
    <button class="profile-btn mom" onclick="openPasswordModal('mom', '엄마')">
      <div class="profile-avatar" style="font-size:1.8rem;">👩</div>
      <div>엄마</div>
    </button>
  </div>
</div>

<div class="screen" id="screen-subjects">
  <h1 class="main-title"><span class="accent2">민민이네</span><br><span class="accent">공부방</span></h1>
  <div class="user-welcome">안녕하세요, <span id="welcomeName">?</span>!</div>

  <div class="inventory-card" id="inventoryDisplay">
    <div class="reward-badge"><span style="font-size:1.2rem;">⏳</span> <span style="font-size:1rem; color:#888;">데이터 불러오는 중...</span></div>
  </div>

  <p class="subtitle" style="margin-bottom: 20px;">어떤 곳으로 입장할까요?</p>

  <div class="subject-grid">
    <a href="kids/math.html" class="subject-btn btn-math">
      <div class="s-icon"><span style="font-size: 1.8rem;">✖️</span></div>
      <div class="s-info"><div class="s-label">수학 스피드 연산</div><div class="s-desc">구구단 · 덧셈뺄셈 · 떨어지는 게임</div></div>
    </a>

    <a href="kids/gugudan.html" class="subject-btn" style="background: linear-gradient(135deg, #1A1A2E 0%, #16213E 100%); box-shadow: 0 8px 22px rgba(22,33,62,0.35);">
      <div class="s-icon" style="border-color: #00D4FF;">
        <span style="font-size: 1.8rem;">🚀</span>
      </div>
      <div class="s-info">
        <div class="s-label" style="color: #FFD93D;">구구단 탐험대</div>
        <div class="s-desc" style="color: #AAB7B8;">우주 테마로 배우는 구구단 원리</div>
      </div>
    </a>

    <a href="kids/english-typing.html" class="subject-btn btn-english">
      <div class="s-icon"><span style="font-size: 1.8rem; font-family: serif; font-weight: bold;">A</span></div>
      <div class="s-info"><div class="s-label">영단어 탐험대</div><div class="s-desc">노션 단어장 · 퀴즈 · 오답 복습</div></div>
    </a>
    <a href="kids/korean_app.html" class="subject-btn btn-korean">
      <div class="s-icon"><span style="font-size: 1.8rem;">📚</span></div>
      <div class="s-info"><div class="s-label">용어사전방</div><div class="s-desc">새싹 받아쓰기 · 척척박사 개념 사전</div></div>
    </a>
  </div>
  <button class="back-btn" onclick="goBack()">← 프로필 다시 선택하기</button>
</div>

<div class="pw-overlay" id="pwOverlay" onclick="closePasswordModal(event)">
  <div class="pw-modal" id="pwModal" onclick="event.stopPropagation()">
    <div class="pw-title">부모님 비밀번호 입력</div>
    <div class="pw-dots">
      <div class="dot" id="dot0"></div>
      <div class="dot" id="dot1"></div>
      <div class="dot" id="dot2"></div>
      <div class="dot" id="dot3"></div>
    </div>
    <div class="keypad">
      <button class="key-btn" onclick="addNumber(1)">1</button>
      <button class="key-btn" onclick="addNumber(2)">2</button>
      <button class="key-btn" onclick="addNumber(3)">3</button>
      <button class="key-btn" onclick="addNumber(4)">4</button>
      <button class="key-btn" onclick="addNumber(5)">5</button>
      <button class="key-btn" onclick="addNumber(6)">6</button>
      <button class="key-btn" onclick="addNumber(7)">7</button>
      <button class="key-btn" onclick="addNumber(8)">8</button>
      <button class="key-btn" onclick="addNumber(9)">9</button>
      <button class="key-btn del" onclick="closePasswordModal(event)">취소</button>
      <button class="key-btn" onclick="addNumber(0)">0</button>
      <button class="key-btn del" onclick="keyDel()">지움</button>
    </div>
  </div>
</div>

<script>
// 🚀 노션 API 설정
const PROXY_URL = "https://minmin-notion.awslike6.workers.dev";
const INVENTORY_DB_ID = "374a27115b688042bb61e6a102242e12"; 

(function () {
  const wrap = document.getElementById('bgFloats');
  const symbols = ['2', '3', '+', 'A', 'B', '*', '7', 'x', '=', '?', '5', 'C'];
  for (let i = 0; i < 18; i++) {
    const el = document.createElement('div'); el.className = 'float-item'; el.textContent = symbols[Math.floor(Math.random() * symbols.length)];
    el.style.left = (Math.random() * 92) + '%'; el.style.animationDuration = (12 + Math.random() * 14) + 's'; el.style.animationDelay = (-Math.random() * 18) + 's';
    wrap.appendChild(el);
  }
})();

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function goBack() { showScreen('screen-profile'); document.body.className = ''; }

function selectChild(profileKey, displayName) {
  localStorage.setItem('currentUser', profileKey);
  localStorage.setItem('currentUserName', displayName);
  document.getElementById('welcomeName').textContent = displayName;
  showScreen('screen-subjects');
  loadUserInventory(displayName);
}

async function loadUserInventory(userName) {
  const container = document.getElementById('inventoryDisplay');
  container.className = 'inventory-card'; 
  document.body.className = '';

  if (userName === '아빠' || userName === '엄마') {
    container.innerHTML = `<div class="reward-badge">☕ <span style="color:#555;">어른 모드</span></div><div class="math-level">관리자</div>`;
    container.classList.add('theme--minecraft');
    document.body.classList.add('theme--minecraft');
    return;
  }

  try {
    const response = await fetch(`${PROXY_URL}/v1/databases/${INVENTORY_DB_ID}/query`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        filter: { property: "이름", title: { equals: userName } }
      })
    });

    const data = await response.json();
    if (!data.results || data.results.length === 0) throw new Error("데이터 없음");

    const props = data.results[0].properties;
    const theme = props["현재 테마"]?.select?.name || (userName === '민수' ? '마인크래프트' : '슬라임');
    const diamond = props["다이아몬드 개수"]?.number || 0;
    const slime = props["슬라임 파츠 개수"]?.number || 0;
    const level = props["수학 레벨"]?.number || 1;

    localStorage.setItem('currentTheme', theme);

    if (theme === '마인크래프트') {
      container.innerHTML = `<div class="reward-badge">💎 <span style="color:#0288D1;">x${diamond}</span></div><div class="math-level">Lv. ${level}</div>`;
      container.classList.add('theme--minecraft');
      document.body.classList.add('theme--minecraft');
    } else {
      container.innerHTML = `<div class="reward-badge">💧 <span style="color:#388E3C;">x${slime}</span></div><div class="math-level">Lv. ${level}</div>`;
      container.classList.add('theme--slime');
      document.body.classList.add('theme--slime');
    }
  } catch (error) {
    console.error("인벤토리 로드 에러:", error);
    const defaultTheme = userName === '민수' ? '마인크래프트' : '슬라임';
    localStorage.setItem('currentTheme', defaultTheme);
    container.innerHTML = `<div class="reward-badge">${defaultTheme === '마인크래프트' ? '💎' : '💧'} <span>x0 (연결필요)</span></div>`;
  }
}

const PARENT_PASSWORD = "0000"; 
let pwBuffer = "";
let pendingParentKey = "";
let pendingParentName = "";

function openPasswordModal(key, name) {
  pendingParentKey = key;
  pendingParentName = name;
  pwBuffer = "";
  updateDots();
  document.getElementById('pwOverlay').classList.add('active');
}

function closePasswordModal(e) {
  if(e) e.stopPropagation();
  document.getElementById('pwOverlay').classList.remove('active');
  pwBuffer = "";
}

function addNumber(n) {
  if (pwBuffer.length < 4) {
    pwBuffer += n;
    updateDots();
    if (pwBuffer.length === 4) {
      setTimeout(checkPassword, 100);
    }
  }
}

function keyDel() {
  pwBuffer = pwBuffer.slice(0, -1);
  updateDots();
}

function updateDots() {
  for (let i = 0; i < 4; i++) {
    const dot = document.getElementById('dot' + i);
    dot.classList.remove('filled', 'error');
    if (i < pwBuffer.length) dot.classList.add('filled');
  }
}

// 🌟 부모님 비밀번호 통과 시 대시보드로 이동 🌟
function checkPassword() {
  if (pwBuffer === PARENT_PASSWORD) {
    localStorage.setItem('currentUser', pendingParentKey);
    localStorage.setItem('currentUserName', pendingParentName);
    closePasswordModal();
    // 부모님 대시보드 화면으로 즉시 이동
    location.href = 'parent_dashboard.html';
  } else {
    for (let i = 0; i < 4; i++) {
      const dot = document.getElementById('dot' + i);
      dot.classList.remove('filled');
      dot.classList.add('error');
    }
    const modal = document.getElementById('pwModal');
    modal.classList.add('shake');
    modal.addEventListener('animationend', function onEnd() {
      modal.classList.remove('shake');
      modal.removeEventListener('animationend', onEnd);
    });
    setTimeout(() => {
      pwBuffer = '';
      updateDots();
    }, 600);
  }
}

document.addEventListener('keydown', function (e) {
  if (!document.getElementById('pwOverlay').classList.contains('active')) return;
  if (e.key >= '0' && e.key <= '9') {
    addNumber(e.key);
  } else if (e.key === 'Backspace') {
    keyDel();
  } else if (e.key === 'Escape') {
    closePasswordModal();
  }
});
</script>
</body>
</html>
