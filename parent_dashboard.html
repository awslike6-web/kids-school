<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>민민이네 대시보드 👨‍👩‍👧‍👦</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --sky: #6EC6F5; --yellow: #FFD93D; --pink: #FF6B9D; --mint: #4ECDC4;
    --purple: #A78BFA; --orange: #FF9F43; --green: #6BCB77;
    --white: #FFFEF7; --dark: #2D2D4E; 
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { 
    font-family: 'Jua', sans-serif; 
    background: linear-gradient(160deg, #f0f8ff 0%, #fff0f5 50%, #fffbe6 100%); 
    min-height: 100vh; 
    overflow-x: hidden; 
    color: var(--dark); 
  }
  
  .bg-floats { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .float-item { position: absolute; font-size: 2rem; opacity: 0.15; animation: floatUp linear infinite; }
  @keyframes floatUp { 
    0% { transform: translateY(110vh) rotate(0deg); opacity: 0; } 
    10% { opacity: 0.15; } 
    90% { opacity: 0.15; } 
    100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; } 
  }

  .screen { 
    position: relative; z-index: 1; display: none; flex-direction: column; 
    align-items: center; padding: 30px 16px 60px; min-height: 100vh; width: 100%; 
  }
  .screen.active { display: flex; }

  .main-title { 
    font-family: 'Gaegu', cursive; font-size: clamp(2.4rem, 8vw, 4rem); 
    font-weight: 700; text-align: center; line-height: 1.2; margin-bottom: 8px; 
    filter: drop-shadow(2px 3px 0 rgba(0,0,0,0.08)); 
  }
  .main-title span { color: var(--purple); }
  .subtitle { font-size: 1.1rem; color: #888; margin-bottom: 30px; }

  /* 대시보드 그리드 컨테이너 */
  .dashboard-container {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
    width: 100%;
    max-width: 900px;
    margin-bottom: 30px;
  }
  
  @media (max-width: 768px) {
    .dashboard-container { grid-template-columns: 1fr; }
  }

  /* 개별 카드 스타일 */
  .profile-card {
    border-radius: 30px;
    padding: 30px 24px;
    box-shadow: 0 16px 40px rgba(0,0,0,0.08);
    display: flex;
    flex-direction: column;
    gap: 16px;
    position: relative;
    overflow: hidden;
  }

  /* 오빠 (민수) 마인크래프트 테마 */
  .card-minsu {
    background: linear-gradient(145deg, #ffffff, #e0f7fa);
    border: 4px solid var(--sky);
  }
  .card-minsu .card-header { color: #0288D1; border-bottom: 2px dashed var(--sky); }
  .card-minsu .currency-box { border-color: var(--sky); color: #0288D1; }

  /* 동생 (민서) 슬라임 테마 */
  .card-minser {
    background: linear-gradient(145deg, #ffffff, #ffe4e6);
    border: 4px solid var(--pink);
  }
  .card-minser .card-header { color: #D81B60; border-bottom: 2px dashed var(--pink); }
  .card-minser .currency-box { border-color: var(--pink); color: #D81B60; }

  .card-header {
    font-size: 2rem;
    font-family: 'Gaegu', cursive;
    font-weight: 700;
    text-align: center;
    padding-bottom: 12px;
    margin-bottom: 10px;
  }

  /* 정보 블록 (재화) */
  .currency-box {
    background: rgba(255, 255, 255, 0.9);
    border: 3px dashed;
    border-radius: 20px;
    padding: 24px 10px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .currency-title { font-size: 1.1rem; margin-bottom: 4px; color: #666; font-weight: bold; }
  .currency-amount { font-family: 'Gaegu', cursive; font-size: 3.5rem; font-weight: 700; line-height: 1.1; }

  /* 정보 블록 (레벨) */
  .level-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }
  .level-box {
    background: rgba(255, 255, 255, 0.7);
    border-radius: 16px;
    padding: 16px 8px;
    text-align: center;
    box-shadow: 0 4px 10px rgba(0,0,0,0.03);
  }
  .level-box .subj { font-size: 0.9rem; color: #888; margin-bottom: 4px; }
  .level-box .lvl { font-size: 1.6rem; font-weight: bold; color: var(--dark); }

  /* 정보 블록 (소원권 영역 래퍼) */
  .ticket-wrap {
    margin-top: auto; 
    display: flex; 
    flex-direction: column; 
    gap: 10px;
  }

  /* 정보 블록 (소원권 카드) */
  .ticket-box {
    background: linear-gradient(135deg, var(--yellow), var(--orange));
    border-radius: 20px;
    padding: 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: #1a1a2e;
    box-shadow: 0 8px 20px rgba(255, 159, 67, 0.3);
  }
  .ticket-box .t-title { font-size: 1.2rem; font-weight: bold; display: flex; align-items: center; gap: 8px; }
  .ticket-box .t-amount { font-family: 'Gaegu', cursive; font-size: 2.2rem; font-weight: 700; }

  /* 소원권 사용 승인 버튼 */
  .use-ticket-btn {
    width: 100%;
    padding: 14px;
    border-radius: 16px;
    border: none;
    background: #fff;
    font-family: 'Jua', sans-serif;
    font-size: 1.1rem;
    cursor: pointer;
    transition: all 0.2s;
    box-shadow: 0 4px 10px rgba(0,0,0,0.05);
  }
  .use-ticket-btn:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 6px 15px rgba(0,0,0,0.1);
  }
  .use-ticket-btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }
  /* 민수/민서 전용 버튼 테마 */
  .card-minsu .use-ticket-btn { border: 2px solid var(--sky); color: #0288D1; }
  .card-minsu .use-ticket-btn:hover:not(:disabled) { background: var(--sky); color: #fff; }
  
  .card-minser .use-ticket-btn { border: 2px solid var(--pink); color: #D81B60; }
  .card-minser .use-ticket-btn:hover:not(:disabled) { background: var(--pink); color: #fff; }

  /* 하단 공통 버튼 영역 */
  .big-btn { 
    width: 100%; max-width: 480px; padding: 18px; border-radius: 20px; 
    border: none; font-family: 'Jua', sans-serif; font-size: 1.3rem; 
    cursor: pointer; transition: transform .15s, box-shadow .15s; margin-top: 10px; 
  }
  .big-btn:hover { transform: translateY(-3px); box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
  .big-btn.back-btn { background: #fff; color: var(--dark); border: 3px solid #e0e0e0; }

  /* 로딩 UI */
  .loading-spinner {
    display: inline-block; width: 40px; height: 40px; 
    border: 5px solid rgba(0,0,0,0.1); border-top-color: var(--purple); 
    border-radius: 50%; animation: spin 0.8s linear infinite; margin-top: 20px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  
  .error-msg { color: var(--pink); font-size: 1.2rem; margin-top: 20px; text-align: center; }
</style>
</head>
<body>

<!-- 떠다니는 배경 아이콘들 -->
<div class="bg-floats" id="bgFloats"></div>

<!-- 로딩 화면 -->
<div class="screen active" id="screen-loading">
  <h1 class="main-title">👨‍👩‍👧‍👦 부모님 <span>대시보드</span></h1>
  <p class="subtitle" id="loadingText">노션에서 아이들의 학습 데이터를 불러오는 중입니다...</p>
  <div class="loading-spinner" id="spinner"></div>
</div>

<!-- 대시보드 메인 화면 -->
<div class="screen" id="screen-dashboard">
  <h1 class="main-title">👨‍👩‍👧‍👦 학습 <span>현황판</span></h1>
  <p class="subtitle">아이들이 모은 보상과 레벨을 확인하세요!</p>

  <div class="dashboard-container">
    
    <!-- 👦 오빠(민수) 카드 -->
    <div class="profile-card card-minsu">
      <div class="card-header">👦 민수 (오빠)</div>
      
      <div class="currency-box">
        <div class="currency-title">모은 다이아몬드</div>
        <div class="currency-amount">💎 <span id="ms-dia">0</span></div>
      </div>

      <div class="level-grid">
        <div class="level-box">
          <div class="subj">수학 레벨</div>
          <div class="lvl">Lv.<span id="ms-math">1</span></div>
        </div>
        <div class="level-box">
          <div class="subj">영어 레벨</div>
          <div class="lvl">Lv.<span id="ms-eng">1</span></div>
        </div>
        <div class="level-box">
          <div class="subj">용어 레벨</div>
          <div class="lvl">Lv.<span id="ms-kor">1</span></div>
        </div>
      </div>

      <!-- 소원권 & 사용 버튼 래퍼 -->
      <div class="ticket-wrap">
        <div class="ticket-box">
          <div class="t-title"><span style="font-size: 1.8rem; animation: floatUp 2s infinite alternate;">🎫</span> 획득한 소원권</div>
          <div class="t-amount" id="ms-ticket">0장</div>
        </div>
        <button class="use-ticket-btn" id="btn-ms-ticket" onclick="useWishTicket('민수')">🎫 소원권 1장 사용하기</button>
      </div>
    </div>

    <!-- 👧 동생(민서) 카드 -->
    <div class="profile-card card-minser">
      <div class="card-header">👧 민서 (동생)</div>
      
      <div class="currency-box">
        <div class="currency-title">모은 슬라임 파츠</div>
        <div class="currency-amount">💧 <span id="ds-slime">0</span></div>
      </div>

      <div class="level-grid">
        <div class="level-box">
          <div class="subj">수학 레벨</div>
          <div class="lvl">Lv.<span id="ds-math">1</span></div>
        </div>
        <div class="level-box">
          <div class="subj">영어 레벨</div>
          <div class="lvl">Lv.<span id="ds-eng">1</span></div>
        </div>
        <div class="level-box">
          <div class="subj">용어 레벨</div>
          <div class="lvl">Lv.<span id="ds-kor">1</span></div>
        </div>
      </div>

      <!-- 소원권 & 사용 버튼 래퍼 -->
      <div class="ticket-wrap">
        <div class="ticket-box">
          <div class="t-title"><span style="font-size: 1.8rem; animation: floatUp 2s infinite alternate-reverse;">🎁</span> 획득한 소원권</div>
          <div class="t-amount" id="ds-ticket">0장</div>
        </div>
        <button class="use-ticket-btn" id="btn-ds-ticket" onclick="useWishTicket('민서')">🎫 소원권 1장 사용하기</button>
      </div>
    </div>

  </div>

  <button class="big-btn back-btn" onclick="location.href='index.html'">🚪 공부방 대문으로 돌아가기</button>
</div>

<script>
// 노션 API 연결 정보
const PROXY_URL = "https://minmin-notion.awslike6.workers.dev";
const INVENTORY_DB_ID = "374a27115b688042bb61e6a102242e12"; 

// 🎯 PATCH 통신(소원권 차감)을 위해 유저별 노션 페이지 ID와 현재 소원권 수를 저장해둘 객체
let userData = {
  "민수": { pageId: null, ticketCount: 0 },
  "민서": { pageId: null, ticketCount: 0 }
};

// 둥둥 떠다니는 배경 효과 생성
(function createFloatingBackground() {
  const wrap = document.getElementById('bgFloats');
  const icons = ['🌟', '📚', '💎', '💧', '🎫', '🚀', '🖍️', '🧩'];
  for (let i = 0; i < 15; i++) {
    const el = document.createElement('div');
    el.className = 'float-item';
    el.textContent = icons[Math.floor(Math.random() * icons.length)];
    el.style.left = (Math.random() * 95) + '%';
    el.style.animationDuration = (12 + Math.random() * 15) + 's';
    el.style.animationDelay = (-Math.random() * 20) + 's';
    wrap.appendChild(el);
  }
})();

// 데이터를 화면에 렌더링하는 함수
function renderDashboard(results) {
  results.forEach(page => {
    const props = page.properties;
    const name = props["이름"]?.title[0]?.plain_text;
    
    if (!name || !userData[name]) return;

    // 🎯 PATCH 통신을 위해 유저의 Page ID와 소원권 개수 저장
    userData[name].pageId = page.id;
    
    const mathLvl = props["수학 레벨"]?.number || 1;
    const engLvl = props["영어 레벨"]?.number || 1;
    const korLvl = props["용어 레벨"]?.number || 1;
    const tickets = props["소원권 개수"]?.number || 0;
    
    userData[name].ticketCount = tickets;

    if (name === "민수") {
      const diamond = props["다이아몬드 개수"]?.number || 0;
      document.getElementById('ms-dia').textContent = diamond;
      document.getElementById('ms-math').textContent = mathLvl;
      document.getElementById('ms-eng').textContent = engLvl;
      document.getElementById('ms-kor').textContent = korLvl;
      document.getElementById('ms-ticket').textContent = tickets + "장";
    } 
    else if (name === "민서") {
      const slime = props["슬라임 파츠 개수"]?.number || 0;
      document.getElementById('ds-slime').textContent = slime;
      document.getElementById('ds-math').textContent = mathLvl;
      document.getElementById('ds-eng').textContent = engLvl;
      document.getElementById('ds-kor').textContent = korLvl;
      document.getElementById('ds-ticket').textContent = tickets + "장";
    }
  });

  // 로딩 화면 숨기고 대시보드 보여주기
  document.getElementById('screen-loading').classList.remove('active');
  document.getElementById('screen-dashboard').classList.add('active');
}

// 🎯 소원권 1장 사용하기 (노션 DB 업데이트)
async function useWishTicket(childName) {
  const childData = userData[childName];
  
  // 예외 처리 (페이지 ID가 아직 없거나 불러오지 못했을 때)
  if (!childData || !childData.pageId) {
    alert("데이터를 아직 불러오지 못했습니다. 잠시 후 다시 시도해주세요.");
    return;
  }

  // 1. 유효성 검사: 소원권 0장일 때 차단
  if (childData.ticketCount <= 0) {
    alert("소원권이 부족합니다! 더 열심히 공부하라고 전해주세요.");
    return;
  }

  // 2. 확인 팝업
  const isConfirmed = confirm(`정말로 ${childName}의 소원권을 1장 사용하시겠습니까? (예: 아이스크림 사주기)`);
  if (!isConfirmed) return;

  // 3. 사용 중 버튼 상태 변경 (로딩 효과)
  const btnId = childName === '민수' ? 'btn-ms-ticket' : 'btn-ds-ticket';
  const targetBtn = document.getElementById(btnId);
  const originalHtml = targetBtn.innerHTML;
  
  targetBtn.innerHTML = "⏳ 노션 업데이트 중...";
  targetBtn.disabled = true;

  try {
    const newCount = childData.ticketCount - 1;

    // 4. 노션 API PATCH 통신을 통해 소원권 -1 개수 적용
    const response = await fetch(`${PROXY_URL}/v1/pages/${childData.pageId}`, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        properties: {
          "소원권 개수": { number: newCount }
        }
      })
    });

    if (!response.ok) throw new Error("업데이트 통신 실패");

    // 5. 통신 성공 시 로컬 데이터 갱신 및 UI 즉각 반영
    childData.ticketCount = newCount;
    const countDisplayId = childName === '민수' ? 'ms-ticket' : 'ds-ticket';
    document.getElementById(countDisplayId).textContent = newCount + "장";

    // 6. 성공 축하 메시지 팝업 (버튼 텍스트 복구 시간을 살짝 줌)
    setTimeout(() => {
      alert("🎉 결제 완료! 아이의 소원을 들어주세요!");
    }, 100);

  } catch (error) {
    console.error(error);
    alert("❌ 소원권 사용 중 오류가 발생했습니다. 다시 시도해주세요.");
  } finally {
    // 7. 통신이 완료되면 버튼 상태를 원래대로 복원
    targetBtn.innerHTML = originalHtml;
    targetBtn.disabled = false;
  }
}

// 노션에서 인벤토리 데이터 불러오기
async function loadInventoryData() {
  try {
    const response = await fetch(`${PROXY_URL}/v1/databases/${INVENTORY_DB_ID}/query`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ page_size: 10 }) 
    });
    
    if (!response.ok) throw new Error("네트워크 응답 오류");
    
    const data = await response.json();
    
    if (data.results && data.results.length > 0) {
      renderDashboard(data.results);
    } else {
      throw new Error("데이터가 비어있습니다.");
    }
  } catch (error) {
    console.error("데이터 로딩 실패:", error);
    document.getElementById('spinner').style.display = 'none';
    document.getElementById('loadingText').innerHTML = 
      `<div class="error-msg">❌ 데이터를 불러오지 못했습니다.<br>인터넷 연결이나 프록시 서버 상태를 확인해주세요.</div>`;
  }
}

// 페이지 로드 시 데이터 호출 시작
window.addEventListener('DOMContentLoaded', loadInventoryData);
</script>
</body>
</html>
