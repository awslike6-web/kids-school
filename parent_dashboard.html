<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>주아의 수학방 🌟</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --sky: #6EC6F5; --yellow: #FFD93D; --pink: #FF6B9D; --mint: #4ECDC4;
    --purple: #A78BFA; --orange: #FF9F43; --green: #6BCB77;
    --white: #FFFEF7; --dark: #2D2D4E; --card: rgba(255,255,255,0.95);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Jua', sans-serif; background: linear-gradient(160deg, #ffe8f5 0%, #fffbe6 50%, #e0f7fa 100%); min-height: 100vh; overflow-x: hidden; color: var(--dark); }

  .bg-floats { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .screen { position: relative; z-index: 1; display: none; flex-direction: column; align-items: center; padding: 20px 16px 40px; min-height: 100vh; }
  .screen.active { display: flex; }

  .main-title { font-family: 'Gaegu', cursive; font-size: clamp(2rem, 8vw, 3.6rem); font-weight: 700; text-align: center; line-height: 1.2; margin-bottom: 4px; filter: drop-shadow(2px 3px 0 rgba(0,0,0,0.08)); position: relative; }
  .main-title span { color: var(--pink); }

  .card { background: var(--card); border-radius: 24px; padding: 22px 24px; width: 100%; max-width: 480px; box-shadow: 0 8px 30px rgba(255,107,157,0.15); margin-bottom: 18px; border: 2.5px solid #fff; }
  .card-title { font-size: 1.05rem; color: var(--pink); margin-bottom: 14px; display: flex; align-items: center; gap: 6px; }

  .grid-5, .grid-4, .grid-3, .grid-2 { display: grid; gap: 8px; margin-bottom: 10px; }
  .grid-5 { grid-template-columns: repeat(5, 1fr); }
  .grid-2 { grid-template-columns: repeat(2, 1fr); }
  input[type="checkbox"], input[type="radio"] { display: none; }
  
  .btn-label { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px 2px; border-radius: 14px; border: 2.5px solid #ffe0e9; font-size: 0.9rem; cursor: pointer; background: #fff; text-align: center; color: var(--dark); }
  .btn-label:hover { border-color: var(--pink); transform: scale(1.04); }
  input[type="radio"]:checked + .btn-label { background: var(--pink); border-color: var(--pink); color: #fff; }
  #speed-turtle:checked + .btn-label { background: var(--green); border-color: var(--green); color:#fff; }
  #speed-rabbit:checked + .btn-label { background: var(--orange); border-color: var(--orange); color:#fff; }

  .mode-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .mode-btn { padding: 16px; border-radius: 18px; border: none; font-family: 'Jua', sans-serif; cursor: pointer; color: #fff; }
  .mode-btn.falling { background: linear-gradient(135deg, var(--orange), var(--pink)); }
  .mode-btn.typing { background: linear-gradient(135deg, var(--purple), var(--sky)); }
  .mode-btn.vertical { grid-column: span 2; background: linear-gradient(135deg, #4ECDC4, #6BCB77); }

  .big-btn { width: 100%; max-width: 480px; padding: 16px; border-radius: 18px; border: none; font-family: 'Jua', sans-serif; cursor: pointer; color: #fff; display: flex; align-items: center; justify-content: center; }
  .big-btn.yellow-btn { background: linear-gradient(135deg, var(--yellow), var(--orange)); color: var(--dark); }
  .big-btn.back-btn { background: #eee; color: #888; }
  .user-badge { padding: 6px 16px; border-radius: 20px; background: rgba(255,107,157,0.1); color: var(--pink); border: 2px solid var(--pink); margin-bottom: 20px; }

  /* 떨어지는 공 모드 */
  #screen-falling { background: linear-gradient(180deg, #2D2D4E 0%, #4a4a75 60%, #2D2D4E 100%); color: #fff; }
  .falling-arena { position: relative; width: 100%; max-width: 460px; height: 50vh; border-radius: 20px; background: rgba(0,0,0,0.25); overflow: hidden; }
  .fall-ball { position: absolute; width: 66px; height: 66px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; cursor: pointer; color: #fff; }
  @keyframes falling { 0% { top: -80px; } 100% { top: 100%; } }
</style>
</head>
<body>

<div class="screen active" id="screen-setup">
  <h1 class="main-title">🌟 주아의 <span>수학방</span></h1>
  <div class="user-badge">현재 사용자: 👧 주아</div>

  <button class="big-btn yellow-btn" onclick="location.href='gugudan.html'" style="margin-bottom: 20px;">
    🚀 구구단 탐험대로 이동하기
  </button>
  
  <div class="card">
    <div class="card-title">🔢 연산 모드 선택</div>
    <div class="grid-5">
      <input type="radio" name="opMode" id="op-add" value="add" checked><label for="op-add" class="btn-label">➕덧셈</label>
      <input type="radio" name="opMode" id="op-sub" value="sub"><label for="op-sub" class="btn-label">➖뺄셈</label>
      <input type="radio" name="opMode" id="op-mul" value="mul"><label for="op-mul" class="btn-label">✖️곱셈</label>
      <input type="radio" name="opMode" id="op-div" value="div"><label for="op-div" class="btn-label">➗나눗</label>
      <input type="radio" name="opMode" id="op-mix" value="mix"><label for="op-mix" class="btn-label">🔀섞어</label>
    </div>
  </div>

  <div class="card">
    <div class="card-title">⏱️ 떨어지는 속도 (객관식 모드용)</div>
    <div class="grid-2">
      <input type="radio" name="speedMode" id="speed-turtle" value="turtle" checked><label for="speed-turtle" class="btn-label">🐢거북이(느림)</label>
      <input type="radio" name="speedMode" id="speed-rabbit" value="rabbit"><label for="speed-rabbit" class="btn-label">🐇토끼(빠름)</label>
    </div>
  </div>

  <div class="card">
    <div class="card-title">🎮 게임 시작하기</div>
    <div class="mode-grid">
      <button class="mode-btn falling" onclick="startGame('falling')">☄️ 객관식 공 잡기</button>
      <button class="mode-btn typing" onclick="startGame('typing')">⌨️ 주관식 테스트</button>
      <button class="mode-btn vertical" onclick="startGame('vertical')">📝 세로셈 모드</button>
    </div>
  </div>
</div>

<div class="screen" id="screen-falling">
  <div id="f-question" style="font-size:2rem; margin-bottom:10px;">? × ? = ?</div>
  <div class="falling-arena" id="fallingArena"></div>
</div>
