<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>용어사전방 - 민민이네 공부방</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --sky: #6EC6F5; --yellow: #FFD93D; --pink: #FF6B9D; --mint: #4ECDC4;
    --purple: #A78BFA; --orange: #FF9F43; --green: #6BCB77;
    --white: #FFFEF7; --dark: #2D2D4E; --card: rgba(255,255,255,0.93);
    --line: rgba(98,84,255,0.14);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Jua', sans-serif; background: linear-gradient(160deg, #c8f0ff 0%, #ffe8f5 50%, #fffbe6 100%); min-height: 100vh; overflow-x: hidden; color: var(--dark); transition: background 0.5s ease; }
  
  body.theme--minecraft { background: linear-gradient(160deg, #e0f7fa 0%, #b2ebf2 50%, #80deea 100%); }
  body.theme--slime { background: linear-gradient(160deg, #e8f5e9 0%, #c8e6c9 50%, #a5d6a7 100%); }

  .bg-floats { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .float-item { position: absolute; font-size: 1.8rem; opacity: 0.13; animation: floatUp linear infinite; font-family: 'Gaegu', cursive; font-weight: 700; color: var(--purple); }
  @keyframes floatUp { 0% { transform: translateY(110vh) rotate(0deg); opacity: 0; } 10% { opacity: 0.13; } 90% { opacity: 0.13; } 100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; } }

  .screen { position: relative; z-index: 1; display: none; flex-direction: column; align-items: center; padding: 36px 16px 60px; min-height: 100vh; animation: fadeIn .35s ease; }
  .screen.active { display: flex; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }

  .main-title { font-family: 'Gaegu', cursive; font-size: clamp(2.2rem, 9vw, 3.8rem); font-weight: 700; text-align: center; line-height: 1.2; margin-bottom: 6px; filter: drop-shadow(2px 3px 0 rgba(0,0,0,0.07)); }
  .main-title .accent { color: var(--pink); }
  .main-title .accent2 { color: var(--purple); }
  .subtitle { font-family: 'Gaegu', cursive; font-size: 1.05rem; color: #999; margin-bottom: 32px; }

  /* 테스트용 프로필 스위치 버튼 */
  .profile-switch-btn { position: absolute; top: 10px; right: 10px; background: rgba(255,255,255,0.8); border: 2px solid var(--purple); color: var(--dark); padding: 6px 12px; border-radius: 12px; font-family: 'Jua', sans-serif; font-size: 0.9rem; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.1); z-index: 10; transition: all 0.2s; }
  .profile-switch-btn:hover { background: var(--purple); color: #fff; }

  .user-welcome { display: inline-block; padding: 8px 20px; border-radius: 999px; background: rgba(255,255,255,0.7); border: 2.5px solid rgba(0,0,0,0.08); font-size: 1rem; margin-bottom: 14px; backdrop-filter: blur(8px); }
  .user-welcome span { color: var(--purple); font-weight: bold; }

  .progress-bar { width: 100%; max-width: 420px; height: 8px; background: rgba(255,255,255,0.5); border-radius: 10px; margin-bottom: 24px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--purple), var(--pink)); border-radius: 10px; transition: width 0.3s ease; }

  .flashcard-container { width: 100%; max-width: 420px; perspective: 1000px; margin-bottom: 24px; }
  .flashcard { background: var(--card); border-radius: 20px; padding: 40px 24px; box-shadow: 0 8px 20px rgba(0,0,0,0.08); border: 2px solid rgba(255,255,255,0.8); min-height: 200px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; cursor: pointer; transition: transform 0.3s ease; }
  .flashcard:hover { transform: translateY(-5px); }
  .flashcard.flipped { transform: rotateY(180deg); }
  .flashcard-label { font-size: 0.9rem; color: #999; margin-bottom: 12px; font-family: 'Gaegu', cursive; }
  .flashcard-content { font-size: 1.8rem; font-weight: bold; color: var(--dark); word-break: keep-all; }

  .input-group { width: 100%; max-width: 420px; margin-bottom: 20px; }
  .input-label { font-size: 0.95rem; color: #666; margin-bottom: 8px; display: block; text-align:center; }
  .input-field { width: 100%; padding: 16px 18px; border-radius: 16px; border: 2.5px solid rgba(0,0,0,0.08); font-family: 'Jua', sans-serif; font-size: 1.1rem; color: var(--dark); background: rgba(255,255,255,0.8); transition: all 0.2s ease; text-align:center; }
  .input-field:focus { outline: none; border-color: var(--purple); background: #fff; box-shadow: 0 0 0 3px rgba(167,139,250,0.1); }
  .input-field.error { border-color: var(--pink); }
  .input-field.success { border-color: var(--green); }

  .btn-group { display: flex; gap: 12px; width: 100%; max-width: 420px; margin-bottom: 20px; }
  .btn { flex: 1; padding: 16px 20px; border-radius: 16px; border: none; font-family: 'Jua', sans-serif; font-size: 1.1rem; cursor: pointer; transition: all 0.2s ease; font-weight: bold; }
  .btn:active { transform: scale(0.95); }
  .btn-primary { background: linear-gradient(135deg, var(--purple), var(--pink)); color: #fff; box-shadow: 0 6px 16px rgba(167,139,250,0.3); }
  .btn-primary:hover { transform: translateY(-3px); }
  .btn-secondary { background: rgba(255,255,255,0.7); color: var(--dark); border: 2px solid rgba(0,0,0,0.08); }
  .btn-secondary:hover { background: rgba(255,255,255,0.9); }

  .result-overlay { position: fixed; inset: 0; background: rgba(35, 40, 60, 0.6); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 100; opacity: 0; transition: opacity 0.3s; }
  .result-overlay.active { display: flex; opacity: 1; }
  .result-modal { background: #fff; width: 90%; max-width: 360px; border-radius: 30px; padding: 40px 24px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.2); animation: slideUp 0.4s ease; }
  @keyframes slideUp { from { transform: translateY(40px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .result-emoji { font-size: 3.5rem; margin-bottom: 16px; }
  .result-title { font-size: 1.5rem; color: var(--dark); margin-bottom: 12px; font-weight: bold; }
  .result-message { font-size: 1rem; color: #666; margin-bottom: 24px; line-height: 1.5; }
  .result-stats { background: rgba(0,0,0,0.03); border-radius: 16px; padding: 16px; margin-bottom: 24px; }
  .stat-row { display: flex; justify-content: space-between; margin: 8px 0; font-size: 1rem; text-align:left; gap:10px;}
  .stat-label { color: #999; flex-shrink: 0; }
  .stat-value { color: var(--dark); font-weight: bold; }

  .loading { display: inline-block; width: 30px; height: 30px; border: 4px solid rgba(0,0,0,0.1); border-top-color: var(--purple); border-radius: 50%; animation: spin 0.8s linear infinite; margin-top:20px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .slide-in { animation: slideInUp 0.4s ease; }
  @keyframes slideInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  .shake { animation: shake 0.4s; }
  @keyframes shake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }

  .back-btn { margin-top: 28px; padding: 14px 32px; border-radius: 18px; border: 2.5px solid rgba(0,0,0,0.09); background: rgba(255,255,255,0.7); font-family: 'Jua', sans-serif; font-size: 1rem; cursor: pointer; color: #888; transition: all 0.2s ease; }
</style>
</head>
<body>

<div class="bg-floats" id="bgFloats"></div>

<!-- 로딩 화면 -->
<div class="screen active" id="screen-loading">
  <h1 class="main-title"><span class="accent2">용어</span><br><span class="accent">사전방</span></h1>
  <p class="subtitle" id="loadingSubtitle">데이터 준비 중...</p>
  <div class="loading" id="mainLoadingSpinner"></div>
</div>

<!-- 민수 플래시카드 모드 -->
<div class="screen" id="screen-minsu-quiz">
  <button class="profile-switch-btn" onclick="toggleProfileManually()">🔄 민수/민서 바꾸기</button>
  <h1 class="main-title"><span class="accent2">척척박사</span><br><span class="accent">개념 사전</span></h1>
  <div class="user-welcome">안녕하세요, <span id="welcomeName">민수</span>!</div>
  
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>

  <div class="input-group">
    <label class="input-label" id="quizModeLabel">힌트를 보고 단어를 맞혀보세요</label>
    <div class="flashcard-container">
      <div class="flashcard" id="flashcard" onclick="toggleFlashcard()">
        <div class="flashcard-label" id="cardLabel">힌트</div>
        <div class="flashcard-content" id="cardContent">로딩 중...</div>
      </div>
    </div>
  </div>

  <div class="input-group"><input type="text" class="input-field" id="answerInput" placeholder="정답을 입력하세요" autocomplete="off"></div>

  <div class="btn-group">
    <button class="btn btn-primary" onclick="submitAnswer()">제출</button>
    <button class="btn btn-secondary" onclick="skipQuestion()">건너뛰기</button>
  </div>
  <button class="back-btn" onclick="goHome()">← 돌아가기</button>
</div>

<!-- 민서 받아쓰기 모드 -->
<div class="screen" id="screen-minser-dictation">
  <button class="profile-switch-btn" onclick="toggleProfileManually()">🔄 민수/민서 바꾸기</button>
  <h1 class="main-title"><span class="accent2">새싹</span><br><span class="accent">받아쓰기</span></h1>
  <div class="user-welcome">안녕하세요, <span id="welcomeName2">민서</span>!</div>
  
  <div class="progress-bar"><div class="progress-fill" id="progressFill2"></div></div>

  <div class="input-group">
    <label class="input-label">힌트를 읽고 단어를 써보세요</label>
    <div class="flashcard-container">
      <div class="flashcard" id="hintCard">
        <div class="flashcard-label">힌트</div>
        <div class="flashcard-content" id="hintContent">로딩 중...</div>
      </div>
    </div>
  </div>

  <div class="input-group"><input type="text" class="input-field" id="dictationInput" placeholder="단어를 써보세요" autocomplete="off"></div>

  <div class="btn-group">
    <button class="btn btn-primary" onclick="submitDictation()">제출</button>
    <button class="btn btn-secondary" onclick="skipDictation()">건너뛰기</button>
  </div>
  <button class="back-btn" onclick="goHome()">← 돌아가기</button>
</div>

<!-- 퀴즈 1문제 정답 모달 -->
<div class="result-overlay" id="resultOverlay" onclick="closeResult(event)">
  <div class="result-modal" id="resultModal" onclick="event.stopPropagation()">
    <div class="result-emoji" id="resultEmoji">🎉</div>
    <div class="result-title" id="resultTitle">정답입니다!</div>
    <div class="result-message" id="resultMessage">좋은 답변입니다!</div>
    <div class="result-stats" id="resultStats"></div>
    <button class="btn btn-primary" onclick="nextQuestion()" style="width:100%;">다음 문제</button>
  </div>
</div>

<script>
// 🚀 [필수] 용어사전용 새로운 노션 DB 아이디를 여기에 넣으세요!
const KOREAN_DB_ID = "여기에_용어사전_DB_아이디를_넣어주세요"; 

// 🚀 공통 연결 고리 (경비실 및 인벤토리 지갑)
const PROXY_URL = "https://minmin-notion.awslike6.workers.dev";
const INVENTORY_DB_ID = "374a27115b688042bb61e6a102242e12"; 

let currentUser = localStorage.getItem('currentUser') || 'son';
let currentUserName = localStorage.getItem('currentUserName') || '민수';
let currentTheme = localStorage.getItem('currentTheme') || '마인크래프트';
let words = [];
let currentIndex = 0;
let correctCount = 0;
let totalCount = 0;

(function () {
  const wrap = document.getElementById('bgFloats');
  const symbols = ['가', '나', '다', '한', '글', '📚', '✏️', '💭', '🎓', '단', '어', '사', '전'];
  for (let i = 0; i < 18; i++) {
    const el = document.createElement('div'); el.className = 'float-item'; el.textContent = symbols[Math.floor(Math.random() * symbols.length)];
    el.style.left = (Math.random() * 92) + '%'; el.style.animationDuration = (12 + Math.random() * 14) + 's'; el.style.animationDelay = (-Math.random() * 18) + 's';
    wrap.appendChild(el);
  }
})();

function applyTheme() {
  if (currentTheme === '마인크래프트') {
    document.body.classList.add('theme--minecraft'); document.body.classList.remove('theme--slime');
  } else {
    document.body.classList.add('theme--slime'); document.body.classList.remove('theme--minecraft');
  }
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// 👦👧 실시간 프로필 체인지 기능 추가
function toggleProfileManually() {
  if (currentUser === 'son') {
    currentUser = 'daughter'; currentUserName = '민서'; currentTheme = '슬라임';
  } else {
    currentUser = 'son'; currentUserName = '민수'; currentTheme = '마인크래프트';
  }
  localStorage.setItem('currentUser', currentUser);
  localStorage.setItem('currentUserName', currentUserName);
  localStorage.setItem('currentTheme', currentTheme);
  
  applyTheme();
  document.getElementById('welcomeName').textContent = currentUserName;
  document.getElementById('welcomeName2').textContent = currentUserName;
  
  loadKoreanWords();
}

async function loadKoreanWords() {
  showScreen('screen-loading');
  document.getElementById('loadingSubtitle').textContent = `${currentUserName}의 단어를 불러오고 있어요...`;

  if (KOREAN_DB_ID === '여기에_용어사전_DB_아이디를_넣어주세요') {
    alert("아버님! 코드 상단에 용어사전 DB ID를 먼저 넣어주세요!");
    goHome(); return;
  }

  try {
    const response = await fetch(`${PROXY_URL}/v1/databases/${KOREAN_DB_ID}/query`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        filter: { property: "대상", select: { equals: currentUserName } }
      })
    });

    const data = await response.json();
    if (!data.results || data.results.length === 0) throw new Error("단어 데이터 없음");

    words = data.results.map(item => {
      const props = item.properties;
      return {
        id: item.id,
        word: props["단어"]?.title?.[0]?.plain_text || '',
        hint: props["힌트"]?.rich_text?.[0]?.plain_text || props["뜻풀이"]?.rich_text?.[0]?.plain_text || '',
        meaning: props["뜻풀이"]?.rich_text?.[0]?.plain_text || '',
        subject: props["과목"]?.select?.name || ''
      };
    });

    words = words.sort(() => Math.random() - 0.5); // 섞기
    totalCount = words.length;
    currentIndex = 0;
    correctCount = 0;

    if (currentUser === 'son') {
      showScreen('screen-minsu-quiz'); displayMinsuQuiz();
    } else {
      showScreen('screen-minser-dictation'); displayMinserDictation();
    }
  } catch (error) {
    console.error("단어 로드 에러:", error);
    document.getElementById('loadingSubtitle').innerHTML = `<span style="color:var(--pink)">아직 노션에 ${currentUserName}의 단어가 없습니다!</span>`;
    document.getElementById('mainLoadingSpinner').style.display = 'none';
    setTimeout(goHome, 2000);
  }
}

function displayMinsuQuiz() {
  if (currentIndex >= words.length) { completeSession(); return; }
  const word = words[currentIndex];
  document.getElementById('cardLabel').textContent = '힌트';
  document.getElementById('cardContent').textContent = word.hint;
  const input = document.getElementById('answerInput');
  input.value = ''; input.classList.remove('error', 'success'); input.focus();
  updateProgress();
}

function displayMinserDictation() {
  if (currentIndex >= words.length) { completeSession(); return; }
  const word = words[currentIndex];
  document.getElementById('hintContent').textContent = word.hint;
  const input = document.getElementById('dictationInput');
  input.value = ''; input.classList.remove('error', 'success'); input.focus();
  updateProgress();
}

function updateProgress() {
  const percentage = totalCount > 0 ? (currentIndex / totalCount) * 100 : 0;
  document.getElementById('progressFill').style.width = percentage + '%';
  document.getElementById('progressFill2').style.width = percentage + '%';
}

function toggleFlashcard() {
  const card = document.getElementById('flashcard');
  const label = document.getElementById('cardLabel');
  const content = document.getElementById('cardContent');
  const word = words[currentIndex];

  if (card.classList.contains('flipped')) {
    card.classList.remove('flipped'); label.textContent = '힌트'; content.textContent = word.hint;
  } else {
    card.classList.add('flipped'); label.textContent = '정답'; content.textContent = word.word;
  }
}

function submitAnswer() {
  const input = document.getElementById('answerInput');
  if (!input.value.trim()) return;
  processAnswer(input);
}

function submitDictation() {
  const input = document.getElementById('dictationInput');
  if (!input.value.trim()) return;
  processAnswer(input);
}

function processAnswer(inputEl) {
  const word = words[currentIndex];
  const answer = inputEl.value.trim().replace(/\s+/g, '');
  const cleanWord = word.word.replace(/\s+/g, '');
  const isCorrect = answer === cleanWord;
  
  if (isCorrect) {
    correctCount++;
    inputEl.classList.remove('error'); inputEl.classList.add('success');
    showResult(true, word.word, word.meaning);
  } else {
    inputEl.classList.remove('success'); inputEl.classList.add('error');
    inputEl.classList.add('shake');
    setTimeout(() => inputEl.classList.remove('shake'), 400);
    showResult(false, word.word, word.meaning);
  }
}

function showResult(isCorrect, word, meaning) {
  const overlay = document.getElementById('resultOverlay');
  document.getElementById('resultEmoji').textContent = isCorrect ? '🎉' : '💭';
  document.getElementById('resultTitle').textContent = isCorrect ? '정답입니다!' : '아쉬워요!';
  document.getElementById('resultMessage').textContent = isCorrect ? `"${word}"가 맞습니다!` : `정답은 "${word}"입니다.`;
  document.getElementById('resultStats').innerHTML = `
    <div class="stat-row"><span class="stat-label">뜻풀이:</span><span class="stat-value">${meaning}</span></div>
    <div class="stat-row"><span class="stat-label">진행도:</span><span class="stat-value">${currentIndex + 1} / ${totalCount}</span></div>
  `;
  overlay.classList.add('active');
}

function closeResult(e) { if (e) e.stopPropagation(); document.getElementById('resultOverlay').classList.remove('active'); }
function nextQuestion() { closeResult(); currentIndex++; currentUser === 'son' ? displayMinsuQuiz() : displayMinserDictation(); }
function skipQuestion() { currentIndex++; displayMinsuQuiz(); }
function skipDictation() { currentIndex++; displayMinserDictation(); }

// 🏆 인벤토리 자동 롤오버 보상 엔진 이식 완료
async function completeSession() {
  showScreen('screen-loading');
  document.getElementById('screen-loading').innerHTML = `
    <h1 class="main-title"><span class="accent2">수고했어요!</span><br><span class="accent">완료!</span></h1>
    <p class="subtitle" id="rewardLoadingMsg">⏳ 공용 인벤토리에 보상 전송 중...</p>
    <div class="loading" id="rewardLoadingSpinner" style="display:block;"></div>
    <div id="rewardResultArea"></div>
  `;

  try {
    let rewardResultMsg = "";
    if (correctCount > 0 && currentUserName !== '아빠' && currentUserName !== '엄마') {
      const res = await saveRewardToNotion(correctCount);
      rewardResultMsg = `
        <div style="background:rgba(255,255,255,0.8); border:2px solid #A78BFA; padding:12px; border-radius:12px; margin-top:10px; margin-bottom:15px; font-size:1.1rem;">
          <b style="color:#A78BFA;">${res.rewardName} ${res.earned}개 적립 완료!</b> (현재: ${res.currentCount}/20)<br>
          ${res.isLevelUp ? `<span style="font-size:1.3rem; color:#FF6B9D; display:inline-block; margin-top:8px; font-weight:bold;">🎉 레벨 업! Lv.${res.level} 달성! 🎉</span>` : ''}
        </div>
      `;
    } else if (correctCount === 0) {
      rewardResultMsg = `<div style="color:var(--pink); margin-bottom:15px; font-weight:bold;">맞힌 문제가 없어서 보상이 없어요 😢 다음에 다시 도전!</div>`;
    }

    document.getElementById('rewardLoadingSpinner').style.display = 'none';
    document.getElementById('rewardLoadingMsg').style.display = 'none';

    const accuracy = totalCount > 0 ? Math.round((correctCount / totalCount) * 100) : 0;
    
    document.getElementById('rewardResultArea').innerHTML = `
      <div class="slide-in" style="background: rgba(255,255,255,0.8); border-radius: 20px; padding: 30px 24px; max-width: 400px; text-align: center; margin: 0 auto; border:2px solid rgba(0,0,0,0.1);">
        <div style="font-size: 3rem; margin-bottom: 16px;">${accuracy >= 70 ? '🌟' : '💪'}</div>
        <div style="font-size: 1.3rem; font-weight: bold; margin-bottom: 8px;">최종 정답률: ${accuracy}%</div>
        <div style="font-size: 1rem; color: #666; margin-bottom: 16px;">총 ${totalCount}문제 중 ${correctCount}문제를 맞혔습니다!</div>
        ${rewardResultMsg}
        <button class="btn btn-primary" onclick="goHome()" style="width: 100%; max-width: 300px;">🏠 메인 화면으로</button>
      </div>
    `;
  } catch (error) {
    document.getElementById('rewardLoadingSpinner').style.display = 'none';
    document.getElementById('rewardLoadingMsg').innerHTML = `<span style="color:var(--pink)">❌ 보상 저장 실패 (인터넷 상태 확인)</span>`;
    setTimeout(goHome, 3000);
  }
}

async function saveRewardToNotion(earned) {
  const response = await fetch(`${PROXY_URL}/v1/databases/${INVENTORY_DB_ID}/query`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ filter: { property: "이름", title: { equals: currentUserName } } })
  });
  const data = await response.json();
  if (!data.results || data.results.length === 0) throw new Error("인벤토리 없음");

  const page = data.results[0];
  const props = page.properties;

  let level = props["수학 레벨"]?.number || 1;
  let diamond = props["다이아몬드 개수"]?.number || 0;
  let slime = props["슬라임 파츠 개수"]?.number || 0;
  
  let isLevelUp = false;
  let updateProps = {};
  let currentCount = 0;
  let rewardName = currentTheme === '마인크래프트' ? '💎 다이아몬드' : '💧 슬라임 파츠';

  if (currentTheme === '마인크래프트') {
    let total = diamond + earned;
    let levelUps = Math.floor(total / 20);
    if (levelUps > 0) { isLevelUp = true; level += levelUps; total = total % 20; }
    currentCount = total;
    updateProps = { "다이아몬드 개수": { number: total }, "수학 레벨": { number: level } };
  } else {
    let total = slime + earned;
    let levelUps = Math.floor(total / 20);
    if (levelUps > 0) { isLevelUp = true; level += levelUps; total = total % 20; }
    currentCount = total;
    updateProps = { "슬라임 파츠 개수": { number: total }, "수학 레벨": { number: level } };
  }

  await fetch(`${PROXY_URL}/v1/pages/${page.id}`, {
    method: "PATCH", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ properties: updateProps })
  });

  return { earned, currentCount, level, isLevelUp, rewardName };
}

});
