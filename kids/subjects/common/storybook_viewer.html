<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>단원 스토리북 📖 | 민민이네 공부방</title>
<link rel="stylesheet" href="../../css/design-system.css">
<link rel="stylesheet" href="../../css/storybook_viewer.css">
</head>
<body>

<audio id="mainAudio" preload="auto"></audio>

<div class="top-bar">
  <div class="top-left">
    <a id="storyBackBtn" href="../lobby.html" class="btn-back">🔙 대기실로</a>
    <div class="story-title">
      <span id="storyTitleIcon">📖</span>
      <span id="storyTitleText">동화책 불러오는 중...</span>
    </div>
  </div>
  
  <div class="view-mode-tabs">
    <button id="tabEbook" class="tab-btn active" onclick="setViewerMode('ebook')">📖 책 넘김</button>
    <button id="tabWebtoon" class="tab-btn" onclick="setViewerMode('webtoon')">📜 웹툰 스크롤</button>
  </div>
</div>

<!-- 1. 📖 E-Book 책 넘김 뷰어 -->
<div class="ebook-container" id="ebookView">
  <div class="book-frame">
    <img id="ebookImg" class="book-spread-img" src="" alt="동화 펼침면">
  </div>

  <div class="ebook-controls">
    <button id="prevBtn" class="btn-page-nav btn-prev" onclick="changePage(-1)">◀ 이전 장</button>
    
    <div style="display:flex; align-items:center; gap:10px;">
      <span id="pageIndicator" class="page-indicator">- / - 쪽</span>
      
      <div class="audio-control-bar">
        <button id="playBtn" class="btn-play" onclick="toggleEbookAudio()">
          <span id="playIcon">🔊</span>
          <span id="playText">동화 듣기</span>
        </button>
        <label class="auto-read-label">
          <input type="checkbox" id="autoPlayCheckbox" checked>
          <span>자동 넘김</span>
        </label>
      </div>
    </div>

    <button id="nextBtn" class="btn-page-nav btn-next" onclick="changePage(1)">다음 장 ▶</button>
  </div>
</div>

<!-- 2. 📜 웹툰 스크롤 뷰어 -->
<div class="webtoon-container" id="webtoonView">
  <div class="webtoon-sticky-bar">
    <div id="webtoonStickyTitle" style="font-family:'Jua', sans-serif; font-size:1.05rem; color:var(--primary);">
      📖 동화 읽기
    </div>
    <button id="continuousPlayBtn" class="continuous-btn" onclick="toggleContinuousPlay()">
      <span id="continuousIcon">▶</span>
      <span id="continuousText">처음부터 연속 낭독</span>
    </button>
  </div>

  <div id="webtoonCardsList" style="display:flex; flex-direction:column; gap:28px;"></div>
</div>

<script src="../../js/storybook_engine.js"></script>
<script>
  // URL 파라미터 기반 동적 데이터 로드 지원 (예: ?subject=korean&book=story_1_2_1_b1)
  const urlParams = new URLSearchParams(window.location.search);
  const subject = urlParams.get('subject');
  const book = urlParams.get('book');

  if (subject && book) {
    const dataScript = document.createElement('script');
    dataScript.src = `../${subject}/data/${book}.js`;
    dataScript.onload = () => {
      if (window.STORY_BOOK) {
        // 공용 뷰어 위치(common/) 기준 상대 경로 보정
        if (window.STORY_BOOK.imgBase && window.STORY_BOOK.imgBase.startsWith('./')) {
          window.STORY_BOOK.imgBase = `../${subject}/${window.STORY_BOOK.imgBase.slice(2)}`;
        }
        if (window.STORY_BOOK.backUrl && !window.STORY_BOOK.backUrl.startsWith('../') && !window.STORY_BOOK.backUrl.startsWith('http')) {
          window.STORY_BOOK.backUrl = `../${subject}/${window.STORY_BOOK.backUrl}`;
        }
        initStorybook(window.STORY_BOOK);
      }
    };
    dataScript.onerror = () => {
      document.getElementById('storyTitleText').textContent = '도서 데이터를 찾을 수 없습니다.';
    };
    document.body.appendChild(dataScript);
  }
</script>
</body>
</html>
