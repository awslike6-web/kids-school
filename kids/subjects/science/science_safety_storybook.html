<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>안전을 지키는 꼬마 과학자 탐험대 📖 | 민민이네 공부방</title>
<link rel="stylesheet" href="../../css/design-system.css">
<style>
    @import url('https://fonts.googleapis.com/css2?family=Jua&family=Nanum+Gothic:wght@400;700;800&family=Gaegu:wght@400;700&display=swap');

    :root {
        --primary: #059669;
        --primary-dark: #047857;
        --accent: #f59e0b;
        --bg-color: #061a14;
        --card-bg: #132e27;
        --text-light: #f8fafc;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        font-family: 'Nanum Gothic', sans-serif;
        background: #061a14;
        min-height: 100vh;
        color: var(--text-light);
        display: flex;
        flex-direction: column;
    }

    /* 상단 헤더 바 */
    .top-bar {
        display: flex; justify-content: space-between; align-items: center;
        padding: 10px 18px; background: rgba(6, 26, 20, 0.95); backdrop-filter: blur(12px);
        box-shadow: 0 2px 15px rgba(0,0,0,0.5); position: sticky; top: 0; z-index: 100;
        border-bottom: 1px solid #134e3f;
    }
    .top-left { display: flex; align-items: center; gap: 12px; }
    .btn-back {
        display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px;
        background: #132e27; color: #e2e8f0; border-radius: 12px; font-family: 'Jua', sans-serif;
        font-size: 0.95rem; text-decoration: none; border: 1px solid #134e3f; cursor: pointer; transition: all 0.2s;
    }
    .btn-back:hover { background: #134e3f; color: #fff; }
    .story-title {
        font-family: 'Jua', sans-serif; font-size: 1.2rem; color: #34d399;
        display: flex; align-items: center; gap: 8px;
    }

    /* 뷰 모드 전환 탭 */
    .view-mode-tabs {
        display: flex; background: #132e27; padding: 4px; border-radius: 14px;
        border: 1px solid #134e3f;
    }
    .tab-btn {
        padding: 6px 14px; border-radius: 10px; border: none; font-family: 'Jua', sans-serif;
        font-size: 0.95rem; color: #94a3b8; background: transparent; cursor: pointer;
        transition: all 0.2s; display: flex; align-items: center; gap: 6px;
    }
    .tab-btn.active {
        background: linear-gradient(135deg, #059669 0%, #047857 100%);
        color: white; box-shadow: 0 2px 8px rgba(5, 150, 105, 0.4);
    }

    /* ==========================================
       1. 📖 책 넘김 모드 (E-Book Spread Mode)
       ========================================== */
    .ebook-container {
        flex: 1; max-width: 1080px; width: 100%; margin: 10px auto; padding: 0 12px;
        display: flex; flex-direction: column; justify-content: center; align-items: center;
    }
    .book-frame {
        position: relative; width: 100%; max-width: 960px;
        background: #132e27; border-radius: 16px; padding: 10px;
        box-shadow: 0 20px 50px rgba(0,0,0,0.6), 0 0 0 2px #134e3f;
        display: flex; justify-content: center; align-items: center;
    }
    .book-spread-img {
        width: 100%; height: auto; max-height: 75vh; object-fit: contain;
        border-radius: 10px; box-shadow: 0 8px 25px rgba(0,0,0,0.4);
        display: block;
    }
    .ebook-controls {
        width: 100%; max-width: 960px; margin-top: 14px;
        display: flex; justify-content: space-between; align-items: center; gap: 12px;
        flex-wrap: wrap;
    }
    .btn-page-nav {
        padding: 10px 20px; border-radius: 14px; border: none; font-family: 'Jua', sans-serif;
        font-size: 1.1rem; cursor: pointer; transition: all 0.2s;
        display: flex; align-items: center; gap: 6px;
    }
    .btn-prev { background: #1e3a31; color: #f1f5f9; }
    .btn-prev:hover:not(:disabled) { background: #2a4f43; }
    .btn-next {
        background: linear-gradient(135deg, #059669 0%, #047857 100%);
        color: white; box-shadow: 0 4px 14px rgba(5, 150, 105, 0.4);
    }
    .btn-page-nav:disabled { opacity: 0.3; cursor: not-allowed; }
    .page-indicator {
        font-family: 'Jua', sans-serif; font-size: 1.15rem; color: #34d399;
        background: #132e27; padding: 6px 16px; border-radius: 20px; border: 1px solid #134e3f;
    }
    .audio-control-bar {
        display: flex; align-items: center; gap: 10px; background: #132e27;
        padding: 8px 16px; border-radius: 16px; border: 1px solid #134e3f;
    }
    .btn-play {
        padding: 8px 16px; border-radius: 12px; border: none; font-family: 'Jua', sans-serif;
        font-size: 1rem; color: white; background: #059669; cursor: pointer;
        display: inline-flex; align-items: center; gap: 6px; transition: all 0.2s;
    }
    .btn-play.playing { background: #f59e0b; }
    .auto-read-label {
        display: inline-flex; align-items: center; gap: 6px; font-size: 0.88rem;
        font-family: 'Jua', sans-serif; color: #cbd5e1; cursor: pointer;
    }
    .auto-read-label input { width: 16px; height: 16px; accent-color: #059669; cursor: pointer; }

    /* ========================================================
       2. 📜 웹툰 스크롤 모드 (대형 그림 + 반응형 HTML 글밥 카드)
       ======================================================== */
    .webtoon-container {
        display: none; max-width: 680px; width: 100%; margin: 15px auto;
        padding: 0 12px 50px 12px; flex-direction: column; gap: 32px;
    }
    .webtoon-sticky-bar {
        position: sticky; top: 60px; z-index: 90;
        background: rgba(6, 26, 20, 0.95); backdrop-filter: blur(10px);
        padding: 10px 16px; border-radius: 16px; border: 1.5px solid #059669;
        display: flex; justify-content: space-between; align-items: center;
        box-shadow: 0 8px 25px rgba(0,0,0,0.6);
    }
    .continuous-btn {
        padding: 8px 16px; border-radius: 12px; border: none; font-family: 'Jua', sans-serif;
        font-size: 0.95rem; color: white; background: linear-gradient(135deg, #059669 0%, #047857 100%);
        cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
    }
    .continuous-btn.playing { background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); }

    .webtoon-card {
        background: #132e27; border-radius: 20px; overflow: hidden;
        box-shadow: 0 15px 35px rgba(0,0,0,0.6); border: 2px solid #1e3a31;
        display: flex; flex-direction: column; transition: border-color 0.3s;
    }
    .webtoon-header {
        padding: 10px 16px; background: #0a1f18; display: flex;
        justify-content: space-between; align-items: center; border-bottom: 1px solid #1e3a31;
    }
    .webtoon-tag {
        font-family: 'Jua', sans-serif; font-size: 0.95rem; color: #34d399;
        display: flex; align-items: center; gap: 6px;
    }
    .btn-card-audio {
        padding: 5px 12px; border-radius: 10px; border: none; font-family: 'Jua', sans-serif;
        font-size: 0.88rem; color: white; background: #1e3a31; cursor: pointer;
        display: inline-flex; align-items: center; gap: 6px; transition: all 0.2s;
    }
    .btn-card-audio:hover { background: #2a4f43; }
    .btn-card-audio.playing { background: #f59e0b; }

    /* 🖼️ 상단 대형 삽화 */
    .webtoon-ill-wrap {
        width: 100%; background: #061a14; overflow: hidden; display: flex; justify-content: center;
    }
    .webtoon-ill-img {
        width: 100%; height: auto; display: block; object-fit: contain; max-height: 520px;
    }

    /* 📝 하단 반응형 HTML 글밥 카드 */
    .webtoon-story-box {
        background: #f8fafc; color: #1e293b; padding: 16px 18px;
        border-top: 3px solid #059669; border-left: 6px solid #059669;
        display: flex; flex-direction: column; gap: 10px;
    }
    .webtoon-passage {
        font-size: 1.05rem; line-height: 1.7; color: #1e293b;
        font-weight: 500; word-break: keep-all; word-wrap: break-word;
    }
    .webtoon-passage b { color: #047857; font-weight: 700; }
    .webtoon-passage .highlight {
        background: #d1fae5; padding: 1px 4px; border-radius: 4px; color: #047857; font-weight: 700;
    }
    .webtoon-ref-badge {
        display: inline-flex; align-items: center; gap: 5px;
        background: #ecfdf5; color: #047857; padding: 5px 12px;
        border-radius: 8px; font-size: 0.88rem; font-weight: 700;
        border: 1px solid #a7f3d0; margin-top: 4px; width: fit-content;
        font-family: 'Jua', sans-serif;
    }

    /* 다시 시작 버튼 카드 */
    .restart-card-box {
        text-align: center; padding: 20px; background: #132e27; border-radius: 16px;
        border: 2px dashed #34d399; display: flex; flex-direction: column; align-items: center; gap: 12px;
    }
    .btn-restart-large {
        padding: 12px 28px; border-radius: 14px; border: none; font-family: 'Jua', sans-serif;
        font-size: 1.15rem; color: white; background: linear-gradient(135deg, #059669 0%, #047857 100%);
        cursor: pointer; box-shadow: 0 4px 15px rgba(5, 150, 105, 0.4); transition: transform 0.2s;
    }
    .btn-restart-large:hover { transform: scale(1.05); }

    @media (max-width: 768px) {
        .top-bar { padding: 8px 10px; }
        .story-title { font-size: 1rem; }
        .tab-btn { padding: 4px 8px; font-size: 0.85rem; }
        .btn-page-nav { padding: 8px 12px; font-size: 0.95rem; }
        .page-indicator { font-size: 0.95rem; padding: 4px 10px; }
        .book-frame { padding: 4px; }
        .audio-control-bar { width: 100%; justify-content: space-between; margin-top: 6px; }
        .webtoon-passage { font-size: 0.98rem; line-height: 1.6; }
    }
</style>
</head>
<body>

<div class="top-bar">
    <div class="top-left">
        <a href="science.html" class="btn-back">🔙 과학 탐구실</a>
        <div class="story-title">🛡️ 안전을 지키는 꼬마 과학자 탐험대</div>
    </div>

    <div class="view-mode-tabs">
        <button class="tab-btn active" id="tabEbook" onclick="setViewerMode('ebook')">📖 책장 넘김</button>
        <button class="tab-btn" id="tabWebtoon" onclick="setViewerMode('webtoon')">📜 웹툰 스크롤</button>
    </div>
</div>

<!-- 1. 📖 책 넘김 뷰어 -->
<div class="ebook-container" id="ebookView">
    <div class="book-frame">
        <img src="images/minsu/5-1/0/safety_storybook/science_safety_story_p1.png?v=20260902_1" alt="동화책 페이지" class="book-spread-img" id="ebookImg">

    <div class="ebook-controls">

        <button class="btn-page-nav btn-next" id="nextBtn" onclick="changePage(1)">다음 장 ▶</button>

        <div class="audio-control-bar">
            <button class="btn-play" id="ebookPlayBtn" onclick="toggleEbookAudio()">
                <span id="ebookPlayIcon">▶️</span> <span id="ebookPlayLabel">구연동화 듣기</span>
            </button>
            <label class="auto-read-label">
                <input type="checkbox" id="autoPlayCheckbox" checked>
                🔊 넘길 때 자동 읽기
            </label>
        </div>
    </div>
</div>

<!-- 2. 📜 웹툰 스크롤 뷰어 -->
<div class="webtoon-container" id="webtoonView">
    <div class="webtoon-sticky-bar">
        <div style="font-family:'Jua', sans-serif; font-size:0.95rem; color:#34d399;">
            🎧 전체 1~13장 연속 구연동화 듣기
        </div>
        <button class="continuous-btn" id="continuousBtn" onclick="toggleContinuousPlay()">
            <span id="continuousIcon">▶️</span> <span id="continuousLabel">1장부터 연속 재생</span>
        </button>
    </div>

    <div id="webtoonCardList" style="display:flex; flex-direction:column; gap:32px;"></div>
</div>

<audio id="mainAudio" preload="auto"></audio>

<script>

            page: 1,

    let currentMode = 'ebook';
    let currentPageIndex = 0;
    let isContinuousPlaying = false;
    let continuousIndex = 0;
    const audio = document.getElementById('mainAudio');

    function setViewerMode(mode) {
        currentMode = mode;
        audio.pause();
        updateEbookAudioUI(false);
        updateContinuousUI(false);
        isContinuousPlaying = false;
        resetAllWebtoonCardButtons();

        if (mode === 'ebook') {
            document.getElementById('tabEbook').classList.add('active');
            document.getElementById('tabWebtoon').classList.remove('active');
            document.getElementById('ebookView').style.display = 'flex';
            document.getElementById('webtoonView').style.display = 'none';
            renderEbook();
        } else {
            document.getElementById('tabWebtoon').classList.add('active');
            document.getElementById('tabEbook').classList.remove('active');
            document.getElementById('ebookView').style.display = 'none';
            document.getElementById('webtoonView').style.display = 'flex';
            renderWebtoonList();
        }
    }

    function renderEbook() {
        const item = STORY_DATA[currentPageIndex];
        const img = document.getElementById('ebookImg');
        img.src = `images/minsu/5-1/0/safety_storybook/${item.spreadImg}?v=20260902_2`;
        document.getElementById('pageIndicator').textContent = `${item.page} / ${STORY_DATA.length} 쪽`;

        document.getElementById('prevBtn').disabled = (currentPageIndex === 0);
        document.getElementById('nextBtn').textContent = (currentPageIndex === STORY_DATA.length - 1) ? '🎉 처음으로' : '다음 장 ▶';

        audio.src = item.audio;
        audio.pause();
        updateEbookAudioUI(false);

        const autoPlay = document.getElementById('autoPlayCheckbox').checked;
        if (autoPlay) {
            setTimeout(() => {
                audio.play().then(() => {
                    updateEbookAudioUI(true);
                }).catch(() => {
                    updateEbookAudioUI(false);
                });
            }, 200);
        }
    }

    function changePage(dir) {
        audio.pause();
        if (currentPageIndex === STORY_DATA.length - 1 && dir === 1) {
            currentPageIndex = 0;
        } else {
            currentPageIndex = Math.max(0, Math.min(STORY_DATA.length - 1, currentPageIndex + dir));
        }
        renderEbook();
    }

    function toggleEbookAudio() {
        if (audio.paused) {
            audio.play().then(() => {
                updateEbookAudioUI(true);
            }).catch(() => {
                updateEbookAudioUI(false);
            });
        } else {
            audio.pause();
            updateEbookAudioUI(false);
        }
    }

    function updateEbookAudioUI(isPlaying) {
        const btn = document.getElementById('ebookPlayBtn');
        const icon = document.getElementById('ebookPlayIcon');
        const label = document.getElementById('ebookPlayLabel');
        if (!btn) return;
        if (isPlaying) {
            btn.classList.add('playing');
            icon.textContent = '⏸️';
            label.textContent = '일시 정지';
        } else {
            btn.classList.remove('playing');
            icon.textContent = '▶️';
            label.textContent = '구연동화 듣기';
        }
    }

    // ==========================================
    // 📜 웹툰 모드 렌더링
    // ==========================================
    function renderWebtoonList() {
        const container = document.getElementById('webtoonCardList');
        container.innerHTML = STORY_DATA.map((item, idx) => `
            <div class="webtoon-card" id="webtoonCard_${idx}">
                <div class="webtoon-header">
                    <div class="webtoon-tag">${item.tag}</div>
                    <button class="btn-card-audio" id="cardAudioBtn_${idx}" onclick="playSingleCardAudio(${idx})">
                        ▶️ ${item.page}장 듣기
                    </button>
                </div>
                <div class="webtoon-ill-wrap">
                    <img class="webtoon-ill-img" src="images/minsu/5-1/0/safety_storybook/${item.illImg}?v=20260902_2" alt="${item.tag}">
                </div>
                <div class="webtoon-story-box">
                    ${item.textHtml}
                </div>
            </div>
        `).join('');
    }

    function playSingleCardAudio(idx) {
        isContinuousPlaying = false;
        updateContinuousUI(false);

        const currentBtn = document.getElementById(`cardAudioBtn_${idx}`);
        if (!audio.paused && continuousIndex === idx) {
            audio.pause();
            currentBtn.classList.remove('playing');
            currentBtn.innerHTML = `▶️ ${STORY_DATA[idx].page}장 듣기`;
            return;
        }

        resetAllWebtoonCardButtons();

        continuousIndex = idx;
        audio.src = STORY_DATA[idx].audio;
        audio.play().then(() => {
            currentBtn.classList.add('playing');
            currentBtn.innerHTML = `⏸️ ${STORY_DATA[idx].page}장 멈춤`;
        }).catch(e => console.log(e));
    }

    function toggleContinuousPlay() {
        if (isContinuousPlaying) {
            audio.pause();
            isContinuousPlaying = false;
            updateContinuousUI(false);
            resetAllWebtoonCardButtons();
        } else {
            isContinuousPlaying = true;
            updateContinuousUI(true);
            playContinuousFrom(0);
        }
    }

    function playContinuousFrom(idx) {
        if (idx >= STORY_DATA.length) {
            isContinuousPlaying = false;
            updateContinuousUI(false);
            resetAllWebtoonCardButtons();
            return;
        }

        continuousIndex = idx;
        audio.src = STORY_DATA[idx].audio;

        const targetCard = document.getElementById(`webtoonCard_${idx}`);
        if (targetCard) {
            targetCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
            targetCard.style.borderColor = '#059669';
        }

        resetAllWebtoonCardButtons();
        const activeBtn = document.getElementById(`cardAudioBtn_${idx}`);
        if (activeBtn) {
            activeBtn.classList.add('playing');
            activeBtn.innerHTML = `🔊 ${STORY_DATA[idx].page}장 재생 중`;
        }

        audio.play().catch(e => console.log(e));
    }

    function updateContinuousUI(isPlaying) {
        const btn = document.getElementById('continuousBtn');
        const icon = document.getElementById('continuousIcon');
        const label = document.getElementById('continuousLabel');
        if (!btn) return;
        if (isPlaying) {
            btn.classList.add('playing');
            icon.textContent = '⏸️';
            label.textContent = '연속 재생 멈춤';
        } else {
            btn.classList.remove('playing');
            icon.textContent = '▶️';
            label.textContent = '1장부터 연속 재생';
        }
    }

    function resetAllWebtoonCardButtons() {
        document.querySelectorAll('.btn-card-audio').forEach((b, i) => {
            b.classList.remove('playing');
            b.innerHTML = `▶️ ${STORY_DATA[i].page}장 듣기`;
        });
        document.querySelectorAll('.webtoon-card').forEach(c => {
            c.style.borderColor = '#1e3a31';
        });
    }

    audio.onended = () => {
        if (currentMode === 'ebook') {
            updateEbookAudioUI(false);
        } else {
            if (isContinuousPlaying) {
                playContinuousFrom(continuousIndex + 1);
            } else {
                resetAllWebtoonCardButtons();
            }
        }
    };

    audio.onerror = () => {
        updateEbookAudioUI(false);
        updateContinuousUI(false);
        resetAllWebtoonCardButtons();
    };

    function restartStorybook() {
        window.scrollTo({ top: 0, behavior: 'smooth' });
        if (currentMode === 'ebook') {
            currentPageIndex = 0;
            renderEbook();
        } else {
            setViewerMode('ebook');
            currentPageIndex = 0;
            renderEbook();
        }
    }

    window.addEventListener('keydown', (e) => {
        if (currentMode === 'ebook') {
            if (e.key === 'ArrowLeft') changePage(-1);
            if (e.key === 'ArrowRight') changePage(1);
            if (e.key === ' ') {
                e.preventDefault();
                toggleEbookAudio();
            }
        }
    });

    document.addEventListener('DOMContentLoaded', () => {
        renderEbook();
    });
</script>
