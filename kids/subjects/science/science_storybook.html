<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>과학 교과서 탐험대: 완벽 공부법 📖 | 민민이네 공부방</title>
<link rel="stylesheet" href="../../css/design-system.css">
<style>
    @import url('https://fonts.googleapis.com/css2?family=Jua&family=Nanum+Gothic:wght@400;700;800&family=Gaegu:wght@400;700&display=swap');

    :root {
        --primary: #0284c7;
        --primary-dark: #0369a1;
        --accent: #f59e0b;
        --bg-color: #0b1329;
        --card-bg: #1e293b;
        --text-light: #f8fafc;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        font-family: 'Nanum Gothic', sans-serif;
        background: #0b1329;
        min-height: 100vh;
        color: var(--text-light);
        display: flex;
        flex-direction: column;
    }

    /* 상단 헤더 바 */
    .top-bar {
        display: flex; justify-content: space-between; align-items: center;
        padding: 10px 18px; background: rgba(11, 19, 41, 0.95); backdrop-filter: blur(12px);
        box-shadow: 0 2px 15px rgba(0,0,0,0.5); position: sticky; top: 0; z-index: 100;
        border-bottom: 1px solid #1e293b;
    }
    .top-left { display: flex; align-items: center; gap: 12px; }
    .btn-back {
        display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px;
        background: #1e293b; color: #e2e8f0; border-radius: 12px; font-family: 'Jua', sans-serif;
        font-size: 0.95rem; text-decoration: none; border: 1px solid #334155; cursor: pointer; transition: all 0.2s;
    }
    .btn-back:hover { background: #334155; color: #fff; }
    .story-title {
        font-family: 'Jua', sans-serif; font-size: 1.2rem; color: #38bdf8;
        display: flex; align-items: center; gap: 8px;
    }

    /* 뷰 모드 전환 탭 */
    .view-mode-tabs {
        display: flex; background: #1e293b; padding: 4px; border-radius: 14px;
        border: 1px solid #334155;
    }
    .tab-btn {
        padding: 6px 14px; border-radius: 10px; border: none; font-family: 'Jua', sans-serif;
        font-size: 0.95rem; color: #94a3b8; background: transparent; cursor: pointer;
        transition: all 0.2s; display: flex; align-items: center; gap: 6px;
    }
    .tab-btn.active {
        background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
        color: white; box-shadow: 0 2px 8px rgba(2, 132, 199, 0.4);
    }

    /* ==========================================
       1. 📖 책 넘김 모드 (E-Book Spread Mode)
       ========================================== */
    .ebook-container {
        flex: 1; max-width: 1080px; width: 100%; margin: 10px auto; padding: 0 12px;
        display: flex; flex-direction: column; justify-content: center; align-items: center;
    }
    .book-frame {
        position: relative; width: 100%; max-width: 960px;
        background: #1e293b; border-radius: 16px; padding: 10px;
        box-shadow: 0 20px 50px rgba(0,0,0,0.6), 0 0 0 2px #334155;
        display: flex; justify-content: center; align-items: center;
    }
    .book-spread-img {
        width: 100%; height: auto; max-height: 75vh; object-fit: contain;
        border-radius: 10px; box-shadow: 0 8px 25px rgba(0,0,0,0.4);
        display: block;
    }
    .ebook-controls {
        width: 100%; max-width: 960px; margin-top: 14px;
        display: flex; justify-content: space-between; align-items: center; gap: 12px;
        flex-wrap: wrap;
    }
    .btn-page-nav {
        padding: 10px 20px; border-radius: 14px; border: none; font-family: 'Jua', sans-serif;
        font-size: 1.1rem; cursor: pointer; transition: all 0.2s;
        display: flex; align-items: center; gap: 6px;
    }
    .btn-prev { background: #334155; color: #f1f5f9; }
    .btn-prev:hover:not(:disabled) { background: #475569; }
    .btn-next {
        background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
        color: white; box-shadow: 0 4px 14px rgba(2, 132, 199, 0.4);
    }
    .btn-page-nav:disabled { opacity: 0.3; cursor: not-allowed; }
    .page-indicator {
        font-family: 'Jua', sans-serif; font-size: 1.15rem; color: #38bdf8;
        background: #1e293b; padding: 6px 16px; border-radius: 20px; border: 1px solid #334155;
    }
    .audio-control-bar {
        display: flex; align-items: center; gap: 10px; background: #1e293b;
        padding: 8px 16px; border-radius: 16px; border: 1px solid #334155;
    }
    .btn-play {
        padding: 8px 16px; border-radius: 12px; border: none; font-family: 'Jua', sans-serif;
        font-size: 1rem; color: white; background: #0284c7; cursor: pointer;
        display: inline-flex; align-items: center; gap: 6px; transition: all 0.2s;
    }
    .btn-play.playing { background: #f59e0b; }
    .auto-read-label {
        display: inline-flex; align-items: center; gap: 6px; font-size: 0.88rem;
        font-family: 'Jua', sans-serif; color: #cbd5e1; cursor: pointer;
    }
    .auto-read-label input { width: 16px; height: 16px; accent-color: #0284c7; cursor: pointer; }

    /* ========================================================
       2. 📜 웹툰 스크롤 모드 (대형 그림 + 반응형 HTML 글밥 카드)
       ======================================================== */
    .webtoon-container {
        display: none; max-width: 680px; width: 100%; margin: 15px auto;
        padding: 0 12px 50px 12px; flex-direction: column; gap: 32px;
    }
    .webtoon-sticky-bar {
        position: sticky; top: 60px; z-index: 90;
        background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(10px);
        padding: 10px 16px; border-radius: 16px; border: 1.5px solid #0284c7;
        display: flex; justify-content: space-between; align-items: center;
        box-shadow: 0 8px 25px rgba(0,0,0,0.6);
    }
    .continuous-btn {
        padding: 8px 16px; border-radius: 12px; border: none; font-family: 'Jua', sans-serif;
        font-size: 0.95rem; color: white; background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
        cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
    }
    .continuous-btn.playing { background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); }

    .webtoon-card {
        background: #1e293b; border-radius: 20px; overflow: hidden;
        box-shadow: 0 15px 35px rgba(0,0,0,0.6); border: 2px solid #334155;
        display: flex; flex-direction: column; transition: border-color 0.3s;
    }
    .webtoon-header {
        padding: 10px 16px; background: #0f172a; display: flex;
        justify-content: space-between; align-items: center; border-bottom: 1px solid #334155;
    }
    .webtoon-tag {
        font-family: 'Jua', sans-serif; font-size: 0.95rem; color: #38bdf8;
        display: flex; align-items: center; gap: 6px;
    }
    .btn-card-audio {
        padding: 5px 12px; border-radius: 10px; border: none; font-family: 'Jua', sans-serif;
        font-size: 0.88rem; color: white; background: #334155; cursor: pointer;
        display: inline-flex; align-items: center; gap: 6px; transition: all 0.2s;
    }
    .btn-card-audio:hover { background: #475569; }
    .btn-card-audio.playing { background: #f59e0b; }

    /* 🖼️ 상단 대형 삽화 */
    .webtoon-ill-wrap {
        width: 100%; background: #0f172a; overflow: hidden; display: flex; justify-content: center;
    }
    .webtoon-ill-img {
        width: 100%; height: auto; display: block; object-fit: contain; max-height: 520px;
    }

    /* 📝 하단 반응형 HTML 글밥 카드 (글자 잘림 0%, 여백 최적화) */
    .webtoon-story-box {
        background: #f8fafc; color: #1e293b; padding: 16px 18px;
        border-top: 3px solid #0284c7; border-left: 6px solid #0284c7;
        display: flex; flex-direction: column; gap: 10px;
    }
    .webtoon-passage {
        font-size: 1.05rem; line-height: 1.7; color: #1e293b;
        font-weight: 500; word-break: keep-all; word-wrap: break-word;
    }
    .webtoon-passage b { color: #0369a1; font-weight: 700; }
    .webtoon-passage .highlight {
        background: #e0f2fe; padding: 1px 4px; border-radius: 4px; color: #0369a1; font-weight: 700;
    }
    .webtoon-ref-badge {
        display: inline-flex; align-items: center; gap: 5px;
        background: #e0f2fe; color: #0369a1; padding: 5px 12px;
        border-radius: 8px; font-size: 0.88rem; font-weight: 700;
        border: 1px solid #bae6fd; margin-top: 4px; width: fit-content;
        font-family: 'Jua', sans-serif;
    }

    /* 다시 시작 버튼 카드 */
    .restart-card-box {
        text-align: center; padding: 20px; background: #1e293b; border-radius: 16px;
        border: 2px dashed #38bdf8; display: flex; flex-direction: column; align-items: center; gap: 12px;
    }
    .btn-restart-large {
        padding: 12px 28px; border-radius: 14px; border: none; font-family: 'Jua', sans-serif;
        font-size: 1.15rem; color: white; background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
        cursor: pointer; box-shadow: 0 4px 15px rgba(2, 132, 199, 0.4); transition: transform 0.2s;
    }
    .btn-restart-large:hover { transform: scale(1.05); }

    @media (max-width: 768px) {
        .top-bar { padding: 8px 10px; }
        .story-title { font-size: 1rem; }
        .tab-btn { padding: 4px 8px; font-size: 0.85rem; }
        .btn-page-nav { padding: 8px 12px; font-size: 0.95rem; }
        .page-indicator { font-size: 0.95rem; padding: 4px 10px; }
        .book-frame { padding: 4px; }
        .audio-control-bar { width: 100%; justify-content: space-between; margin-top: 6px; }
        .webtoon-passage { font-size: 0.98rem; line-height: 1.6; }
    }
</style>
</head>

    let currentMode = 'ebook';
    let currentPageIndex = 0;
    let isContinuousPlaying = false;
    let webtoonPlayIdx = 0;
    let isTtsPlaying = false;

    // Web Speech API TTS 요정 엔진 결합
    function speakText(text, onEndCallback) {
        stopSpeech();
        if (!('speechSynthesis' in window)) {
            if (onEndCallback) onEndCallback();
            return;
        }
        window.speechSynthesis.cancel();
        
        const cleanText = text.replace(/<[^>]*>?/gm, '').replace(/一언제나처럼/g, '언제나처럼').trim();
        const utterance = new SpeechSynthesisUtterance(cleanText);
        utterance.lang = 'ko-KR';
        utterance.rate = 0.95; // 살짝 또렷하고 나긋나긋한 속도
        utterance.pitch = 1.05;

        // 한국어 음성 우선 선택
        const voices = window.speechSynthesis.getVoices();
        const koVoice = voices.find(v => v.lang.startsWith('ko') || v.name.includes('Korean') || v.name.includes('Yuna') || v.name.includes('Heami') || v.name.includes('Google 한국의'));
        if (koVoice) utterance.voice = koVoice;

        utterance.onend = () => {
            isTtsPlaying = false;
            if (onEndCallback) onEndCallback();
        };

        utterance.onerror = () => {
            isTtsPlaying = false;
            if (onEndCallback) onEndCallback();
        };

        isTtsPlaying = true;
        window.speechSynthesis.speak(utterance);
    }

    function stopSpeech() {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
        }
        isTtsPlaying = false;
    }

    function setViewerMode(mode) {
        currentMode = mode;
        stopSpeech();
        updateEbookAudioUI(false);
        updateContinuousUI(false);
        isContinuousPlaying = false;

        if (mode === 'ebook') {
            document.getElementById('tabEbook').classList.add('active');
            document.getElementById('tabWebtoon').classList.remove('active');
            document.getElementById('ebookView').style.display = 'flex';
            document.getElementById('webtoonView').style.display = 'none';
            renderEbook();
        } else {
            document.getElementById('tabWebtoon').classList.add('active');
            document.getElementById('tabEbook').classList.remove('active');
            document.getElementById('ebookView').style.display = 'none';
            document.getElementById('webtoonView').style.display = 'flex';
            renderWebtoonList();
        }
    }

    function renderEbook() {
        const item = STORY_DATA[currentPageIndex];
        const img = document.getElementById('ebookImg');
        img.src = `images/minsu/5-1/0/storybook/${item.spreadImg}?v=20260902_2`;
        document.getElementById('pageIndicator').textContent = `${item.page} / ${STORY_DATA.length} 쪽`;

        document.getElementById('prevBtn').disabled = (currentPageIndex === 0);
        document.getElementById('nextBtn').textContent = (currentPageIndex === STORY_DATA.length - 1) ? '🎉 다시 시작' : '다음 장 ▶';

        stopSpeech();
        updateEbookAudioUI(false);

        const autoPlay = document.getElementById('autoPlayCheckbox').checked;
        if (autoPlay) {
            setTimeout(() => {
                updateEbookAudioUI(true);
                speakText(item.rawText, () => {
                    updateEbookAudioUI(false);
                    const autoChecked = document.getElementById('autoPlayCheckbox').checked;
                    if (autoChecked && currentMode === 'ebook' && currentPageIndex < STORY_DATA.length - 1) {
                        setTimeout(() => changePage(1), 1200);
                    }
                });
            }, 300);
        }
    }

    function changePage(dir) {
        stopSpeech();
        if (currentPageIndex === STORY_DATA.length - 1 && dir === 1) {
            currentPageIndex = 0;
        } else {
            currentPageIndex = Math.max(0, Math.min(STORY_DATA.length - 1, currentPageIndex + dir));
        }
        renderEbook();
    }

    function toggleEbookAudio() {
        const item = STORY_DATA[currentPageIndex];
        if (isTtsPlaying) {
            stopSpeech();
            updateEbookAudioUI(false);
        } else {
            updateEbookAudioUI(true);
            speakText(item.rawText, () => {
                updateEbookAudioUI(false);
            });
        }
    }

    function updateEbookAudioUI(isPlaying) {
        const btn = document.getElementById('ebookPlayBtn');
        const icon = document.getElementById('ebookPlayIcon');
        const label = document.getElementById('ebookPlayLabel');
        if (!btn) return;
        if (isPlaying) {
            btn.classList.add('playing');
            icon.textContent = '⏸️';
            label.textContent = '일시 정지';
        } else {
            btn.classList.remove('playing');
            icon.textContent = '▶️';
            label.textContent = '구연동화 듣기';
        }
    }

    function renderWebtoonList() {

            <div class="webtoon-card" id="webtoonCard_${idx}">
                <div class="webtoon-header">

                <div class="webtoon-story-box">
                    ${item.textHtml}
                </div>
            </div>
        `).join('');
    }

    function playWebtoonCardAudio(idx) {
        isContinuousPlaying = false;
        updateContinuousUI(false);
        playWebtoonIndex(idx);
    }

    function playWebtoonIndex(idx) {
        webtoonPlayIdx = idx;
        const item = STORY_DATA[idx];

        STORY_DATA.forEach((_, i) => {
            const c = document.getElementById(`webtoonCard_${i}`);

            const b = document.getElementById(`cardAudioBtn_${i}`);
            if (b) { b.classList.remove('playing'); b.textContent = '🔊 이 장면 듣기'; }
        });

        const card = document.getElementById(`webtoonCard_${idx}`);
        const btn = document.getElementById(`cardAudioBtn_${idx}`);
        if (card) {
            card.scrollIntoView({ behavior: 'smooth', block: 'center' });
            card.style.borderColor = '#0284c7';
        }
        if (btn) {
            btn.classList.add('playing');
            btn.textContent = '⏸️ 낭독 중...';
        }

        speakText(item.rawText, () => {
            if (btn) {
                btn.classList.remove('playing');
                btn.textContent = '🔊 이 장면 듣기';
            }
            if (card) card.style.borderColor = '#334155';

            if (isContinuousPlaying) {
                if (webtoonPlayIdx < STORY_DATA.length - 1) {
                    webtoonPlayIdx++;
                    setTimeout(() => playWebtoonIndex(webtoonPlayIdx), 1000);
                } else {
                    updateContinuousUI(false);
                    isContinuousPlaying = false;
                }
            }
        });
    }

    function updateContinuousUI(playing) {
        isContinuousPlaying = playing;
        const btn = document.getElementById('continuousBtn');
        const icon = document.getElementById('continuousIcon');
        const label = document.getElementById('continuousLabel');
        if (!btn) return;
        if (playing) {
            btn.classList.add('playing');
            icon.textContent = '⏸️';
            label.textContent = '연속 낭독 중지';
        } else {
            btn.classList.remove('playing');
            icon.textContent = '▶️';
            label.textContent = '1장부터 연속 재생';
        }
    }

    function toggleContinuousPlay() {
        if (isContinuousPlaying) {
            stopSpeech();
            updateContinuousUI(false);
        } else {
            updateContinuousUI(true);
            playWebtoonIndex(0);
        }
    }

    function restartStorybook() {
        window.scrollTo({ top: 0, behavior: 'smooth' });
        if (currentMode === 'ebook') {
            currentPageIndex = 0;
            renderEbook();
        } else {
            setViewerMode('ebook');
            currentPageIndex = 0;
            renderEbook();
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        // 음성 목록 사전 로드 (Chrome 등 브라우저 대응)
        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = () => {
                window.speechSynthesis.getVoices();
            };
        }
        renderEbook();
    });
</script>
</body>
</html>
