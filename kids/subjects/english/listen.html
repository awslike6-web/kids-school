<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>원어민 발음 듣기 🧚‍♂️ | 김s 공부방</title>
<link rel="stylesheet" href="../../css/design-system.css?v=5fe8b77a">
<style>
    @import url('https://fonts.googleapis.com/css2?family=Jua&family=Nanum+Gothic:wght@400;700;800&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        font-family: 'Nanum Gothic', sans-serif;
        background: linear-gradient(135deg, #e0f2fe 0%, #ede9fe 100%);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 20px;
        color: #1e293b;
    }

    .listen-card {
        background: #ffffff;
        width: 100%;
        max-width: 420px;
        border-radius: 28px;
        box-shadow: 0 15px 35px rgba(99, 102, 241, 0.18);
        padding: 30px 24px;
        text-align: center;
        position: relative;
        overflow: hidden;
        border: 3px solid #c7d2fe;
    }

    .top-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: #f0fdf4;
        color: #166534;
        border: 2px solid #bbf7d0;
        padding: 6px 16px;
        border-radius: 20px;
        font-family: 'Jua', sans-serif;
        font-size: 1rem;
        margin-bottom: 20px;
    }

    .fairy-avatar {
        font-size: 3.5rem;
        margin-bottom: 10px;
        animation: float 3s ease-in-out infinite;
        display: inline-block;
    }

    @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-8px); }
    }

    .english-box {
        background: #f8fafc;
        border: 2px dashed #94a3b8;
        border-radius: 20px;
        padding: 20px 16px;
        margin-bottom: 15px;
        position: relative;
    }

    .english-text {
        font-size: 1.65rem;
        font-weight: 800;
        color: #1e1b4b;
        line-height: 1.35;
        word-break: keep-all;
        margin-bottom: 6px;
    }

    .korean-text {
        font-size: 1.15rem;
        font-weight: 700;
        color: #64748b;
        line-height: 1.35;
        word-break: keep-all;
    }

    /* 메인 발음 재생 버튼 */
    .btn-main-play {
        width: 100%;
        padding: 16px;
        background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
        color: white;
        border: none;
        border-radius: 20px;
        font-family: 'Jua', sans-serif;
        font-size: 1.35rem;
        cursor: pointer;
        box-shadow: 0 8px 20px rgba(79, 70, 229, 0.35);
        transition: all 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        margin-bottom: 16px;
    }
    .btn-main-play:active {
        transform: scale(0.97);
    }
    .btn-main-play.speaking {
        background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        animation: pulse 1s infinite;
    }

    @keyframes pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.02); }
    }

    /* 서브 컨트롤 버튼들 */
    .sub-controls {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-bottom: 20px;
    }

    .btn-sub {
        padding: 12px;
        background: #f1f5f9;
        border: 2px solid #e2e8f0;
        border-radius: 14px;
        font-family: 'Jua', sans-serif;
        font-size: 0.95rem;
        color: #334155;
        cursor: pointer;
        transition: all 0.2s;
    }
    .btn-sub:hover, .btn-sub:active {
        background: #e2e8f0;
        border-color: #cbd5e1;
    }

    .btn-repeat {
        width: 100%;
        padding: 12px;
        background: #fffbeb;
        border: 2px solid #fde68a;
        border-radius: 14px;
        font-family: 'Jua', sans-serif;
        font-size: 1rem;
        color: #92400e;
        cursor: pointer;
        margin-bottom: 15px;
    }

    .bottom-info {
        font-size: 0.82rem;
        color: #94a3b8;
        font-weight: bold;
    }
</style>
</head>
<body>

<div class="listen-card">
    <div class="top-badge">✨ 코코 요정의 스마트 발음기</div>
    <div class="fairy-avatar" id="fairyIcon">🧚‍♂️</div>

    <div class="english-box">
        <div class="english-text" id="engText">Loading...</div>
        <div class="korean-text" id="korText"></div>
    </div>

    <button class="btn-main-play" id="playBtn" onclick="speakText(1.0)">
        <span id="playIcon">🔊</span> <span id="playLabel">원어민 발음 듣기</span>
    </button>

    <div class="sub-controls">
        <button class="btn-sub" onclick="speakText(0.75)">🐢 천천히 듣기 (0.75x)</button>
        <button class="btn-sub" onclick="speakText(1.1)">🐇 조금 빠르게 (1.1x)</button>
    </div>

    <button class="btn-repeat" onclick="speakRepeat(3)">🔁 3번 연속 반복 듣기</button>

    <div class="bottom-info">💡 소리가 안 나면 스마트폰 무음(진동) 모드를 해제해주세요!</div>
</div>

<script src="../../config.js?v=7e621b5d"></script>
<script src="../../core/notion-helper.js?v=e6a50a7a"></script>
<script src="../../core/fairy-config.js?v=556cfe19"></script>
<script src="../../core/fairy-tts.js?v=653e7029"></script> <!-- 공용 영어 음성(Edge Jenny), 2026-11-28 -->
<script>
    // URL 파라미터 파싱
    const params = new URLSearchParams(window.location.search);
    const eng = params.get('t') || 'Hello!';
    let kor = params.get('m') || '';

    document.getElementById('engText').textContent = eng;
    if (kor) {
        document.getElementById('korText').textContent = kor;
    }

    // URL에 한글 뜻이 없을 경우 노션 DB에서 실시간 단어 검색 매칭
    if (!kor && typeof fetchVocaFromNotion === 'function') {
        fetchVocaFromNotion({ subject: '영어' }).then(words => {
            if (words && words.length) {
                const cleanEng = eng.trim().toLowerCase();
                const matched = words.find(w => (w.word || '').trim().toLowerCase() === cleanEng);
                if (matched && matched.meaning) {
                    document.getElementById('korText').textContent = matched.meaning;
                }
            }
        }).catch(err => console.log('Voca fetch background err:', err));
    }

    let isSpeaking = false;

    function getEnVoice() {
        if (!('speechSynthesis' in window)) return null;
        const voices = window.speechSynthesis.getVoices();
        return voices.find(v => v.lang.startsWith('en') && (v.name.includes('Natural') || v.name.includes('Google') || v.name.includes('Samantha') || v.name.includes('US')))
            || voices.find(v => v.lang.startsWith('en')) || null;
    }

    function setSpeaking(on, label = null) {
        isSpeaking = on;
        document.getElementById('playBtn').classList.toggle('speaking', on);
        document.getElementById('playLabel').textContent = on ? (label || '말하는 중... 🎶') : '원어민 발음 듣기';
        document.getElementById('fairyIcon').textContent = on ? '🗣️' : '🧚‍♂️';
    }

    function browserSpeak(rate, done) {
        if (!('speechSynthesis' in window)) {
            done();
            alert('이 브라우저는 음성 재생을 지원하지 않습니다.');
            return;
        }
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(eng);
        utter.lang = 'en-US';
        utter.rate = rate;
        utter.pitch = 1.05;
        const voice = getEnVoice();
        if (voice) utter.voice = voice;
        utter.onend = done;
        utter.onerror = done;
        window.speechSynthesis.speak(utter);
    }

    // 공용 Edge 원어민 음성(fairy-tts.js playCloudflareEdgeTtsStream, Jenny)으로 읽는다. 버튼 빠르기는 이번만 빠르기로.
    // - 발음 듣기가 목적인 화면이라 「요정 목소리 끔」 설정과 상관없이 읽는다(speakEnglish는 끔이면 조용히 끝남)
    // - 재생 번호(playSeq)로 이전 재생의 끝남 알림은 무시하고, 끝남 알림은 한 번만 (카본 검토 2026-11-28)
    // - Edge가 막히면 브라우저 음성으로, 첫 자동 재생이 막히면(NotAllowedError) 그냥 멈추고 버튼으로 듣게 한다
    let playSeq = 0;
    function speakText(rate = 1.0, onEndCallback = null, label = null) {
        const seq = ++playSeq;
        let finished = false;
        const done = () => {
            if (finished || seq !== playSeq) return;
            finished = true;
            setSpeaking(false);
            if (onEndCallback) onEndCallback();
        };
        if (typeof stopFairyTTS === 'function') stopFairyTTS();
        setSpeaking(true, label);
        if (typeof playCloudflareEdgeTtsStream === 'function') {
            const voice = (typeof APP_CONFIG !== 'undefined' && APP_CONFIG.DEFAULT_ENGLISH_VOICE) || 'en-US-JennyNeural';
            playCloudflareEdgeTtsStream(eng, done, voice, { playbackRate: rate }).catch(err => {
                if (seq !== playSeq) return;
                if (err && err.name === 'NotAllowedError') { done(); return; }
                browserSpeak(rate, done);
            });
            return;
        }
        browserSpeak(rate, done);
    }

    function speakRepeat(times = 3) {
        let count = 0;
        function playNext() {
            if (count < times) {
                count++;
                const label = `반복 듣기 (${count}/${times}) 🎶`;
                document.getElementById('playLabel').textContent = label;
                setTimeout(() => {
                    speakText(0.9, () => {
                        setTimeout(playNext, 600);
                    }, label);
                }, 100);
            }
        }
        playNext();
    }

    if ('speechSynthesis' in window) {
        window.speechSynthesis.onvoiceschanged = () => getEnVoice();
    }

    window.addEventListener('DOMContentLoaded', () => {
        setTimeout(() => {
            speakText(1.0);
        }, 500);
    });
</script>

</body>
</html>
