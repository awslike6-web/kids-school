<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>민민이네 국어방 본부 📚</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<style>
    :root {
        --sky: #6EC6F5; --yellow: #FFD93D; --pink: #FF6B9D; --mint: #4ECDC4;
        --purple: #A78BFA; --orange: #FF9F43; --green: #6BCB77; --white: #FFFEF7; --dark: #2D2D4E; --card: rgba(255,255,255,0.92);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Jua', sans-serif; background: linear-gradient(160deg, #c8f0ff 0%, #ffe8f5 50%, #fffbe6 100%); min-height: 100vh; overflow-x: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--dark); transition: background 0.5s; }
    
    body.theme--slime { background: linear-gradient(160deg, #e8f5e9 0%, #c8e6c9 50%, #a5d6a7 100%); }
    body.theme--minecraft { background: linear-gradient(160deg, #e0f7fa 0%, #b2ebf2 50%, #80deea 100%); }
    
    .hub-card { position: relative; background: var(--card); border-radius: 24px; padding: 30px; width: 100%; max-width: 480px; box-shadow: 0 8px 30px rgba(0,0,0,0.1); border: 2.5px solid rgba(255,255,255,0.8); text-align: center; z-index: 1; }
    .main-title { font-family: 'Gaegu', cursive; font-size: 3rem; margin-bottom: 10px; }
    .main-title span { color: var(--pink); }
    .user-badge { display: inline-block; padding: 6px 16px; border-radius: 20px; background: rgba(0,0,0,0.05); font-size: 0.95rem; margin-bottom: 25px; font-weight: bold; }
    
    .gate-btn { width: 100%; padding: 18px; border-radius: 16px; border: none; font-family: 'Jua'; font-size: 1.2rem; color: #fff; cursor: pointer; margin-bottom: 12px; transition: transform 0.2s; text-shadow: 1px 1px 2px rgba(0,0,0,0.2); }
    .gate-btn.sentence { background: linear-gradient(135deg, var(--sky), var(--purple)); }
    .gate-btn.reading { background: linear-gradient(135deg, var(--orange), var(--pink)); }
    .gate-btn.voca-btn { background: linear-gradient(135deg, var(--mint), var(--sky)); }
    .gate-btn.dictation-btn { background: linear-gradient(135deg, var(--purple), var(--pink)); }
    .gate-btn:hover { transform: scale(1.03); }
    .back-btn { background: #eee; color: #888; width: 100%; padding: 14px; border-radius: 16px; border: none; font-family: 'Jua'; font-size: 1rem; cursor: pointer; margin-top: 10px; }
    .profile-switch-btn { position: absolute; top: 15px; right: 15px; background: #fff; border: 2px solid var(--purple); padding: 6px 12px; border-radius: 12px; cursor: pointer; font-family: 'Jua'; font-size: 0.85rem; z-index: 10; }
</style>
</head>
<body>

<button class="profile-switch-btn" onclick="toggleProfileManually()">🔄 민수/민서 바꾸기</button>

<div class="hub-card">
    <h1 class="main-title">📚 국어 <span>본부</span></h1>
    <div class="user-badge" id="currentUserBadge">현재 사용자: 로딩 중...</div>

    <button class="gate-btn sentence" onclick="location.href='korean.html?type=sentence'">⌨️ AI 문장 학습방</button>
    <button class="gate-btn reading" onclick="location.href='korean.html?type=reading'">📖 정밀 독해 멀티버스방</button>
    <button class="gate-btn voca-btn" onclick="location.href='../../common_space/voca.html?subject=korean'">📚 국어 단어장</button>
    <button class="gate-btn dictation-btn" onclick="location.href='../../common_space/voca.html?subject=dictation'">✍️ 받아쓰기 훈련소</button>
    
    <button class="back-btn" onclick="location.href='../../../lobby.html'">🚪 메인 로비로 나가기</button>
</div>

<script src="../../config.js"></script>

<script>
    // 2. 이 방에서 필요한 코어 부품들의 목록을 작성합니다.
    const requiredCores = [
        "notion-helper.js",
        "korean_common.js",
        "fairy-config.js",
        "fairy-engine.js"
    ];

    // 3. 하이브리드 로더 가동
    loadCoreScripts("../../core/", requiredCores, () => {
        console.log("국어방 중문 하이브리드 엔진 시동 완료! 🚀");
        
        // 🔄 프로필 수동 전환 함수 전역화 및 문법 교정
        window.toggleProfileManually = function() {
            if (currentProfile === 'son') { currentProfile = 'daughter'; currentTheme = '슬라임'; } 
            else { currentProfile = 'son'; currentTheme = '마인크래프트'; }
            localStorage.setItem('currentUser', currentProfile); 
            localStorage.setItem('currentTheme', currentTheme);
            window.initProfile();
        }

        // 🎠 프로필 데이터 주입 및 UI 스위칭
        window.initProfile = function() {
            const savedUser = localStorage.getItem('currentUser'); if (savedUser) currentProfile = savedUser;
            const savedTheme = localStorage.getItem('currentTheme'); if (savedTheme) currentTheme = savedTheme;
            const themeClass = currentTheme === '슬라임' ? 'theme--slime' : 'theme--minecraft';
            document.body.className = themeClass;
            
            // APP_CONFIG 기반 동적 조카 이름 치환 바인딩
            const userName = currentProfile === 'son' ? APP_CONFIG.CHILDREN.first.name : APP_CONFIG.CHILDREN.second.name;
            document.getElementById('currentUserBadge').innerHTML = `현재 사용자: ${currentProfile === 'son' ? '👦' : '👧'} ${userName} (${currentTheme} 모드)`;
        }

        // 🔀 라우팅 게이트웨이 제어 처리
        window.handleRouting = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const type = urlParams.get('type');

            if (type === 'sentence') {
                location.href = 'korean-sentence.html';
            } else if (type === 'reading') {
                location.href = 'korean-reading.html';
            }
        }

        // ⚙️ 비동기 엔진 조립 마감 후 즉시 기본 로직 가동
        window.initProfile();
        window.handleRouting();

        // 🧚‍♀️ 단어요정 소환
        if (typeof initFairyChat === 'function') {
            initFairyChat('KOREAN');
        }
    });
</script>
</body>
</html>
