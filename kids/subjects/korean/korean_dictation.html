<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>국어 멀티버스 - 받아쓰기 훈련소</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --mint: #4ECDC4; --purple: #A78BFA; --dark: #2D2D4E; --card: rgba(255,255,255,0.95); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Jua', sans-serif; background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%); min-height: 100vh; color: var(--dark); padding-bottom: 50px; }
  
  .top-nav { display: flex; justify-content: space-between; padding: 15px 20px; background: rgba(255,255,255,0.8); position: sticky; top: 0; z-index: 50; }
  .exit-btn { padding: 8px 16px; background: #eee; border-radius: 15px; text-decoration: none; color: var(--dark); font-weight: bold; }
  
  .screen { display: none; flex-direction: column; align-items: center; padding: 20px; width: 100%; max-width: 600px; margin: 0 auto; }
  .screen.active { display: flex; }
  
  .main-title { font-family: 'Gaegu', cursive; font-size: 3rem; margin-bottom: 20px; text-align: center; }
  .card { background: var(--card); border-radius: 20px; padding: 25px; width: 100%; box-shadow: 0 8px 30px rgba(0,0,0,0.1); margin-bottom: 20px; border: 2px solid #fff; text-align: center; }
  .card-title { font-size: 1.3rem; color: var(--purple); margin-bottom: 15px; border-bottom: 2px dashed #eee; padding-bottom: 10px; }
  
  .game-zone { width: 100%; background: #fff; border: 3px solid var(--mint); border-radius: 20px; padding: 40px 20px; text-align: center; }
  .main-input { width: 100%; padding: 20px; border-radius: 15px; border: 3px solid #ccc; font-size: 1.6rem; text-align: center; font-family: 'Jua'; margin-bottom: 20px; outline: none;}
  .main-input:focus { border-color: var(--mint); }
  .main-input.correct { border-color: #6BCB77; background: #f0fff4; }
  .main-input.wrong { border-color: #FF6B9D; background: #fff5f5; }
  
  .btn { padding: 15px 30px; border-radius: 15px; border: none; background: var(--mint); color: white; font-size: 1.3rem; font-family: 'Jua'; cursor: pointer; margin: 5px; font-weight: bold;}
</style>
</head>
<body>

<div class="top-nav">
  <div style="font-size: 1.2rem; font-weight: bold;">✍️ 받아쓰기 훈련소</div>
  <a href="korean.html" class="exit-btn">🚪 국어 본부로</a>
</div>

<div class="screen active" id="screen-setup">
  <h1 class="main-title">✍️ 실전 <span>받아쓰기</span></h1>
  
  <div class="card" id="loadingCard">
    <div class="card-title">📡 도서관 스캔 중...</div>
    <p>받아쓰기 문장들을 불러오고 있어요!</p>
  </div>

  <div class="card" id="startCard" style="display: none;">
    <p style="font-size: 1.2rem; margin-bottom: 20px;">준비가 다 되었어요!<br>소리를 잘 듣고 띄어쓰기까지 정확하게 적어주세요!</p>
    <button class="btn" style="width: 100%; background: var(--purple);" onclick="startDictation()">🚀 훈련 시작하기</button>
  </div>
</div>

<div class="screen" id="screen-quiz">
  <div style="width:100%; display:flex; justify-content:space-between; margin-bottom:10px;">
    <div style="font-size:1.2rem; font-weight:bold; color:var(--purple);">⭐ <span id="score">0</span>점</div>
    <div style="font-size:1.2rem; font-weight:bold;">📝 <span id="q-num">1</span> / 10</div>
  </div>
  
  <div class="game-zone">
      <div style="font-size: 5rem; margin-bottom: 20px;">🎧</div>
      <div id="hintText" style="font-size: 1.2rem; color: #888; margin-bottom: 20px; display: none;"></div>
      
      <input id="answerInput" class="main-input" type="text" autocomplete="off" placeholder="여기에 받아 적으세요" onkeypress="if(event.key === 'Enter') checkAnswer()">
      
      <div style="display:flex; gap:10px; justify-content:center;">
          <button class="btn" onclick="checkAnswer()">정답 내기</button>
          <button class="btn" style="background:#ff9f43;" onclick="speakSentence()">🔊 다시 듣기</button>
      </div>
      <button style="margin-top: 20px; background: none; border: none; color: #ccc; text-decoration: underline; cursor: pointer;" onclick="document.getElementById('hintText').style.display='block'">모르겠어요 (힌트 보기)</button>
  </div>
</div>

<script src="../../config.js"></script>
<script src="../../core/core.js"></script>
<script src="../../core/notion-helper.js"></script>
<script src="../../core/fairy-chatbot.js"></script>  
<script src="../../core/fairy-engine.js"></script>
<script src="../../js/korean_common.js"></script>

<script>
let sentenceList = [];
let quizPool = [];
let currentIdx = 0;
let score = 0;

window.onload = async () => {
    try {
        sentenceList = await fetchVocaFromNotion({ subject: "받아쓰기" });

        document.getElementById('loadingCard').style.display = 'none';
        if (sentenceList.length > 0) document.getElementById('startCard').style.display = 'block';
        else alert("노션에 '받아쓰기'로 등록된 문장이 없습니다!");
    } catch (e) {
        alert("데이터 로딩 실패!");
    }
};

function startDictation() {
    score = 0; currentIdx = 0;
    quizPool = [...sentenceList].sort(() => Math.random() - 0.5).slice(0, 10);
    
    document.getElementById('screen-setup').classList.remove('active');
    document.getElementById('screen-quiz').classList.add('active');
    
    // 오디오 잠금 해제를 위해 빈 음성 출력
    if(window.speechSynthesis) window.speechSynthesis.speak(new SpeechSynthesisUtterance(''));
    
    loadQuestion();
}

function loadQuestion() {
    const q = quizPool[currentIdx];
    document.getElementById('q-num').textContent = currentIdx + 1;
    document.getElementById('score').textContent = score;
    document.getElementById('hintText').style.display = 'none';
    
    // 힌트는 초성으로 제공 (간단한 구현)
    document.getElementById('hintText').textContent = "정답: " + q.word; 
    
    const input = document.getElementById('answerInput');
    input.value = ''; input.className = 'main-input'; input.disabled = false;
    
    setTimeout(() => {
        speakSentence();
        input.focus();
    }, 500);
}

function speakSentence() {
    if(window.speakFairyTTS) window.speakFairyTTS(quizPool[currentIdx].word);
}

function checkAnswer() {
    const q = quizPool[currentIdx];
    const inputEl = document.getElementById('answerInput');
    // 받아쓰기는 띄어쓰기까지 정확하게 검사 (기호는 제외)
    const val = inputEl.value.trim().replace(/[.,!?]/g, '');
    const target = q.word.trim().replace(/[.,!?]/g, '');
    
    if (val === target) {
        inputEl.className = "main-input correct"; inputEl.disabled = true;
        score += 10;
        if(window.speakFairyTTS) window.speakFairyTTS("완벽해! 띄어쓰기까지 정확했어!");
        setTimeout(nextQuestion, 1500);
    } else {
        inputEl.className = "main-input wrong";
        if(window.speakFairyTTS) window.speakFairyTTS("어딘가 틀렸어. 다시 들어보고 고쳐봐!");
        
        // 오답 리포트에 아이가 작성한 문장 내용 그대로 기록
        let studentWrongAnswer = inputEl.value.trim();
        if (!window.wrongNotes.some(item => item.word === q.word)) { 
            window.wrongNotes.push({ ...q, wrongInput: studentWrongAnswer }); 
        }

        setTimeout(() => { inputEl.className = "main-input"; }, 800);
    }
}

async function nextQuestion() {
    currentIdx++;
    if (currentIdx >= quizPool.length) {
        document.getElementById('answerInput').style.display = 'none';
        document.querySelector('.game-zone').innerHTML = "<h2>🎉 훈련 완료!</h2><br><span style='font-size:1.5rem; color:#A78BFA;'>관제탑에 보상을 기록 중입니다...</span>";
        
        // 💡 국어 관제탑 보상 시스템 호출!
        if (score > 0 && typeof grantRewardAndShowUI === 'function') {
            await grantRewardAndShowUI(score / 10);
        }
    } else {
        loadQuestion();
    }
}
</script>
</body>
</html>
