<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>마음 똑똑! 감정 라디오 교실 (국어 1-2 1단원 스토리북) 📖 | 민민이네 공부방</title>
<link rel="stylesheet" href="../../css/design-system.css">
<style>
    @import url('https://fonts.googleapis.com/css2?family=Jua&family=Nanum+Gothic:wght@400;700;800&family=Gaegu:wght@400;700&display=swap');

    :root {
        --primary: #ec4899;
        --primary-dark: #db2777;
        --accent: #f59e0b;
        --bg-color: #0f172a;
        --card-bg: #1e293b;
        --text-light: #f8fafc;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        font-family: 'Nanum Gothic', sans-serif;
        background: #0f172a;
        min-height: 100vh;
        color: var(--text-light);
        display: flex;
        flex-direction: column;
    }

    /* 상단 헤더 바 */
    .top-bar {
        display: flex; justify-content: space-between; align-items: center;
        padding: 10px 18px; background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(12px);
        box-shadow: 0 2px 15px rgba(0,0,0,0.5); position: sticky; top: 0; z-index: 100;
        border-bottom: 1px solid #334155;
    }
    .top-left { display: flex; align-items: center; gap: 12px; }
    .btn-back {
        display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px;
        background: #334155; color: #e2e8f0; border-radius: 12px; font-family: 'Jua', sans-serif;
        font-size: 0.95rem; text-decoration: none; border: none; cursor: pointer; transition: all 0.2s;
    }
    .btn-back:hover { background: #475569; color: #fff; }
    .story-title {
        font-family: 'Jua', sans-serif; font-size: 1.2rem; color: #f472b6;
        display: flex; align-items: center; gap: 8px;
    }

    /* 뷰 모드 전환 탭 */
    .view-mode-tabs {
        display: flex; background: #1e293b; padding: 4px; border-radius: 14px;
        border: 1px solid #475569;
    }
    .tab-btn {
        padding: 6px 14px; border-radius: 10px; border: none; font-family: 'Jua', sans-serif;
        font-size: 0.95rem; color: #94a3b8; background: transparent; cursor: pointer;
        transition: all 0.2s; display: flex; align-items: center; gap: 6px;
    }
    .tab-btn.active {
        background: #ec4899; color: white; box-shadow: 0 2px 8px rgba(236, 72, 153, 0.4);
    }

    /* ==========================================
       1. 📖 책 넘김 모드 (E-Book Spread Mode)
       ========================================== */
    .ebook-container {
        flex: 1; max-width: 1080px; width: 100%; margin: 10px auto; padding: 0 12px;
        display: flex; flex-direction: column; justify-content: center; align-items: center;
    }
    .book-frame {
        position: relative; width: 100%; max-width: 960px;
        background: #1e293b; border-radius: 16px; padding: 10px;
        box-shadow: 0 20px 50px rgba(0,0,0,0.6), 0 0 0 2px #334155;
        display: flex; justify-content: center; align-items: center;
    }
    .book-spread-img {
        width: 100%; height: auto; max-height: 75vh; object-fit: contain;
        border-radius: 10px; box-shadow: 0 8px 25px rgba(0,0,0,0.4);
        display: block;
    }
    .ebook-controls {
        width: 100%; max-width: 960px; margin-top: 14px;
        display: flex; justify-content: space-between; align-items: center; gap: 12px;
        flex-wrap: wrap;
    }
    .btn-page-nav {
        padding: 10px 20px; border-radius: 14px; border: none; font-family: 'Jua', sans-serif;
        font-size: 1.1rem; cursor: pointer; transition: all 0.2s;
        display: flex; align-items: center; gap: 6px;
    }
    .btn-prev { background: #334155; color: #f1f5f9; }
    .btn-prev:hover:not(:disabled) { background: #475569; }
    .btn-next {
        background: linear-gradient(135deg, #ec4899 0%, #db2777 100%);
        color: white; box-shadow: 0 4px 14px rgba(236, 72, 153, 0.4);
    }
    .btn-page-nav:disabled { opacity: 0.3; cursor: not-allowed; }
    .page-indicator {
        font-family: 'Jua', sans-serif; font-size: 1.15rem; color: #f472b6;
        background: #1e293b; padding: 6px 16px; border-radius: 20px; border: 1px solid #334155;
    }
    .audio-control-bar {
        display: flex; align-items: center; gap: 10px; background: #1e293b;
        padding: 8px 16px; border-radius: 16px; border: 1px solid #334155;
    }
    .btn-play {
        padding: 8px 16px; border-radius: 12px; border: none; font-family: 'Jua', sans-serif;
        font-size: 1rem; color: white; background: #ec4899; cursor: pointer;
        display: inline-flex; align-items: center; gap: 6px;
    }
    .btn-play.playing { background: #f59e0b; }
    .auto-read-label {
        display: inline-flex; align-items: center; gap: 6px; font-size: 0.88rem;
        font-family: 'Jua', sans-serif; color: #cbd5e1; cursor: pointer;
    }
    .auto-read-label input { width: 16px; height: 16px; accent-color: #ec4899; cursor: pointer; }

    /* ========================================================
       2. 📜 웹툰 스크롤 모드 (대형 그림 + 반응형 HTML 글밥 카드)
       ======================================================== */
    .webtoon-container {
        display: none; max-width: 650px; width: 100%; margin: 15px auto;
        padding: 0 10px 40px 10px; flex-direction: column; gap: 32px;
    }
    .webtoon-sticky-bar {
        position: sticky; top: 60px; z-index: 90;
        background: rgba(30, 41, 59, 0.95); backdrop-filter: blur(10px);
        padding: 10px 16px; border-radius: 16px; border: 1.5px solid #ec4899;
        display: flex; justify-content: space-between; align-items: center;
        box-shadow: 0 8px 25px rgba(0,0,0,0.6);
    }
    .continuous-btn {
        padding: 8px 16px; border-radius: 12px; border: none; font-family: 'Jua', sans-serif;
        font-size: 0.95rem; color: white; background: linear-gradient(135deg, #ec4899 0%, #db2777 100%);
        cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
    }
    .continuous-btn.playing { background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); }

    .webtoon-card {
        background: #1e293b; border-radius: 20px; overflow: hidden;
        box-shadow: 0 15px 35px rgba(0,0,0,0.6); border: 2px solid #334155;
        display: flex; flex-direction: column;
    }
    .webtoon-header {
        padding: 10px 16px; background: #0f172a; display: flex;
        justify-content: space-between; align-items: center; border-bottom: 1px solid #334155;
    }
    .webtoon-tag {
        font-family: 'Jua', sans-serif; font-size: 0.95rem; color: #f472b6;
        display: flex; align-items: center; gap: 6px;
    }
    .webtoon-img {
        width: 100%; height: auto; max-height: 480px; object-fit: contain;
        background: #0f172a; border-bottom: 1px solid #334155; display: block;
    }
    .webtoon-body {
        padding: 20px 22px; display: flex; flex-direction: column; gap: 14px;
        background: #1e293b;
    }
    .webtoon-passage {
        font-size: 1.15rem; line-height: 1.85; color: #f1f5f9; font-weight: 500;
        word-break: keep-all; letter-spacing: -0.2px;
    }
    .webtoon-passage b {
        color: #f472b6; font-weight: 800; text-shadow: 0 0 1px rgba(244, 114, 182, 0.4);
    }
    .webtoon-dialogue {
        background: rgba(236, 72, 153, 0.1); border-left: 4px solid #ec4899;
        padding: 10px 14px; border-radius: 0 10px 10px 0; color: #fdf2f8;
        font-style: italic; margin: 4px 0;
    }
    .webtoon-ref-badge {
        display: inline-flex; align-items: center; gap: 6px; font-size: 0.85rem;
        color: #f472b6; background: rgba(236, 72, 153, 0.15); padding: 4px 10px;
        border-radius: 8px; align-self: flex-start; margin-top: 4px; font-weight: bold;
    }
    .webtoon-footer {
        padding: 12px 20px; background: #0f172a; display: flex;
        justify-content: flex-end; align-items: center; border-top: 1px solid #334155;
    }
    .btn-card-read {
        padding: 6px 14px; border-radius: 10px; border: 1px solid #475569;
        background: #1e293b; color: #cbd5e1; font-family: 'Jua', sans-serif;
        font-size: 0.9rem; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
    }
    .btn-card-read:hover { background: #334155; color: #fff; }

    @media (max-width: 640px) {
        .top-bar { padding: 8px 12px; }
        .story-title { font-size: 1rem; }
        .book-spread-img { max-height: 60vh; }
        .ebook-controls { justify-content: center; gap: 8px; }
        .btn-page-nav { padding: 8px 14px; font-size: 0.95rem; }
        .webtoon-passage { font-size: 1.05rem; line-height: 1.75; }
    }
</style>
</head>
<body>

<div class="top-bar">
    <div class="top-left">
        <a href="korean.html" class="btn-back">🚪 국어방 대기실</a>
        <div class="story-title">
            <span>📻</span>

        </div>
    </div>
    
    <div class="view-mode-tabs">
        <button id="tabEbook" class="tab-btn active" onclick="setViewerMode('ebook')">📖 책 넘김</button>
        <button id="tabWebtoon" class="tab-btn" onclick="setViewerMode('webtoon')">📜 웹툰 스크롤</button>
    </div>
</div>

<!-- ==========================================
     1. 📖 E-Book 책 넘김 뷰어
     ========================================== -->
<div class="ebook-container" id="ebookView">

    <div class="ebook-controls">

                </button>
                <label class="auto-read-label">
                    <input type="checkbox" id="autoPlayCheckbox" checked>
                    <span>자동 넘김</span>
                </label>
            </div>
        </div>

        <button id="nextBtn" class="btn-page-nav btn-next" onclick="navigatePage(1)">다음 장 ▶</button>
    </div>
</div>

<!-- ==========================================
     2. 📜 웹툰 스크롤 뷰어
     ========================================= -->
<div class="webtoon-container" id="webtoonView">
    <div class="webtoon-sticky-bar">
        <div style="font-family:'Jua', sans-serif; font-size:1.05rem; color:#f472b6;">

        </button>
    </div>

    <div id="webtoonCardsList" style="display:flex; flex-direction:column; gap:28px;"></div>
</div>

    let currentMode = 'ebook';
    let currentPageIndex = 0;
    let isPlaying = false;
    let isContinuousPlaying = false;

    // 🔊 WebSpeech 구연동화 TTS 엔진
    function speakText(text, onEndCallback) {
        window.speechSynthesis.cancel();
        if (!text) {
            if (onEndCallback) onEndCallback();
            return;
        }

        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'ko-KR';
        utterance.rate = 0.95; // 어린이를 위한 친절하고 또박또박한 속도
        utterance.pitch = 1.15; // 다정하고 밝은 톤

        utterance.onend = () => {
            if (onEndCallback) onEndCallback();
        };
        utterance.onerror = () => {
            if (onEndCallback) onEndCallback();
        };

        window.speechSynthesis.speak(utterance);
    }

    function stopSpeaking() {
        window.speechSynthesis.cancel();
        isPlaying = false;
        isContinuousPlaying = false;
        updateEbookAudioUI(false);
        updateContinuousUI(false);
    }

    function setViewerMode(mode) {
        currentMode = mode;
        stopSpeaking();

        if (mode === 'ebook') {
            document.getElementById('tabEbook').classList.add('active');
            document.getElementById('tabWebtoon').classList.remove('active');
            document.getElementById('ebookView').style.display = 'flex';
            document.getElementById('webtoonView').style.display = 'none';
            renderEbook();
        } else {
            document.getElementById('tabWebtoon').classList.add('active');
            document.getElementById('tabEbook').classList.remove('active');
            document.getElementById('ebookView').style.display = 'none';
            document.getElementById('webtoonView').style.display = 'flex';
            renderWebtoonList();
        }
    }

    function renderEbook() {
        const item = STORY_DATA[currentPageIndex];
        const img = document.getElementById('ebookImg');
        img.src = `${item.img}?v=20260902_1`;
        document.getElementById('pageIndicator').textContent = `${item.page} / ${STORY_DATA.length} 쪽`;

        document.getElementById('prevBtn').disabled = (currentPageIndex === 0);
        document.getElementById('nextBtn').textContent = (currentPageIndex === STORY_DATA.length - 1) ? '🎉 처음으로' : '다음 장 ▶';

        stopSpeaking();

        const autoPlay = document.getElementById('autoPlayCheckbox').checked;
        if (autoPlay) {
            setTimeout(() => {
                playCurrentEbookPageAudio();
            }, 300);
        }
    }

    function navigatePage(direction) {
        if (direction === 1) {
            if (currentPageIndex >= STORY_DATA.length - 1) {
                currentPageIndex = 0;
            } else {
                currentPageIndex++;
            }
        } else {
            if (currentPageIndex > 0) {
                currentPageIndex--;
            }
        }
        renderEbook();
    }

    function updateEbookAudioUI(playing) {
        isPlaying = playing;
        const btn = document.getElementById('playBtn');
        const icon = document.getElementById('playIcon');
        const text = document.getElementById('playText');
        if (!btn) return;
        if (playing) {
            btn.classList.add('playing');
            icon.textContent = '⏹️';
            text.textContent = '낭독 중지';
        } else {
            btn.classList.remove('playing');
            icon.textContent = '🔊';
            text.textContent = '동화 듣기';
        }
    }

    function playCurrentEbookPageAudio() {
        const item = STORY_DATA[currentPageIndex];
        updateEbookAudioUI(true);
        speakText(item.readText, () => {
            updateEbookAudioUI(false);
            const autoPlay = document.getElementById('autoPlayCheckbox').checked;
            if (autoPlay && currentMode === 'ebook') {
                if (currentPageIndex < STORY_DATA.length - 1) {
                    setTimeout(() => navigatePage(1), 1200);
                }
            }
        });
    }

    function togglePlayAudio() {
        if (isPlaying) {
            stopSpeaking();
        } else {
            playCurrentEbookPageAudio();
        }
    }

    // ==========================================
    // 📜 웹툰 모드 렌더링
    // ==========================================
    function renderWebtoonList() {
        const container = document.getElementById('webtoonCardsList');
        container.innerHTML = STORY_DATA.map((item, idx) => `
            <div class="webtoon-card" id="webtoonCard_${idx}">
                <div class="webtoon-header">
                    <div class="webtoon-tag">${item.tag}</div>
                    <button class="btn-card-read" onclick="playWebtoonCardAudio(${idx})">
                        🔊 이 장면 듣기
                    </button>
                </div>
                <img class="webtoon-img" src="${item.img}?v=20260902_1" alt="${item.tag}">
                <div class="webtoon-body">
                    ${item.textHtml}
                </div>
            </div>
        `).join('');
    }

    function playWebtoonCardAudio(idx) {
        stopSpeaking();
        const item = STORY_DATA[idx];
        const card = document.getElementById(`webtoonCard_${idx}`);
        if (card) {
            card.scrollIntoView({ behavior: 'smooth', block: 'center' });
            card.style.borderColor = '#ec4899';
            setTimeout(() => { card.style.borderColor = '#334155'; }, 3000);
        }
        speakText(item.readText, () => {});
    }

    function updateContinuousUI(playing) {
        isContinuousPlaying = playing;
        const btn = document.getElementById('continuousPlayBtn');
        const icon = document.getElementById('continuousIcon');
        const text = document.getElementById('continuousText');
        if (!btn) return;
        if (playing) {
            btn.classList.add('playing');
            icon.textContent = '⏹️';
            text.textContent = '연속 낭독 중지';
        } else {
            btn.classList.remove('playing');
            icon.textContent = '▶';
            text.textContent = '처음부터 연속 낭독';
        }
    }

    function toggleContinuousPlay() {
        if (isContinuousPlaying) {
            stopSpeaking();
        } else {
            updateContinuousUI(true);
            playContinuousFrom(0);
        }
    }

    function playContinuousFrom(idx) {
        if (idx >= STORY_DATA.length || !isContinuousPlaying) {
            updateContinuousUI(false);
            return;
        }

        const item = STORY_DATA[idx];
        const card = document.getElementById(`webtoonCard_${idx}`);
        if (card) {
            card.scrollIntoView({ behavior: 'smooth', block: 'center' });
            card.style.borderColor = '#ec4899';
        }

        speakText(item.readText, () => {
            if (card) card.style.borderColor = '#334155';
            if (isContinuousPlaying) {
                setTimeout(() => playContinuousFrom(idx + 1), 1000);
            }
        });
    }

    document.addEventListener('DOMContentLoaded', () => {
        renderEbook();
    });
</script>
