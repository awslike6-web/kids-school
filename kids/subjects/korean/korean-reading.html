<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>민민이네 국어 멀티버스: 독해 아카데미</title>
    <style>
        :root {
            --dark-bg: #0d1117;
            --panel-bg: #161b22;
            --border-line: #30363d;
            --text-normal: #c9d1d9;
            --neon-accent: #58a6ff;
            --mint-success: #26a69a;
            --danger-red: #ff073a;
        }

        body {
            margin: 0; padding: 0;
            background-color: var(--dark-bg);
            color: var(--text-normal);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex; flex-direction: column; align-items: center; min-height: 100vh;
            box-sizing: border-box; padding: 15px;
        }

        .container {
            width: 100%; max-width: 550px;
            background-color: var(--panel-bg);
            border: 2px solid var(--border-line);
            border-radius: 16px; padding: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            box-sizing: border-box;
        }

        h2 { text-align: center; color: var(--neon-accent); margin-top: 0; font-size: 1.3rem; }
        .status-header { text-align: center; font-size: 0.9rem; font-weight: bold; padding: 6px; background-color: #0d1117; border-radius: 6px; margin-bottom: 20px; color: #8b949e; }

        .puzzle-pool { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; }
        .puzzle-block { padding: 12px; background: #21262d; border: 1px solid var(--border-line); border-radius: 8px; cursor: pointer; font-size: 0.9rem; transition: 0.2s; text-align: left; }
        .puzzle-block.selected { opacity: 0.4; border-color: var(--neon-accent); background: #0d1117; }
        .puzzle-slots { padding: 12px; background: #0d1117; border-radius: 8px; min-height: 20px; font-weight: bold; color: var(--neon-accent); margin-bottom: 15px; font-size: 0.9rem; }

        .passage-box { padding: 18px; background: #0d1117; border-radius: 10px; line-height: 1.7; margin-bottom: 20px; font-size: 1rem; border-left: 4px solid var(--neon-accent); word-break: keep-all; }
        .blank-indicator { color: var(--danger-red); font-weight: bold; background: rgba(255,7,58,0.1); padding: 2px 6px; border-radius: 4px; }

        .btn-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 10px; }
        .btn-grid-vertical { display: flex; flex-direction: column; gap: 12px; }
        .opt-btn { padding: 14px; background: #21262d; border: 1px solid var(--border-line); color: var(--text-normal); border-radius: 8px; font-weight: bold; cursor: pointer; text-align: left; font-size: 0.95rem; }
        .opt-btn:active { background: var(--border-line); }

        .card-stack { display: flex; flex-direction: column; gap: 12px; }
        .lesson-card { padding: 16px; background: linear-gradient(135deg, #1f2937, #111827); border: 2px solid #374151; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 0.95rem; line-height: 1.4; transition: 0.2s; }
        .lesson-card:hover { border-color: var(--mint-success); }

        .chat-box { height: 260px; overflow-y: auto; background: #0d1117; border: 1px solid var(--border-line); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; }
        .chat-msg { max-width: 85%; padding: 10px 12px; border-radius: 8px; font-size: 0.9rem; line-height: 1.4; word-break: break-all; }
        .chat-msg.ai { background: #21262d; align-self: flex-start; border-left: 3px solid var(--neon-accent); }
        .chat-msg.user { background: #1f6feb; color: white; align-self: flex-end; }
        .chat-input-area { display: flex; gap: 8px; margin-bottom: 15px; }
        textarea { flex: 1; height: 44px; background: #0d1117; color: var(--text-normal); border: 1px solid var(--border-line); border-radius: 6px; padding: 8px; resize: none; font-size: 0.9rem; }
        
        .action-btn, .send-btn { background: var(--neon-accent); color: #0d1117; border: none; padding: 10px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .send-btn { height: 44px; }
        .exit-gate-btn { width: 100%; padding: 15px; background: linear-gradient(45deg, #238636, #2ea44f); color: white; border: none; border-radius: 10px; font-size: 1.1rem; font-weight: bold; cursor: pointer; box-shadow: 0 0 15px rgba(46,164,79,0.4); margin-top: 10px; }
        .start-gate { padding: 12px; width: 100%; background: var(--neon-accent); border: none; border-radius: 8px; font-weight: bold; font-size: 1.1rem; cursor: pointer; margin-top: 15px; color:#0d1117; }
    </style>
</head>
<body>

<button style="position: fixed; top: 15px; right: 15px; background: #21262d; border: 1px solid #30363d; color: #c9d1d9; padding: 10px 15px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 0.95rem; z-index: 1000; box-shadow: 0 4px 6px rgba(0,0,0,0.3);" 
onclick="if(confirm('🚨 경고: 지금 나가면 지금까지 푼 내용이 사라지고 보상을 받을 수 없어요! 😢\n\n정말 메인 로비로 돌아갈까요?')) location.href='../../../lobby.html'">
🏠 로비로 나가기
</button>

<div id="start-overlay" style="position: fixed; top:0; left:0; width:100vw; height:100vh; background: rgba(13,17,23,0.96); z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center;">
    <h2 style="font-size: 1.8rem;">📖 정밀 지문독해 멀티버스</h2>
    <p style="color: #8b949e; margin-bottom: 20px;">문단 순서부터 차근차근 결합 코드를 해제하세요.</p>
    <button class="start-gate" style="width:auto; padding:15px 40px;" onclick="window.unlockAudioAndStart()">독해 학습방 진입하기</button>
</div>

<div class="container">
    <h2>🚀 전 과목 통합 연동: 국어 독해실</h2>
    <div class="status-header" id="stage-indicator">인프라 동기화 대기 중...</div>
    
    <div id="game-zone"></div>
</div>

<script src="../../config.js"></script>

<script src="../../core/notion-helper.js"></script>
<script src="../../core/korean_common.js"></script>

<script src="../../data/korean-reading-data.js"></script>

<script src="../../core/korean-reading-logic.js"></script>
   <script src="../../core/fairy-config.js?v=1"></script>
<script src="../../core/fairy-engine.js?v=1"></script>


<script>
    // 1. 방 시동 함수 (사용자가 터치하면 실행)
    window.unlockAudioAndStart = function() {
        document.getElementById('start-overlay').style.display = 'none';
        window.speechSynthesis.speak(new SpeechSynthesisUtterance(''));
        
        // 독해방 전용 유니버스 실행
        if (typeof initKoreanUniverse === 'function') {
            initKoreanUniverse();
        } else {
            console.error("오류: initKoreanUniverse가 정의되지 않았습니다.");
        }
    };

    // 2. 요정 엔진 호출 (페이지가 준비되면 자동으로 실행)
    window.addEventListener('DOMContentLoaded', () => {
        // 요정이 준비되었는지 확인 후 시동
        if (typeof initFairyChat === 'function') {
            initFairyChat('KOREAN');
            console.log("요정 엔진 시동 완료!");
        } else {
            console.error("요정 엔진이 아직 로드되지 않았습니다.");
        }
    });
</script>
</body>
</html>
