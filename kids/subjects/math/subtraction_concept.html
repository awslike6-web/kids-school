<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>➖ 뺄셈 개념 탐험대</title>
  <link rel="stylesheet" href="../../css/math_factors.css">
  <link rel="stylesheet" href="arithmetic_cpa.css">
</head>
<body data-operation="subtract">
  <canvas id="confetti-canvas"></canvas>
  <div class="top-bar"><div class="profile-badge"><span id="userIcon">👧</span> <span id="userName">민서 대원</span></div>
    <div><button class="exit-btn" id="ttsToggleBtn" onclick="toggleFairyTtsSetting()">🔊 요정 음성</button> <a class="exit-btn" href="math.html">🔙 수학 탐험 본부</a></div></div>
  <main class="cpa-app">
    <header class="cpa-intro"><h1>➖ 구슬을 가르는 뺄셈 탐험대</h1><p>손으로 옮기고, 그림으로 보고, 식으로 말해요.</p></header>
    <nav class="cpa-nav" aria-label="뺄셈 활동">
      <button data-panel="panel-ten" aria-pressed="false">🔵 10에서 빼기</button><button data-panel="panel-strategy" aria-pressed="true">⚖️ 두 방법 비교</button>
      <button data-panel="panel-train" aria-pressed="false">🚂 세 수 기차</button><button data-panel="panel-partner" aria-pressed="false">🎈 짝꿍 풍선</button>
      <button data-panel="panel-quiz" aria-pressed="false">🎯 개념 퀴즈</button>
    </nav>
    <section id="panel-ten" class="cpa-panel" hidden><h2>10개에서 쏙 빼기</h2><p>덜어 낼 구슬 수를 고르고 남은 구슬을 세어 봐요.</p>
      <div id="ten-options" class="cpa-actions"></div><div class="cpa-frame" id="sub-ten-frame"></div><p class="cpa-formula" id="sub-frame-formula"></p><p id="sub-frame-sub-formula" class="cpa-guide"></p><button id="ten-read">🔊 설명 듣기</button></section>
    <section id="panel-strategy" class="cpa-panel"><h2>어디에서 먼저 빼 볼까요?</h2>
      <div class="cpa-actions" id="sub10-preset-buttons"><label>처음 수 <select id="lesson-a"></select></label><span>−</span><label>빼는 수 <select id="lesson-b"></select></label><button id="strategy-new">🎲 새 뺄셈식</button></div>
      <div class="cpa-actions"><button data-strategy="ones" aria-pressed="true">방법 A · 낱개부터 빼기</button><button data-strategy="ten" aria-pressed="false">방법 B · 10묶음부터 빼기</button></div>
      <div class="cpa-formula" id="sub10-equation-view" aria-live="polite"></div>
      <div class="cpa-frame-pair"><div class="cpa-frame-group"><h3>10묶음에서 시작한 판 · <span id="left-count"></span></h3><div class="cpa-frame" id="sub10-left"></div></div>
        <div class="cpa-frame-group"><h3>낱개에서 시작한 판 · <span id="right-count"></span></h3><div class="cpa-frame" id="sub10-right"></div></div></div>
      <p id="removed-count"></p><div class="cpa-removed" id="sub10-removed"></div>
      <p class="cpa-guide" id="sub10-step-guide" aria-live="polite"></p>
      <div class="cpa-actions"><button class="primary" id="strategy-step">1단계 · 구슬 옮기기</button><button id="strategy-reset">처음부터</button><button id="strategy-read">🔊 설명 듣기</button></div>
      <details><summary>두 가지 방법 나란히 보기</summary><p class="cpa-guide" id="strategy-comparison"></p></details>
    </section>
    <section id="panel-train" class="cpa-panel" hidden><h2>🚂 세 수의 뺄셈 기차</h2><p>앞의 두 수를 먼저 계산하고, 그 결과에 마지막 수를 계산해요.</p>
      <div class="cpa-formula" id="train-equation"></div><div class="cpa-train" id="train-cars"></div><p id="train-guide" class="cpa-guide" aria-live="polite"></p>
      <div class="cpa-actions"><button id="train-step" class="primary">1단계</button><button id="train-reset">다시 출발</button><button id="train-new">새 기차</button><button id="train-read">🔊 설명 듣기</button></div></section>
    <section id="panel-partner" class="cpa-panel" hidden><h2>🎈 10의 짝꿍 풍선 팡!</h2><p>1부터 9까지 숫자 주사위를 굴리고, 10을 만드는 짝꿍을 찾아요.</p>
      <div id="partner-dice" class="cpa-partner-dice"></div><div class="cpa-frame" id="partner-frame"></div><p class="cpa-formula" id="partner-formula"></p><div class="cpa-actions" id="partner-choices"></div>
      <p class="cpa-guide" id="partner-feedback" aria-live="polite"></p><div class="cpa-actions"><button id="partner-roll">🎲 다시 굴리기</button><button id="partner-read">🔊 설명 듣기</button></div></section>

    <section id="panel-quiz" class="cpa-panel" hidden><h2>🎯 뺄셈 개념 퀴즈</h2><p class="cpa-formula" id="quiz-question"></p><div id="quiz-choices" class="cpa-actions"></div><p id="quiz-feedback" class="cpa-guide" aria-live="polite"></p><button id="quiz-next">다음 문제</button></section>
  </main>
  <script src="../../config.js"></script><script src="../../core/core.js"></script><script src="../../core/notion-helper.js"></script>
  <script src="../../core/fairy-config.js"></script><script src="../../core/fairy-tts.js?v=20261028-tts"></script>
  <script src="../../core/fairy-settings-catalog.js"></script>
  <script src="../../core/fairy-engine.js?v=20261028-tts"></script><script src="../../core/fairy-chatbot.js"></script>
  <script src="js/math_quiz_engine.js"></script><script src="js/arithmetic_cpa.js"></script><script src="js/arithmetic_lessons.js"></script>
</body>
</html>
