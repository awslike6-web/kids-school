<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>민민 연산 멀티 스튜디오 🧮 | 민민 수학 멀티버스</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Nanum+Gothic:wght@400;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/design-system.css">
<link rel="stylesheet" href="../../css/math_operator_studio.css?v=20261031-split">
</head>
<body>

<div class="studio-container">
  
  <!-- 상단 내비게이션 바 -->
  <div class="top-action-bar">
    <div class="nav-group">
      <a href="math.html" class="action-btn">🔙 수학 탐험 본부</a>
      <a href="math_storybook_library.html" class="action-btn">📚 동화 도서관</a>
    </div>
    <div class="nav-group">
      <button class="action-btn" id="ttsToggleBtn" onclick="toggleFairyTtsSetting()">🔊 요정 음성 ON</button>
      <div class="action-btn" id="userProfileTag" style="border-color: var(--primary); color: #38bdf8;">🚀 [민수] 5학년 모드</div>
    </div>
  </div>

  <!-- 히어로 배너 -->
  <div class="hero-banner">
    <span class="hero-badge">✨ 시각화 & 음성 튜터링 인터랙티브 스튜디오</span>
    <h1 class="hero-title">민민 연산 멀티 스튜디오</h1>
    <p class="hero-desc">
      어떤 문제든 직접 입력해 보세요! 10개 묶음 블록 쪼개기, 단계별 세로셈, 수직선, 면적 분할로 연산의 비밀을 시원하게 밝혀드립니다.
    </p>
  </div>

  <!-- 1. 사칙연산 선택 탭 -->
  <div class="op-tabs-container">
    <button class="op-tab-btn active" onclick="switchOperation('div', this)">➗ 나눗셈 (집중 특화)</button>
    <button class="op-tab-btn" onclick="switchOperation('mul', this)">✖️ 곱셈 (넓이 모델)</button>
    <button class="op-tab-btn" onclick="switchOperation('add', this)">➕ 덧셈 (모으기)</button>
    <button class="op-tab-btn" onclick="switchOperation('sub', this)">➖ 뺄셈 (가르기)</button>
  </div>

  <!-- 2. 수식 직접 입력 카드 -->
  <div class="input-card">
    <div class="input-row">
      <input type="number" id="numA" class="num-input" value="74" min="1" max="999" aria-label="나누어지는 수">
      <span class="op-sign" id="opSymbol">÷</span>
      <input type="number" id="numB" class="num-input" value="6" min="1" max="99" aria-label="나누는 수">
      <button class="btn-submit-calc" onclick="startStudioCalculation(true)">🚀 스튜디오 탐구 시작!</button>
    </div>

    <!-- 추천 프리셋 칩스 -->
    <div class="preset-row">
      <span class="preset-label">💡 민수 맞춤 추천 문제:</span>
      <button class="preset-btn" onclick="loadPreset(74, 6)">74 ÷ 6 (나머지 2)</button>
      <button class="preset-btn" onclick="loadPreset(85, 4)">85 ÷ 4 (나머지 1)</button>
      <button class="preset-btn" onclick="loadPreset(92, 3)">92 ÷ 3 (나머지 2)</button>
      <button class="preset-btn" onclick="loadPreset(48, 4)">48 ÷ 4 (딱 떨어짐)</button>
      <button class="preset-btn" onclick="loadPreset(56, 8)">56 ÷ 8 (구구단 한자리)</button>
      <button class="preset-btn" onclick="loadPreset(35, 5)">35 ÷ 5 (구구단 5단)</button>
    </div>
  </div>

  <!-- 3. 다차원 시각화 4대 표현 탭 -->
  <div class="view-tabs-container">
    <button class="view-tab-btn active" onclick="switchViewTab('blocks', this)">🧱 십진 블록 분배관</button>
    <button class="view-tab-btn" onclick="switchViewTab('vertical', this)">📝 단계별 세로셈 튜터</button>
    <button class="view-tab-btn" onclick="switchViewTab('numberline', this)">📏 수직선 덜어내기</button>
    <button class="view-tab-btn" onclick="switchViewTab('area', this)">🍫 면적(넓이) 모델</button>
  </div>

  <!-- 4. 스튜디오 뷰포트 (선택된 탭 렌더링) -->
  <div class="studio-viewport" id="studioViewport">
    <!-- 동적으로 렌더링 -->
  </div>

  <!-- 5. 요정 코코 음성 해설 도크 -->
  <div class="fairy-dock">
    <img src="https://img.icons8.com/illustrations/external-pack-flat-linear-illy-cafe/512/external-fairy-fairy-tale-pack-flat-linear-illy-cafe.png" alt="요정 코코" class="fairy-avatar">
    <div class="fairy-content">
      <div class="fairy-name">🧚 요정 코코의 나긋나긋 해설</div>
      <div class="fairy-speech-text" id="fairySpeechText">
        문제를 입력하고 탐구 시작을 누르면, 코코가 단계별로 친절하게 설명해줄게요!
      </div>
    </div>
    <button class="btn-replay-voice" onclick="replayCurrentVoice()">🔊 다시 듣기</button>
  </div>

</div>

<!-- 코어 및 오디오 엔진 로드 -->
<script src="../../config.js"></script>
<script src="../../core/core.js"></script>
<script src="../../core/notion-helper.js"></script>
<script src="../../core/fairy-config.js"></script>
<script src="../../core/fairy-tts.js?v=20261028-tts"></script>
<script src="../../core/fairy-settings-catalog.js"></script>
<script src="../../core/fairy-engine.js?v=20261028-coco"></script>
<script src="../../core/fairy-chatbot.js"></script>

<script src="./js/math_operator_studio-core.js?v=20261031-split"></script>
<script src="./js/math_operator_studio-main.js?v=20261031-split"></script>

</body>
</html>
