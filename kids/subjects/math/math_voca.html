<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🔤 수학 문장제 지시어 번역소 ➔ 🧮 | 민민 수학 멀티버스</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@700&family=Jua&family=Nanum+Gothic:wght@400;700;800&family=Noto+Sans+KR:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/math_style.css">
  <link rel="stylesheet" href="../../css/design-system.css">
  <style>
    :root {
      --primary: #00d4ff;
      --primary-dark: #0284c7;
      --accent: #ff6b9d;
      --yellow: #ffd93d;
      --green: #6bcb77;
      --card-bg: rgba(30, 30, 50, 0.9);
      --border-color: #3a3a5a;
    }

    body {
      font-family: 'Nanum Gothic', sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      color: #ffffff;
      user-select: none;
    }

    body.theme--arcade {
      background: #12121e;
      --card-bg: rgba(30, 30, 50, 0.9);
      --border-color: #3a3a5a;
      color: #ffffff;
    }

    body.theme--slime {
      background: #fff3f5;
      --card-bg: rgba(255, 255, 255, 0.95);
      --border-color: #ffb3c6;
      color: #334155;
    }

    .translator-wrap {
      max-width: 820px;
      margin: 0 auto;
      padding: 20px 16px 80px;
    }

    /* 상단 탑바 */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .profile-badge {
      background: rgba(0, 212, 255, 0.12);
      border: 2px solid var(--primary);
      color: var(--primary);
      padding: 6px 16px;
      border-radius: 30px;
      font-family: 'Jua', sans-serif;
      font-size: 1.1rem;
    }
    .btn-exit {
      background: rgba(255,255,255,0.08);
      border: 2px solid #64748b;
      color: #e2e8f0;
      padding: 6px 16px;
      border-radius: 30px;
      font-family: 'Jua', sans-serif;
      font-size: 1rem;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s;
    }
    .btn-exit:hover {
      background: rgba(239, 68, 68, 0.2);
      border-color: #ef4444;
      color: #ef4444;
    }

    /* 메인 타이틀 */
    .header-banner {
      text-align: center;
      margin-bottom: 20px;
    }
    .main-logo-title {
      font-family: 'Jua', sans-serif;
      font-size: 2.2rem;
      background: linear-gradient(135deg, #00d4ff, #c77dff, #ff6b9d);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }
    .main-sub-title {
      color: #94a3b8;
      font-size: 1rem;
      word-break: keep-all;
    }

    /* 5단계 세분화 레벨 선택 탭 바 */
    .level-tab-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 20px;
    }
    @media (max-width: 720px) {
      .level-tab-bar { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 480px) {
      .level-tab-bar { grid-template-columns: 1fr; }
    }
    .level-tab-btn {
      background: rgba(255,255,255,0.05);
      border: 2px solid var(--border-color);
      border-radius: 16px;
      padding: 10px 8px;
      font-family: 'Jua', sans-serif;
      font-size: 0.95rem;
      color: #94a3b8;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }
    body.theme--slime .level-tab-btn {
      background: #ffffff;
      color: #64748b;
    }
    .level-tab-btn:hover {
      border-color: var(--primary);
      color: #ffffff;
      transform: translateY(-2px);
    }
    body.theme--slime .level-tab-btn:hover {
      color: #0284c7;
    }
    .level-tab-btn.active {
      background: linear-gradient(135deg, rgba(0, 212, 255, 0.2), rgba(199, 125, 255, 0.2));
      border-color: var(--primary);
      color: var(--yellow);
      font-weight: bold;
      box-shadow: 0 4px 14px rgba(0, 212, 255, 0.25);
      transform: scale(1.02);
    }
    body.theme--slime .level-tab-btn.active {
      background: linear-gradient(135deg, #e0f2fe, #fce7f3);
      border-color: #0284c7;
      color: #0284c7;
    }
    .level-sub-desc {
      font-size: 0.75rem;
      color: #64748b;
      font-weight: normal;
    }
    .level-tab-btn.active .level-sub-desc {
      color: #93c5fd;
    }
    body.theme--slime .level-tab-btn.active .level-sub-desc {
      color: #0369a1;
    }

    /* 퀴즈 메타 바 (진행률 & 점수) */
    .quiz-status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      font-family: 'Jua', sans-serif;
      color: #94a3b8;
    }
    .score-chip {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #ffffff;
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 0.95rem;
      box-shadow: 0 3px 8px rgba(245, 158, 11, 0.3);
    }
    .progress-bar-bg {
      height: 8px;
      background: rgba(255,255,255,0.1);
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 20px;
    }
    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      width: 0%;
      transition: width 0.3s ease;
      border-radius: 10px;
    }

    /* 문장제 지문 카드 */
    .passage-card {
      background: var(--card-bg);
      border: 3px solid var(--border-color);
      border-radius: 24px;
      padding: 26px 22px;
      margin-bottom: 20px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
      position: relative;
    }
    .passage-badge {
      display: inline-block;
      background: rgba(0, 212, 255, 0.15);
      border: 1.5px solid var(--primary);
      color: var(--primary);
      padding: 4px 14px;
      border-radius: 12px;
      font-family: 'Jua', sans-serif;
      font-size: 0.9rem;
      margin-bottom: 12px;
    }
    .passage-sentence {
      font-family: 'Gaegu', cursive;
      font-size: clamp(1.6rem, 5vw, 2.2rem);
      line-height: 1.5;
      word-break: keep-all;
      margin-bottom: 12px;
    }

    /* 핵심 지시어 하이라이트 */
    .highlight-word {
      background: rgba(255, 217, 61, 0.25);
      border-bottom: 3px solid #ffd93d;
      color: #ffd93d;
      padding: 2px 8px;
      border-radius: 8px;
      font-weight: 800;
      display: inline-block;
      animation: pulseHighlight 2s infinite ease-in-out;
    }
    body.theme--slime .highlight-word {
      background: #fef08a;
      color: #854d0e;
      border-bottom-color: #eab308;
    }
    @keyframes pulseHighlight {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    .passage-prompt {
      font-family: 'Jua', sans-serif;
      font-size: 1.15rem;
      color: #38bdf8;
      margin-top: 6px;
    }
    body.theme--slime .passage-prompt {
      color: #0284c7;
    }

    /* 3지선다 선택지 그리드 */
    .choices-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }
    .choice-card-btn {
      background: rgba(255,255,255,0.06);
      border: 2px solid var(--border-color);
      border-radius: 18px;
      padding: 16px 20px;
      font-family: 'Jua', sans-serif;
      font-size: 1.3rem;
      color: #ffffff;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 14px;
      word-break: keep-all;
    }
    body.theme--slime .choice-card-btn {
      background: #ffffff;
      color: #1e293b;
    }
    .choice-card-btn:hover {
      border-color: var(--primary);
      background: rgba(0, 212, 255, 0.15);
      transform: translateX(6px);
    }
    body.theme--slime .choice-card-btn:hover {
      background: #f0f9ff;
    }
    .choice-num-tag {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: rgba(255,255,255,0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      color: #94a3b8;
      flex-shrink: 0;
    }
    body.theme--slime .choice-num-tag {
      background: #f1f5f9;
      color: #64748b;
    }
    .choice-card-btn.correct {
      background: rgba(16, 185, 129, 0.25) !important;
      border-color: #10b981 !important;
      color: #34d399 !important;
      box-shadow: 0 0 16px rgba(16, 185, 129, 0.3);
    }
    body.theme--slime .choice-card-btn.correct {
      background: #d1fae5 !important;
      color: #047857 !important;
    }
    .choice-card-btn.wrong {
      background: rgba(239, 68, 68, 0.2) !important;
      border-color: #ef4444 !important;
      color: #f87171 !important;
      opacity: 0.75;
    }
    body.theme--slime .choice-card-btn.wrong {
      background: #fee2e2 !important;
      color: #b91c1c !important;
    }

    /* 정답/오답 해설 & 수식 모델 박스 */
    .explain-card {
      background: rgba(16, 185, 129, 0.12);
      border: 2px solid #10b981;
      border-radius: 18px;
      padding: 18px 20px;
      margin-bottom: 20px;
      display: none;
      animation: popIn 0.3s cubic-bezier(0.34,1.56,0.64,1) both;
    }
    body.theme--slime .explain-card {
      background: #f0fdf4;
    }
    .explain-card.show {
      display: block;
    }
    .explain-title {
      font-family: 'Jua', sans-serif;
      font-size: 1.25rem;
      color: #34d399;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    body.theme--slime .explain-title { color: #059669; }
    .explain-body {
      font-size: 1rem;
      color: #e2e8f0;
      line-height: 1.6;
      word-break: keep-all;
    }
    body.theme--slime .explain-body { color: #334155; }
    .explain-formula-box {
      background: rgba(0,0,0,0.3);
      border-radius: 12px;
      padding: 10px 16px;
      margin-top: 10px;
      font-family: 'Jua', sans-serif;
      font-size: 1.35rem;
      color: #ffd93d;
      text-align: center;
    }
    body.theme--slime .explain-formula-box {
      background: #e2e8f0;
      color: #0f172a;
    }

    /* 용어사전 백과 딥링크 버튼 */
    .explain-voca-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 14px;
      width: 100%;
      padding: 11px 16px;
      background: rgba(167, 139, 250, 0.15);
      border: 1.5px solid #a78bfa;
      border-radius: 14px;
      color: #c4b5fd;
      font-family: 'Jua', sans-serif;
      font-size: 1.05rem;
      text-decoration: none;
      transition: all 0.2s;
      cursor: pointer;
      box-sizing: border-box;
    }
    .explain-voca-btn:hover {
      background: rgba(167, 139, 250, 0.3);
      color: #ffffff;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(167, 139, 250, 0.3);
    }
    body.theme--slime .explain-voca-btn {
      background: #f3e8ff;
      border-color: #a855f7;
      color: #7e22ce;
    }

    /* 다음 문제 버튼 */
    .btn-next-question {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      border: none;
      border-radius: 18px;
      font-family: 'Jua', sans-serif;
      font-size: 1.25rem;
      color: #ffffff;
      cursor: pointer;
      display: none;
      box-shadow: 0 6px 18px rgba(0, 212, 255, 0.3);
      transition: all 0.2s;
    }
    .btn-next-question:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0, 212, 255, 0.4);
    }
    .btn-next-question.show {
      display: block;
    }

    /* 세로 분수 스타일 */
    .inline-frac {
      display: inline-flex;
      flex-direction: column;
      vertical-align: middle;
      text-align: center;
      padding: 0 4px;
      font-size: 1.05em;
      line-height: 1.1;
      font-weight: 700;
    }
    .inline-frac .num { display: block; padding-bottom: 2px; }
    .inline-frac .bar {
      display: block;
      border-top: 2px solid currentColor;
      height: 0;
      width: 100%;
      min-width: 16px;
      margin: 2px 0;
      font-size: 0;
    }
    .inline-frac .den { display: block; padding-top: 2px; }

    /* 대분수 */
    .mixed-frac {
      display: inline-flex;
      align-items: center;
      vertical-align: middle;
      gap: 3px;
      font-weight: 700;
    }
    .mixed-frac .whole { font-size: 1.25em; line-height: 1; }

    /* 결과 축하 모달 */
    .result-modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .result-modal-card {
      background: #1e1e32;
      border: 3px solid var(--primary);
      border-radius: 28px;
      max-width: 440px;
      width: 90%;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 212, 255, 0.3);
    }
    body.theme--slime .result-modal-card {
      background: #ffffff;
      border-color: #ff6b9d;
    }
    .modal-trophy { font-size: 4.5rem; margin-bottom: 12px; }
    .modal-title { font-family: 'Jua', sans-serif; font-size: 2rem; color: var(--yellow); margin-bottom: 10px; }
    body.theme--slime .modal-title { color: #b45309; }
    .modal-score { font-size: 1.15rem; color: #cbd5e1; margin-bottom: 20px; line-height: 1.6; }
    body.theme--slime .modal-score { color: #475569; }
    .btn-modal-replay {
      background: linear-gradient(135deg, #10b981, #059669);
      border: none;
      border-radius: 16px;
      padding: 12px 32px;
      font-family: 'Jua', sans-serif;
      font-size: 1.2rem;
      color: #ffffff;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(16, 185, 129, 0.3);
      transition: all 0.2s;
    }
    .btn-modal-replay:hover { transform: translateY(-2px); }

    @keyframes popIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body class="theme--arcade">

<div class="translator-wrap">
  
  <!-- 상단 프로필 및 뒤로가기 -->
  <div class="top-bar">
    <div class="profile-badge" id="profileBadge">접속중: 👨‍🚀 <b>민수</b></div>
    <div style="display: flex; gap: 8px;">
      <button class="btn-exit" id="ttsBtn" onclick="toggleTts()">🔊 음성 켜기</button>
      <a href="math.html" class="btn-exit">🔙 수학 대문</a>
    </div>
  </div>

  <!-- 헤더 배너 -->
  <div class="header-banner">
    <h1 class="main-logo-title">🔤 수학 문장제 지시어 번역소 ➔ 🧮</h1>
    <p class="main-sub-title">문제 속 헷갈리는 우리말 지시어를 사칙연산 기호로 척척 번역해요!</p>
  </div>

  <!-- 5단계 세분화 레벨 선택 탭 바 (6개 탭) -->
  <div class="level-tab-bar">
    <button class="level-tab-btn" id="tab_lvl_0" onclick="switchLevel(0)">
      <span>🟢 1단계 기초 연산</span>
      <span class="level-sub-desc">덧셈·뺄셈 일상말 (초1~2)</span>
    </button>
    <button class="level-tab-btn" id="tab_lvl_1" onclick="switchLevel(1)">
      <span>🔵 2단계 연산·단위</span>
      <span class="level-sub-desc">곱셈·나눗셈·단위 (초3~4)</span>
    </button>
    <button class="level-tab-btn" id="tab_lvl_2" onclick="switchLevel(2)">
      <span>📐 3단계 평면도형</span>
      <span class="level-sub-desc">도형·각도·둘레 (초3~4)</span>
    </button>
    <button class="level-tab-btn active" id="tab_lvl_3" onclick="switchLevel(3)">
      <span>👑 4단계 분수·범위 ⭐</span>
      <span class="level-sub-desc">분수·약수·범위 (초5 실전)</span>
    </button>
    <button class="level-tab-btn" id="tab_lvl_4" onclick="switchLevel(4)">
      <span>🏰 5단계 넓이·입체·비율</span>
      <span class="level-sub-desc">넓이·입체·비율 (초5~6 심화)</span>
    </button>
    <button class="level-tab-btn" id="tab_lvl_5" onclick="switchLevel(5)">
      <span>🌟 마스터 챌린지</span>
      <span class="level-sub-desc">전 단계 통합 10제</span>
    </button>
  </div>

  <!-- 퀴즈 상태 바 -->
  <div class="quiz-status-bar">
    <span id="qProgressText">문제 1 / 10</span>
    <span class="score-chip" id="qScoreBadge">정답 0개</span>
  </div>
  <div class="progress-bar-bg">
    <div class="progress-bar-fill" id="progressBar"></div>
  </div>

  <!-- 문장제 지문 카드 -->
  <div class="passage-card">
    <span class="passage-badge" id="passageStageBadge">👑 4단계: 5학년 분수·약수·범위 실전</span>
    <div class="passage-sentence" id="passageSentence">
      로딩 중...
    </div>
    <div class="passage-prompt">👉 강조된 말은 어떤 계산 기호나 의미로 바꿔야 할까요?</div>
  </div>

  <!-- 3지선다 선택지 리스트 -->
  <div class="choices-grid" id="choicesGrid">
    <!-- 동적 생성 -->
  </div>

  <!-- 피드백 및 코코 번역 해설 블록 -->
  <div class="explain-card" id="explainCard">
    <div class="explain-title" id="explainTitle">💡 코코의 번역 팁</div>
    <div class="explain-body" id="explainBody">해설 내용이 들어갑니다.</div>
    <div class="explain-formula-box" id="explainFormula">수식 모델</div>
    <a id="explainVocaLink" class="explain-voca-btn" href="#" target="_blank" style="display: none;">
      📖 용어사전에서 공식/개념 깊이 보기 ↗
    </a>
  </div>

  <!-- 다음 문제 버튼 -->
  <button class="btn-next-question" id="btnNext" onclick="nextQuestion()">다음 번역 문제로 이동 ➔</button>

</div>

<!-- 결과 축하 모달 -->
<div class="result-modal-backdrop" id="resultModal">
  <div class="result-modal-card">
    <div class="modal-trophy">🏆</div>
    <h2 class="modal-title" id="modalTitle">번역 훈련 완주!</h2>
    <p class="modal-score" id="modalScore">10문제 중 10문제를 정확하게 번역했습니다!<br><b>보석 +5 💎 & 수학 경험치 +15 EXP</b> 획득!</p>
    <button class="btn-modal-replay" onclick="closeResultModal()">한 번 더 도전!</button>
  </div>
</div>

<script src="../../config.js"></script>
<script src="../../core/core.js"></script>
<script src="../../core/notion-helper.js"></script>
<script src="../../core/fairy-config.js"></script>
<script src="../../core/fairy-engine.js"></script>
<script>
// ========================================================
// 📐 정품 세로 분수 HTML 렌더러
// ========================================================
function renderFrac(num, den) {
  return `<span class="inline-frac"><span class="num">${num}</span><span class="bar"></span><span class="den">${den}</span></span>`;
}
function renderMixed(whole, num, den) {
  return `<span class="mixed-frac"><span class="whole">${whole}</span><span class="inline-frac"><span class="num">${num}</span><span class="bar"></span><span class="den">${den}</span></span></span>`;

// 🎮 퀴즈 상태 및 로직
// ========================================================
let currentLevel = 3; // 기본 4단계(초5 분수·약수·범위 실전 ⭐)로 시작
let quizList = [];
let currentQIdx = 0;
let score = 0;
let answered = false;
let isTtsOn = true;

// 노션에서 가져온 데이터 보관
let notionDirectives = [];

async function loadNotionData() {
  try {
    if (typeof fetchVocaFromNotion === 'function') {
      const records = await fetchVocaFromNotion({ subject: '수학' });
      if (records && records.length > 0) {
        console.log(`[노션 연동] 수학 단어 ${records.length}건 로드 성공`);
        records.forEach(r => {
          if (r.detailContext && r.word && r.meaning) {
            notionDirectives.push({
              sentence: r.detailContext.replace(r.word, `<mark class="highlight-word">[ ${r.word} ]</mark>`),
              word: r.word,
              opts: [r.meaning, "기타 의미", "알 수 없음"],
              ans: 0,
              tip: r.hint || r.meaning,
              formula: r.word
            });
          }
        });
      }
    }
  } catch (e) {
    console.warn("노션 연동 실패 (오프라인 모드 유지):", e);
  }
}

function initLevelQuiz(lvl) {
  currentLevel = lvl;
  currentQIdx = 0;
  score = 0;
  answered = false;

  let pool = [];
  if (lvl === 5) {
    // 🌟 마스터 챌린지 (전 5단계 통합 88문항 + 노션)
    pool = [
      ...DIRECTIVE_BANKS[0],
      ...DIRECTIVE_BANKS[1],
      ...DIRECTIVE_BANKS[2],
      ...DIRECTIVE_BANKS[3],
      ...DIRECTIVE_BANKS[4],
      ...notionDirectives
    ];
  } else {
    pool = [...DIRECTIVE_BANKS[lvl]];
  }

  // 10문제 무작위 셔플 추출
  const shuffled = [...pool].sort(() => Math.random() - 0.5);
  quizList = shuffled.slice(0, Math.min(10, shuffled.length));

  renderQuestion();
}

function renderQuestion() {
  answered = false;
  const qData = quizList[currentQIdx];

  // 진행률 & 점수 업데이트
  document.getElementById('qProgressText').textContent = `문제 ${currentQIdx + 1} / ${quizList.length}`;
  document.getElementById('qScoreBadge').textContent = `정답 ${score}개`;
  const pct = (currentQIdx / quizList.length) * 100;
  document.getElementById('progressBar').style.width = `${pct}%`;

  // 배지 텍스트
  const badgeMap = [
    "🟢 1단계: 초1~2 기초 연산 & 일상 수 감각",
    "🔵 2단계: 초3~4 사칙연산 & 측정 단위",
    "📐 3단계: 초3~4 평면도형 & 각도 마스터",
    "👑 4단계: 초5 분수·소수 & 약수배수·범위 실전 ⭐",
    "🏰 5단계: 초5~6 다각형 넓이 · 입체도형 · 비와 비율",
    "🌟 전 단계 마스터 챌린지 (통합 10제)"
  ];
  document.getElementById('passageStageBadge').textContent = badgeMap[currentLevel];

  // 지문 표시
  document.getElementById('passageSentence').innerHTML = qData.sentence;

  // 선택지 3종 렌더링 (셔플)
  const choicesGrid = document.getElementById('choicesGrid');
  choicesGrid.innerHTML = '';

  const optsWithIdx = qData.opts.map((opt, i) => ({ opt, isAns: i === qData.ans }));
  const shuffledOpts = [...optsWithIdx].sort(() => Math.random() - 0.5);

  shuffledOpts.forEach((item, idx) => {
    const btn = document.createElement('button');
    btn.className = 'choice-card-btn';
    btn.innerHTML = `<span class="choice-num-tag">${idx + 1}</span> <span>${item.opt}</span>`;
    btn.onclick = () => selectChoice(item.isAns, btn, qData);
    choicesGrid.appendChild(btn);
  });

  // 해설 및 다음 버튼 숨김
  const exCard = document.getElementById('explainCard');
  exCard.classList.remove('show');
  document.getElementById('btnNext').classList.remove('show');

  // TTS 음성 출력
  if (isTtsOn && typeof speakFairyTTS === 'function') {
    const cleanSentence = qData.sentence.replace(/<[^>]*>?/gm, '');
    speakFairyTTS(cleanSentence);
  }
}

function selectChoice(isCorrect, selectedBtn, qData) {
  if (answered) return;
  answered = true;

  const exCard = document.getElementById('explainCard');
  const exTitle = document.getElementById('explainTitle');
  const exBody = document.getElementById('explainBody');
  const exFormula = document.getElementById('explainFormula');

  if (isCorrect) {
    score++;
    selectedBtn.classList.add('correct');
    playSfx('correct');
    exTitle.innerHTML = "🎉 완벽한 번역이에요! 참 잘했어요!";
    exTitle.style.color = "#34d399";
    if (isTtsOn && typeof speakFairyTTS === 'function') {
      speakFairyTTS("정답이에요! 참 잘했어요!");
    }
  } else {
    selectedBtn.classList.add('wrong');
    playSfx('wrong');
    exTitle.innerHTML = "💡 코코의 번역 팁";
    exTitle.style.color = "#fbbf24";
    // 정답 버튼도 살짝 표시
    document.querySelectorAll('.choice-card-btn').forEach(btn => {
      if (btn.textContent.includes(qData.opts[qData.ans])) {
        btn.classList.add('correct');
      }
    });
    if (isTtsOn && typeof speakFairyTTS === 'function') {
      speakFairyTTS(qData.tip);
    }
  }

  // 해설 및 수식 채우기
  exBody.innerHTML = qData.tip;
  exFormula.innerHTML = `수식 모델 ➔ <b>${qData.formula}</b>`;

  // 📖 용어사전 백과 딥링크 동적 배선
  const vocaBtn = document.getElementById('explainVocaLink');
  const targetConcept = getMathVocaSearchKeyword(qData);
  if (vocaBtn) {
    if (targetConcept) {
      vocaBtn.href = `../../common_space/voca.html?subject=수학&search=${encodeURIComponent(targetConcept)}`;
      vocaBtn.innerHTML = `📖 [${targetConcept}] 용어사전에서 공식/개념 깊이 보기 ↗`;
      vocaBtn.style.display = 'inline-flex';
    } else {
      vocaBtn.style.display = 'none';
    }
  }

  exCard.classList.add('show');

  // 다음 문제 버튼 오픈
  document.getElementById('btnNext').classList.add('show');
}

// 🧮 문장제 지시어와 매핑되는 용어사전 공식/개념어 탐색 헬퍼
function getMathVocaSearchKeyword(qData) {
  if (!qData || !qData.word) return null;
  const w = qData.word;
  if (w.includes('이상') || w.includes('이하')) return '이상과 이하';
  if (w.includes('초과') || w.includes('미만')) return '초과와 미만';
  if (w.includes('올림') || w.includes('버림')) return '올림과 버림';
  if (w.includes('반올림')) return '반올림';

function nextQuestion() {
  playSfx('click');
  if (currentQIdx < quizList.length - 1) {
    currentQIdx++;
    renderQuestion();
  } else {
    // 10문제 완료
    playSfx('fanfare');
    document.getElementById('progressBar').style.width = '100%';
    showCompletionModal();
  }
}

function showCompletionModal() {
  const modal = document.getElementById('resultModal');
  const title = document.getElementById('modalTitle');
  const scoreTxt = document.getElementById('modalScore');

  // 보상 지급
  let earnedGems = Math.max(1, Math.floor(score / 2));
  if (score >= 8) earnedGems += 2; // 고득점 보너스

  if (typeof addGems === 'function') {
    addGems(earnedGems);
  } else {
    const cur = parseInt(localStorage.getItem('minmin_gems') || '0', 10);
    localStorage.setItem('minmin_gems', (cur + earnedGems).toString());
  }

  title.textContent = score >= 8 ? "🎉 번역 마스터 등극! 🎉" : "✨ 훈련 완주 성공! ✨";
  scoreTxt.innerHTML = `10문제 중 <b>${score}문제</b>를 멋지게 번역했습니다!<br>보석 <b>+${earnedGems} 💎 & 경험치 +15 EXP</b> 획득!`;
  modal.style.display = 'flex';
}

function closeResultModal() {
  playSfx('click');
  document.getElementById('resultModal').style.display = 'none';
  initLevelQuiz(currentLevel);
}

function switchLevel(lvl) {
  playSfx('click');
  document.querySelectorAll('.level-tab-btn').forEach((b, i) => {
    b.classList.toggle('active', i === lvl);
  });
  initLevelQuiz(lvl);
}

function toggleTts() {
  isTtsOn = !isTtsOn;
  const btn = document.getElementById('ttsBtn');
  btn.textContent = isTtsOn ? "🔊 음성 켜기" : "🔇 음성 끄기";
  btn.style.color = isTtsOn ? "#ffffff" : "#94a3b8";
}

// 사운드 엔진
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function playSfx(type) {
  try {
    const ctx = getAudioCtx();
    if (ctx.state === 'suspended') ctx.resume();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    const now = ctx.currentTime;

    if (type === 'correct') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(523.25, now);
      osc.frequency.exponentialRampToValueAtTime(783.99, now + 0.15);
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
      osc.start(now);
      osc.stop(now + 0.3);
    } else if (type === 'wrong') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(240, now);
      osc.frequency.setValueAtTime(180, now + 0.1);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
      osc.start(now);
      osc.stop(now + 0.25);
    } else if (type === 'click') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(880, now);
      gain.gain.setValueAtTime(0.1, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
      osc.start(now);
      osc.stop(now + 0.05);
    } else if (type === 'fanfare') {
      [523.25, 659.25, 783.99, 1046.5].forEach((freq, i) => {
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.connect(g);
        g.connect(ctx.destination);
        o.type = 'triangle';
        o.frequency.setValueAtTime(freq, now + i * 0.1);
        g.gain.setValueAtTime(0.25, now + i * 0.1);
        g.gain.exponentialRampToValueAtTime(0.01, now + i * 0.1 + 0.35);
        o.start(now + i * 0.1);
        o.stop(now + i * 0.1 + 0.35);
      });
    }
  } catch (e) {
    console.warn("Audio error:", e);
  }
}
