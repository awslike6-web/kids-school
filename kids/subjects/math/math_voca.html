  <!-- 헤더 배너 -->

  <!-- 퀴즈 상태 바 -->

<!-- 결과 축하 모달 -->
<div class="result-modal-backdrop" id="resultModal">
  <div class="result-modal-card">
    <div class="modal-trophy">🏆</div>

    <p class="modal-score" id="modalScore">10문제 중 10문제를 정확하게 번역했습니다!<br><b>보석 +5 💎 & 수학 경험치 +15 EXP</b> 획득!</p>
    <button class="btn-modal-replay" onclick="closeResultModal()">한 번 더 도전!</button>

<script src="../../config.js"></script>
<script src="../../core/core.js"></script>
<script src="../../core/notion-helper.js"></script>
<script src="../../core/fairy-config.js"></script>
<script src="../../core/fairy-engine.js"></script>
<script src="../../data/math_voca_data.js"></script>
<script>
// ========================================================
// 📐 정품 세로 분수 HTML 렌더러
// ========================================================
function renderFrac(num, den) {
  return `<span class="inline-frac"><span class="num">${num}</span><span class="bar"></span><span class="den">${den}</span></span>`;
}
function renderMixed(whole, num, den) {
  return `<span class="mixed-frac"><span class="whole">${whole}</span><span class="inline-frac"><span class="num">${num}</span><span class="bar"></span><span class="den">${den}</span></span></span>`;
}

// ========================================================
// 🎮 퀴즈 상태 및 로직
// ========================================================
let currentLevel = 3; // 기본 4단계(초5 분수·약수·범위 실전 ⭐)로 시작
let quizList = [];
let currentQIdx = 0;
let score = 0;
let answered = false;
let isTtsOn = true;

// 💡 [노션 Headless CMS 연동] VOCA_DB 실시간 동기화
async function loadNotionData() {
  try {
    if (typeof fetchVocaFromNotion === 'function') {
      const records = await fetchVocaFromNotion({ subject: '수학' });
      if (records && records.length > 0) {
        console.log(`[노션 연동] 수학 어휘/지시어 ${records.length}건 안전 연동 성공`);
        const banks = window.DIRECTIVE_BANKS || DIRECTIVE_BANKS;
        if (!banks) return;

        // 노션 데이터는 검증된 88제 퀴즈의 보기/문맥을 훼손하지 않고, 팁과 수식 모델 보강에만 안전 반영
        records.forEach(r => {
          if (r.word) {
            for (let lvl = 0; lvl <= 4; lvl++) {
              if (banks[lvl]) {
                const matchItem = banks[lvl].find(x => x.word === r.word || (x.word && r.word && (x.word.includes(r.word) || r.word.includes(x.word))));
                if (matchItem) {
                  if (r.meaning && r.meaning.length > 5) matchItem.tip = r.meaning;
                  if (r.hint && r.hint.length > 0) matchItem.formula = r.hint;
                }
              }
            }
          }
        });
      }
    }
  } catch (e) {
    console.warn("노션 연동 경고 (로컬 캐시로 안전하게 구동):", e);
  }
}

function initLevelQuiz(lvl) {
  currentLevel = lvl;
  currentQIdx = 0;
  score = 0;
  answered = false;

  const banks = window.DIRECTIVE_BANKS || DIRECTIVE_BANKS || {};
  let pool = [];
  if (lvl === 5) {
    // 🌟 마스터 챌린지 (전 5단계 통합 88문항 + 노션)
    pool = [
      ...(banks[0] || []),
      ...(banks[1] || []),
      ...(banks[2] || []),
      ...(banks[3] || []),
      ...(banks[4] || [])
    ];
  } else {
    pool = [...(banks[lvl] || [])];
  }

  // 10문제 무작위 셔플 추출
  const shuffled = [...pool].sort(() => Math.random() - 0.5);
  quizList = shuffled.slice(0, Math.min(10, shuffled.length));

  renderQuestion();
}

function renderQuestion() {
  answered = false;
  const qData = quizList[currentQIdx];
  if (!qData) return;

  // 진행률 & 점수 업데이트
  document.getElementById('qProgressText').textContent = `문제 ${currentQIdx + 1} / ${quizList.length}`;
  document.getElementById('qScoreBadge').textContent = `정답 ${score}개`;
  const pct = (currentQIdx / quizList.length) * 100;
  document.getElementById('progressBar').style.width = `${pct}%`;

  // 배지 텍스트
  const badgeMap = [
    "🟢 1단계: 초1~2 기초 연산 & 일상 수 감각",
    "🔵 2단계: 초3~4 사칙연산 & 측정 단위",
    "📐 3단계: 초3~4 평면도형 & 각도 마스터",
    "👑 4단계: 초5 분수·소수 & 약수배수·범위 실전 ⭐",
    "🏰 5단계: 초5~6 다각형 넓이 · 입체도형 · 비와 비율",
    "🌟 전 단계 마스터 챌린지 (통합 10제)"
  ];
  document.getElementById('passageStageBadge').textContent = badgeMap[currentLevel];

  // 지문 표시
  document.getElementById('passageSentence').innerHTML = qData.sentence;

  // 선택지 3종 렌더링 (셔플)
  const choicesGrid = document.getElementById('choicesGrid');
  choicesGrid.innerHTML = '';

  const optsWithIdx = qData.opts.map((opt, i) => ({ opt, isAns: i === qData.ans }));
  const shuffledOpts = [...optsWithIdx].sort(() => Math.random() - 0.5);

  shuffledOpts.forEach((item, idx) => {
    const btn = document.createElement('button');
    btn.className = 'choice-card-btn';
    btn.innerHTML = `<span class="choice-num-tag">${idx + 1}</span> <span>${item.opt}</span>`;
    btn.onclick = () => selectChoice(item.isAns, btn, qData);
    choicesGrid.appendChild(btn);
  });

  // 해설 및 다음 버튼 숨김
  const exCard = document.getElementById('explainCard');
  exCard.classList.remove('show');
  document.getElementById('btnNext').classList.remove('show');

  // TTS 음성 출력
  if (isTtsOn && typeof speakFairyTTS === 'function') {
    const cleanSentence = qData.sentence.replace(/<[^>]*>?/gm, '');
    speakFairyTTS(cleanSentence);
  }
}

function selectChoice(isCorrect, selectedBtn, qData) {
  if (answered) return;
  answered = true;

  const exCard = document.getElementById('explainCard');
  const exTitle = document.getElementById('explainTitle');
  const exBody = document.getElementById('explainBody');
  const exFormula = document.getElementById('explainFormula');

  if (isCorrect) {
    score++;
    selectedBtn.classList.add('correct');
    playSfx('correct');
    exTitle.innerHTML = "🎉 완벽한 번역이에요! 참 잘했어요!";
    exTitle.style.color = "#34d399";
    if (isTtsOn && typeof speakFairyTTS === 'function') {
      speakFairyTTS("정답이에요! 참 잘했어요!");
    }
  } else {
    selectedBtn.classList.add('wrong');
    playSfx('wrong');
    exTitle.innerHTML = "💡 코코의 번역 팁";
    exTitle.style.color = "#fbbf24";
    // 정답 버튼도 살짝 표시
    document.querySelectorAll('.choice-card-btn').forEach(btn => {
      if (btn.textContent.includes(qData.opts[qData.ans])) {
        btn.classList.add('correct');
      }
    });
    if (isTtsOn && typeof speakFairyTTS === 'function') {
      speakFairyTTS(qData.tip);
    }
  }

  // 해설 및 수식 채우기
  exBody.innerHTML = qData.tip;
  exFormula.innerHTML = `수식 모델 ➔ <b>${qData.formula}</b>`;

  // 📖 용어사전 백과 딥링크 동적 배선
  const vocaBtn = document.getElementById('explainVocaLink');
  const targetConcept = getMathVocaSearchKeyword(qData);
  if (vocaBtn) {
    if (targetConcept) {
      vocaBtn.href = `../../common_space/voca.html?subject=수학&search=${encodeURIComponent(targetConcept)}`;
      vocaBtn.innerHTML = `📖 [${targetConcept}] 용어사전에서 공식/개념 깊이 보기 ↗`;
      vocaBtn.style.display = 'inline-flex';
    } else {
      vocaBtn.style.display = 'none';
    }
  }

  exCard.classList.add('show');

  // 다음 문제 버튼 오픈
  document.getElementById('btnNext').classList.add('show');
}

// 🧮 문장제 지시어와 매핑되는 용어사전 공식/개념어 탐색 헬퍼
function getMathVocaSearchKeyword(qData) {
  if (!qData || !qData.word) return null;
  const w = qData.word;
  if (w.includes('이상') || w.includes('이하')) return '이상과 이하';
  if (w.includes('초과') || w.includes('미만')) return '초과와 미만';
  if (w.includes('올림') || w.includes('버림')) return '올림과 버림';
  if (w.includes('반올림')) return '반올림';
  if (w.includes('분수') && w.includes('곱')) return '분수의 곱셈 공식';
  if (w.includes('전체') && w.includes('몇 분의 몇')) return '전체의 몇 분의 몇';
  if (w.includes('합동')) return '도형의 합동';
  if (w.includes('선대칭')) return '선대칭도형과 대칭축';
  if (w.includes('점대칭')) return '점대칭도형과 대칭의 중심';
  if (w.includes('겨냥도')) return '직육면체의 겨냥도';
  if (w.includes('전개도')) return '직육면체의 전개도';
  if (w.includes('각기둥')) return '각기둥';
  if (w.includes('각뿔')) return '각뿔';
  if (w.includes('기준량') || w.includes('비율') || w.includes('비 (')) return '비와 기준량';
  if (w.includes('평균')) return '평균';
  if (w.includes('들이') || w.includes('1L') || w.includes('mL')) return '들이의 단위';
  if (w.includes('무게') || w.includes('1kg') || w.includes('1t') || w.includes('g')) return '무게의 단위';
  if (w.includes('사칙혼합') || w.includes('계산순서')) return '사칙혼합 계산의 순서';
  if (w.includes('사다리꼴')) return '사다리꼴의 넓이';
  if (w.includes('평행사변형')) return '평행사변형의 넓이';
  if (w.includes('마름모')) return '마름모의 넓이';
  if (w.includes('삼각형') && w.includes('넓이')) return '삼각형의 넓이';
  if (w.includes('직사각형') && w.includes('넓이')) return '직사각형의 넓이';
  if (w.includes('둘레')) return '다각형의 둘레 공식';
  if (w.includes('약수') || w.includes('배수')) return '약수와 배수';
  if (w.includes('기약') || w.includes('통분') || w.includes('약분')) return '약분과 통분';
  if (w.includes('직육면체') || w.includes('정육면체')) return '직육면체 & 정육면체';
  if (w.includes('원주율') || w.includes('원의 넓이')) return '원주율과 원의 넓이';
  if (w.includes('선분') || w.includes('반직선') || w.includes('직선')) return '선분 · 반직선 · 직선 & 각';
  if (w.includes('직각') || w.includes('예각') || w.includes('둔각') || w.includes('평각') || w.includes('각도')) return '예각 · 직각 · 둔각 · 평각';
  if (w.includes('이등변') || w.includes('정삼각형')) return '이등변삼각형 & 정삼각형';
  if (w.includes('나눗셈') || w.includes('검산')) return '나눗셈의 검산 공식';
  if (w.includes('시계') || w.includes('정각') || w.includes('30분')) return '시계 읽기 (시와 분)';
  if (w.includes('상자') || w.includes('원기둥') || w.includes('공 모양')) return '입체도형 3총사';
  if (w.includes('동그라미') || w.includes('세모') || w.includes('네모')) return '평면도형 3총사';
  if (w.includes('가르기') || w.includes('모으기') || w.includes('10개씩 묶음')) return '가르기와 모으기';
  if (w.includes('큰 수') || w.includes('만') || w.includes('억') || w.includes('조')) return '큰 수 (만 · 억 · 조 자릿값)';
  if (w.includes('1km') || w.includes('1m') || w.includes('1cm')) return '길이와 시간의 단위 환산';
  if (w.includes('1분')) return '길이와 시간의 단위 환산';
  return null;
}

function nextQuestion() {
  playSfx('click');
  if (currentQIdx < quizList.length - 1) {
    currentQIdx++;
    renderQuestion();
  } else {
    // 10문제 완료
    playSfx('fanfare');
    document.getElementById('progressBar').style.width = '100%';
    showCompletionModal();
  }
}

function showCompletionModal() {
  const modal = document.getElementById('resultModal');
  const title = document.getElementById('modalTitle');
  const scoreTxt = document.getElementById('modalScore');

  // 보상 지급
  let earnedGems = Math.max(1, Math.floor(score / 2));
  if (score >= 8) earnedGems += 2; // 고득점 보너스

  if (typeof addGems === 'function') {
    addGems(earnedGems);
  } else {
    const cur = parseInt(localStorage.getItem('minmin_gems') || '0', 10);
    localStorage.setItem('minmin_gems', (cur + earnedGems).toString());
  }

  title.textContent = score >= 8 ? "🎉 번역 마스터 등극! 🎉" : "✨ 훈련 완주 성공! ✨";
  scoreTxt.innerHTML = `10문제 중 <b>${score}문제</b>를 멋지게 번역했습니다!<br>보석 <b>+${earnedGems} 💎 & 경험치 +15 EXP</b> 획득!`;
  modal.style.display = 'flex';
}

function closeResultModal() {
  playSfx('click');
  document.getElementById('resultModal').style.display = 'none';
  initLevelQuiz(currentLevel);
}

function switchLevel(lvl) {
  playSfx('click');
  document.querySelectorAll('.level-tab-btn').forEach((b, i) => {
    b.classList.toggle('active', i === lvl);
  });
  initLevelQuiz(lvl);
}

function toggleTts() {
  isTtsOn = !isTtsOn;
  const btn = document.getElementById('ttsBtn');
  btn.textContent = isTtsOn ? "🔊 음성 켜기" : "🔇 음성 끄기";
  btn.style.color = isTtsOn ? "#ffffff" : "#94a3b8";
}

// 사운드 엔진
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function playSfx(type) {
  try {
    const ctx = getAudioCtx();
    if (ctx.state === 'suspended') ctx.resume();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    const now = ctx.currentTime;

    if (type === 'correct') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(523.25, now);
      osc.frequency.exponentialRampToValueAtTime(783.99, now + 0.15);
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
      osc.start(now);
      osc.stop(now + 0.3);
    } else if (type === 'wrong') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(240, now);
      osc.frequency.setValueAtTime(180, now + 0.1);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
      osc.start(now);
      osc.stop(now + 0.25);
    } else if (type === 'click') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(880, now);
      gain.gain.setValueAtTime(0.1, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
      osc.start(now);
      osc.stop(now + 0.05);
    } else if (type === 'fanfare') {
      [523.25, 659.25, 783.99, 1046.5].forEach((freq, i) => {
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.connect(g);
        g.connect(ctx.destination);
        o.type = 'triangle';
        o.frequency.setValueAtTime(freq, now + i * 0.1);
        g.gain.setValueAtTime(0.25, now + i * 0.1);
        g.gain.exponentialRampToValueAtTime(0.01, now + i * 0.1 + 0.35);
        o.start(now + i * 0.1);
        o.stop(now + i * 0.1 + 0.35);
      });
    }
  } catch (e) {
    console.warn("Audio error:", e);
  }
}
