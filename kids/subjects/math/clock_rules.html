<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>⏰ 시계 보기와 규칙 찾기 탐험대 🔍</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@700&family=Jua&family=Nanum+Gothic:wght@400;700;800&family=Noto+Sans+KR:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/math_factors.css">
  <link rel="stylesheet" href="math_play.css">
</head>
<body>

<div class="top-bar"><span id="userName">민서 대원</span><div>
<button class="exit-btn" id="ttsToggleBtn" onclick="toggleFairyTtsSetting()">🔊 요정 음성</button>
<a class="exit-btn" href="math.html">🔙 수학 탐험 본부</a></div></div>
<main class="math-room-container">
<header class="math-header-hero"><h1>⏰ 시계와 규칙 공방</h1><p>직접 돌리고, 이어 만들고, 규칙을 찾아봐요.</p></header>
<section class="play-card"><h2>🕒 긴바늘을 돌려 봐요</h2>
<p>시계 위에서 손가락을 돌리면 짧은바늘도 함께 움직여요. 버튼이나 방향키로도 움직일 수 있어요.</p>
<div class="play-actions"><button id="clock-explore">자유롭게 돌리기</button><button id="clock-quiz">시계 읽기 · 다음 문제</button><button id="clock-read">🔊 설명 듣기</button></div>
<div class="clock-canvas" id="clock-face" tabindex="0" role="group">
<div id="hour-zone"></div><div class="clock-hand-hour" id="hand-hour"></div><div class="clock-hand-minute" id="hand-minute"></div><div class="clock-center-pin"></div></div>
<div id="clock-controls" class="play-actions"></div><div id="clock-digital-display"></div>
<p id="clock-rule-desc" class="play-feedback"></p><div id="clock-choices" class="play-actions"></div><p id="clock-feedback" aria-live="polite"></p>
</section>
<section class="play-card"><h2>📿 나만의 규칙 기차 · 팔찌</h2>
<p>구슬을 눌러 순서대로 이어 보세요. 코코가 다음 구슬을 예상해 볼게요!</p>
<label>구슬 종류 <select id="bead-family"><option value="fruit">과일</option><option value="color">색깔</option><option value="shape">모양</option></select></label>
<label>작품 <select id="bead-layout"><option value="train">규칙 기차</option><option value="bracelet">규칙 팔찌</option></select></label>
<div id="bead-palette" class="play-actions"></div><div id="bead-row" aria-label="내가 만든 구슬 배열"></div>
<div class="play-actions"><button id="bead-analyze">코코야, 규칙을 찾아줘!</button><button id="bead-next" disabled>다음 구슬 이어 붙이기</button><button id="bead-clear">새로 만들기</button><button id="bead-read">🔊 설명 듣기</button></div>
<p id="bead-feedback" class="play-feedback" aria-live="polite"></p></section>
<section class="play-card"><h2>🧩 다음 구슬 맞히기</h2><p>반복되는 마디를 보고 빈칸에 알맞은 구슬을 골라요.</p><div id="pattern-display" class="play-feedback"></div><div id="pattern-choices" class="play-actions"></div><p id="pattern-feedback" aria-live="polite"></p><button id="pattern-next">다음 규칙 문제</button></section>
<section class="play-card"><h2>🔍 수 배열판 규칙 찾기</h2>
<label>뛰어 세기 <select id="number-step"><option value="2">2씩</option><option value="5">5씩</option><option value="10">10씩</option></select></label>
<p id="number-sequence"></p><p id="number-feedback" class="play-feedback" aria-live="polite"></p><div id="number-grid" aria-label="1부터 100까지 수 배열판"></div></section>
</main>
<script src="../../config.js"></script><script src="../../core/core.js"></script>
<script src="../../core/notion-helper.js"></script><script src="../../core/fairy-config.js"></script><script src="../../core/fairy-engine.js"></script>
<script src="js/math_quiz_engine.js"></script><script src="js/clock_rules_logic.js"></script>
</body></html>
