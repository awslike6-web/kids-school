// ⚔️ 5-2 수학 2단원 실전 훈련관 엔진
// ========================================================

// 🎵 Web Audio 효과음
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSfx(type) {
  try {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const now = audioCtx.currentTime;

    if (type === 'click') {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.frequency.setValueAtTime(600, now);
      gain.gain.setValueAtTime(0.15, now);
      gain.gain.linearRampToValueAtTime(0, now + 0.05);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(now); osc.stop(now + 0.05);
    } else if (type === 'correct') {
      // 딩동댕 2톤
      [523, 659, 783].forEach((f, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.setValueAtTime(f, now + i * 0.08);
        gain.gain.setValueAtTime(0.25, now + i * 0.08);
        gain.gain.linearRampToValueAtTime(0, now + i * 0.08 + 0.15);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(now + i * 0.08); osc.stop(now + i * 0.08 + 0.15);
      });
    } else if (type === 'wrong') {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(250, now);
      osc.frequency.setValueAtTime(200, now + 0.1);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.linearRampToValueAtTime(0, now + 0.25);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(now); osc.stop(now + 0.25);
    } else if (type === 'fanfare') {
      [440, 554, 659, 880].forEach((f, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(f, now + i * 0.1);
        gain.gain.setValueAtTime(0.3, now + i * 0.1);
        gain.gain.linearRampToValueAtTime(0, now + i * 0.1 + 0.3);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(now + i * 0.1); osc.stop(now + i * 0.1 + 0.3);
      });
    }
  } catch (e) {}
}

function getGemCount() {
  return parseInt(localStorage.getItem('math_gem_count') || '0', 10);
}
function addGems(n) {
  const c = getGemCount() + n;
  localStorage.setItem('math_gem_count', c);
  document.getElementById('gemCount').textContent = c;
}

let trainMode = 'scaffold'; // 'scaffold' | 'battle'

function switchTrainMode(mode) {
  playSfx('click');
  trainMode = mode;
  document.getElementById('btnModeScaffold').classList.toggle('active', mode === 'scaffold');
  document.getElementById('btnModeBattle').classList.toggle('active', mode === 'battle');
  if (mode === 'scaffold') {
    renderScaffoldMode();
  } else {
    renderBattleMode();
  }
}

// 🧱 1. 단계별 빈칸 연산 훈련소 데이터 & 로직
// ========================================================

const SCAFFOLD_PROBLEMS = [
  // 1. 진분수 x 자연수
  {
    id: 0,
    name: "🍕 진분수 × 자연수",

        hint: "자연수 2를 분자에 쏙 넣어보세요!"

      {

        formula: `= <span class="inline-frac"><span><input class="blank-input" id="inp_0_1" data-ans="2" maxlength="2" onkeyup="checkInput(this)"></span><span class="bar">/</span><span>3</span></span>`,
        hint: "1 곱하기 2는 2예요!"

    ]
  },
  // 2. 가분수 탈출
  {
    id: 1,
    name: "🐸 가분수 탈출",
    displayHero: `<span class="inline-frac"><span>2</span><span class="bar">/</span><span>5</span></span> × 3`,
    steps: [
      {
        desc: "분자에 3을 곱해요 (2 × 3)",
        formula: `= <span class="inline-frac"><span><input class="blank-input" id="inp_1_0" data-ans="6" maxlength="2" onkeyup="checkInput(this)"></span><span class="bar">/</span><span>5</span></span>`,
        hint: "2 곱하기 3은 6이에요!"
      },
      {
        desc: "가분수 6/5를 대분수로 바꿔요! (6 = 5 × 1 + 1)",
        formula: `= <input class="blank-input" id="inp_1_1" data-ans="1" maxlength="2" onkeyup="checkInput(this)"><span class="inline-frac"><span><input class="blank-input" id="inp_1_2" data-ans="1" maxlength="2" onkeyup="checkInput(this)"></span><span class="bar">/</span><span>5</span></span>`,
        hint: "6 안에 5가 1번 들어가고 1이 남아요! (1과 1/5)"

  // 3. 대분수 x 자연수
  {

let curScaffoldIdx = 0;
let lastFocusedInput = null;

function renderScaffoldMode() {
  const prob = SCAFFOLD_PROBLEMS[curScaffoldIdx];
  const area = document.getElementById('mainTrainArea');

  // 상단 주제 알약들
  let pillsHtml = SCAFFOLD_PROBLEMS.map((p, i) => `
    <button class="topic-pill ${i === curScaffoldIdx ? 'active' : ''}" onclick="selectScaffoldProblem(${i})">
      ${p.name}
    </button>
  `).join('');

  // 스텝들
  let stepsHtml = prob.steps.map((st, sIdx) => `
    <div class="step-row ${sIdx === 0 ? 'active' : ''}" id="stepRow_${sIdx}">
      <div class="step-info">
        <span class="step-badge">${sIdx + 1}단계</span>
        <span class="step-desc">${st.desc}</span>
      </div>
      <div class="step-formula-area">
        ${st.formula}
      </div>
    </div>
  `).join('');

  area.innerHTML = `
    <div class="trainer-topic-pills">${pillsHtml}</div>

    <div class="problem-hero-box">
      <span class="problem-badge">단계별 템플릿 연산</span>
      <div class="problem-title">${prob.displayHero}</div>
    </div>

    <div class="scaffold-steps-wrap">
      ${stepsHtml}
    </div>

    <!-- 코코 힌트 박스 -->
    <div class="hint-alert-box" id="hintAlertBox">
      <span style="font-size:1.4rem;">💡</span>
      <span id="hintAlertText">힌트 내용이 여기에 표시됩니다.</span>
    </div>

    <!-- 온스크린 키패드 -->
    <div style="margin-top:20px; text-align:center;">
      <span style="font-family:'Jua'; color:#9ca3af; font-size:0.95rem;">📱 터치 입력 키패드</span>
      <div class="keypad-grid">
        ${[1,2,3,4,5,6,7,8,9,0].map(n => `<button class="keypad-btn" onclick="pressKeypad('${n}')">${n}</button>`).join('')}
        <button class="keypad-btn" style="color:#ef4444;" onclick="pressKeypad('del')">지우기 ⌫</button>
        <button class="keypad-btn" style="color:#047857;" onclick="pressKeypad('next')">다음 ➔</button>
      </div>
    </div>
  `;

  // 첫 번째 인풋 포커스
  setTimeout(() => {
    const firstInp = document.getElementById(`inp_${prob.id}_0`);
    if (firstInp) {
      firstInp.focus();
      lastFocusedInput = firstInp;
    }
  }, 100);

  // 모든 인풋에 포커스 이벤트 연결
  document.querySelectorAll('.blank-input').forEach(inp => {
    inp.addEventListener('focus', () => { lastFocusedInput = inp; });
  });
}

function selectScaffoldProblem(idx) {
  playSfx('click');
  curScaffoldIdx = idx;
  renderScaffoldMode();
}

function checkInput(inp) {
  const userVal = inp.value.trim();
  const correctAns = inp.getAttribute('data-ans');

  if (userVal === correctAns) {
    inp.classList.add('correct');
    playSfx('correct');
    hideHint();

    // 다음 빈칸 찾아서 포커스
    const inputs = Array.from(document.querySelectorAll('.blank-input'));
    const currIdx = inputs.indexOf(inp);
    const nextInp = inputs[currIdx + 1];

    if (nextInp) {
      nextInp.focus();
      lastFocusedInput = nextInp;
      // 다음 스텝 로우 active 하이라이트
      const nextRow = nextInp.closest('.step-row');
      if (nextRow) nextRow.classList.add('active');
    } else {
      // 모든 단계 완료!
      playSfx('fanfare');
      addGems(1);
      document.querySelectorAll('.step-row').forEach(r => r.classList.add('done'));
      showTrainModal("문제 정복 완료! 💎 +1 획득", "단계별 공식을 꼼꼼하게 채워 정답을 완성했습니다!");
    }
  } else if (userVal.length >= correctAns.length) {
    // 오답 시 힌트 표시 (Errorless Learning)
    playSfx('wrong');
    showHint(inp);
  }
}

function showHint(inp) {
  const prob = SCAFFOLD_PROBLEMS[curScaffoldIdx];
  const row = inp.closest('.step-row');
  const stepIdx = Array.from(document.querySelectorAll('.step-row')).indexOf(row);
  const hintText = prob.steps[stepIdx]?.hint || "다시 한번 차근차근 생각해 보세요!";

  const box = document.getElementById('hintAlertBox');
  const txt = document.getElementById('hintAlertText');
  if (box && txt) {
    txt.textContent = hintText;
    box.style.display = 'flex';
  }
}

function hideHint() {
  const box = document.getElementById('hintAlertBox');
  if (box) box.style.display = 'none';
}

function pressKeypad(key) {
  if (!lastFocusedInput) return;
  if (key === 'del') {
    lastFocusedInput.value = '';
    playSfx('click');
  } else if (key === 'next') {
    const inputs = Array.from(document.querySelectorAll('.blank-input'));
    const idx = inputs.indexOf(lastFocusedInput);
    if (inputs[idx + 1]) inputs[idx + 1].focus();
  } else {
    lastFocusedInput.value = lastFocusedInput.value + key;
    checkInput(lastFocusedInput);
  }
}

let curQuizIdx = 0;
let quizScore = 0;
let answeredThisQ = false;

function renderBattleMode() {
  const area = document.getElementById('mainTrainArea');
  const qData = QUIZ_QUESTIONS[curQuizIdx];

  area.innerHTML = `
    <div class="quiz-progress-bar">
      <span>문제 ${curQuizIdx + 1} / ${QUIZ_QUESTIONS.length}</span>
      <span>현재 정답: ${quizScore}개</span>
    </div>

    <div class="quiz-question-box">
      <span class="quiz-q-num">Q ${curQuizIdx + 1}</span>
      <h3 class="quiz-question-text">${qData.q}</h3>
    </div>

    <div class="quiz-options-list">
      ${qData.opts.map((opt, i) => `
        <button class="quiz-opt-btn" id="optBtn_${i}" onclick="selectQuizOption(${i})">
          <span class="quiz-opt-num">${i + 1}</span>
          <span>${opt}</span>
        </button>
      `).join('')}
    </div>

    <div class="hint-alert-box" id="quizHintBox" style="margin-top:20px;">
      <span style="font-size:1.4rem;">💡</span>
      <span id="quizHintText"></span>
    </div>
  `;

  answeredThisQ = false;
}

function selectQuizOption(choiceIdx) {
  if (answeredThisQ) return;
  const qData = QUIZ_QUESTIONS[curQuizIdx];
  const selectedBtn = document.getElementById(`optBtn_${choiceIdx}`);

  if (choiceIdx === qData.ans) {
    answeredThisQ = true;
    quizScore++;
    selectedBtn.classList.add('correct');
    playSfx('correct');

    // 2문제마다 보석 1개
    if (quizScore % 2 === 0) {
      addGems(1);
    }

    setTimeout(() => {
      if (curQuizIdx < QUIZ_QUESTIONS.length - 1) {
        curQuizIdx++;
        renderBattleMode();
      } else {
        playSfx('fanfare');
        addGems(5);
        showTrainModal("🎉 10문제 배틀 완주 성공! 🎉", `10문제 중 ${quizScore}문제를 완벽하게 풀었습니다!<br><b>보석 +5 💎 & 수학 경험치 +15 EXP</b> 획득!`);
      }
    }, 1000);
  } else {
    // 오답 (Errorless Learning: 힌트 제공 후 재도전)
    playSfx('wrong');
    selectedBtn.classList.add('wrong');
    const hintBox = document.getElementById('quizHintBox');
    const hintTxt = document.getElementById('quizHintText');
    if (hintBox && hintTxt) {
      hintTxt.textContent = qData.tip;
      hintBox.style.display = 'flex';
    }
  }
}

function showTrainModal(title, desc) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalDesc').innerHTML = desc;
  document.getElementById('trainModal').style.display = 'flex';
}

function closeTrainModal() {
  playSfx('click');
  document.getElementById('trainModal').style.display = 'none';
  if (trainMode === 'scaffold') {
    // 다음 문제로 이동
    curScaffoldIdx = (curScaffoldIdx + 1) % SCAFFOLD_PROBLEMS.length;
    renderScaffoldMode();
  } else {
    curQuizIdx = 0;
    quizScore = 0;
    renderBattleMode();
  }
}
