<!DOCTYPE html>
<html lang="ko">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>⚔️ 5학년 분수의 곱셈 실전 훈련관 & 공식 퀴즈 🚀 | 민민이네 공부방</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@700&family=Jua&family=Nanum+Gothic:wght@400;700;800&family=Noto+Sans+KR:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/design-system.css">
  <link rel="stylesheet" href="../../css/math_factors.css">
  <style>

      --primary-dark: #b45309;
      --primary-light: #fef3c7;
      --accent: #f59e0b;
      --success: #10b981;
      --card-bg: #ffffff;
      --text-main: #1f2937;
      --text-muted: #6b7280;
    }

    body {
      margin: 0;
      padding: 0;
      background: #fffdf7;
      font-family: 'Noto Sans KR', sans-serif;
      color: var(--text-main);
      -webkit-font-smoothing: antialiased;
      user-select: none;

    /* 상단 탑바 */
    .top-header {
      background: #ffffff;
      border-bottom: 2px solid #fde68a;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 12px rgba(217, 119, 6, 0.08);
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .btn-nav-back {
      background: #fef3c7;
      color: #b45309;
      border: 2px solid #f59e0b;
      border-radius: 14px;
      padding: 6px 14px;
      font-family: 'Jua', sans-serif;
      font-size: 1rem;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s;
    }
    .btn-nav-back:hover {
      background: #fde68a;
      transform: translateY(-2px);
    }
    .header-title-box h1 {
      margin: 0;
      font-family: 'Jua', sans-serif;
      font-size: 1.4rem;
      color: #78350f;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .gem-badge {
      background: #eff6ff;
      border: 2px solid #3b82f6;
      border-radius: 20px;
      padding: 4px 12px;
      font-family: 'Jua', sans-serif;
      font-size: 1rem;
      color: #1d4ed8;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* 메인 컨테이너 */
    .training-container {
      max-width: 920px;
      margin: 0 auto;
      padding: 24px 16px 80px;
    }

    /* 상단 모드 전환 탭 (Mode 1 vs Mode 2) */
    .mode-tab-bar {
      display: flex;
      background: #fef3c7;
      padding: 6px;
      border-radius: 20px;
      margin-bottom: 24px;
      gap: 6px;
      border: 2px solid #fde68a;
    }
    .mode-tab-btn {
      flex: 1;
      padding: 12px 16px;
      border: none;
      background: transparent;
      border-radius: 14px;
      font-family: 'Jua', sans-serif;
      font-size: 1.15rem;
      color: #92400e;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .mode-tab-btn.active {

      color: #b45309;
      box-shadow: 0 4px 12px rgba(217, 119, 6, 0.15);
      font-weight: 800;
      transform: scale(1.02);
    }

    /* 공통 카드 스타일 */
    .train-card {
      background: #ffffff;
      border: 3px solid #fde68a;
      border-radius: 28px;
      padding: 28px 24px;
      box-shadow: 0 8px 24px rgba(217, 119, 6, 0.1);
      position: relative;
    }

    /* ======================================================== */
    /* 📐 교과서 실물 정품 세로 분수 (Vertical Fraction)       */
    /* ======================================================== */
    .inline-frac {
      display: inline-flex;
      flex-direction: column;
      vertical-align: middle;
      text-align: center;
      padding: 0 4px;
      font-size: 1.05em;
      line-height: 1.1;
      font-weight: 700;
    }
    .inline-frac .num {
      display: block;
      padding-bottom: 2px;
    }
    .inline-frac .bar {
      display: block;
      border-top: 2px solid currentColor;
      height: 0;
      width: 100%;
      min-width: 16px;
      margin: 2px 0;
      font-size: 0;
    }
    .inline-frac .den {
      display: block;
      padding-top: 2px;
    }

    /* 대분수 래퍼 */
    .mixed-frac {
      display: inline-flex;
      align-items: center;
      vertical-align: middle;
      gap: 3px;
      font-weight: 700;
    }
    .mixed-frac .whole {
      font-size: 1.25em;
      line-height: 1;
      color: currentColor;
    }

    /* 🧱 Mode 1: 6대 파트 대분류 탭 */
    .category-pills-bar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 16px;
      justify-content: center;
    }
    .cat-pill {

      border: 2px solid #e5e7eb;
      border-radius: 14px;

      font-size: 0.95rem;

    }

    .sub-problem-bar {

      align-items: center;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 24px;
      padding: 10px;
      background: #fefce8;
      border-radius: 18px;
      border: 1.5px dashed #fcd34d;
    }
    .prob-num-btn {
      background: #ffffff;

      border-radius: 12px;
      padding: 6px 14px;

      color: #475569;

    .btn-random-generate {
      background: linear-gradient(135deg, #10b981, #059669);

      color: #ffffff;
      border-radius: 12px;
      padding: 6px 16px;
      font-family: 'Jua', sans-serif;
      font-size: 0.95rem;

      transition: all 0.2s;

    .step-row.active {

    .step-row.done {

    .step-info {
      display: flex;

    .step-badge {

      color: #1e293b;

      align-items: center;
      gap: 8px;

    /* 빈칸 인풋 */
    .blank-input {
      width: 54px;
      height: 48px;
      border: 3px dashed #d97706;
      border-radius: 12px;
      background: #ffffff;
      text-align: center;
      font-family: 'Jua', sans-serif;
      font-size: 1.6rem;
      color: #b45309;
      outline: none;
      transition: all 0.2s;

      color: #991b1b;

      border: 2px solid #e2e8f0;
      border-radius: 12px;
      padding: 12px 0;
      font-family: 'Jua', sans-serif;

      color: #334155;

    .keypad-btn:active {
      transform: scale(0.95);
      background: #f1f5f9;

    /* ⚔️ Mode 2: 퀴즈 배틀 */
    .quiz-progress-bar {
      display: flex;
      justify-content: space-between;
      font-family: 'Jua', sans-serif;
      color: #64748b;
      margin-bottom: 12px;
    }
    .quiz-question-box {
      background: linear-gradient(135deg, #fff7ed, #ffedd5);
      border: 2px solid #fdba74;
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 24px;
      text-align: center;
    }
    .quiz-q-num {
      background: #ea580c;
      color: #ffffff;

      border-radius: 10px;
      font-family: 'Jua', sans-serif;
      font-size: 0.9rem;

      margin-bottom: 12px;

    .quiz-question-text {
      font-family: 'Jua', sans-serif;

    }
    .quiz-options-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .quiz-opt-btn {
      background: #ffffff;
      border: 2px solid #e2e8f0;
      border-radius: 16px;
      padding: 16px 20px;
      text-align: left;
      font-family: 'Jua', sans-serif;
      font-size: 1.25rem;
      color: #334155;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .quiz-opt-btn:hover {
      border-color: #f59e0b;

      transform: translateX(4px);

    .quiz-opt-num {
      width: 32px;
      height: 32px;
      background: #f1f5f9;

      justify-content: center;

    .quiz-opt-btn.correct {

      border-color: #10b981 !important;

    .quiz-opt-btn.wrong {

    /* 팝업 모달 */
    .train-modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .train-modal-box {
      background: #ffffff;
      border-radius: 28px;
      max-width: 440px;
      width: 90%;
      padding: 32px 24px;
      text-align: center;
      border: 3px solid #fde68a;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    }
    .modal-trophy {
      font-size: 4rem;
      margin-bottom: 12px;
    }
    .modal-title {
      font-family: 'Jua', sans-serif;
      font-size: 1.8rem;
      color: #78350f;
      margin-bottom: 10px;
    }
    .modal-desc {
      font-size: 1.05rem;
      color: #64748b;
      line-height: 1.6;
      margin-bottom: 24px;
      word-break: keep-all;
    }
    .btn-modal-action {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #ffffff;
      border: none;
      border-radius: 16px;
      padding: 12px 32px;
      font-family: 'Jua', sans-serif;
      font-size: 1.2rem;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(217, 119, 6, 0.3);
      transition: all 0.2s;

      .keypad-btn { font-size: 1.15rem; padding: 10px 0; }

<script>
// ========================================================
// 🔊 사운드 및 보상 헬퍼
// ========================================================
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  return audioCtx;
}

function playSfx(type) {
  try {
    const ctx = getAudioCtx();
    if (ctx.state === 'suspended') ctx.resume();

    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);

    const now = ctx.currentTime;

    if (type === 'correct') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(523.25, now);
      osc.frequency.exponentialRampToValueAtTime(783.99, now + 0.15);
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
      osc.start(now);
      osc.stop(now + 0.3);
    } else if (type === 'wrong') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(220, now);
      osc.frequency.setValueAtTime(196, now + 0.1);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
      osc.start(now);
      osc.stop(now + 0.25);
    } else if (type === 'click') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(800, now);
      gain.gain.setValueAtTime(0.1, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
      osc.start(now);
      osc.stop(now + 0.05);
    } else if (type === 'fanfare') {
      const notes = [523.25, 659.25, 783.99, 1046.5];
      notes.forEach((freq, i) => {
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.connect(g);
        g.connect(ctx.destination);
        o.type = 'triangle';
        o.frequency.setValueAtTime(freq, now + i * 0.1);
        g.gain.setValueAtTime(0.25, now + i * 0.1);
        g.gain.exponentialRampToValueAtTime(0.01, now + i * 0.1 + 0.35);
        o.start(now + i * 0.1);
        o.stop(now + i * 0.1 + 0.35);
      });
    }
  } catch (e) {
    console.warn("Audio error:", e);
  }
}

function getGemCount() {
  return parseInt(localStorage.getItem('minmin_gems') || '0', 10);
}
function addGems(amount) {
  const cur = getGemCount() + amount;
  localStorage.setItem('minmin_gems', cur.toString());
  document.getElementById('gemCount').textContent = cur;
}

// ========================================================
// 📐 정품 세로 분수 HTML 생성 헬퍼 (슬래시 분수 표기 완전 제거)
// ========================================================
function renderFrac(num, den) {
  return `<span class="inline-frac"><span class="num">${num}</span><span class="bar"></span><span class="den">${den}</span></span>`;
}

function renderMixed(whole, num, den) {
  return `<span class="mixed-frac"><span class="whole">${whole}</span><span class="inline-frac"><span class="num">${num}</span><span class="bar"></span><span class="den">${den}</span></span></span>`;
}

// ========================================================
// 🧱 1. 단계별 빈칸 연산 훈련소 (6대 파트별 문제 은행 & 랜덤 생성)

function generateRandomProblem(catIdx) {
  if (catIdx === 0) {
    // 진분수 x 자연수 (결과 진분수)
    const dens = [5, 6, 7, 8, 9, 10];
    const d = dens[Math.floor(Math.random() * dens.length)];
    const n = Math.floor(Math.random() * 2) + 1; // 1 or 2
    const m = Math.floor(Math.random() * (Math.floor((d - 1) / n) - 1)) + 2;
    const prod = n * m;
    return {
      hero: `${renderFrac(n, d)} × ${m}`,
      steps: [
        { desc: `자연수 ${m}은 분자에만 곱해요!`, formula: `${renderFrac(`${n} × <input class="blank-input" id="inp_s_0" data-ans="${m}" maxlength="2" onkeyup="checkInput(this)">`, d)}`, hint: `자연수 ${m}을 분자에 쏙 넣어보세요!` },
        { desc: `분자 ${n} × ${m}을 계산하면?`, formula: `= ${renderFrac(`<input class="blank-input" id="inp_s_1" data-ans="${prod}" maxlength="2" onkeyup="checkInput(this)">`, d)}`, hint: `${n} 곱하기 ${m}은 ${prod}이에요!` }
      ]
    };
  } else if (catIdx === 1) {
    // 가분수 탈출 (결과 대분수)
    const d = [3, 4, 5, 7][Math.floor(Math.random() * 4)];
    const n = Math.floor(Math.random() * (d - 1)) + 1;
    const m = Math.floor(Math.random() * 3) + 2;
    const prod = n * m;
    if (prod <= d) return generateRandomProblem(catIdx); // 가분수가 되도록 재시도
    const w = Math.floor(prod / d);
    const rem = prod % d;
    return {
      hero: `${renderFrac(n, d)} × ${m}`,
      steps: [
        { desc: `분자에 ${m}을 곱해요 (${n} × ${m})`, formula: `= ${renderFrac(`<input class="blank-input" id="inp_s_0" data-ans="${prod}" maxlength="2" onkeyup="checkInput(this)">`, d)}`, hint: `${n} 곱하기 ${m}은 ${prod}이에요!` },
        { desc: `가분수 ${renderFrac(prod, d)}를 대분수로 정리!`, formula: `= <input class="blank-input" id="inp_s_1" data-ans="${w}" maxlength="2" onkeyup="checkInput(this)">${renderFrac(`<input class="blank-input" id="inp_s_2" data-ans="${rem}" maxlength="2" onkeyup="checkInput(this)">`, d)}`, hint: `${prod} 안에 ${d}가 ${w}번 들어가고 ${rem}이 남아요!` }
      ]
    };
  } else if (catIdx === 2) {
    // 대분수 x 자연수
    const d = [3, 4, 5][Math.floor(Math.random() * 3)];
    const w = Math.floor(Math.random() * 2) + 1;
    const n = Math.floor(Math.random() * (d - 1)) + 1;
    const m = Math.floor(Math.random() * 2) + 2;
    const improper = w * d + n;
    const prod = improper * m;
    const finW = Math.floor(prod / d);
    const finRem = prod % d;
    return {
      hero: `${renderMixed(w, n, d)} × ${m}`,
      steps: [
        { desc: `대분수 ${renderMixed(w, n, d)}를 가분수로 변신!`, formula: `= ${renderFrac(`<input class="blank-input" id="inp_s_0" data-ans="${improper}" maxlength="2" onkeyup="checkInput(this)">`, d)} × ${m}`, hint: `${w}×${d}+${n} = ${improper}예요!` },
        { desc: `분자 ${improper}에 자연수 ${m} 곱하기`, formula: `= ${renderFrac(`<input class="blank-input" id="inp_s_1" data-ans="${prod}" maxlength="2" onkeyup="checkInput(this)">`, d)}`, hint: `${improper} 곱하기 ${m}은 ${prod}이에요!` },
        { desc: `가분수를 대분수로 정리!`, formula: `= <input class="blank-input" id="inp_s_2" data-ans="${finW}" maxlength="2" onkeyup="checkInput(this)">${renderFrac(`<input class="blank-input" id="inp_s_3" data-ans="${finRem}" maxlength="2" onkeyup="checkInput(this)">`, d)}`, hint: `${prod} 안에 ${d}가 ${finW}번 들어가고 ${finRem}이 남아요!` }
      ]
    };
  } else if (catIdx === 3) {
    // 자연수 x 진분수 (약분)
    const d = [3, 4, 5, 6][Math.floor(Math.random() * 4)];
    const mult = Math.floor(Math.random() * 3) + 2;
    const nat = d * mult;
    const n = Math.floor(Math.random() * (d - 1)) + 1;
    const ans = mult * n;
    return {
      hero: `${nat} × ${renderFrac(n, d)}`,
      steps: [
        { desc: `자연수 ${nat}과 분모 ${d}를 ${d}로 약분하면 ${nat}은?`, formula: `${nat}은 ➔ <input class="blank-input" id="inp_s_0" data-ans="${mult}" maxlength="2" onkeyup="checkInput(this)">`, hint: `${nat} 나누기 ${d}는 ${mult}이에요!` },
        { desc: `남은 수 ${mult} × ${n}을 계산하면?`, formula: `= <input class="blank-input" id="inp_s_1" data-ans="${ans}" maxlength="2" onkeyup="checkInput(this)">`, hint: `${mult} 곱하기 ${n}은 ${ans}이에요!` }
      ]
    };
  } else if (catIdx === 4) {
    // 단위/진분수 x 진분수
    const d1 = [2, 3, 4][Math.floor(Math.random() * 3)];
    const d2 = [3, 5, 7][Math.floor(Math.random() * 3)];
    const prodDen = d1 * d2;
    return {
      hero: `${renderFrac(1, d1)} × ${renderFrac(1, d2)}`,
      steps: [
        { desc: "분모끼리 곱하고, 분자끼리 곱해요!", formula: `= ${renderFrac("1 × 1", `<input class="blank-input" id="inp_s_0" data-ans="${d1}" maxlength="2" onkeyup="checkInput(this)"> × <input class="blank-input" id="inp_s_1" data-ans="${d2}" maxlength="2" onkeyup="checkInput(this)">`)}`, hint: `분모 ${d1}과 ${d2}를 분모 자리에 써요!` },
        { desc: `분모 ${d1} × ${d2}를 계산하면 전체 칸 수는?`, formula: `= ${renderFrac(1, `<input class="blank-input" id="inp_s_2" data-ans="${prodDen}" maxlength="2" onkeyup="checkInput(this)">`)}`, hint: `${d1} 곱하기 ${d2}는 ${prodDen}이에요!` }
      ]
    };
  } else {
    // 대분수 x 대분수
    return {
      hero: `${renderMixed(1, 1, 2)} × ${renderMixed(1, 1, 3)}`,
      steps: [
        { desc: `두 대분수를 가분수로 변신!`, formula: `= ${renderFrac(`<input class="blank-input" id="inp_s_0" data-ans="3" maxlength="2" onkeyup="checkInput(this)">`, 2)} × ${renderFrac(`<input class="blank-input" id="inp_s_1" data-ans="4" maxlength="2" onkeyup="checkInput(this)">`, 3)}`, hint: "1×2+1=3, 1×3+1=4예요!" },
        { desc: "3끼리 약분되고, 분자 4를 분모 2로 나누면 남는 자연수는?", formula: `= <input class="blank-input" id="inp_s_2" data-ans="2" maxlength="2" onkeyup="checkInput(this)">`, hint: "4 나누기 2는 2예요!" }
      ]
    };
  }
}

let lastFocusedInput = null;

function renderScaffoldMode() {
  const area = document.getElementById('mainTrainArea');
  
  // 1. 카테고리 알약 탭 (6대 파트)
  let catPillsHtml = CATEGORIES.map((cat, i) => `
    <button class="cat-pill ${i === curCatIdx ? 'active' : ''}" onclick="selectCategory(${i})">
      ${cat.name}
    </button>
  `).join('');

  // 2. 문제 번호 선택 바 (1번~5번 + 🎲 무한 랜덤 버튼)
  const isRandom = (curProbIdx === -1);
  let subPillsHtml = [0, 1, 2, 3, 4].map(pIdx => {
    const isSolved = solvedMap[`${curCatIdx}_${pIdx}`];
    return `
      <button class="prob-num-btn ${(!isRandom && curProbIdx === pIdx) ? 'active' : ''} ${isSolved ? 'done' : ''}" onclick="selectProblem(${pIdx})">
        ${pIdx + 1}번 문제
      </button>
    `;
  }).join('');

  subPillsHtml += `
    <button class="btn-random-generate" onclick="generateAndPlayRandom()">
      🎲 무한 랜덤 문제 뽑기!
    </button>
  `;

  // 현재 문제 객체 가져오기
  let prob;
  if (isRandom) {
    prob = customRandomProb || generateRandomProblem(curCatIdx);
    customRandomProb = prob;
  } else {
    prob = PROBLEM_BANKS[curCatIdx][curProbIdx];
  }

  // 3. 단계별 수식 스텝들
  let stepsHtml = prob.steps.map((st, sIdx) => `
    <div class="step-row ${sIdx === 0 ? 'active' : ''}" id="stepRow_${sIdx}">
      <div class="step-info">
        <span class="step-badge">${sIdx + 1}단계</span>
        <span class="step-desc">${st.desc}</span>
      </div>
      <div class="step-formula-area">
        ${st.formula}
      </div>
    </div>
  `).join('');

  area.innerHTML = `
    <!-- 6대 카테고리 탭 -->
    <div class="category-pills-bar">${catPillsHtml}</div>

    <!-- 1~5번 및 랜덤 선택 바 -->
    <div class="sub-problem-bar">${subPillsHtml}</div>

    <!-- 문제 헤로 박스 -->
    <div class="problem-hero-box">
      <span class="problem-badge">${CATEGORIES[curCatIdx].name}</span>
      <div class="problem-title">${prob.hero}</div>
    </div>

    <!-- 단계별 비계 입력 -->
    <div class="scaffold-steps-wrap">
      ${stepsHtml}
    </div>

    <!-- 코코 힌트 박스 -->
    <div class="hint-alert-box" id="hintAlertBox">
      <span style="font-size:1.4rem;">💡</span>
      <span id="hintAlertText">힌트가 여기에 표시됩니다.</span>
    </div>

    <!-- 온스크린 키패드 -->
    <div style="margin-top:24px; text-align:center;">
      <span style="font-family:'Jua'; color:#9ca3af; font-size:0.95rem;">📱 터치 입력 키패드</span>
      <div class="keypad-grid">
        ${[1,2,3,4,5,6,7,8,9,0].map(n => `<button class="keypad-btn" onclick="pressKeypad('${n}')">${n}</button>`).join('')}
        <button class="keypad-btn" style="color:#ef4444;" onclick="pressKeypad('del')">지우기 ⌫</button>
        <button class="keypad-btn" style="color:#047857;" onclick="pressKeypad('next')">다음 ➔</button>
      </div>
    </div>
  `;

  // 첫 번째 인풋 포커스
  setTimeout(() => {
    const firstInp = document.getElementById('inp_s_0');
    if (firstInp) {
      firstInp.focus();
      lastFocusedInput = firstInp;
    }
  }, 100);

  // 인풋 포커스 이벤트 연결
  document.querySelectorAll('.blank-input').forEach(inp => {
    inp.addEventListener('focus', () => { lastFocusedInput = inp; });
  });
}

function selectCategory(catIdx) {
  playSfx('click');
  curCatIdx = catIdx;
  curProbIdx = 0;
  customRandomProb = null;
  renderScaffoldMode();
}

function selectProblem(pIdx) {
  playSfx('click');
  curProbIdx = pIdx;
  customRandomProb = null;
  renderScaffoldMode();
}

function generateAndPlayRandom() {
  playSfx('click');
  curProbIdx = -1;
  customRandomProb = generateRandomProblem(curCatIdx);
  renderScaffoldMode();
}

function checkInput(inp) {
  const userVal = inp.value.trim();
  const correctAns = inp.getAttribute('data-ans');

  if (userVal === correctAns) {
    inp.classList.add('correct');
    playSfx('correct');
    hideHint();

    const inputs = Array.from(document.querySelectorAll('.blank-input'));
    const currIdx = inputs.indexOf(inp);
    const nextInp = inputs[currIdx + 1];

    if (nextInp) {
      nextInp.focus();
      lastFocusedInput = nextInp;
      const nextRow = nextInp.closest('.step-row');
      if (nextRow) nextRow.classList.add('active');
    } else {
      // 모든 단계 정답 완료!
      playSfx('fanfare');
      addGems(1);
      document.querySelectorAll('.step-row').forEach(r => r.classList.add('done'));
      
      if (curProbIdx >= 0) {
        solvedMap[`${curCatIdx}_${curProbIdx}`] = true;
      }

      showTrainModal("🎉 문제 정복 완료! 💎 +1 획득", "교과서 계산 공식을 완벽하게 마스터했습니다!");
    }
  } else if (userVal.length >= correctAns.length) {
    playSfx('wrong');
    showHint(inp);
  }
}

function showHint(inp) {
  let prob;
  if (curProbIdx === -1) {
    prob = customRandomProb;
  } else {
    prob = PROBLEM_BANKS[curCatIdx][curProbIdx];
  }
  const row = inp.closest('.step-row');
  const stepIdx = Array.from(document.querySelectorAll('.step-row')).indexOf(row);
  const hintText = prob?.steps[stepIdx]?.hint || "다시 한번 차근차근 생각해 보세요!";

  const box = document.getElementById('hintAlertBox');
  const txt = document.getElementById('hintAlertText');
  if (box && txt) {
    txt.textContent = hintText;
    box.style.display = 'flex';
  }
}

function hideHint() {
  const box = document.getElementById('hintAlertBox');
  if (box) box.style.display = 'none';
}

function pressKeypad(key) {
  if (!lastFocusedInput) return;
  if (key === 'del') {
    lastFocusedInput.value = '';
    playSfx('click');
  } else if (key === 'next') {
    const inputs = Array.from(document.querySelectorAll('.blank-input'));
    const idx = inputs.indexOf(lastFocusedInput);
    if (inputs[idx + 1]) inputs[idx + 1].focus();
  } else {
    lastFocusedInput.value = lastFocusedInput.value + key;
    checkInput(lastFocusedInput);
  }
}

    opts: ["대분수", "단위분수", "소수"],
    ans: 0,
    tip: `온전한 1개(${renderFrac(5, 5)})를 쏙 뽑아 대분수 ${renderMixed(1, 1, 5)}로 변신시켜요!`
  },
  {
    q: `대분수와 자연수를 곱할 때는 대분수에게 무엇을 먼저 씌워야 할까요?`,
    opts: ["소수 안경", "가분수 투구", "거꾸로 모자"],
    ans: 1,
    tip: "뚱뚱한 대분수를 날씬한 가분수로 바꾸면 계산이 훨씬 쉬워져요!"
  },
  {
    q: `자연수 6과 ${renderFrac(2, 3)}를 곱할 때, 6과 3을 미리 약분하면 6은 무엇이 될까요?`,
    opts: ["1", "2", "3"],
    ans: 1,
    tip: "6 나누기 3은 2! 2가 남아요."
  },
  {
    q: `단위분수 ${renderFrac(1, 2)}과 ${renderFrac(1, 3)}을 곱하면 전체는 몇 칸으로 나뉠까요?`,
    opts: ["5칸", "6칸", "8칸"],
    ans: 1,
    tip: "가로 2줄 × 세로 3줄 = 분모끼리 곱해서 6칸이 돼요!"
  },
  {
    q: `분수끼리의 곱셈에서 계산하기 전에 대각선에 있는 숫자끼리 나누는 기술은?`,
    opts: ["통분술", "번개 약분술", "내림술"],
    ans: 1,
    tip: "마법 가위로 대각선 친구를 똑같은 수로 미리 싹둑 자르는 번개 약분술!"
  },
  {
    q: `대분수끼리 곱할 때 (${renderMixed(2, 1, 3)} × ${renderMixed(1, 1, 5)}) 가장 먼저 해야 할 일은?`,
    opts: ["둘 다 가분수로 바꾼다", "자연수끼리만 곱한다", "분모를 통분한다"],
    ans: 0,
    tip: "두 대분수를 반드시 모두 가분수로 먼저 변신시켜야 곱할 수 있어요!"
  },
  {
    q: `1보다 작은 진분수를 곱하면 원래 수보다 어떻게 될까요?`,
    opts: ["더 커진다", "더 작아진다", "변함이 없다"],
    ans: 1,
    tip: "1보다 작은 수를 곱하면 조각의 조각이 되어 알맞게 작아져요!"
  },
  {
    q: `${renderFrac(3, 4)} × ${renderFrac(2, 7)}에서 대각선 4와 2를 2로 약분하면 분모는 몇이 될까요?`,
    opts: ["14", "28", "8"],
    ans: 0,
    tip: "4가 2가 되었으니 분모는 2 × 7 = 14가 돼요!"
  },
  {
    q: `분수의 곱셈을 할 때 '약분'은 언제 하는 것이 가장 좋을까요?`,
    opts: ["곱하기 전에 미리 약분한다", "계산이 다 끝나고만 한다", "약분은 안 해도 된다"],
    ans: 0,
    tip: "곱하기 전에 미리 대각선 약분을 하면 숫자가 작아져서 계산 실수가 없어져요!"
  }
];

let curQuizIdx = 0;
let quizScore = 0;
let answeredThisQ = false;

function renderBattleMode() {
  const area = document.getElementById('mainTrainArea');
  const qData = QUIZ_QUESTIONS[curQuizIdx];

  area.innerHTML = `
    <div class="quiz-progress-bar">
      <span>문제 ${curQuizIdx + 1} / ${QUIZ_QUESTIONS.length}</span>
      <span>현재 정답: ${quizScore}개</span>
    </div>

    <div class="quiz-question-box">
      <span class="quiz-q-num">Q ${curQuizIdx + 1}</span>
      <h3 class="quiz-question-text">${qData.q}</h3>
    </div>

    <div class="quiz-options-list">
      ${qData.opts.map((opt, i) => `
        <button class="quiz-opt-btn" id="optBtn_${i}" onclick="selectQuizOption(${i})">
          <span class="quiz-opt-num">${i + 1}</span>
          <span>${opt}</span>
        </button>
      `).join('')}
    </div>

    <div class="hint-alert-box" id="quizHintBox" style="margin-top:20px;">
      <span style="font-size:1.4rem;">💡</span>
      <span id="quizHintText"></span>
    </div>
  `;

  answeredThisQ = false;
}

function selectQuizOption(choiceIdx) {
  if (answeredThisQ) return;
  const qData = QUIZ_QUESTIONS[curQuizIdx];
  const selectedBtn = document.getElementById(`optBtn_${choiceIdx}`);

  if (choiceIdx === qData.ans) {
    answeredThisQ = true;
    quizScore++;
    selectedBtn.classList.add('correct');
    playSfx('correct');

    if (quizScore % 2 === 0) {
      addGems(1);
    }

    setTimeout(() => {
      if (curQuizIdx < QUIZ_QUESTIONS.length - 1) {
        curQuizIdx++;
        renderBattleMode();
      } else {
        playSfx('fanfare');
        addGems(5);
        showTrainModal("🎉 10문제 배틀 완주 성공! 🎉", `10문제 중 ${quizScore}문제를 완벽하게 풀었습니다!<br><b>보석 +5 💎 & 수학 경험치 +15 EXP</b> 획득!`);
      }
    }, 900);
  } else {
    playSfx('wrong');
    selectedBtn.classList.add('wrong');
    const hintBox = document.getElementById('quizHintBox');
    const hintTxt = document.getElementById('quizHintText');
    if (hintBox && hintTxt) {
      hintTxt.innerHTML = qData.tip;
      hintBox.style.display = 'flex';
    }
  }
}

// 모드 스위치
function switchTrainMode(mode) {
  playSfx('click');
  trainMode = mode;
  const tabS = document.getElementById('tabScaffold');
  const tabB = document.getElementById('tabBattle');

  if (mode === 'scaffold') {
    tabS.classList.add('active');
    tabB.classList.remove('active');
    renderScaffoldMode();
  } else {
    tabS.classList.remove('active');
    tabB.classList.add('active');
    curQuizIdx = 0;
    quizScore = 0;
    renderBattleMode();
  }
}

function showTrainModal(title, desc) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalDesc').innerHTML = desc;
  document.getElementById('trainModal').style.display = 'flex';
}

function closeTrainModal() {
  playSfx('click');
  document.getElementById('trainModal').style.display = 'none';
  if (trainMode === 'scaffold') {
    if (curProbIdx >= 0) {
      curProbIdx = (curProbIdx + 1) % 5;
    } else {
      generateAndPlayRandom();
      return;
    }
    renderScaffoldMode();
  } else {
    curQuizIdx = 0;
    quizScore = 0;
    renderBattleMode();
  }
}

// 초기 로드
window.addEventListener('DOMContentLoaded', () => {
  document.getElementById('gemCount').textContent = getGemCount();
  renderScaffoldMode();
});
</script>
