<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>⚔️ 5학년 분수의 곱셈 실전 훈련관 & 공식 퀴즈 🚀 | 민민이네 공부방</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@700&family=Jua&family=Nanum+Gothic:wght@400;700;800&family=Noto+Sans+KR:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/design-system.css">
  <link rel="stylesheet" href="../../css/math_factors.css">
  <link rel="stylesheet" href="../../css/math_fractions_training.css?v=20261031-split">
</head>
<body>

<!-- 상단 탑바 -->
<div class="top-header">
  <div class="header-left">
    <a href="math.html" class="btn-nav-back">🔙 수학 대문</a>
    <div class="header-title-box">
      <h1>⚡ 5학년 분수의 곱셈 실전 훈련관</h1>
    </div>
  </div>
  <div class="header-right">
    <div class="gem-badge">💎 <span id="gemCount">0</span></div>
  </div>
</div>

<div class="training-container">
  
  <!-- 모드 전환 탭 -->
  <div class="mode-tab-bar">
    <button class="mode-tab-btn active" id="tabScaffold" onclick="switchTrainMode('scaffold')">
      🧩 1. 단계별 빈칸 연산 훈련소
    </button>
    <button class="mode-tab-btn" id="tabBattle" onclick="switchTrainMode('battle')">
      🏆 2. 6대 공식 퀴즈 배틀 (10제)
    </button>
  </div>

  <!-- 메인 훈련 카드 -->
  <div class="train-card" id="mainTrainArea">
    <!-- 동적 렌더링 영역 -->
  </div>

</div>

<!-- 팝업 모달 -->
<div class="train-modal-backdrop" id="trainModal">
  <div class="train-modal-box">
    <div class="modal-trophy">🏆</div>
    <h2 class="modal-title" id="modalTitle">훈련 완료!</h2>
    <p class="modal-desc" id="modalDesc">축하합니다! 보상을 획득했습니다.</p>
    <button class="btn-modal-action" onclick="closeTrainModal()">확인</button>
  </div>
</div>

<script src="../../core/fairy-config.js"></script>
<script src="../../core/fairy-tts.js?v=20261028-tts"></script>
<script src="../../core/fairy-settings-catalog.js"></script>
<script src="../../core/fairy-engine.js?v=20261028-coco"></script>
<script src="./js/fractions_training-core.js?v=20261031-split"></script>
<script src="./js/fractions_training-main.js?v=20261031-split"></script>
</body>
</html>
