<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>민민 우주 정거장 🚀 - 통합 세로셈 본부 (동적 그리드)</title>
<link rel="stylesheet" href="../../css/math_style.css">
</head>
<body>

<div class="app-container">
  <div class="top-bar">
    <div class="profile-badge">
      <span id="userIcon">👨‍🚀</span> <span id="userName">로딩중...</span>
    </div>
    <button class="exit-btn" onclick="window.exitRoom()">🔙 수학 탐험 본부</button>
  </div>

  <!-- 설정(메인) 화면 -->
  <div class="screen active" id="screen-setup">
    <div class="logo-title">통합 세로셈 훈련소 📝</div>
    <div style="color: var(--muted); text-align: center; margin-bottom: 30px;">원하는 연산을 선택하면 난이도에 맞는 동적 그리드가 생성됩니다!</div>
    
    <div class="mission-grid">
      <div class="mission-card mc-add" onclick="startGame('add')">
        <div style="font-size: 2.5rem;">➕</div>덧셈 기지<br><span style="font-size:1rem;color:#ccc;">(3자리 + 3자리)</span>
      </div>
      <div class="mission-card mc-sub" onclick="startGame('sub')">
        <div style="font-size: 2.5rem;">➖</div>뺄셈 기지<br><span style="font-size:1rem;color:#ccc;">(3자리 - 2자리)</span>
      </div>
      <div class="mission-card mc-mul" onclick="startGame('mul')">
        <div style="font-size: 2.5rem;">✖️</div>곱셈 기지<br><span style="font-size:1rem;color:#ccc;">(3자리 x 2자리)</span>
      </div>
      <div class="mission-card mc-div" onclick="startGame('div')">
        <div style="font-size: 2.5rem;">➗</div>나눗셈 기지<br><span style="font-size:1rem;color:#ccc;">(동적 나눗셈)</span>
      </div>
    </div>
  </div>

  <!-- 게임 화면 -->
  <div class="screen" id="screen-game">
    <div class="game-header">
      <div class="game-stat-box" id="game-title">덧셈 기지</div>
      <div>
        <button class="print-btn" onclick="printWorksheet()">🖨️ 오늘의 문제 인쇄하기</button>
      </div>
      <div class="game-stat-box" id="game-qnum">1/10</div>
    </div>
    
    <div class="v-board-container">
      <div class="v-board" id="vertical-container"></div>
    </div>
    
    <div class="feedback-msg" id="v-feedbackMsg"></div>
    
    <!-- 가상 키패드 -->
    <div class="numpad-container">
      <button class="numpad-btn" onclick="pressNum('1')">1</button>
      <button class="numpad-btn" onclick="pressNum('2')">2</button>
      <button class="numpad-btn" onclick="pressNum('3')">3</button>
      <button class="numpad-btn" onclick="pressNum('4')">4</button>
      <button class="numpad-btn" onclick="pressNum('5')">5</button>
      <button class="numpad-btn" onclick="pressNum('6')">6</button>
      <button class="numpad-btn" onclick="pressNum('7')">7</button>
      <button class="numpad-btn" onclick="pressNum('8')">8</button>
      <button class="numpad-btn" onclick="pressNum('9')">9</button>
      <button class="numpad-btn action" onclick="pressClear()">C</button>
      <button class="numpad-btn" onclick="pressNum('0')">0</button>
      <button class="numpad-btn action" onclick="pressBackspace()">←</button>
      <button class="numpad-btn submit" onclick="submitAnswer()">✅ 정답 확인</button>
    </div>
  </div>

  <!-- 결과 화면 -->
  <div class="screen" id="screen-result">
    <div class="result-card">
      <div class="result-emoji">🎉</div>
      <h2 style="font-family:'Jua'; font-size:2rem; margin-bottom:10px;">훈련 완료!</h2>
      <div class="result-score" id="r-score">100점</div>
      <div id="r-detail" style="font-size:1.1rem; color:var(--muted); margin-bottom:30px;">10문제 중 10개 성공!</div>
      <button class="btn-big" onclick="goSetup()">🔄 다른 연산 도전하기</button>
    </div>
  </div>

  <!-- 인쇄 전용 영역 -->
  <div id="print-area"></div>

</div>

<script src="../../config.js"></script>
<script src="../../js/vertical_math_logic.js"></script>
</body>
</html>
