<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>민민 우주 정거장 🚀 - 통합 세로셈 본부 (동적 그리드)</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gaegu:wght@400;700&family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0B0B1A; --surface: #16162C; --card: rgba(22, 22, 44, 0.8);
    --border: #2A2A4A; --yellow: #FFD93D; --orange: #FF6B35;
    --green: #6BCB77; --blue: #4D96FF; --pink: #FF6B9D;
    --purple: #C77DFF; --cyan: #00D4FF; --white: #F5F5F5; --dark: #2D2D4E; --muted: #8888AA;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Nanum Gothic', sans-serif; background: var(--bg); color: var(--white); min-height: 100vh; overflow-x: hidden; touch-action: manipulation; }

  /* 🌌 심우주 배경 */
  body::before {
    content: ''; position: fixed; inset: 0;
    background-image:
      radial-gradient(1.5px 1.5px at 15% 20%, white 0%, transparent 100%),
      radial-gradient(2px 2px at 70% 35%, var(--yellow) 0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 55% 85%, var(--cyan) 0%, transparent 100%),
      radial-gradient(2px 2px at 10% 50%, var(--pink) 0%, transparent 100%),
      radial-gradient(1px 1px at 80% 65%, white 0%, transparent 100%);
    pointer-events: none; z-index: 0;
  }

  .app-container { max-width: 600px; margin: 0 auto; padding: 20px; position: relative; z-index: 1; display: flex; flex-direction: column; min-height: 100vh; }
  
  /* 🛠️ 상단 UI */
  .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .profile-badge { background: rgba(0,212,255,0.1); border: 2px solid var(--cyan); color: var(--cyan); padding: 8px 16px; border-radius: 30px; font-family: 'Jua', sans-serif; font-size: 1.1rem; }
  .exit-btn { background: rgba(255,255,255,0.1); border: 2px solid var(--muted); color: var(--white); padding: 8px 16px; border-radius: 30px; font-family: 'Jua', sans-serif; font-size: 1rem; cursor: pointer; transition: 0.2s; }
  .exit-btn:hover { background: rgba(255,107,53,0.2); border-color: var(--orange); color: var(--orange); }

  .screen { display: none; flex-direction: column; align-items: center; width: 100%; flex: 1; }
  .screen.active { display: flex; }

  .logo-title { font-family: 'Jua', sans-serif; font-size: 2.5rem; text-align: center; background: linear-gradient(135deg, var(--cyan), var(--purple), var(--pink)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 20px; }

  /* 🪐 행성계 (섹션) 그리드 */
  .mission-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; width: 100%; margin-bottom: 20px; }
  .mission-card { background: var(--card); border: 2px solid var(--border); border-radius: 20px; padding: 20px 10px; text-align: center; cursor: pointer; font-family: 'Jua', sans-serif; font-size: 1.5rem; color: var(--white); transition: 0.2s; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .mission-card:hover { transform: translateY(-5px); }
  .mc-add { border-color: var(--pink); color: var(--pink); }
  .mc-sub { border-color: var(--green); color: var(--green); }
  .mc-mul { border-color: var(--yellow); color: var(--yellow); }
  .mc-div { border-color: var(--cyan); color: var(--cyan); }

  /* 게임 화면 상단바 */
  .game-header { width: 100%; display: flex; justify-content: space-between; margin-bottom: 10px; font-family: 'Jua', sans-serif; font-size: 1.2rem; }
  .game-stat-box { background: rgba(255,255,255,0.1); border-radius: 14px; padding: 6px 14px; border: 1px solid var(--border); }
  
  /* 동적 세로셈 보드 (CSS Grid) */
  .v-board-container { width: 100%; display: flex; justify-content: center; margin-bottom: 20px; flex: 1; align-items: center; }
  
  .v-board { 
    background: #fff; 
    padding: 20px 25px; 
    border-radius: 24px; 
    border: 4px solid var(--cyan); 
    box-shadow: 0 10px 30px rgba(0,0,0,0.3); 
    display: inline-block; 
    font-family: 'Jua', sans-serif; 
  }

  .math-grid {
    display: grid;
    gap: 6px;
    justify-content: center;
  }

  .grid-cell {
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 2.2rem;
    font-weight: bold;
    color: var(--dark);
    width: 45px;
    height: 50px;
  }

  .grid-input {
    width: 100%;
    height: 100%;
    min-height: 50px;
    font-size: 2rem;
    text-align: center;
    border: 2px dashed #b0b0b0;
    border-radius: 8px;
    background: #fff;
    color: var(--dark);
    cursor: pointer;
    outline: none;
    font-family: 'Jua', sans-serif;
    transition: 0.2s;
  }

  .grid-input.cell-carry {
    min-height: 35px;
    height: 35px;
    font-size: 1.3rem;
    color: var(--pink);
    background: #fffceb;
    border-color: #f7d5e1;
    align-self: end;
  }

  .grid-input.cell-ans {
    border: 3px solid #ccc;
    background: #f8f8f8;
  }

  .grid-input.focused {
    border-color: var(--cyan) !important;
    background: #e0f7fa !important;
    border-style: solid !important;
    box-shadow: 0 0 8px rgba(0, 212, 255, 0.4);
    transform: scale(1.05);
    z-index: 10;
  }

  .grid-line {
    background: var(--dark);
    height: 4px;
    border-radius: 2px;
    margin: 4px 0;
    align-self: center;
  }

  .cell-op {
    color: var(--pink);
  }

  .feedback-msg { font-family: 'Jua', sans-serif; font-size: 1.3rem; text-align: center; height: 2rem; margin-bottom: 10px; color: var(--yellow); }

  /* 📱 가상 키패드 */
  .numpad-container { width: 100%; background: rgba(22, 22, 44, 0.9); padding: 15px; border-radius: 24px 24px 0 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: auto; border-top: 1px solid var(--border); box-shadow: 0 -5px 20px rgba(0,0,0,0.5); }
  .numpad-btn { background: rgba(255, 255, 255, 0.1); border: 2px solid rgba(255,255,255,0.15); border-radius: 16px; padding: 15px; font-size: 1.8rem; font-family: 'Jua', sans-serif; color: var(--white); cursor: pointer; transition: 0.1s; }
  .numpad-btn:active { transform: scale(0.95); background: rgba(255, 255, 255, 0.25); }
  .numpad-btn.action { background: rgba(255, 107, 157, 0.15); border-color: var(--pink); color: var(--pink); }
  .numpad-btn.submit { grid-column: span 3; background: linear-gradient(135deg, var(--cyan), var(--blue)); color: #fff; border: none; font-size: 1.5rem; padding: 18px; }

  /* 결과창 */
  .result-card { background: var(--card); border-radius: 30px; padding: 40px 32px; width: 100%; text-align: center; border: 2px solid var(--border); }
  .result-emoji { font-size: 4rem; margin-bottom: 10px; }
  .result-score { font-size: 3.5rem; color: var(--yellow); margin-bottom: 20px; font-family: 'Jua'; }
  .btn-big { background: linear-gradient(135deg, var(--purple), var(--pink)); color: white; border: none; padding: 16px 30px; font-size: 1.4rem; font-family: 'Jua', sans-serif; border-radius: 20px; cursor: pointer; width: 100%; }

  @keyframes shake {
    0% { transform: translateX(0); }
    20% { transform: translateX(-10px); }
    40% { transform: translateX(10px); }
    60% { transform: translateX(-10px); }
    80% { transform: translateX(10px); }
    100% { transform: translateX(0); }
  }
</style>
</head>
<body>

<div class="app-container">
  <div class="top-bar">
    <div class="profile-badge">
      <span id="userIcon">👨‍🚀</span> <span id="userName">로딩중...</span>
    </div>
    <button class="exit-btn" onclick="location.href='math.html'">🔙 수학 탐험 본부</button>
  </div>

  <!-- 설정(메인) 화면 -->
  <div class="screen active" id="screen-setup">
    <div class="logo-title">통합 세로셈 훈련소 📝</div>
    <div style="color: var(--muted); text-align: center; margin-bottom: 30px;">원하는 연산을 선택하면 난이도에 맞는 동적 그리드가 생성됩니다!</div>
    
    <div class="mission-grid">
      <div class="mission-card mc-add" onclick="startGame('add')">
        <div style="font-size: 2.5rem;">➕</div>덧셈 기지<br><span style="font-size:1rem;color:#ccc;">(3자리 + 3자리)</span>
      </div>
      <div class="mission-card mc-sub" onclick="startGame('sub')">
        <div style="font-size: 2.5rem;">➖</div>뺄셈 기지<br><span style="font-size:1rem;color:#ccc;">(3자리 - 2자리)</span>
      </div>
      <div class="mission-card mc-mul" onclick="startGame('mul')">
        <div style="font-size: 2.5rem;">✖️</div>곱셈 기지<br><span style="font-size:1rem;color:#ccc;">(3자리 x 2자리)</span>
      </div>
      <div class="mission-card mc-div" onclick="startGame('div')">
        <div style="font-size: 2.5rem;">➗</div>나눗셈 기지<br><span style="font-size:1rem;color:#ccc;">(동적 나눗셈)</span>
      </div>
    </div>
  </div>

  <!-- 게임 화면 -->
  <div class="screen" id="screen-game">
    <div class="game-header">
      <div class="game-stat-box" id="game-title">덧셈 기지</div>
      <div class="game-stat-box" id="game-qnum">1/10</div>
    </div>
    
    <div class="v-board-container">
      <div class="v-board" id="vertical-container"></div>
    </div>
    
    <div class="feedback-msg" id="v-feedbackMsg"></div>
    
    <!-- 가상 키패드 -->
    <div class="numpad-container">
      <button class="numpad-btn" onclick="pressNum('1')">1</button>
      <button class="numpad-btn" onclick="pressNum('2')">2</button>
      <button class="numpad-btn" onclick="pressNum('3')">3</button>
      <button class="numpad-btn" onclick="pressNum('4')">4</button>
      <button class="numpad-btn" onclick="pressNum('5')">5</button>
      <button class="numpad-btn" onclick="pressNum('6')">6</button>
      <button class="numpad-btn" onclick="pressNum('7')">7</button>
      <button class="numpad-btn" onclick="pressNum('8')">8</button>
      <button class="numpad-btn" onclick="pressNum('9')">9</button>
      <button class="numpad-btn action" onclick="pressClear()">C</button>
      <button class="numpad-btn" onclick="pressNum('0')">0</button>
      <button class="numpad-btn action" onclick="pressBackspace()">←</button>
      <button class="numpad-btn submit" onclick="submitAnswer()">✅ 정답 확인</button>
    </div>
  </div>

  <!-- 결과 화면 -->
  <div class="screen" id="screen-result">
    <div class="result-card">
      <div class="result-emoji">🎉</div>
      <h2 style="font-family:'Jua'; font-size:2rem; margin-bottom:10px;">훈련 완료!</h2>
      <div class="result-score" id="r-score">100점</div>
      <div id="r-detail" style="font-size:1.1rem; color:var(--muted); margin-bottom:30px;">10문제 중 10개 성공!</div>
      <button class="btn-big" onclick="goSetup()">🔄 다른 연산 도전하기</button>
    </div>
  </div>

</div>

<script src="../../config.js"></script>
<script>
  let currentProfile = localStorage.getItem('currentUser') || 'son';
  let gameState = { mode: '', questions: [], current: 0, correctCount: 0 };
  let focusedInput = null;
  window.wrongNotes = JSON.parse(localStorage.getItem(`minmin_math_wrong_${currentProfile}`)) || [];

  document.addEventListener("DOMContentLoaded", () => {
    const name = currentProfile === 'son' ? '민수' : (currentProfile === 'daughter' ? '민서' : '어른');
    const icon = currentProfile === 'son' ? '👨‍🚀' : (currentProfile === 'daughter' ? '👩‍🚀' : '👨‍💻');
    document.getElementById('userName').textContent = `${name} 탐험대원`;
    document.getElementById('userIcon').textContent = icon;
  });

  function setFocus(el) {
    if (!el) return;
    document.querySelectorAll('.grid-input').forEach(i => i.classList.remove('focused'));
    el.classList.add('focused');
    focusedInput = el;
  }

  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  function goSetup() { showScreen('screen-setup'); }

  // 가상 키패드 로직 (자동 이동 기능 추가)
  function pressNum(num) {
    if (!focusedInput) return;
    focusedInput.value = num; // 동적 그리드는 셀당 1글자만!
    
    // 왼쪽 칸으로 자동 이동 (세로셈은 오른쪽에서 왼쪽으로 푸는 게 자연스러우므로)
    const row = parseInt(focusedInput.dataset.row);
    const col = parseInt(focusedInput.dataset.col);
    const nextInput = document.querySelector(`.grid-input[data-row="${row}"][data-col="${col - 1}"]`);
    if (nextInput) setFocus(nextInput);
  }
  
  function pressBackspace() {
    if (!focusedInput) return;
    focusedInput.value = '';
    
    // 지울 때는 오른쪽 칸으로 역이동
    const row = parseInt(focusedInput.dataset.row);
    const col = parseInt(focusedInput.dataset.col);
    const prevInput = document.querySelector(`.grid-input[data-row="${row}"][data-col="${col + 1}"]`);
    if (prevInput) setFocus(prevInput);
  }
  
  function pressClear() {
    if (!focusedInput) return;
    focusedInput.value = '';
  }

  // 문제 생성기 (동적 그리드를 뽐내기 위해 자릿수 강화)
  function generateQuestions(mode) {
    const qs = [];
    for(let i=0; i<10; i++) {
      let a, b, ans, rem = 0;
      if (mode === 'add') {
        a = Math.floor(Math.random() * 800) + 111; // 3자리
        b = Math.floor(Math.random() * 800) + 111; // 3자리
        ans = a + b;
      } else if (mode === 'sub') {
        a = Math.floor(Math.random() * 800) + 200; // 3자리
        b = Math.floor(Math.random() * (a - 100)) + 100; // 2~3자리
        ans = a - b;
      } else if (mode === 'mul') {
        a = Math.floor(Math.random() * 800) + 111; // 3자리
        b = Math.floor(Math.random() * 80) + 11;   // 2자리
        ans = a * b;
      } else if (mode === 'div') {
        b = Math.floor(Math.random() * 80) + 11; // 2자리 제수
        ans = Math.floor(Math.random() * 8) + 2; // 1자리 몫
        rem = Math.floor(Math.random() * b);     // 나머지
        a = (b * ans) + rem;                     // 피제수 계산
      }
      qs.push({ numA: a, numB: b, answer: ans, rem });
    }
    return qs;
  }

  function startGame(mode) {
    gameState = { mode, questions: generateQuestions(mode), current: 0, correctCount: 0 };
    
    const titles = { add: '➕ 덧셈 기지 (3자리+3자리)', sub: '➖ 뺄셈 기지 (3자리-2자리)', mul: '✖️ 곱셈 기지 (3자리x2자리)', div: '➗ 나눗셈 기지 (동적 나눗셈)' };
    document.getElementById('game-title').textContent = titles[mode];
    
    showScreen('screen-game');
    nextQuestion();
  }

  // 🚀 핵심: 세로셈 동적 그리드 생성 함수
  function renderDynamicGrid(mode, q) {
    const aStr = String(q.numA);
    const bStr = String(q.numB);
    let W = 0;
    let gridHTML = '';

    const commonInp = `inputmode="none" readonly onclick="setFocus(this)"`;

    if (mode === 'add' || mode === 'sub') {
        W = Math.max(aStr.length, bStr.length) + 2; // 연산자 기호 칸 1개 + 올림수 여유 칸 1개
        gridHTML += `<div class="math-grid" style="grid-template-columns: repeat(${W}, 45px);">`;
        
        // 1행: 올림/내림수 메모 (cell-carry)
        for(let c=1; c<=W; c++) {
            gridHTML += `<input type="text" class="grid-input cell-carry" data-row="1" data-col="${c}" style="grid-area: 1 / ${c};" ${commonInp}>`;
        }
        
        // 2행: 피연산자 A (오른쪽 정렬)
        for(let i=0; i<aStr.length; i++) {
            let c = W - aStr.length + 1 + i;
            gridHTML += `<div class="grid-cell" style="grid-area: 2 / ${c};">${aStr[i]}</div>`;
        }
        
        // 3행: 연산자 기호 & 피연산자 B (오른쪽 정렬)
        const opSym = mode === 'add' ? '＋' : '－';
        let opCol = W - Math.max(aStr.length, bStr.length);
        gridHTML += `<div class="grid-cell cell-op" style="grid-area: 3 / ${opCol};">${opSym}</div>`;
        
        for(let i=0; i<bStr.length; i++) {
            let c = W - bStr.length + 1 + i;
            gridHTML += `<div class="grid-cell" style="grid-area: 3 / ${c};">${bStr[i]}</div>`;
        }
        
        // 4행: 밑줄
        gridHTML += `<div class="grid-line" style="grid-area: 4 / 1 / 4 / ${W + 1};"></div>`;
        
        // 5행: 최종 정답 (cell-ans)
        for(let c=1; c<=W; c++) {
            gridHTML += `<input type="text" class="grid-input cell-ans" data-type="ans" data-row="5" data-col="${c}" style="grid-area: 5 / ${c};" ${commonInp}>`;
        }
        gridHTML += `</div>`;
    }
    else if (mode === 'mul') {
        W = aStr.length + bStr.length + 1; // 곱셈 결과 최대 길이 + 1
        gridHTML += `<div class="math-grid" style="grid-template-columns: repeat(${W}, 45px);">`;
        
        // 1행: 올림수
        for(let c=1; c<=W; c++) {
            gridHTML += `<input type="text" class="grid-input cell-carry" data-row="1" data-col="${c}" style="grid-area: 1 / ${c};" ${commonInp}>`;
        }
        
        // 2행: 피연산자 A
        for(let i=0; i<aStr.length; i++) {
            let c = W - aStr.length + 1 + i;
            gridHTML += `<div class="grid-cell" style="grid-area: 2 / ${c};">${aStr[i]}</div>`;
        }
        
        // 3행: 연산자 & 피연산자 B
        let opCol = W - Math.max(aStr.length, bStr.length);
        gridHTML += `<div class="grid-cell cell-op" style="grid-area: 3 / ${opCol};">×</div>`;
        for(let i=0; i<bStr.length; i++) {
            let c = W - bStr.length + 1 + i;
            gridHTML += `<div class="grid-cell" style="grid-area: 3 / ${c};">${bStr[i]}</div>`;
        }
        
        // 4행: 첫 번째 밑줄
        gridHTML += `<div class="grid-line" style="grid-area: 4 / 2 / 4 / ${W + 1};"></div>`;
        
        let row = 5;
        // B가 2자리 이상일 때 중간 풀이과정 행 생성
        if (bStr.length > 1) {
            // 오른쪽 자릿수부터 한 줄씩 생성
            for(let j=bStr.length-1; j>=0; j--) {
                let shift = (bStr.length - 1) - j; // 왼쪽으로 이동할 칸 수
                for(let k=0; k<=aStr.length+1; k++) {
                    let c = W - shift - k;
                    if(c > 0) {
                        gridHTML += `<input type="text" class="grid-input cell-inter" data-row="${row}" data-col="${c}" style="grid-area: ${row} / ${c};" ${commonInp}>`;
                    }
                }
                row++;
            }
            // 덧셈 전 두 번째 밑줄
            gridHTML += `<div class="grid-line" style="grid-area: ${row} / 1 / ${row} / ${W + 1};"></div>`;
            row++;
        }
        
        // 마지막 행: 최종 정답
        for(let c=1; c<=W; c++) {
            gridHTML += `<input type="text" class="grid-input cell-ans" data-type="ans" data-row="${row}" data-col="${c}" style="grid-area: ${row} / ${c};" ${commonInp}>`;
        }
        gridHTML += `</div>`;
    }
    else if (mode === 'div') {
        W = aStr.length + bStr.length + 2; 
        gridHTML += `<div class="math-grid" style="grid-template-columns: repeat(${W}, 45px);">`;
        
        let row = 1;
        // 1행: 몫 (Quotient)
        for (let i = 0; i < aStr.length; i++) {
            let c = bStr.length + 2 + i;
            gridHTML += `<input type="text" class="grid-input cell-ans" data-type="q" data-row="${row}" data-col="${c}" style="grid-area: ${row} / ${c};" ${commonInp}>`;
        }
        row++;
        
        // 2행: 지붕 모양 가로선
        gridHTML += `<div class="grid-line" style="grid-area: ${row} / ${bStr.length + 2} / ${row} / ${W + 1};"></div>`;
        row++;
        
        // 3행: 제수 ) 피제수
        for (let i = 0; i < bStr.length; i++) {
            gridHTML += `<div class="grid-cell" style="grid-area: ${row} / ${1 + i};">${bStr[i]}</div>`;
        }
        gridHTML += `<div class="grid-cell cell-op" style="grid-area: ${row} / ${bStr.length + 1};">)</div>`;
        for (let i = 0; i < aStr.length; i++) {
            let c = bStr.length + 2 + i;
            gridHTML += `<div class="grid-cell" style="grid-area: ${row} / ${c};">${aStr[i]}</div>`;
        }
        row++;
        
        // 4행: 곱셈 결과 빼기 (Intermediate)
        for (let i = 0; i < aStr.length; i++) {
            let c = bStr.length + 2 + i;
            gridHTML += `<input type="text" class="grid-input cell-inter" data-row="${row}" data-col="${c}" style="grid-area: ${row} / ${c};" ${commonInp}>`;
        }
        row++;
        
        // 5행: 밑줄
        gridHTML += `<div class="grid-line" style="grid-area: ${row} / ${bStr.length + 2} / ${row} / ${W + 1};"></div>`;
        row++;
        
        // 6행: 나머지 (Remainder)
        for (let i = 0; i < aStr.length; i++) {
            let c = bStr.length + 2 + i;
            gridHTML += `<input type="text" class="grid-input cell-ans" data-type="rem" data-row="${row}" data-col="${c}" style="grid-area: ${row} / ${c};" ${commonInp}>`;
        }
        gridHTML += `</div>`;
    }

    document.getElementById('vertical-container').innerHTML = gridHTML;

    // 포커스 자동 지정 로직: 입력해야 할 칸 중 가장 오른쪽 칸을 찾아서 포커스
    const ansCells = Array.from(document.querySelectorAll('.cell-ans, .cell-inter'));
    if (ansCells.length > 0) {
        // 배열의 맨 마지막 요소가 통상적으로 가장 아래쪽, 가장 오른쪽 칸임
        setFocus(ansCells[ansCells.length - 1]);
    }
  }

  function nextQuestion() {
    if (gameState.current >= gameState.questions.length) {
      showResult();
      return;
    }
    const q = gameState.questions[gameState.current];
    document.getElementById('game-qnum').textContent = `${gameState.current + 1} / ${gameState.questions.length}`;
    document.getElementById('v-feedbackMsg').textContent = '';
    
    // 동적 그리드 생성 호출
    renderDynamicGrid(gameState.mode, q);
  }

  function submitAnswer() {
    const q = gameState.questions[gameState.current];
    let isCorrect = false;
    let userAnsText = "";
    let correctAnsText = "";

    if (gameState.mode === 'div') {
        const qCells = Array.from(document.querySelectorAll('.cell-ans[data-type="q"]'));
        const qStr = qCells.map(c => c.value || '0').join('');
        const userQ = parseInt(qStr, 10);
        
        const remCells = Array.from(document.querySelectorAll('.cell-ans[data-type="rem"]'));
        const remStr = remCells.map(c => c.value || '0').join('');
        const userRem = parseInt(remStr, 10);

        isCorrect = (userQ === q.answer && userRem === q.rem);
        userAnsText = `몫 ${userQ} 나머지 ${userRem}`;
        correctAnsText = `몫 ${q.answer} 나머지 ${q.rem}`;
    } else {
        const ansCells = Array.from(document.querySelectorAll('.cell-ans[data-type="ans"]'));
        const ansStr = ansCells.map(c => c.value || '').join('');
        if (ansStr === '') return; // 아무것도 입력 안했을 때
        const userAns = parseInt(ansStr, 10);
        isCorrect = (userAns === q.answer);
        userAnsText = `${userAns}`;
        correctAnsText = `${q.answer}`;
    }

    const msgBox = document.getElementById('v-feedbackMsg');
    if (isCorrect) {
        // 🎵 딩동댕 연출
        document.querySelectorAll('.cell-ans').forEach(c => {
            c.style.borderColor = 'var(--green)';
            c.style.background = '#e8f5e9';
        });
        msgBox.style.color = 'var(--green)';
        msgBox.textContent = "딩동댕! 정답입니다! 🎵🎉";
        
        gameState.correctCount++;
        gameState.current++;
        setTimeout(nextQuestion, 1200); // 1.2초 후 자동으로 다음 문제 그려짐
    } else {
        // 💥 땡 연출
        document.querySelectorAll('.cell-ans').forEach(c => {
            if(c.value !== '') {
                c.style.borderColor = 'var(--pink)';
                c.style.background = '#ffebee';
            }
        });
        document.querySelector('.v-board').style.animation = 'shake 0.4s';
        setTimeout(() => document.querySelector('.v-board').style.animation = '', 400);

        msgBox.style.color = 'var(--pink)';
        msgBox.textContent = "땡! 아쉽네요. 다시 한번 계산해볼까요? 💥";

        // 🎒 오답 가방(wrongNotes)에 저장 (해당 문제에서 처음 틀렸을 때 1회만)
        if (!q.wrongLogged) {
            let opSymbol = '';
            if(gameState.mode === 'add') opSymbol = '+';
            else if(gameState.mode === 'sub') opSymbol = '-';
            else if(gameState.mode === 'mul') opSymbol = 'x';
            else if(gameState.mode === 'div') opSymbol = '÷';

            const note = {
                text: `${q.numA} ${opSymbol} ${q.numB}`,
                userAns: userAnsText,
                answer: correctAnsText,
                opType: gameState.mode,
                timestamp: new Date().toISOString()
            };
            
            window.wrongNotes.push(note);
            localStorage.setItem(`minmin_math_wrong_${currentProfile}`, JSON.stringify(window.wrongNotes));
            q.wrongLogged = true; // 중복 저장 방지 자물쇠
            
            console.log("🎒 오답 가방에 쏙 들어갔어요!", note);
        }

        // 틀린 문제 재도전 기회 (입력 칸 초기화)
        setTimeout(() => {
            document.querySelectorAll('.cell-ans').forEach(c => {
                c.style.borderColor = '';
                c.style.background = '';
                c.value = ''; // 재도전시 정답칸 초기화
            });
            msgBox.textContent = '';
            
            // 다시 포커스
            const ansCells = Array.from(document.querySelectorAll('.cell-ans'));
            if (ansCells.length > 0) setFocus(ansCells[ansCells.length - 1]);
        }, 1800);
    }
  }

  async function showResult() {
    document.getElementById('r-score').textContent = (gameState.correctCount * 10) + '점';
    document.getElementById('r-detail').textContent = `10문제 중 ${gameState.correctCount}개 성공!`;
    showScreen('screen-result');

    // 노션 보상 연동
    if (gameState.correctCount > 0 && typeof loadCoreScripts !== 'undefined') {
        loadCoreScripts("../../core/", ["notion-helper.js"], async () => {
            if (typeof grantRewardAndShowUI === 'function') {
                window.currentSubject = "수학";
                await grantRewardAndShowUI(gameState.correctCount, false);
            }
        });
    }
  }
</script>
