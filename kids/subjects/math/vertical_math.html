<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>민민 우주 정거장 🚀 - 통합 세로셈 본부 (동적 그리드)</title>
<link rel="stylesheet" href="../../css/math_style.css">
</head>
<body>

<div class="app-container">
  <div class="top-bar">
    <div class="profile-badge">
      <span id="userIcon">👨‍🚀</span> <span id="userName">로딩중...</span>
    </div>
    <button class="exit-btn" onclick="window.exitRoom()">🔙 수학 탐험 본부</button>
  </div>

  <!-- 설정(메인) 화면 -->
  <div class="screen active" id="screen-setup">
    <div class="logo-title">통합 세로셈 훈련소 📝</div>
    <div style="color: var(--muted); text-align: center; margin-bottom: 30px;">원하는 연산을 선택하고 난이도를 골라보세요!</div>
    
    <div class="mission-grid">
      <div class="mission-card mc-add" onclick="showDifficultyModal('add')">
        <div style="font-size: 2.5rem;">➕</div>덧셈 기지<br><span style="font-size:1rem;color:#ccc;">난이도 선택</span>
      </div>
      <div class="mission-card mc-sub" onclick="showDifficultyModal('sub')">
        <div style="font-size: 2.5rem;">➖</div>뺄셈 기지<br><span style="font-size:1rem;color:#ccc;">난이도 선택</span>
      </div>
      <div class="mission-card mc-mul" onclick="showDifficultyModal('mul')">
        <div style="font-size: 2.5rem;">✖️</div>곱셈 기지<br><span style="font-size:1rem;color:#ccc;">난이도 선택</span>
      </div>
      <div class="mission-card mc-div" onclick="showDifficultyModal('div')">
        <div style="font-size: 2.5rem;">➗</div>나눗셈 기지<br><span style="font-size:1rem;color:#ccc;">난이도 선택</span>
      </div>
    </div>
  </div>

  <!-- 난이도 선택 모달 -->
  <div id="difficulty-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:9999; justify-content:center; align-items:center;">
    <div style="background:var(--card); padding:30px; border-radius:20px; text-align:center; width:90%; max-width:400px; border:2px solid var(--border);">
      <h2 id="diff-modal-title" style="font-family:'Jua'; font-size:2rem; margin-bottom:20px;">난이도 선택</h2>
      <div id="diff-buttons" style="display:flex; flex-direction:column; gap:10px; margin-bottom:20px;">
        <!-- 버튼들이 동적으로 들어갈 자리 -->
      </div>
      <button onclick="closeDifficultyModal()" style="padding:10px 20px; border-radius:10px; border:none; background:#8b949e; color:white; font-family:'Jua'; font-size:1.2rem; cursor:pointer;">취소</button>
    </div>
  </div>

  <!-- 게임 화면 -->
  <div class="screen" id="screen-game">
    <div class="game-header">
      <div class="game-stat-box" id="game-title">덧셈 기지</div>
      <div>
        <button class="print-btn" onclick="printWorksheet()">🖨️ 오늘의 문제 인쇄하기</button>
      </div>
      <div class="game-stat-box" id="game-qnum">1/10</div>
    </div>
    
    <div class="v-board-container">
      <div class="v-board" id="vertical-container"></div>
    </div>
    
    <div class="feedback-msg" id="v-feedbackMsg"></div>
    
    <!-- 가상 키패드 -->
    <div class="numpad-container">
      <button class="numpad-btn" onclick="pressNum('1')">1</button>
      <button class="numpad-btn" onclick="pressNum('2')">2</button>
      <button class="numpad-btn" onclick="pressNum('3')">3</button>
      <button class="numpad-btn" onclick="pressNum('4')">4</button>
      <button class="numpad-btn" onclick="pressNum('5')">5</button>
      <button class="numpad-btn" onclick="pressNum('6')">6</button>
      <button class="numpad-btn" onclick="pressNum('7')">7</button>
      <button class="numpad-btn" onclick="pressNum('8')">8</button>
      <button class="numpad-btn" onclick="pressNum('9')">9</button>
      <button class="numpad-btn action" onclick="pressClear()">C</button>
      <button class="numpad-btn" onclick="pressNum('0')">0</button>
      <button class="numpad-btn action" onclick="pressBackspace()">←</button>
      <button class="numpad-btn submit" onclick="submitAnswer()">✅ 정답 확인</button>
    </div>
  </div>

  <!-- 결과 화면 -->
  <div class="screen" id="screen-result">
    <div class="result-card">
      <div class="result-emoji">🎉</div>
      <h2 style="font-family:'Jua'; font-size:2rem; margin-bottom:10px;">훈련 완료!</h2>
      <div class="result-score" id="r-score">100점</div>
      <div id="r-detail" style="font-size:1.1rem; color:var(--muted); margin-bottom:30px;">10문제 중 10개 성공!</div>
      <button class="btn-big" onclick="goSetup()">🔄 다른 연산 도전하기</button>
    </div>
  </div>

  <!-- 인쇄 전용 영역 -->
  <div id="print-area"></div>

</div>

<script src="../../config.js"></script>
<script src="../../js/vertical_math_logic.js"></script>
</body>
</html>
