<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>민수와 친구들의 지구 지키기: 기후 수업 대모험 📖 | 민민이네 공부방</title>
<link rel="stylesheet" href="../../css/design-system.css">
<style>
    @import url('https://fonts.googleapis.com/css2?family=Jua&family=Nanum+Gothic:wght@400;700;800&family=Gaegu:wght@400;700&display=swap');

    :root {
        --primary: #10b981;
        --primary-dark: #059669;
        --accent: #f59e0b;
        --bg-color: #0f172a;
        --card-bg: #1e293b;
        --text-light: #f8fafc;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        font-family: 'Nanum Gothic', sans-serif;
        background: #0f172a;
        min-height: 100vh;
        color: var(--text-light);
        display: flex;
        flex-direction: column;
    }

    /* 상단 헤더 바 */
    .top-bar {
        display: flex; justify-content: space-between; align-items: center;
        padding: 10px 18px; background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(12px);
        box-shadow: 0 2px 15px rgba(0,0,0,0.5); position: sticky; top: 0; z-index: 100;
        border-bottom: 1px solid #334155;
    }
    .top-left { display: flex; align-items: center; gap: 12px; }
    .btn-back {
        display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px;
        background: #334155; color: #e2e8f0; border-radius: 12px; font-family: 'Jua', sans-serif;
        font-size: 0.95rem; text-decoration: none; border: none; cursor: pointer; transition: all 0.2s;
    }
    .btn-back:hover { background: #475569; color: #fff; }
    .story-title {
        font-family: 'Jua', sans-serif; font-size: 1.2rem; color: #34d399;
        display: flex; align-items: center; gap: 8px;
    }

    /* 뷰 모드 전환 탭 */
    .view-mode-tabs {
        display: flex; background: #1e293b; padding: 4px; border-radius: 14px;
        border: 1px solid #475569;
    }
    .tab-btn {
        padding: 6px 14px; border-radius: 10px; border: none; font-family: 'Jua', sans-serif;
        font-size: 0.95rem; color: #94a3b8; background: transparent; cursor: pointer;
        transition: all 0.2s; display: flex; align-items: center; gap: 6px;
    }
    .tab-btn.active {
        background: #10b981; color: white; box-shadow: 0 2px 8px rgba(16, 185, 129, 0.4);
    }

    /* ==========================================
       1. 📖 책 넘김 모드 (E-Book Spread Mode)
       ========================================== */
    .ebook-container {
        flex: 1; max-width: 1080px; width: 100%; margin: 10px auto; padding: 0 12px;
        display: flex; flex-direction: column; justify-content: center; align-items: center;
    }
    .book-frame {
        position: relative; width: 100%; max-width: 960px;
        background: #1e293b; border-radius: 16px; padding: 10px;
        box-shadow: 0 20px 50px rgba(0,0,0,0.6), 0 0 0 2px #334155;
        display: flex; justify-content: center; align-items: center;
    }
    .book-spread-img {
        width: 100%; height: auto; max-height: 75vh; object-fit: contain;
        border-radius: 10px; box-shadow: 0 8px 25px rgba(0,0,0,0.4);
        display: block;
    }
    .ebook-controls {
        width: 100%; max-width: 960px; margin-top: 14px;
        display: flex; justify-content: space-between; align-items: center; gap: 12px;
        flex-wrap: wrap;
    }
    .btn-page-nav {
        padding: 10px 20px; border-radius: 14px; border: none; font-family: 'Jua', sans-serif;
        font-size: 1.1rem; cursor: pointer; transition: all 0.2s;
        display: flex; align-items: center; gap: 6px;
    }
    .btn-prev { background: #334155; color: #f1f5f9; }
    .btn-prev:hover:not(:disabled) { background: #475569; }
    .btn-next {
        background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        color: white; box-shadow: 0 4px 14px rgba(16, 185, 129, 0.4);
    }
    .btn-page-nav:disabled { opacity: 0.3; cursor: not-allowed; }
    .page-indicator {
        font-family: 'Jua', sans-serif; font-size: 1.15rem; color: #34d399;
        background: #1e293b; padding: 6px 16px; border-radius: 20px; border: 1px solid #334155;
    }
    .audio-control-bar {
        display: flex; align-items: center; gap: 10px; background: #1e293b;
        padding: 8px 16px; border-radius: 16px; border: 1px solid #334155;
    }
    .btn-play {
        padding: 8px 16px; border-radius: 12px; border: none; font-family: 'Jua', sans-serif;
        font-size: 1rem; color: white; background: #10b981; cursor: pointer;
        display: inline-flex; align-items: center; gap: 6px;
    }
    .btn-play.playing { background: #f59e0b; }
    .auto-read-label {
        display: inline-flex; align-items: center; gap: 6px; font-size: 0.88rem;
        font-family: 'Jua', sans-serif; color: #cbd5e1; cursor: pointer;
    }
    .auto-read-label input { width: 16px; height: 16px; accent-color: #10b981; cursor: pointer; }

    /* ========================================================
       2. 📜 웹툰 스크롤 모드 (대형 그림 + 아래 큼직한 글밥 분리 뷰)
       ======================================================== */
    .webtoon-container {
        display: none; max-width: 680px; width: 100%; margin: 15px auto;
        padding: 0 10px 40px 10px; flex-direction: column; gap: 35px;
    }
    .webtoon-sticky-bar {
        position: sticky; top: 60px; z-index: 90;
        background: rgba(30, 41, 59, 0.95); backdrop-filter: blur(10px);
        padding: 10px 16px; border-radius: 16px; border: 1.5px solid #10b981;
        display: flex; justify-content: space-between; align-items: center;
        box-shadow: 0 8px 25px rgba(0,0,0,0.6);
    }
    .continuous-btn {
        padding: 8px 16px; border-radius: 12px; border: none; font-family: 'Jua', sans-serif;
        font-size: 0.95rem; color: white; background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
    }
    .continuous-btn.playing { background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); }

    /* 웹툰 각 단원 카드 */
    .webtoon-card {
        background: #1e293b; border-radius: 20px; overflow: hidden;
        box-shadow: 0 15px 35px rgba(0,0,0,0.6); border: 2px solid #334155;
        display: flex; flex-direction: column;
    }
    .webtoon-header {
        padding: 12px 16px; background: #0f172a; display: flex;
        justify-content: space-between; align-items: center; border-bottom: 1px solid #334155;
    }
    .webtoon-tag {
        font-family: 'Jua', sans-serif; font-size: 1rem; color: #34d399;
        display: flex; align-items: center; gap: 6px;
    }
    .btn-card-audio {
        padding: 6px 14px; border-radius: 10px; border: none; font-family: 'Jua', sans-serif;
        font-size: 0.9rem; color: white; background: #334155; cursor: pointer;
        display: inline-flex; align-items: center; gap: 6px; transition: all 0.2s;
    }
    .btn-card-audio:hover { background: #475569; }
    .btn-card-audio.playing { background: #f59e0b; }

    /* 🖼️ 상단 대형 삽화 */
    .webtoon-ill-wrap {
        width: 100%; background: #0f172a; overflow: hidden;
    }
    .webtoon-ill-img {
        width: 100%; height: auto; display: block; object-fit: contain;
    }

    /* 📝 하단 큼직한 글밥 카드 */
    .webtoon-txt-wrap {
        background: #f8fafc; padding: 12px; display: flex;
        justify-content: center; align-items: center; border-top: 3px solid #10b981;
    }
    .webtoon-txt-img {
        width: 100%; height: auto; display: block; object-fit: contain;
        border-radius: 8px;
    }

    @media (max-width: 768px) {
        .top-bar { padding: 8px 10px; }
        .story-title { font-size: 1rem; }
        .tab-btn { padding: 4px 8px; font-size: 0.85rem; }
        .btn-page-nav { padding: 8px 12px; font-size: 0.95rem; }
        .page-indicator { font-size: 0.95rem; padding: 4px 10px; }
        .book-frame { padding: 4px; }
        .audio-control-bar { width: 100%; justify-content: space-between; margin-top: 6px; }
    }
</style>
</head>
<body>

<div class="top-bar">
    <div class="top-left">
        <a href="society.html" class="btn-back">🔙 사회 탐험관</a>
        <div class="story-title">📖 기후 수업 대모험</div>
    </div>

    <div class="view-mode-tabs">
        <button class="tab-btn active" id="tabEbook" onclick="setViewerMode('ebook')">📖 책장 넘김</button>
        <button class="tab-btn" id="tabWebtoon" onclick="setViewerMode('webtoon')">📜 웹툰 스크롤</button>
    </div>
</div>

<!-- ============================================================
     1. 📖 책 넘김 뷰어 (E-Book Spread View)
     ============================================================ -->
<div class="ebook-container" id="ebookView">
    <div class="book-frame">
        <img src="../../subjects/society/images/storybook/climate/climate_story_p1.png" alt="동화책 페이지" class="book-spread-img" id="ebookImg">
    </div>

    <div class="ebook-controls">
        <button class="btn-page-nav btn-prev" id="prevBtn" onclick="changePage(-1)">◀ 이전 장</button>
        <div class="page-indicator" id="pageIndicator">1 / 10 쪽</div>
        <button class="btn-page-nav btn-next" id="nextBtn" onclick="changePage(1)">다음 장 ▶</button>

        <div class="audio-control-bar">
            <button class="btn-play" id="ebookPlayBtn" onclick="toggleEbookAudio()">
                <span id="ebookPlayIcon">▶️</span> <span id="ebookPlayLabel">구연동화 듣기</span>
            </button>
            <label class="auto-read-label">
                <input type="checkbox" id="autoPlayCheckbox" checked>
                🔊 넘길 때 자동 읽기
            </label>
        </div>
    </div>
</div>

<!-- ============================================================
     2. 📜 웹툰 스크롤 뷰어 (상단 대형 그림 + 하단 큼직한 글밥 분리 뷰)
     ============================================================ -->
<div class="webtoon-container" id="webtoonView">
    <div class="webtoon-sticky-bar">
        <div style="font-family:'Jua', sans-serif; font-size:1rem; color:#34d399;">
            🎧 전체 1~10장 연속 구연동화 듣기
        </div>
        <button class="continuous-btn" id="continuousBtn" onclick="toggleContinuousPlay()">
            <span id="continuousIcon">▶️</span> <span id="continuousLabel">1장부터 연속 재생</span>
        </button>
    </div>

    <div id="webtoonCardList" style="display:flex; flex-direction:column; gap:35px;"></div>
</div>

<audio id="mainAudio" preload="auto"></audio>

<script>
    const STORY_DATA = [
        {
            page: 1,
            tag: "🌟 표지 : 민수와 친구들의 지구 지키기",
            spreadImg: "climate_story_p1.png",
            illImg: "climate_ill_p1.png",
            txtImg: null,
            audio: "../../assets/audio/storybook/climate/climate_story_p1.mp3"
        },
        {
            page: 2,
            tag: "🌤️ 1장 : 날씨와 기후의 차이점 (61쪽)",
            spreadImg: "climate_story_p2.png",
            illImg: "climate_ill_p2.png",
            txtImg: "climate_txt_p2.png",
            audio: "../../assets/audio/storybook/climate/climate_story_p2.mp3"
        },
        {
            page: 3,
            tag: "🌬️ 2장 : 계절마다 부는 바람의 성질 (63쪽)",
            spreadImg: "climate_story_p3.png",
            illImg: "climate_ill_p3.png",
            txtImg: "climate_txt_p3.png",
            audio: "../../assets/audio/storybook/climate/climate_story_p3.mp3"
        },
        {
            page: 4,
            tag: "🌡️ 3장 : 남북의 기온 차이와 위도 (64~65쪽)",
            spreadImg: "climate_story_p4.png",
            illImg: "climate_ill_p4.png",
            txtImg: "climate_txt_p4.png",
            audio: "../../assets/audio/storybook/climate/climate_story_p4.mp3"
        },
        {
            page: 5,
            tag: "🌧️ 4장 : 강수량 특징과 지역별 차이 (66~67쪽)",
            spreadImg: "climate_story_p5.png",
            illImg: "climate_ill_p5.png",
            txtImg: "climate_txt_p5.png",
            audio: "../../assets/audio/storybook/climate/climate_story_p5.mp3"
        },
        {
            page: 6,
            tag: "⚡ 5장 : 계절별 자연재해의 이해 (68~69쪽)",
            spreadImg: "climate_story_p6.png",
            illImg: "climate_ill_p6.png",
            txtImg: "climate_txt_p6.png",
            audio: "../../assets/audio/storybook/climate/climate_story_p6.mp3"
        },
        {
            page: 7,
            tag: "🛡️ 6장 : 재난 안전 행동 요령 (70쪽)",
            spreadImg: "climate_story_p7.png",
            illImg: "climate_ill_p7.png",
            txtImg: "climate_txt_p7.png",
            audio: "../../assets/audio/storybook/climate/climate_story_p7.mp3"
        },
        {
            page: 8,
            tag: "🌍 7장 : 지구 온난화의 심각성 (73쪽)",
            spreadImg: "climate_story_p8.png",
            illImg: "climate_ill_p8.png",
            txtImg: "climate_txt_p8.png",
            audio: "../../assets/audio/storybook/climate/climate_story_p8.mp3"
        },
        {
            page: 9,
            tag: "⚠️ 8장 : 심해지는 이상 기후와 피해 (74~75쪽)",
            spreadImg: "climate_story_p9.png",
            illImg: "climate_ill_p9.png",
            txtImg: "climate_txt_p9.png",
            audio: "../../assets/audio/storybook/climate/climate_story_p9.mp3"
        },
        {
            page: 10,
            tag: "🌱 9장 : 우리가 실천할 기후 행동 (78쪽)",
            spreadImg: "climate_story_p10.png",
            illImg: "climate_ill_p10.png",
            txtImg: "climate_txt_p10.png",
            audio: "../../assets/audio/storybook/climate/climate_story_p10.mp3"
        }
    ];

    let currentMode = 'ebook';
    let currentPageIndex = 0;
    let isContinuousPlaying = false;
    const audio = document.getElementById('mainAudio');

    function setViewerMode(mode) {
        currentMode = mode;
        audio.pause();
        updateEbookAudioUI(false);
        updateContinuousUI(false);
        isContinuousPlaying = false;

        if (mode === 'ebook') {
            document.getElementById('tabEbook').classList.add('active');
            document.getElementById('tabWebtoon').classList.remove('active');
            document.getElementById('ebookView').style.display = 'flex';
            document.getElementById('webtoonView').style.display = 'none';
            renderEbook();
        } else {
            document.getElementById('tabWebtoon').classList.add('active');
            document.getElementById('tabEbook').classList.remove('active');
            document.getElementById('ebookView').style.display = 'none';
            document.getElementById('webtoonView').style.display = 'flex';
            renderWebtoonList();
        }
    }

    function renderEbook() {
        const item = STORY_DATA[currentPageIndex];
        const img = document.getElementById('ebookImg');
        img.src = `../../subjects/society/images/storybook/climate/${item.spreadImg}?v=20260831_2`;
        document.getElementById('pageIndicator').textContent = `${item.page} / ${STORY_DATA.length} 쪽`;

        document.getElementById('prevBtn').disabled = (currentPageIndex === 0);
        document.getElementById('nextBtn').textContent = (currentPageIndex === STORY_DATA.length - 1) ? '🎉 처음으로' : '다음 장 ▶';

        audio.src = item.audio;
        audio.pause();
        updateEbookAudioUI(false);

        const autoPlay = document.getElementById('autoPlayCheckbox').checked;
        if (autoPlay) {
            setTimeout(() => {
                audio.play().then(() => {
                    updateEbookAudioUI(true);
                }).catch(() => {
                    updateEbookAudioUI(false);
                });
            }, 200);
        }
    }

    function changePage(dir) {
        audio.pause();
        if (currentPageIndex === STORY_DATA.length - 1 && dir === 1) {
            currentPageIndex = 0;
        } else {
            currentPageIndex = Math.max(0, Math.min(STORY_DATA.length - 1, currentPageIndex + dir));
        }
        renderEbook();
    }

    function toggleEbookAudio() {
        if (audio.paused) {
            audio.play();
            updateEbookAudioUI(true);
        } else {
            audio.pause();
            updateEbookAudioUI(false);
        }
    }

    function updateEbookAudioUI(isPlaying) {
        const btn = document.getElementById('ebookPlayBtn');
        const icon = document.getElementById('ebookPlayIcon');
        const label = document.getElementById('ebookPlayLabel');
        if (isPlaying) {
            btn.classList.add('playing');
            icon.textContent = '⏸️';
            label.textContent = '일시 정지';
        } else {
            btn.classList.remove('playing');
            icon.textContent = '▶️';
            label.textContent = '구연동화 듣기';
        }
    }

    function renderWebtoonList() {
        const list = document.getElementById('webtoonCardList');
        list.innerHTML = '';

        STORY_DATA.forEach((item, idx) => {
            const card = document.createElement('div');
            card.className = 'webtoon-card';
            card.id = `webtoonCard_${idx}`;

            let txtHtml = '';
            if (item.txtImg) {
                txtHtml = `
                    <div class="webtoon-txt-wrap">
                        <img src="../../subjects/society/images/storybook/climate/${item.txtImg}?v=20260831_2" alt="동화 글밥" class="webtoon-txt-img" loading="lazy">
                    </div>
                `;
            }

            card.innerHTML = `
                <div class="webtoon-header">
                    <div class="webtoon-tag">${item.tag}</div>
                    <button class="btn-card-audio" id="cardAudioBtn_${idx}" onclick="playSingleCardAudio(${idx})">
                        ▶️ ${item.page}장 듣기
                    </button>
                </div>
                <div class="webtoon-ill-wrap">
                    <img src="../../subjects/society/images/storybook/climate/${item.illImg}?v=20260831_2" alt="동화 삽화" class="webtoon-ill-img" loading="lazy">
                </div>
                ${txtHtml}
            `;
            list.appendChild(card);
        });
    }

    function playSingleCardAudio(idx) {
        isContinuousPlaying = false;
        updateContinuousUI(false);

        const currentBtn = document.getElementById(`cardAudioBtn_${idx}`);
        if (!audio.paused && currentPageIndex === idx) {
            audio.pause();
            currentBtn.classList.remove('playing');
            currentBtn.innerHTML = `▶️ ${STORY_DATA[idx].page}장 듣기`;
            return;
        }

        document.querySelectorAll('.btn-card-audio').forEach((b, i) => {
            b.classList.remove('playing');
            b.innerHTML = `▶️ ${STORY_DATA[i].page}장 듣기`;
        });

        currentPageIndex = idx;
        audio.src = STORY_DATA[idx].audio;
        audio.play().then(() => {
            currentBtn.classList.add('playing');
            currentBtn.innerHTML = `⏸️ ${STORY_DATA[idx].page}장 멈춤`;
        }).catch(e => console.log(e));
    }

    function toggleContinuousPlay() {
        if (isContinuousPlaying) {
            audio.pause();
            isContinuousPlaying = false;
            updateContinuousUI(false);
            resetAllWebtoonCardButtons();
        } else {
            isContinuousPlaying = true;
            updateContinuousUI(true);
            playContinuousFrom(0);
        }
    }

    function playContinuousFrom(idx) {
        if (idx >= STORY_DATA.length) {
            isContinuousPlaying = false;
            updateContinuousUI(false);
            resetAllWebtoonCardButtons();
            return;
        }

        currentPageIndex = idx;
        audio.src = STORY_DATA[idx].audio;

        const targetCard = document.getElementById(`webtoonCard_${idx}`);
        if (targetCard) {
            targetCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        resetAllWebtoonCardButtons();
        const activeBtn = document.getElementById(`cardAudioBtn_${idx}`);
        if (activeBtn) {
            activeBtn.classList.add('playing');
            activeBtn.innerHTML = `🔊 ${STORY_DATA[idx].page}장 재생 중`;
        }

        audio.play().catch(e => console.log(e));
    }

    function updateContinuousUI(isPlaying) {
        const btn = document.getElementById('continuousBtn');
        const icon = document.getElementById('continuousIcon');
        const label = document.getElementById('continuousLabel');
        if (isPlaying) {
            btn.classList.add('playing');
            icon.textContent = '⏸️';
            label.textContent = '연속 재생 멈춤';
        } else {
            btn.classList.remove('playing');
            icon.textContent = '▶️';
            label.textContent = '1장부터 연속 재생';
        }
    }

    function resetAllWebtoonCardButtons() {
        document.querySelectorAll('.btn-card-audio').forEach((b, i) => {
            b.classList.remove('playing');
            b.innerHTML = `▶️ ${STORY_DATA[i].page}장 듣기`;
        });
    }

    audio.onended = () => {
        if (currentMode === 'ebook') {
            updateEbookAudioUI(false);
        } else {
            if (isContinuousPlaying) {
                playContinuousFrom(currentPageIndex + 1);
            } else {
                resetAllWebtoonCardButtons();
            }
        }
    };

    window.addEventListener('keydown', (e) => {
        if (currentMode === 'ebook') {
            if (e.key === 'ArrowLeft') changePage(-1);
            if (e.key === 'ArrowRight') changePage(1);
            if (e.key === ' ') {
                e.preventDefault();
                toggleEbookAudio();
            }
        }
    });

    document.addEventListener('DOMContentLoaded', () => {
        renderEbook();
    });
</script>
</body>
</html>
