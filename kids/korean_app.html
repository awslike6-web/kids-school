<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>용어사전방 - 민민이네 공부방</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --sky: #6EC6F5; --yellow: #FFD93D; --pink: #FF6B9D; --mint: #4ECDC4;
    --purple: #A78BFA; --orange: #FF9F43; --green: #6BCB77;
    --white: #FFFEF7; --dark: #2D2D4E; --card: rgba(255,255,255,0.93);
  }
  
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body { 
    font-family: 'Jua', sans-serif; 
    background: linear-gradient(160deg, #c8f0ff 0%, #ffe8f5 50%, #fffbe6 100%); 
    min-height: 100vh; overflow-x: hidden; color: var(--dark); transition: background 0.5s ease; 
  }
  
  body.theme--minecraft { background: linear-gradient(160deg, #e0f7fa 0%, #b2ebf2 50%, #80deea 100%); }
  body.theme--slime { background: linear-gradient(160deg, #e8f5e9 0%, #c8e6c9 50%, #a5d6a7 100%); }

  .bg-floats { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .float-item { position: absolute; font-size: 1.8rem; opacity: 0.13; animation: floatUp linear infinite; font-family: 'Gaegu', cursive; font-weight: 700; color: var(--purple); }
  @keyframes floatUp { 0% { transform: translateY(110vh) rotate(0deg); opacity: 0; } 10% { opacity: 0.13; } 90% { opacity: 0.13; } 100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; } }

  .screen { position: relative; z-index: 1; display: none; flex-direction: column; align-items: center; padding: 20px 16px 40px; min-height: 100vh; width: 100%; }
  .screen.active { display: flex; }

  .main-title { font-family: 'Gaegu', cursive; font-size: clamp(2.2rem, 9vw, 3.8rem); font-weight: 700; text-align: center; line-height: 1.2; margin-bottom: 6px; filter: drop-shadow(2px 3px 0 rgba(0,0,0,0.07)); }
  .main-title .accent { color: var(--pink); }
  .main-title .accent2 { color: var(--purple); }

  .profile-switch-btn { position: absolute; top: 10px; right: 10px; background: rgba(255,255,255,0.8); border: 2px solid var(--purple); color: var(--dark); padding: 6px 12px; border-radius: 12px; font-family: 'Jua', sans-serif; font-size: 0.9rem; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.1); z-index: 10; transition: all 0.2s; }
  .user-welcome { display: inline-block; padding: 8px 20px; border-radius: 999px; background: rgba(255,255,255,0.7); border: 2.5px solid rgba(0,0,0,0.08); font-size: 1rem; margin-bottom: 14px; }

  .card { background: var(--card); border-radius: 24px; padding: 22px 24px; width: 100%; max-width: 480px; box-shadow: 0 8px 30px rgba(0,0,0,0.10); margin-bottom: 18px; border: 2.5px solid rgba(255,255,255,0.8); }
  .card-title { font-size: 1.1rem; color: var(--purple); margin-bottom: 14px; display: flex; align-items: center; gap: 6px; font-weight: bold; }
  .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  
  input[type="checkbox"], input[type="radio"] { display: none; }
  .btn-label { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 12px 4px; border-radius: 14px; border: 2.5px solid #e0e0e0; font-size: 1rem; cursor: pointer; transition: all .18s; background: #fff; text-align: center; color: var(--dark); font-weight: bold; }
  input[type="checkbox"]:checked + .btn-label { background: var(--sky); border-color: var(--sky); color: #fff; transform: scale(1.07); }
  input[name="subjectMode"]:checked + .btn-label { background: var(--mint); border-color: var(--mint); color: #fff; transform: scale(1.07); }

  .big-btn { width: 100%; max-width: 480px; padding: 16px; border-radius: 18px; border: none; font-family: 'Jua'; font-size: 1.15rem; cursor: pointer; color: #fff; margin-top: 10px; }
  .big-btn.yellow-btn { background: linear-gradient(135deg, var(--yellow), var(--orange)); color: var(--dark); font-size: 1.3rem; padding: 18px; }
  .big-btn.back-btn { background: #eee; color: #888; }

  .flashcard-container { width: 100%; max-width: 420px; perspective: 1000px; margin-bottom: 24px; }
  .flashcard { background: var(--card); border-radius: 20px; padding: 40px 24px; box-shadow: 0 8px 20px rgba(0,0,0,0.08); border: 2px solid rgba(255,255,255,0.8); min-height: 200px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; cursor: pointer; }
  .input-field { width: 100%; padding: 16px 18px; border-radius: 16px; border: 2.5px solid rgba(0,0,0,0.08); font-family: 'Jua'; font-size: 1.2rem; color: var(--dark); background: rgba(255,255,255,0.8); text-align:center; font-weight:bold; }
  .btn-group { display: flex; flex-wrap:wrap; gap: 10px; width: 100%; max-width: 420px; margin-bottom: 20px; }
  .btn { flex: 1; padding: 14px 10px; border-radius: 16px; border: none; font-family: 'Jua'; font-size: 1.1rem; cursor: pointer; font-weight: bold; }
  .btn-primary { background: linear-gradient(135deg, var(--purple), var(--pink)); color: #fff; }
  .btn-secondary { background: rgba(255,255,255,0.7); color: var(--dark); border: 2px solid rgba(0,0,0,0.08); }
</style>
</head>
<body>

<div class="bg-floats" id="bgFloats"></div>

<div class="screen active" id="screen-setup">
  <button class="profile-switch-btn" onclick="toggleProfileManually()">🔄 민수/민서 바꾸기</button>
  <h1 class="main-title"><span class="accent2">용어</span><br><span class="accent">사전방</span></h1>
  <div class="user-welcome">안녕하세요, <span id="welcomeNameSetup"></span>!</div>
  
  <div class="card">
    <div class="card-title">📗 1. 공부할 과목 고르기</div>
    <div class="grid-4" id="subjectGrid"></div>
  </div>

  <div class="card">
    <div class="card-title">📚 2. 단계 고르기</div>
    <div style="display: flex; gap: 8px; margin-bottom: 10px;">
      <button class="tiny-btn" onclick="selectAllStages(true)">전체 선택</button>
      <button class="tiny-btn" onclick="selectAllStages(false)">전체 해제</button>
    </div>
    <div class="grid-4" id="stageGrid"></div>
  </div>
  
  <button class="big-btn yellow-btn" onclick="startQuiz()">🚀 탐험 시작하기</button>
  <button class="big-btn back-btn" onclick="location.href='../index.html'">🚪 공부방 메인으로 나가기</button>
</div>

</html>
