<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>삼각형 넓이 공식 유도 🚀</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gaegu:wght@400;700&family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet">
<style>
    :root {
        --bg: #fdfbf7;
        --surface: #ffffff;
        --mint: #B5EAEA;
        --mint-border: #78C4C4;
        --orange: #FFB7B2;
        --orange-border: #FF8A8A;
        --text-main: #4a3352;
        --cyan: #00D4FF;
        --pink: #FF6B9D;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
        font-family: 'Nanum Gothic', sans-serif; 
        background: var(--bg); 
        color: var(--text-main); 
        min-height: 100vh; 
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 20px;
    }

    .header {
        text-align: center;
        margin-bottom: 20px;
        animation: fadeDown 0.6s ease both;
    }

    @keyframes fadeDown { 
        from { opacity:0; transform:translateY(-20px); } 
        to { opacity:1; transform:translateY(0); } 
    }

    .title {
        font-family: 'Jua', sans-serif;
        font-size: 2.5rem;
        color: var(--pink);
        margin-bottom: 10px;
    }

    .subtitle {
        font-size: 1.1rem;
        color: #666;
        font-weight: 700;
    }

    .card {
        background: var(--surface);
        border: 3px solid #ffe7ee;
        border-radius: 30px;
        padding: 30px;
        box-shadow: 0 15px 35px rgba(0,0,0,0.05);
        max-width: 700px;
        width: 100%;
        text-align: center;
    }

    .canvas-container {
        position: relative;
        width: 100%;
        max-width: 500px;
        margin: 0 auto 20px auto;
        background: #fff;
        border-radius: 20px;
        border: 2px dashed #e0e0e0;
        overflow: hidden;
    }

    svg {
        width: 100%;
        height: auto;
        display: block;
    }

    /* 회전 및 이동 애니메이션 트랜지션 */
    #copy-triangle {
        transition: transform 1.8s ease-in-out, filter 0.3s ease;
        transform-origin: 100px 75px; /* 삼각형의 중심점 기준 회전 */
    }

    #copy-triangle.moving {
        filter: drop-shadow(5px 15px 10px rgba(0,0,0,0.2));
    }

    .guide-box {
        background: #f8f9fa;
        border-left: 5px solid var(--cyan);
        padding: 20px;
        border-radius: 15px;
        margin-bottom: 25px;
        min-height: 120px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Jua', sans-serif;
        font-size: 1.3rem;
        line-height: 1.6;
        color: #333;
        transition: all 0.3s ease;
    }

    .controls {
        display: flex;
        gap: 15px;
        justify-content: center;
    }

    .btn {
        padding: 15px 30px;
        border: none;
        border-radius: 20px;
        font-family: 'Jua', sans-serif;
        font-size: 1.2rem;
        cursor: pointer;
        transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        box-shadow: 0 6px 15px rgba(0,0,0,0.1);
    }

    .btn:hover {
        transform: translateY(-3px) scale(1.05);
    }

    .btn:active {
        transform: translateY(2px) scale(0.95);
    }

    .btn-start {
        background: linear-gradient(135deg, var(--cyan), #009ffd);
        color: white;
    }

    .btn-reset {
        background: #e0e0e0;
        color: #555;
        display: none;
    }

    .highlight-orange { color: #FF6B35; }
    .highlight-blue { color: #4D96FF; }
    .highlight-pink { color: var(--pink); }

    .grid-pattern {
        fill: url(#grid);
    }
</style>
</head>
<body>

<div class="header">
    <div class="title">삼각형 넓이 구하기 🔺</div>
    <div class="subtitle">똑같은 삼각형 2개를 합쳐서 우리가 아는 모양을 만들어봐요!</div>
</div>

<div class="card">
    <div class="canvas-container">
        <svg viewBox="-60 -40 420 280" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
                    <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#f0f0f0" stroke-width="1"/>
                </pattern>
            </defs>

            <!-- 모눈종이 배경 -->
            <rect x="-60" y="-40" width="420" height="280" class="grid-pattern" />

            <!-- 원본 삼각형 (민트색): (0,150) -> (200,150) -> (50,0) -->
            <polygon points="0,150 200,150 50,0" fill="var(--mint)" stroke="var(--mint-border)" stroke-width="4" stroke-linejoin="round" />

            <!-- 복사본 삼각형 (주황색): 원본과 동일한 좌표에서 출발 -->
            <polygon id="copy-triangle" points="0,150 200,150 50,0" fill="var(--orange)" stroke="var(--orange-border)" stroke-width="4" stroke-linejoin="round" opacity="0.9" />

            <!-- 치수선 및 라벨 (밑변) -->
            <g id="base-group">
                <line x1="0" y1="170" x2="200" y2="170" stroke="#FF6B35" stroke-width="3" stroke-linecap="round" />
                <line x1="0" y1="165" x2="0" y2="175" stroke="#FF6B35" stroke-width="3" stroke-linecap="round" />
                <line x1="200" y1="165" x2="200" y2="175" stroke="#FF6B35" stroke-width="3" stroke-linecap="round" />
                <text x="100" y="200" text-anchor="middle" font-family="Jua" font-size="20" fill="#FF6B35" id="base-label">밑변</text>
            </g>

            <!-- 치수선 및 라벨 (높이) -->
            <g id="height-group">
                <line x1="50" y1="0" x2="50" y2="150" stroke="#4D96FF" stroke-width="3" stroke-dasharray="5,5" stroke-linecap="round" />
                <line x1="50" y1="150" x2="20" y2="150" stroke="#4D96FF" stroke-width="2" stroke-dasharray="3,3" />
                <line x1="20" y1="0" x2="20" y2="150" stroke="#4D96FF" stroke-width="3" stroke-dasharray="5,5" stroke-linecap="round" />
                <text x="10" y="80" text-anchor="end" font-family="Jua" font-size="20" fill="#4D96FF" id="height-label">높이</text>
            </g>
        </svg>
    </div>

    <div class="guide-box" id="guide-text">
        삼각형의 넓이를 어떻게 구할까요?<br>
        '공식 유도 시작' 버튼을 눌러보세요!
    </div>

    <div class="controls">
        <button class="btn btn-start" id="start-btn">✨ 공식 유도 시작</button>
        <button class="btn btn-reset" id="reset-btn">🔄 다시 보기</button>
    </div>
</div>

<script>
    const copyTriangle = document.getElementById('copy-triangle');
    const guideText = document.getElementById('guide-text');
    const startBtn = document.getElementById('start-btn');
    const resetBtn = document.getElementById('reset-btn');

    let animationTimeouts = [];

    startBtn.addEventListener('click', () => {
        startBtn.style.display = 'none';
        
        // 그림자 효과 추가
        copyTriangle.classList.add('moving');

        // 1단계: 똑같은 삼각형 1개 더 복사하여 분리 (위로 슬그머니 이동)
        copyTriangle.style.transform = 'translate(10px, -20px)';
        guideText.innerHTML = "1. 원본 삼각형과 완전히 똑같은 <span class='highlight-orange'>쌍둥이 삼각형</span>을 하나 더 준비해요!";

        // 2단계: 180도 획 뒤집기 (회전)
        animationTimeouts.push(setTimeout(() => {
            copyTriangle.style.transform = 'translate(10px, -20px) rotate(180deg)';
            guideText.innerHTML = "2. 쌍둥이 삼각형을 180도 빙글~ 뒤집어줍니다! 팽이처럼 뱅글! 💫";
        }, 2000));

        // 3단계: 오른쪽 빗변에 딱 결합하여 평행사변형 완성
        animationTimeouts.push(setTimeout(() => {
            copyTriangle.classList.remove('moving');
            // 정확히 오른쪽 빗변에 맞물리도록 좌표 평행이동 결합
            copyTriangle.style.transform = 'translate(50px, 0px) rotate(180deg)';
            
            guideText.innerHTML = `
                3. 두 삼각형을 딱 붙였더니 <b>평행사변형</b>이 완성되었어요! 🎉<br><br>
                (평행사변형 넓이) = <span class='highlight-orange'>(밑변)</span> × <span class='highlight-blue'>(높이)</span><br>
                우리가 구하려는 삼각형은 딱 절반이므로<br>
                삼각형 넓이 공식 = <b>(밑변) × (높이) <span class='highlight-pink'>÷ 2</span></b>
            `;
            
            resetBtn.style.display = 'inline-block';
        }, 4200));
    });

    resetBtn.addEventListener('click', () => {
        // 모든 타이머 초기화
        animationTimeouts.forEach(clearTimeout);
        animationTimeouts = [];

        // 초기 상태로 복구
        copyTriangle.classList.remove('moving');
        copyTriangle.style.transform = 'translate(0px, 0px) rotate(0deg)';
        
        guideText.innerHTML = "삼각형의 넓이를 어떻게 구할까요?<br>'공식 유도 시작' 버튼을 눌러보세요!";
        
        resetBtn.style.display = 'none';
        startBtn.style.display = 'inline-block';
    });
</script>

</body>
</html>
