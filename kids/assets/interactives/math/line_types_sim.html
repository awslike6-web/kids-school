<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>선분 · 반직선 · 직선 & 각의 정의 📏</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet">
<style>
    :root {
        --bg: #fdfbf7;
        --surface: #ffffff;
        --emerald: #059669;
        --emerald-light: #d1fae5;
        --blue: #2563eb;
        --pink: #ec4899;
        --orange: #f97316;
        --text-main: #1e293b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
        font-family: 'Nanum Gothic', sans-serif; 
        background: var(--bg); 
        color: var(--text-main); 
        min-height: 100vh; 
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 20px;
    }

    .header {
        text-align: center;
        margin-bottom: 16px;
        animation: fadeDown 0.6s ease both;
    }

    @keyframes fadeDown { 
        from { opacity:0; transform:translateY(-20px); } 
        to { opacity:1; transform:translateY(0); } 
    }

    .title {
        font-family: 'Jua', sans-serif;
        font-size: 2.3rem;
        color: var(--emerald);
        margin-bottom: 6px;
    }

    .subtitle {
        font-size: 1.05rem;
        color: #64748b;
        font-weight: 700;
    }

    .card {
        background: var(--surface);
        border: 3px solid var(--emerald-light);
        border-radius: 28px;
        padding: 24px;
        box-shadow: 0 15px 35px rgba(0,0,0,0.05);
        max-width: 720px;
        width: 100%;
        text-align: center;
    }

    .type-tabs {
        display: flex;
        justify-content: center;
        gap: 8px;
        margin-bottom: 16px;
        flex-wrap: wrap;
    }

    .type-tab {
        flex: 1;
        min-width: 120px;
        padding: 10px 14px;
        background: #f8fafc;
        border: 2px solid #cbd5e1;
        border-radius: 14px;
        font-family: 'Jua', sans-serif;
        font-size: 1rem;
        color: #64748b;
        cursor: pointer;
        transition: all 0.2s;
    }
    .type-tab:hover { transform: translateY(-2px); border-color: var(--emerald); }
    .type-tab.active {
        background: var(--emerald);
        color: white;
        border-color: #047857;
        box-shadow: 0 4px 12px rgba(5, 150, 105, 0.25);
    }

    .canvas-container {
        position: relative;
        width: 100%;
        max-width: 520px;
        margin: 0 auto 16px auto;
        background: #fff;
        border-radius: 20px;
        border: 2px dashed #cbd5e1;
        overflow: hidden;
    }

    svg { width: 100%; height: auto; display: block; }

    .guide-box {
        background: #f8fafc;
        border: 2px solid #e2e8f0;
        border-left: 6px solid var(--emerald);
        padding: 16px 20px;
        border-radius: 16px;
        font-size: 1.02rem;
        line-height: 1.6;
        text-align: left;
        color: #334155;
    }

    .badge-pill {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 2px 10px;
        border-radius: 20px;
        font-size: 0.9rem;
        font-weight: 700;
        background: var(--emerald-light);
        color: var(--emerald);
    }
</style>
</head>
<body>

<div class="header">
    <div class="title">선분 · 반직선 · 직선 & 각의 정의 📏</div>
    <div class="subtitle">도형의 가장 기본이 되는 선의 3대 종류와 각의 성질을 비교해요!</div>
</div>

<div class="card">
    <div class="type-tabs">
        <button class="type-tab active" onclick="setLineType('segment')">➖ 1. 선분 (끝이 있음)</button>
        <button class="type-tab" onclick="setLineType('ray')">➡️ 2. 반직선 (한쪽 무한)</button>
        <button class="type-tab" onclick="setLineType('line')">↔️ 3. 직선 (양쪽 무한)</button>
        <button class="type-tab" onclick="setLineType('angle')">📐 4. 각과 꼭짓점</button>
    </div>

    <div class="canvas-container">
        <svg id="lineSvg" viewBox="0 0 380 200" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
                    <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f4f4f4" stroke-width="1"/>
                </pattern>
                <marker id="arrowHeadR" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669" />
                </marker>
                <marker id="arrowHeadL" viewBox="0 0 10 10" refX="4" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 10 0 L 0 5 L 10 10 z" fill="#059669" />
                </marker>
            </defs>

            <rect width="380" height="200" fill="url(#grid)" />

            <g id="lineStage"></g>
        </svg>
    </div>

    <div class="guide-box" id="guideBox"></div>
</div>

<script>
    const stage = document.getElementById('lineStage');
    const guideBox = document.getElementById('guideBox');

    function setLineType(type) {
        document.querySelectorAll('.type-tab').forEach(b => {
            b.classList.toggle('active', b.onclick.toString().includes(`'${type}'`));
        });

        if (type === 'segment') {
            stage.innerHTML = `
                <!-- 선분 ㄱㄴ (두 점 사이를 곧게 이은 선) -->
                <line x1="80" y1="100" x2="300" y2="100" stroke="#059669" stroke-width="4" stroke-linecap="round"/>
                <circle cx="80" cy="100" r="7" fill="#e11d48" />
                <circle cx="300" cy="100" r="7" fill="#e11d48" />
                <text x="80" y="80" font-family="Jua" font-size="18" fill="#1e293b" text-anchor="middle">점 ㄱ</text>
                <text x="300" y="80" font-family="Jua" font-size="18" fill="#1e293b" text-anchor="middle">점 ㄴ</text>
                <text x="190" y="135" font-family="Jua" font-size="16" fill="#059669" text-anchor="middle">선분 ㄱㄴ (또는 선분 ㄴㄱ)</text>
            `;
            guideBox.innerHTML = `
                <div>💡 <span class="badge-pill">선분 (Line Segment) :</span> 두 점을 <strong>곧게 이은 선</strong>입니다.</div>
                <div>• 시작점과 끝점이 명확히 정해져 있어서 <strong>길이를 잴 수 있습니다</strong>.</div>
                <div>• '선분 ㄱㄴ' 또는 '선분 ㄴㄱ'이라고 부릅니다.</div>
            `;
        } else if (type === 'ray') {
            stage.innerHTML = `
                <!-- 반직선 ㄱㄴ (점 ㄱ에서 시작해 점 ㄴ 방향으로 끝없이 늘인 선) -->
                <line x1="80" y1="100" x2="350" y2="100" stroke="#059669" stroke-width="4" marker-end="url(#arrowHeadR)"/>
                <circle cx="80" cy="100" r="7" fill="#e11d48" />
                <circle cx="260" cy="100" r="6" fill="#2563eb" />
                <text x="80" y="80" font-family="Jua" font-size="18" fill="#e11d48" text-anchor="middle">시작점 ㄱ</text>
                <text x="260" y="80" font-family="Jua" font-size="18" fill="#1e293b" text-anchor="middle">점 ㄴ</text>
                <text x="190" y="135" font-family="Jua" font-size="16" fill="#059669" text-anchor="middle">반직선 ㄱㄴ (점 ㄱ에서 출발 ➔)</text>
            `;
            guideBox.innerHTML = `
                <div>💡 <span class="badge-pill">반직선 (Ray) :</span> 한 점에서 시작하여 <strong>한쪽으로 끝없이 늘인 곧은 선</strong>입니다.</div>
                <div>• ⚠️ <strong>주의:</strong> 반직선은 <strong>시작점 이름을 먼저</strong> 읽어야 합니다! (반직선 ㄱㄴ ≠ 반직선 ㄴㄱ)</div>
            `;
        } else if (type === 'line') {
            stage.innerHTML = `
                <!-- 직선 ㄱㄴ (양쪽으로 끝없이 늘인 선) -->
                <line x1="30" y1="100" x2="350" y2="100" stroke="#059669" stroke-width="4" marker-start="url(#arrowHeadL)" marker-end="url(#arrowHeadR)"/>
                <circle cx="110" cy="100" r="6" fill="#2563eb" />
                <circle cx="270" cy="100" r="6" fill="#2563eb" />
                <text x="110" y="80" font-family="Jua" font-size="18" fill="#1e293b" text-anchor="middle">점 ㄱ</text>
                <text x="270" y="80" font-family="Jua" font-size="18" fill="#1e293b" text-anchor="middle">점 ㄴ</text>
                <text x="190" y="135" font-family="Jua" font-size="16" fill="#059669" text-anchor="middle">직선 ㄱㄴ (양쪽으로 무한 ↔)</text>
            `;
            guideBox.innerHTML = `
                <div>💡 <span class="badge-pill">직선 (Line) :</span> 선분을 <strong>양쪽으로 끝없이 늘인 곧은 선</strong>입니다.</div>
                <div>• 양쪽 끝이 없으므로 길이를 잴 수 없습니다.</div>
                <div>• '직선 ㄱㄴ' 또는 '직선 ㄴㄱ'이라고 부릅니다.</div>
            `;
        } else {
            stage.innerHTML = `
                <!-- 각 ㄱㄴㄷ (한 꼭짓점 ㄴ에서 그은 두 반직선) -->
                <line x1="80" y1="140" x2="320" y2="140" stroke="#059669" stroke-width="4" marker-end="url(#arrowHeadR)"/>
                <line x1="80" y1="140" x2="250" y2="40" stroke="#059669" stroke-width="4" marker-end="url(#arrowHeadR)"/>
                
                <path d="M 130 140 A 50 50 0 0 0 115 119" fill="none" stroke="#e11d48" stroke-width="3" />
                
                <circle cx="80" cy="140" r="7" fill="#e11d48" />
                <circle cx="220" cy="58" r="6" fill="#2563eb" />
                <circle cx="260" cy="140" r="6" fill="#2563eb" />

                <text x="70" y="165" font-family="Jua" font-size="16" fill="#e11d48">꼭짓점 ㄴ</text>
                <text x="220" y="45" font-family="Jua" font-size="16" fill="#1e293b">점 ㄱ (변 ㄴㄱ)</text>
                <text x="260" y="165" font-family="Jua" font-size="16" fill="#1e293b">점 ㄷ (변 ㄴㄷ)</text>
                
                <text x="190" y="180" font-family="Jua" font-size="17" fill="#e11d48" text-anchor="middle">각 ㄱㄴㄷ (꼭짓점 ㄴ이 가운데!)</text>
            `;
            guideBox.innerHTML = `
                <div>💡 <span class="badge-pill">각 (Angle) :</span> 한 점에서 그은 <strong>두 반직선으로 이루어진 도형</strong>입니다.</div>
                <div>• 그 점을 <strong>각의 꼭짓점</strong>이라 하고, 두 반직선을 <strong>각의 변</strong>이라고 합니다.</div>
                <div>• 각을 부를 때는 <strong>꼭짓점(ㄴ)을 반드시 가운데</strong>에 넣어 '각 ㄱㄴㄷ' 또는 '각 ㄷㄴㄱ'이라고 부릅니다.</div>
            `;
        }
    }

    setLineType('segment');
</script>

</body>
</html>
