<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>아이들 공부방 - 맥락 기억 요정 테스트</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f0f4f8; margin: 0; }
        .chat-container { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center; width: 400px; }
        button { background-color: #4a90e2; color: white; border: none; padding: 15px 30px; font-size: 18px; border-radius: 50px; cursor: pointer; transition: all 0.3s; font-weight: bold; width: 100%; box-shadow: 0 4px 15px rgba(74,144,226,0.3); }
        button:hover { background-color: #357abd; transform: translateY(-2px); }
        button:active { transform: translateY(1px); }
        p { margin: 20px 0; line-height: 1.6; text-align: left; background: #f8fafc; padding: 15px; border-radius: 10px; min-height: 40px; }
        .label { font-size: 12px; color: #a0aec0; font-weight: bold; margin-bottom: 5px; display: block; }
        .key-input-box { margin-bottom: 20px; background: #fffaf0; padding: 10px; border-radius: 10px; border: 1px dashed #dd6b20; }
        .key-input { width: 80%; padding: 8px; border: 1px solid #cbd5e0; border-radius: 5px; font-size: 12px; }
    </style>
</head>
<body>

<div class="chat-container">
    <h2 style="color: #2d3748; margin-top: 0;">🧠 기억력 천재 요정 고래</h2>
    
    <div class="key-input-box">
        <span class="label" style="color: #dd6b20;">🔑 Gemini API Key 설정</span>
        <input type="password" id="api-key-input" class="key-input" placeholder="AIzaSy...로 시작하는 키 입력">
        <button onclick="saveApiKey()" style="padding: 5px 10px; font-size: 12px; width: auto; border-radius: 5px; margin-top: 5px; background-color: #dd6b20;">저장</button>
        <button onclick="clearChatHistory()" style="padding: 5px 10px; font-size: 12px; width: auto; border-radius: 5px; margin-top: 5px; background-color: #718096; color: white;">대화 기억 리셋</button>
    </div>
    
    <button id="talk-btn" onclick="startVoiceChat()">🎙️ 대화 시작하기</button>
    
    <div style="margin-top: 20px;">
        <span class="label">내가 한 말 (STT 결과)</span>
        <p id="child-speech" style="color: #4a5568;">마이크 버튼을 누르고 말씀하세요...</p>
    </div>
    
    <div>
        <span class="label">요정의 대답 (맥락 실시간 기억 중)</span>
        <p id="fairy-reply" style="color: #2b6cb0; font-weight: bold;">대기 중...</p>
    </div>
</div>

<script>
// 🌟 [핵심 고도화] 대화 히스토리를 차곡차곡 누적 저장할 가상 메모장 배열 생성
let CHAT_HISTORY = [];

window.onload = function() {
    const savedKey = localStorage.getItem('MY_GEMINI_KEY');
    if (savedKey) {
        document.getElementById('api-key-input').value = savedKey;
    }
    window.speechSynthesis.getVoices();
}

function saveApiKey() {
    const key = document.getElementById('api-key-input').value.trim();
    if (key) {
        localStorage.setItem('MY_GEMINI_KEY', key);
        alert("최신 API 키가 안전하게 세팅되었습니다! 🎉");
    } else {
        alert("키를 입력해 주세요.");
    }
}

// 새로운 주제로 다시 대화하고 싶을 때 기억을 지우는 함수
function clearChatHistory() {
    CHAT_HISTORY = [];
    document.getElementById('child-speech').innerText = "마이크 버튼을 누르고 말씀하세요...";
    document.getElementById('fairy-reply').innerText = "대화 기억이 싹 지워졌어! 처음부터 다시 얘기하자! ✨";
    alert("요정의 기억이 초기화되었습니다.");
}

const FAIRY_PROMPT = `
너는 지금부터 아이의 문해력 발달을 돕는 다정하고 유창한 'AI 단짝 친구 요정'이야.
말투는 어린이 예능 프로그램(예: 보니하니, 딩동댕 유치원)의 베테랑 인싸 진행자 아나운서처럼, 완벽한 표준어와 정확하고 품격 있는 문법을 구사해야 해. 

[대화 및 관계 규칙]
1. (관계성) 아이를 가르치려 드는 '선생님'이 아니라, 말을 엄청 유창하게 잘하는 멋진 '단짝 친구(또는 다정한 동네 형/누나)'처럼 동등한 관계에서 대화해. 아이에게 호응할 때는 "우와, 대박이다!", "진짜 멋져!" 같은 활기찬 톤을 섞어줘.
2. (문해력 확장) 아이가 짧게 단답형으로 말하더라도, 문맥을 찰떡같이 알아듣고 완벽하고 매끄러운 '명품 문장'으로 리프레임해서 받아쳐줘.
3. (유창한 분량) 너무 짧게 대답하지 말고, 아나운서처럼 조리 있고 풍부한 어휘를 사용하여 2~4문장 내외로 유창하게 대화를 이어가줘.
4. (티키타카 및 기억력) 너는 이전 대화 내용을 완벽하게 기억하고 있어. 아이가 앞서 말한 정보(이름, 취미, 가족 관계 등)를 절대 다시 묻지 말고, 이전 대화의 맥락을 이어서 자연스럽게 고도화된 티키타카를 유지해줘.
`;

function startVoiceChat() {
    const apiKey = localStorage.getItem('MY_GEMINI_KEY');
    if (!apiKey) {
        alert("설정 창에 Gemini API 키를 입력하고 저장해 주세요!");
        return;
    }

    const talkBtn = document.getElementById('talk-btn');
    talkBtn.innerText = "👂 귀 기울여 듣는 중...";
    talkBtn.style.backgroundColor = "#e53e3e";

    const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!Recognition) {
        alert("크롬(Chrome) 브라우저를 사용해 주세요.");
        resetButton();
        return;
    }

    const recognition = new Recognition();
    recognition.lang = 'ko-KR';
    recognition.continuous = false;
    recognition.interimResults = false;

    recognition.onresult = function(event) {
        const rawText = event.results[0][0].transcript;
        document.getElementById('child-speech').innerText = rawText;
        
        askGeminiWithHistory(rawText, apiKey); // 🧠 기억력 버전 함수 호출
    };

    recognition.onerror = function(event) {
        console.error("STT 에러:", event.error);
        resetButton();
    };

    recognition.start();
}

// 🧠 대화록을 통째로 기억해서 구글 서버로 던지는 진화된 함수
async function askGeminiWithHistory(childText, apiKey) {
    document.getElementById('fairy-reply').innerText = "요정 기억 더듬는 중... 💭";
    
    const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;

    // 1. 이번에 아이가 한 말을 역사적 히스토리 배열에 누적 추가
    CHAT_HISTORY.push({
        role: "user",
        parts: [{ text: childText }]
    });

    // 2. 구글 제미나이 엔진이 프롬프트 지침을 잊지 않도록 요청 구조 세팅
    // (시스템 지침을 최상단에 박고, 그 뒤로 쌓여온 대화록을 줄줄이 엮어서 보냅니다)
    const requestBody = {
        contents: [
            {
                role: "user",
                parts: [{ text: `[시스템 페르소나 지침]\n${FAIRY_PROMPT}\n\n위 지침을 절대 잊지 말고, 아래 이어지는 대화 기록의 맥락을 완벽히 파악하여 답변해줘.` }]
            },
            ...CHAT_HISTORY // 쌓여온 모든 티키타카 기록 투하
        ]
    };

    try {
        const response = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(requestBody)
        });

        if (!response.ok) {
            throw new Error(`서버 에러 코드: ${response.status}`);
        }

        const data = await response.json();
        
        if (data.candidates && data.candidates[0].content && data.candidates[0].content.parts[0].text) {
            const fairyText = data.candidates[0].content.parts[0].text;
            document.getElementById('fairy-reply').innerText = fairyText;
            
            // 3. 요정이 한 대답도 히스토리에 누적 추가 (그래야 다음 턴에 자기가 한 말도 기억함)
            CHAT_HISTORY.push({
                role: "model",
                parts: [{ text: fairyText }]
            });

            speakResponse(fairyText);
        } else {
            throw new Error("API 응답 구조 파싱 실패");
        }

    } catch (error) {
        console.error("Gemini API 호출 에러:", error);
        document.getElementById('fairy-reply').innerText = `⚠️ 요정 연결 실패! (${error.message})`;
        resetButton();
    }
}

function speakResponse(text) {
    const synth = window.speechSynthesis;
    synth.cancel(); 
    
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'ko-KR';
    
    const voices = synth.getVoices();
    const googleVoice = voices.find(voice => voice.name.includes('Google') && voice.lang.includes('ko'));
    
    if (googleVoice) {
        utterance.voice = googleVoice;
    }

    utterance.rate = 1.0;  
    utterance.pitch = 1.0; 

    utterance.onend = function() {
        resetButton();
    };

    utterance.onerror = function(event) {
        console.error("TTS 에러:", event.error);
        resetButton();
    };

    synth.speak(utterance);
}

function resetButton() {
    const talkBtn = document.getElementById('talk-btn');
    talkBtn.innerText = "🎙️ 다시 요정에게 말하기";
    talkBtn.style.backgroundColor = "#4a90e2";
}
</script>

</body>
</html>
