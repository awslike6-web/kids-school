<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>아이들 공부방 - 아나운서 요정 테스트</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f0f4f8; margin: 0; }
        .chat-container { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center; width: 400px; }
        button { background-color: #4a90e2; color: white; border: none; padding: 15px 30px; font-size: 18px; border-radius: 50px; cursor: pointer; transition: all 0.3s; font-weight: bold; width: 100%; box-shadow: 0 4px 15px rgba(74,144,226,0.3); }
        button:hover { background-color: #357abd; transform: translateY(-2px); }
        button:active { transform: translateY(1px); }
        p { margin: 20px 0; line-height: 1.6; text-align: left; background: #f8fafc; padding: 15px; border-radius: 10px; min-height: 40px; }
        .label { font-size: 12px; color: #a0aec0; font-weight: bold; margin-bottom: 5px; display: block; }
        .key-input-box { margin-bottom: 20px; background: #fffaf0; padding: 10px; border-radius: 10px; border: 1px dashed #dd6b20; }
        .key-input { width: 80%; padding: 8px; border: 1px solid #cbd5e0; border-radius: 5px; font-size: 12px; }
    </style>
</head>
<body>

<div class="chat-container">
    <h2 style="color: #2d3748; margin-top: 0;">🎙️ 아나운서 요정 고래</h2>
    
    <div class="key-input-box">
        <span class="label" style="color: #dd6b20;">🔑 Gemini API Key 설정</span>
        <input type="password" id="api-key-input" class="key-input" placeholder="AIzaSy...로 시작하는 키 입력">
        <button onclick="saveApiKey()" style="padding: 5px 10px; font-size: 12px; width: auto; border-radius: 5px; margin-top: 5px; background-color: #dd6b20;">저장</button>
    </div>
    
    <button id="talk-btn" onclick="startVoiceChat()">🎙️ 대화 시작하기</button>
    
    <div style="margin-top: 20px;">
        <span class="label">내가 한 말 (STT 결과)</span>
        <p id="child-speech" style="color: #4a5568;">마이크 버튼을 누르고 말씀하세요...</p>
    </div>
    
    <div>
        <span class="label">요정의 대답 (Gemini 2.5 유창한 대화 모드)</span>
        <p id="fairy-reply" style="color: #2b6cb0; font-weight: bold;">대기 중...</p>
    </div>
</div>

<script>
window.onload = function() {
    const savedKey = localStorage.getItem('MY_GEMINI_KEY');
    if (savedKey) {
        document.getElementById('api-key-input').value = savedKey;
    }
    // 브라우저 음성 엔진 미리 로드 시도
    window.speechSynthesis.getVoices();
}

function saveApiKey() {
    const key = document.getElementById('api-key-input').value.trim();
    if (key) {
        localStorage.setItem('MY_GEMINI_KEY', key);
        alert("최신 API 키가 브라우저에 저장되었습니다! 🎉");
    } else {
        alert("키를 입력해 주세요.");
    }
}

// 🧠 대장 PM님의 목적에 부합하도록 문해력과 유창함을 극대화한 프롬프트
const FAIRY_PROMPT = `
너는 지금부터 아이의 문해력 발달을 돕는 다정하고 유창한 'AI 언어 멘토 요정'이야.
어린이 방송의 전문 아나운서나 구연동화 전문가처럼 완벽한 표준어와 바른 문법을 구사해야 해.

[대화 및 문해력 규칙]
1. 아이가 단답형이나 어설픈 발음으로 말을 걸어도, 문맥을 정확히 파악하여 완벽하고 명료한 명품 문장으로 확장해서 대답해줘.
2. 말투는 마냥 어린애 같지 않게, 다정하면서도 지적이고 신뢰감을 주는 톤앤매너를 유지해.
3. 아이가 대화를 이어 나갈 수 있도록, 대답 끝에는 항상 부드러운 유도 질문을 포함해줘.
4. 너무 짧게 단답형으로 끝내지 말고, 아이의 눈높이에 맞는 풍부한 어휘를 사용하여 매끄럽고 유창하게 3~4문장 내외로 서술해줘.
`;

function startVoiceChat() {
    const apiKey = localStorage.getItem('MY_GEMINI_KEY');
    if (!apiKey) {
        alert("설정 창에 Gemini API 키를 입력하고 저장해 주세요!");
        return;
    }

    const talkBtn = document.getElementById('talk-btn');
    talkBtn.innerText = "👂 귀 기울여 듣는 중...";
    talkBtn.style.backgroundColor = "#e53e3e";

    const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!Recognition) {
        alert("크롬(Chrome) 브라우저를 사용해 주세요.");
        resetButton();
        return;
    }

    const recognition = new Recognition();
    recognition.lang = 'ko-KR';
    recognition.continuous = false;
    recognition.interimResults = false;

    recognition.onresult = function(event) {
        const rawText = event.results[0][0].transcript;
        document.getElementById('child-speech').innerText = rawText;
        
        askGeminiNextGen(rawText, apiKey);
    };

    recognition.onerror = function(event) {
        console.error("STT 에러:", event.error);
        resetButton();
    };

    recognition.start();
}

async function askGeminiNextGen(childText, apiKey) {
    document.getElementById('fairy-reply').innerText = "요정 생각 중... 💭";
    
    const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;

    try {
        const response = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                contents: [{
                    role: "user",
                    parts: [{
                        text: `${FAIRY_PROMPT}\n\n아이가 한 말: "${childText}"`
                    }]
                }]
            })
        });

        if (!response.ok) {
            throw new Error(`서버 에러 코드: ${response.status}`);
        }

        const data = await response.json();
        
        if (data.candidates && data.candidates[0].content && data.candidates[0].content.parts[0].text) {
            const fairyText = data.candidates[0].content.parts[0].text;
            document.getElementById('fairy-reply').innerText = fairyText;
            speakResponse(fairyText);
        } else {
            throw new Error("API 응답 구조 파싱 실패");
        }

    } catch (error) {
        console.error("Gemini API 호출 에러:", error);
        document.getElementById('fairy-reply').innerText = `⚠️ 요정 연결 실패! (${error.message})`;
        resetButton();
    }
}

// 🎙️ 목소리 엔진 최적화 튜닝
function speakResponse(text) {
    const synth = window.speechSynthesis;
    synth.cancel(); 
    
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'ko-KR';
    
    // ⭐ [핵심 꼼수] 브라우저 내장 목소리 중 가장 품질이 좋은 구글 정식 한국어 목소리를 강제로 매칭합니다.
    const voices = synth.getVoices();
    const googleVoice = voices.find(voice => voice.name.includes('Google') && voice.lang.includes('ko'));
    
    if (googleVoice) {
        utterance.voice = googleVoice; // 구글 고품질 목소리 장착
    }

    utterance.rate = 1.0;  // 아나운서 톤을 위해 속도를 신뢰감 있게 일반 속도로 조정
    utterance.pitch = 1.0; // 너무 인위적인 하이톤을 내리고 차분한 톤으로 밸런싱

    utterance.onend = function() {
        resetButton();
    };

    utterance.onerror = function(event) {
        console.error("TTS 에러:", event.error);
        resetButton();
    };

    synth.speak(utterance);
}

function resetButton() {
    const talkBtn = document.getElementById('talk-btn');
    talkBtn.innerText = "🎙️ 다시 요정에게 말하기";
    talkBtn.style.backgroundColor = "#4a90e2";
}
</script>

</body>
</html>
