<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>🌍 광장 · 내 친구 월드</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Nanum+Gothic:wght@400;700;800&display=swap">
  <link rel="stylesheet" href="world.css?v=06a7fd58">
  <link rel="stylesheet" href="hub.css?v=f9f84903">
</head>
<body>
  <!-- 내 친구 월드 광장 (docs/world_module_spec.md §13). 화면은 hub.js가 채운다. -->
  <main id="stage" class="world-stage theme--arcade">
    <canvas id="cv" class="world-canvas" aria-label="광장"></canvas>
    <header id="hud" class="world-hud-top">
      <button id="exitBtn" class="world-exit" type="button" aria-label="나가기">←</button>
      <span id="title" class="world-hud-top__item hub-title">🌍 광장</span>
      <button id="mapBtn" class="world-exit hub-map-btn" type="button" aria-label="지도">🗺️</button>
    </header>
    <div id="toast" class="world-toast" role="status" hidden></div>
    <section id="sheet" class="world-sheet hub-sheet" aria-label="성격 고르기" hidden></section>
    <section id="map" class="hub-map" aria-label="지도" data-no-stick hidden>
      <div class="hub-map__card">
        <canvas id="mapCv" class="hub-map__canvas" width="300" height="440"></canvas>
        <button id="guestBtn" class="world-chip hub-map__guest" type="button">🤝 친구 초대</button>
        <button id="mapClose" class="world-btn hub-map__close" type="button"><span class="world-btn__label">닫기</span></button>
      </div>
    </section>
  </main>
  <script src="../../core/fairy-config.js?v=556cfe19"></script>
  <script src="../../core/fairy-tts.js?v=ed19bef4"></script>
  <script src="../../core/fairy-settings-catalog.js?v=080e1dc2"></script>
  <script src="../../core/fairy-engine.js?v=f5ff3e27"></script>
  <script src="../../data/gallery-data.js"></script>
  <script src="../../subjects/quest/monster_roster.js?v=0c234517"></script>
  <script src="core/world-save.js?v=d129950f"></script>
  <script src="core/world-sprites.js?v=badd5e52"></script>
  <script src="core/world-view.js?v=ce9627c2"></script>
  <script src="core/world-input.js?v=764efb89"></script>
  <script src="core/world-fx.js?v=ffe2e19c"></script>
  <script src="core/world-sfx.js?v=81a927d1"></script>
  <script src="core/world-eggs.js?v=ab0dd079"></script>
  <script src="core/world-voice.js?v=54adedb8"></script>
  <script src="hub-logic.js?v=1d72cd7a"></script>
  <script src="garden-logic.js?v=720fa771"></script>
  <script src="hub.js?v=d6543409"></script>
  <script>window.HubUI && window.HubUI.boot();</script>
</body>
</html>
