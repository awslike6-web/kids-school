<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>💖 마법의 3D 종이접기 스튜디오 - 민민 놀이터</title>
  <link rel="stylesheet" href="../playground.css">
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Gaegu:wght@400;700&family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    .origami-layout {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-top: 12px;
      width: 100%;
      box-sizing: border-box;
    }
    @media (min-width: 880px) {
      .origami-layout {
        display: grid;
        grid-template-columns: 280px 1fr;
        gap: 20px;
      }
    }

    /* 🧰 좌측 선택 패널 */
    .origami-sidebar {
      background: var(--card-light);
      border: 2px solid var(--border-light);
      border-radius: 24px;
      padding: 16px 14px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 8px 25px rgba(255, 107, 157, 0.15);
      width: 100%;
      box-sizing: border-box;
      min-width: 0;
    }
    body.theme--arcade .origami-sidebar {
      background: var(--card-dark);
      border-color: var(--border-dark);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
    }

    .origami-group-title {
      font-family: 'Jua', sans-serif;
      font-size: 1.15rem;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .model-btn-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .origami-model-btn {
      padding: 12px 14px;
      border-radius: 16px;
      border: 1.5px solid rgba(0,0,0,0.08);
      background: #ffffff;
      font-family: 'Jua', sans-serif;
      font-size: 1.05rem;
      cursor: pointer;
      text-align: left;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    body.theme--arcade .origami-model-btn {
      background: #1f183b;
      color: #fff;
      border-color: #3b2e66;
    }
    .origami-model-btn.active {
      border-color: var(--pink-soft);
      background: #ffe4ec;
      color: #ff4081;
      transform: translateX(4px);
      box-shadow: 0 4px 14px rgba(255, 107, 157, 0.35);
    }
    body.theme--arcade .origami-model-btn.active {
      border-color: var(--cyan-neon);
      background: rgba(0, 242, 254, 0.2);
      color: var(--cyan-neon);
      box-shadow: 0 4px 14px rgba(0, 242, 254, 0.35);
    }
    .video-tag {
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 8px;
      background: linear-gradient(135deg, #ff4081, #ff7eb3);
      color: #fff;
      font-weight: bold;
    }

    /* 🎬 메인 비디오 스테이지 카드 */
    .origami-main-stage {
      background: #ffffff;
      border: 3px solid #ffb3c6;
      border-radius: 24px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      width: 100%;
      box-sizing: border-box;
      min-width: 0;
    }
    body.theme--arcade .origami-main-stage {
      border-color: var(--cyan-neon);
      background: #181330;
    }

    /* 📹 3D 비디오 뷰포트 */
    .video-viewport-wrapper {
      width: 100%;
      max-width: 620px;
      aspect-ratio: 16 / 9;
      border-radius: 20px;
      overflow: hidden;
      background: #000000;
      position: relative;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.25);
    }
    .main-origami-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* 비디오 프로그레스 바 */
    .video-progress-container {
      width: 100%;
      height: 6px;
      background: rgba(0, 0, 0, 0.1);
      border-radius: 3px;
      overflow: hidden;
      margin-top: 10px;
    }
    .video-progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ff4081, #ff7eb3);
      transition: width 0.1s linear;
    }
    body.theme--arcade .video-progress-bar {
      background: linear-gradient(90deg, #00f2fe, #4facfe);
    }

    /* 🎛️ 비디오 하단 컨트롤러 */
    .video-controls-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 620px;
      margin-top: 12px;
      gap: 10px;
      flex-wrap: wrap;
    }
    .btn-video-control {
      padding: 10px 18px;
      border-radius: 14px;
      font-family: 'Jua', sans-serif;
      font-size: 1.05rem;
      border: none;
      background: linear-gradient(135deg, #ffd166, #ff9f43);
      color: #1a1a1a;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      transition: transform 0.1s;
    }
    .btn-video-control:active {
      transform: scale(0.96);
    }

    .speed-buttons-group {
      display: flex;
      gap: 6px;
      background: rgba(0,0,0,0.05);
      padding: 4px;
      border-radius: 12px;
    }
    body.theme--arcade .speed-buttons-group {
      background: rgba(255,255,255,0.08);
    }
    .speed-pill-btn {
      padding: 6px 12px;
      border-radius: 8px;
      border: none;
      background: transparent;
      font-family: 'Jua', sans-serif;
      font-size: 0.95rem;
      cursor: pointer;
      color: inherit;
    }
    .speed-pill-btn.active {
      background: #ff4081;
      color: #fff;
    }
    body.theme--arcade .speed-pill-btn.active {
      background: var(--cyan-neon);
      color: #0c0818;
    }

    /* 🧭 단계별 스텝 알약 버튼 바 */
    .step-pills-bar {
      display: flex;
      gap: 8px;
      width: 100%;
      max-width: 620px;
      overflow-x: auto;
      padding: 8px 2px;
      margin-top: 14px;
      box-sizing: border-box;
      -webkit-overflow-scrolling: touch;
    }
    .step-pill-btn {
      flex: 1;
      min-width: 95px;
      padding: 10px 8px;
      border-radius: 14px;
      border: 1.5px solid rgba(0,0,0,0.1);
      background: #ffffff;
      font-family: 'Jua', sans-serif;
      font-size: 0.95rem;
      cursor: pointer;
      text-align: center;
      white-space: nowrap;
      transition: all 0.2s;
    }
    body.theme--arcade .step-pill-btn {
      background: #1f183b;
      border-color: #3b2e66;
      color: #e2e8f0;
    }
    .step-pill-btn.active {
      background: linear-gradient(135deg, #ff758c, #ff7eb3);
      color: #ffffff;
      border-color: transparent;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(255, 107, 157, 0.35);
    }
    body.theme--arcade .step-pill-btn.active {
      background: linear-gradient(135deg, #00f2fe, #4facfe);
      color: #0c0818;
      box-shadow: 0 4px 12px rgba(0, 242, 254, 0.35);
    }

    /* 📝 단계별 텍스트 카드 */
    .step-info-card {
      width: 100%;
      max-width: 620px;
      background: #fff8f9;
      border: 2px dashed #ffb3c6;
      border-radius: 20px;
      padding: 16px 20px;
      margin-top: 14px;
      text-align: center;
      box-sizing: border-box;
    }
    body.theme--arcade .step-info-card {
      background: rgba(0, 242, 254, 0.08);
      border-color: var(--cyan-neon);
    }
    .step-title-badge {
      font-family: 'Jua', sans-serif;
      font-size: 1.35rem;
      color: #ff4081;
      margin-bottom: 6px;
    }
    body.theme--arcade .step-title-badge {
      color: var(--cyan-neon);
    }
    .step-desc-text {
      font-size: 1.05rem;
      line-height: 1.6;
      margin-bottom: 8px;
    }
    .step-tip-badge {
      display: inline-block;
      padding: 5px 14px;
      border-radius: 12px;
      background: #ffe4ec;
      color: #ff007f;
      font-size: 0.95rem;
      font-weight: bold;
    }
    body.theme--arcade .step-tip-badge {
      background: rgba(0, 242, 254, 0.15);
      color: #00f2fe;
    }

    /* 🧭 이전/다음 스텝 내비게이터 */
    .step-nav-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 620px;
      margin-top: 14px;
      gap: 10px;
    }
    .step-btn-nav {
      padding: 12px 24px;
      border-radius: 16px;
      font-family: 'Jua', sans-serif;
      font-size: 1.15rem;
      border: none;
      background: linear-gradient(135deg, #ff758c, #ff7eb3);
      color: #fff;
      cursor: pointer;
      transition: all 0.2s;
    }
    body.theme--arcade .step-btn-nav {
      background: linear-gradient(135deg, #00f2fe, #4facfe);
      color: #0c0818;
    }
    .step-btn-nav:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      transform: none !important;
    }

    /* 🎉 완성 보상 카드 */
    .complete-reward-box {
      display: none;
      width: 100%;
      max-width: 620px;
      margin-top: 16px;
    }
    .btn-reward-jackpot {
      width: 100%;
      padding: 16px;
      border-radius: 18px;
      font-family: 'Jua', sans-serif;
      font-size: 1.25rem;
      border: none;
      cursor: pointer;
      background: linear-gradient(135deg, #ff6b9d, #ff8da1);
      color: #fff;
      box-shadow: 0 6px 20px rgba(255, 107, 157, 0.45);
      animation: pulseGlow 1.5s infinite alternate;
    }
    @keyframes pulseGlow {
      from { transform: scale(1); box-shadow: 0 6px 20px rgba(255, 107, 157, 0.4); }
      to { transform: scale(1.02); box-shadow: 0 8px 30px rgba(255, 64, 129, 0.65); }
    }

    /* 🖨️ 인쇄 스타일 */
    @media print {
      body * { visibility: hidden; }
      .video-viewport-wrapper, .video-viewport-wrapper * { visibility: visible; }
      .origami-sidebar, .video-controls-row, .step-pills-bar, .step-nav-row, .pg-top-nav, .complete-reward-box { display: none !important; }
    }
  </style>
</head>
<body class="theme--hideout">

  <div class="pg-container">
    <!-- 🧭 상단 바 -->
    <div class="pg-top-nav">
      <a href="../index.html" class="pg-back-btn">⬅️ 놀이터 허브로</a>
      <div class="pg-trophy-bar">
        <span>💖 마법 3D 종이접기 스튜디오</span>
      </div>
    </div>

    <!-- 🌟 타이틀 -->
    <div class="pg-header" style="margin-bottom: 12px;">
      <h1 class="pg-title">
        <span class="neon-text">✨ 마법 3D 영상</span> <span class="accent-text">종이접기</span>
      </h1>
      <p class="pg-subtitle" id="currentOrigamiTagline">구글 플로우 3D 비디오로 배우는 반짝이는 입체 종이접기!</p>
    </div>

    <!-- 🛠️ 2열 메인 레이아웃 -->
    <div class="origami-layout">

      <!-- 좌측: 종이접기 모델 선택 -->
      <div class="origami-sidebar">
        <div>
          <div class="origami-group-title"> origami 인기 종이접기</div>
          <div class="model-btn-list">
            <button type="button" class="origami-model-btn active" data-model="heart">
              <span>💖 마법의 사랑 하트</span>
              <span class="video-tag">✨ 3D 비디오</span>
            </button>
            <button type="button" class="origami-model-btn" data-model="frog">
              <span>🐸 폴짝 점핑 개구리</span>
              <span style="font-size: 0.8rem; opacity: 0.7;">도안 교재</span>
            </button>
            <button type="button" class="origami-model-btn" data-model="airplane">
              <span>🚀 슈퍼 제트 비행기</span>
              <span style="font-size: 0.8rem; opacity: 0.7;">도안 교재</span>
            </button>
            <button type="button" class="origami-model-btn" data-model="crane">
              <span>🕊️ 전통 종이학</span>
              <span style="font-size: 0.8rem; opacity: 0.7;">도안 교재</span>
            </button>
          </div>
        </div>

        <!-- A4 도안 인쇄 버튼 -->
        <button type="button" id="printPatternBtn" class="pg-card-btn" style="cursor: pointer; width: 100%; border: none; padding: 12px; margin-top: auto;">
          🖨️ A4 전용 색종이 도안 인쇄
        </button>
      </div>

      <!-- 우측: 인터랙티브 스텝 비디오 뷰포트 -->
      <div class="origami-main-stage">

        <!-- 1. 비디오 플레이어 섹션 -->
        <div id="videoPlayerSection" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
          
          <div class="video-viewport-wrapper">
            <video id="origamiMainVideo" class="main-origami-video" playsinline preload="auto" poster="">
              <source src="../assets/videos/heart_origami.mp4" type="video/mp4">
              <source src="../../../uploads/ex/origami/Origami_paper_folding_into_heart_202608310525.mp4" type="video/mp4">
              동영상을 지원하지 않는 브라우저입니다.
            </video>
          </div>

          <!-- 비디오 프로그레스 바 -->
          <div class="video-progress-container">
            <div id="videoProgressBar" class="video-progress-bar"></div>
          </div>

          <!-- 비디오 컨트롤러 바 -->
          <div class="video-controls-row">
            <div style="display: flex; gap: 8px;">
              <button type="button" id="playPauseVideoBtn" class="btn-video-control">
                <span>▶️ 재생하기</span>
              </button>
              <button type="button" id="replayVideoBtn" class="btn-video-control" style="background: rgba(0,0,0,0.06); color: inherit;">
                <span>🔄 처음부터</span>
              </button>
            </div>

            <!-- 재생 속도 조절 -->
            <div class="speed-buttons-group">
              <button type="button" class="speed-pill-btn" data-speed="0.75">0.75x (느리게)</button>
              <button type="button" class="speed-pill-btn active" data-speed="1.0">1.0x</button>
              <button type="button" class="speed-pill-btn" data-speed="1.25">1.25x</button>
            </div>
          </div>

        </div>

        <!-- 2. 비디오가 없는 모델용 일러스트 캔버스 (대체용) -->
        <div id="illustrationSection" style="width: 100%; display: none; flex-direction: column; align-items: center;">
          <canvas id="illustrationCanvas" style="width: 100%; max-width: 560px; height: auto; border-radius: 18px;"></canvas>
        </div>

        <!-- 3. 단계별 스텝 알약 버튼 바 (동적 생성) -->
        <div class="step-pills-bar" id="stepButtonsContainer"></div>

        <!-- 4. 단계별 설명 & 꿀팁 카드 -->
        <div class="step-info-card">
          <div class="step-title-badge" id="stepTitleBadge">1단계: 가운데 중심선 만들기</div>
          <div class="step-desc-text" id="stepDescText">색종이를 반으로 접었다가 펼쳐서 가운데 기준선을 만들어요.</div>
          <div class="step-tip-badge" id="stepTipText">💡 손톱으로 꾹꾹 눌러주면 다음 단계가 훨씬 쉬워져요!</div>
        </div>

        <!-- 5. 이전/다음 스텝 내비게이터 -->
        <div class="step-nav-row">
          <button type="button" id="prevStepBtn" class="step-btn-nav">◀️ 이전 단계</button>
          <div class="step-indicator-badge" id="stepProgressIndicator">1 / 5 단계</div>
          <button type="button" id="nextStepBtn" class="step-btn-nav">다음 단계 ▶️</button>
        </div>

        <!-- 6. 🎉 5단계 마법 피날레 완성 보상 -->
        <div class="complete-reward-box" id="origamiCompleteArea">
          <button type="button" id="claimOrigamiRewardBtn" class="btn-reward-jackpot">
            💖 마법 하트 접기 성공! (💎 노션 보상 받기)
          </button>
        </div>

      </div>

    </div>
  </div>

  <!-- 🏰 노션 코어 및 보상 엔진 -->
  <script src="../../config.js"></script>
  <script src="../../core/notion-helper.js"></script>
  <script src="../../core/core.js"></script>
  <script src="../starr_drop_engine.js"></script>
  <script src="origami.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const savedUser = localStorage.getItem('currentUser') || 'daughter';
      if (savedUser === 'son') {
        document.body.className = 'theme--arcade';
      } else {
        document.body.className = 'theme--hideout';
      }
    });
  </script>
</body>
</html>
