<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>📐 고화질 인터랙티브 종이접기 연구소 - 민민 놀이터</title>
  <link rel="stylesheet" href="../playground.css">
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Gaegu:wght@400;700&family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    .origami-layout {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-top: 16px;
      width: 100%;
      box-sizing: border-box;
    }
    @media (min-width: 880px) {
      .origami-layout {
        display: grid;
        grid-template-columns: 290px 1fr;
        gap: 20px;
      }
    }

    /* 🧰 좌측 선택 패널 */
    .origami-sidebar {
      background: var(--card-light);
      border: 2px solid var(--border-light);
      border-radius: 24px;
      padding: 16px 14px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 8px 25px rgba(255, 107, 157, 0.15);
      width: 100%;
      box-sizing: border-box;
      min-width: 0;
    }
    body.theme--arcade .origami-sidebar {
      background: var(--card-dark);
      border-color: var(--border-dark);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
    }

    .origami-group-title {
      font-family: 'Jua', sans-serif;
      font-size: 1.15rem;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .model-btn-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .origami-model-btn {
      padding: 11px 14px;
      border-radius: 16px;
      border: 1.5px solid rgba(0,0,0,0.08);
      background: #ffffff;
      font-family: 'Jua', sans-serif;
      font-size: 1.05rem;
      cursor: pointer;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }
    body.theme--arcade .origami-model-btn {
      background: #1f183b;
      color: #fff;
      border-color: #3b2e66;
    }
    .origami-model-btn.active {
      border-color: var(--pink-soft);
      background: #ffe4ec;
      color: #ff4081;
      transform: translateX(4px);
      box-shadow: 0 4px 12px rgba(255, 107, 157, 0.3);
    }
    body.theme--arcade .origami-model-btn.active {
      border-color: var(--cyan-neon);
      background: rgba(0, 242, 254, 0.2);
      color: var(--cyan-neon);
      box-shadow: 0 4px 12px rgba(0, 242, 254, 0.3);
    }

    /* 색상 선택 팔레트 */
    .origami-colors-row {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 6px;
    }
    .origami-color-chip {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 10px;
      border: 2px solid rgba(0,0,0,0.15);
      cursor: pointer;
      transition: transform 0.15s;
    }
    .origami-color-chip:hover {
      transform: scale(1.15);
    }
    .origami-color-chip.active {
      transform: scale(1.2);
      border-color: #222;
      box-shadow: 0 0 0 2px #fff, 0 4px 8px rgba(0,0,0,0.3);
    }

    /* 🖼️ 인터랙티브 종이 뷰포트 */
    .origami-stage-card {
      background: #ffffff;
      border: 3px solid #ffb3c6;
      border-radius: 24px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      width: 100%;
      box-sizing: border-box;
      min-width: 0;
    }
    body.theme--arcade .origami-stage-card {
      border-color: var(--cyan-neon);
      background: #181330;
    }

    #origamiCanvas {
      width: 100%;
      max-width: 580px;
      height: auto;
      aspect-ratio: 600 / 460;
      border-radius: 18px;
      border: 2px solid rgba(0,0,0,0.06);
      display: block;
      box-sizing: border-box;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* 🧭 단계 컨트롤러 바 */
    .step-controller {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 580px;
      margin-top: 14px;
      gap: 8px;
    }
    .step-nav-btn {
      padding: 11px 22px;
      border-radius: 16px;
      font-family: 'Jua', sans-serif;
      font-size: 1.15rem;
      border: none;
      background: linear-gradient(135deg, #ff758c, #ff7eb3);
      color: #fff;
      cursor: pointer;
      transition: all 0.2s;
    }
    body.theme--arcade .step-nav-btn {
      background: linear-gradient(135deg, #00f2fe, #4facfe);
      color: #0c0818;
    }
    .step-nav-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      transform: none !important;
    }
    .step-nav-btn:not(:disabled):hover {
      transform: translateY(-2px);
    }

    .step-indicator-badge {
      font-family: 'Jua', sans-serif;
      font-size: 1.25rem;
      padding: 6px 16px;
      border-radius: 14px;
      background: rgba(0,0,0,0.05);
    }
    body.theme--arcade .step-indicator-badge {
      background: rgba(255,255,255,0.1);
      color: var(--cyan-neon);
    }

    /* 📝 단계별 설명 & 꿀팁 박스 */
    .step-desc-box {
      width: 100%;
      max-width: 580px;
      background: #fff8f9;
      border: 2px dashed #ffb3c6;
      border-radius: 18px;
      padding: 16px 20px;
      margin-top: 14px;
      text-align: center;
      box-sizing: border-box;
    }
    body.theme--arcade .step-desc-box {
      background: rgba(0, 242, 254, 0.08);
      border-color: var(--cyan-neon);
    }
    .step-title-text {
      font-family: 'Jua', sans-serif;
      font-size: 1.35rem;
      color: #ff4081;
      margin-bottom: 6px;
    }
    body.theme--arcade .step-title-text {
      color: var(--cyan-neon);
    }
    .step-desc-text {
      font-size: 1.05rem;
      line-height: 1.6;
      opacity: 0.9;
      margin-bottom: 8px;
    }
    .step-tip-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 10px;
      background: #ffe4ec;
      color: #ff007f;
      font-size: 0.95rem;
      font-weight: bold;
    }
    body.theme--arcade .step-tip-badge {
      background: rgba(0, 242, 254, 0.15);
      color: #00f2fe;
    }

    /* 🎉 완성 후 액션 버튼 */
    .origami-complete-box {
      display: none;
      width: 100%;
      max-width: 580px;
      margin-top: 14px;
    }
    .complete-action-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    @media (max-width: 520px) {
      .complete-action-grid {
        grid-template-columns: 1fr;
      }
    }
    .btn-test {
      padding: 13px;
      border-radius: 16px;
      font-family: 'Jua', sans-serif;
      font-size: 1.15rem;
      border: none;
      cursor: pointer;
      background: linear-gradient(135deg, #ffd166, #ff9f43);
      color: #1a1a1a;
      box-shadow: 0 4px 15px rgba(255, 159, 67, 0.3);
    }
    .btn-reward-claim {
      padding: 13px;
      border-radius: 16px;
      font-family: 'Jua', sans-serif;
      font-size: 1.15rem;
      border: none;
      cursor: pointer;
      background: linear-gradient(135deg, #ff6b9d, #ff8da1);
      color: #fff;
      box-shadow: 0 4px 15px rgba(255, 107, 157, 0.4);
    }

    /* 🖨️ A4 출판용 워크시트 인쇄 스타일 */
    @media print {
      body * { visibility: hidden; }
      #origamiCanvas, #origamiCanvas * { visibility: visible; }
      #origamiCanvas {
        position: fixed;
        left: 0;
        top: 0;
        width: 100vw;
        height: 100vh;
        border: none;
      }
      .origami-sidebar, .step-controller, .pg-top-nav, .origami-complete-box { display: none !important; }
    }
  </style>
</head>
<body class="theme--hideout">

  <div class="pg-container">
    <!-- 🧭 상단 바 -->
    <div class="pg-top-nav">
      <a href="../index.html" class="pg-back-btn">⬅️ 놀이터 허브로</a>
      <div class="pg-trophy-bar">
        <span>📐 고화질 일러스트 종이접기</span>
      </div>
    </div>

    <!-- 🌟 타이틀 -->
    <div class="pg-header" style="margin-bottom: 16px;">
      <h1 class="pg-title">
        <span class="neon-text">📐 고화질 일러스트</span> <span class="accent-text">종이접기</span>
      </h1>
      <p class="pg-subtitle">앞뒷면 색상 대비와 빨간 점선·화살표를 보며 쉽게 따라 접고, A4 전용 도안으로 인쇄해요! 🖨️</p>
    </div>

    <!-- 🛠️ 2열 레이아웃 -->
    <div class="origami-layout">

      <!-- 좌측: 종이접기 모델 및 색상 선택 -->
      <div class="origami-sidebar">
        <div>
          <div class="origami-group-title"> origami 인기 종이접기</div>
          <div class="model-btn-list">
            <button type="button" class="origami-model-btn active" data-model="frog">
              <span>🐸 폴짝 점핑 개구리</span>
            </button>
            <button type="button" class="origami-model-btn" data-model="airplane">
              <span>🚀 슈퍼 제트 비행기</span>
            </button>
            <button type="button" class="origami-model-btn" data-model="fortune">
              <span>👑 동서남북 마법 상자</span>
            </button>
            <button type="button" class="origami-model-btn" data-model="heart">
              <span>💖 반짝 사랑 하트</span>
            </button>
            <button type="button" class="origami-model-btn" data-model="ttakji">
              <span>🪓 천하무적 딱지</span>
            </button>
          </div>
        </div>

        <!-- 색종이 색상 -->
        <div>
          <div class="origami-group-title">🎨 색종이 색상</div>
          <div class="origami-colors-row">
            <div class="origami-color-chip active" style="background:#22c55e;" data-color="#22c55e"></div>
            <div class="origami-color-chip" style="background:#0ea5e9;" data-color="#0ea5e9"></div>
            <div class="origami-color-chip" style="background:#ec4899;" data-color="#ec4899"></div>
            <div class="origami-color-chip" style="background:#eab308;" data-color="#eab308"></div>
            <div class="origami-color-chip" style="background:#f97316;" data-color="#f97316"></div>
            <div class="origami-color-chip" style="background:#a855f7;" data-color="#a855f7"></div>
          </div>
        </div>

        <!-- A4 도안 인쇄 버튼 -->
        <button type="button" id="printPatternBtn" class="pg-card-btn" style="cursor: pointer; width: 100%; border: none; padding: 12px; margin-top: auto;">
          🖨️ A4 전용 색종이 도안 인쇄
        </button>
      </div>

      <!-- 우측: 인터랙티브 종이 뷰포트 -->
      <div class="origami-stage-card">
        
        <!-- 2D/3D 고화질 종이접기 캔버스 -->
        <canvas id="origamiCanvas"></canvas>

        <!-- 🧭 이전/다음 단계 컨트롤러 -->
        <div class="step-controller">
          <button type="button" id="prevStepBtn" class="step-nav-btn">◀️ 이전 단계</button>
          <div class="step-indicator-badge" id="stepIndicator">1 / 5 단계</div>
          <button type="button" id="nextStepBtn" class="step-nav-btn">다음 단계 ▶️</button>
        </div>

        <!-- 📝 단계별 설명 및 꿀팁 박스 -->
        <div class="step-desc-box">
          <div class="step-title-text" id="stepTitle">1단계: 반으로 접어 십자(+) 기준선 만들기</div>
          <div class="step-desc-text" id="stepDesc">색종이의 색깔이 아래로 가도록 둔 뒤, 네모 모양으로 가로와 세로를 반씩 접었다 펼쳐요.</div>
          <div class="step-tip-badge" id="stepTip">💡 모서리를 꼭짓점에 정확히 맞추고 손톱으로 꾹꾹 눌러 다려주세요!</div>
        </div>

        <!-- 🎉 완성 시 액션 영역 -->
        <div class="origami-complete-box" id="origamiCompleteArea">
          <div class="complete-action-grid">
            <button type="button" id="testActionBtn" class="btn-test">
              ✨ 화면에서 날리기/점프 테스트!
            </button>
            <button type="button" id="claimOrigamiRewardBtn" class="btn-reward-claim">
              🎉 종이접기 완성! (💎 보상 받기)
            </button>
          </div>
        </div>

      </div>

    </div>
  </div>

  <!-- 🏰 노션 코어 및 보상 엔진 -->
  <script src="../../config.js"></script>
  <script src="../../core/notion-helper.js"></script>
  <script src="../../core/core.js"></script>
  <script src="../starr_drop_engine.js"></script>
  <script src="origami.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const savedUser = localStorage.getItem('currentUser') || 'daughter';
      if (savedUser === 'son') {
        document.body.className = 'theme--arcade';
      } else {
        document.body.className = 'theme--hideout';
      }
    });
  </script>
</body>
</html>
