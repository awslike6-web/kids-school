<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🎨 매직 컬러링 & 밑그림 공방 - 민민 놀이터</title>
  <link rel="stylesheet" href="../playground.css">
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Gaegu:wght@400;700&family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    .studio-layout {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 20px;
      margin-top: 16px;
    }
    @media (max-width: 860px) {
      .studio-layout {
        grid-template-columns: 1fr;
      }
    }

    /* 🧰 좌측 툴바 패널 */
    .toolbox {
      background: var(--card-light);
      border: 2px solid var(--border-light);
      border-radius: 24px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      box-shadow: 0 8px 25px rgba(255, 107, 157, 0.15);
    }
    body.theme--arcade .toolbox {
      background: var(--card-dark);
      border-color: var(--border-dark);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
    }

    .tool-group-title {
      font-family: 'Jua', sans-serif;
      font-size: 1.15rem;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .tool-btn-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .tool-btn {
      padding: 10px 6px;
      border-radius: 14px;
      border: 2px solid rgba(0,0,0,0.1);
      background: #ffffff;
      font-family: 'Jua', sans-serif;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      transition: all 0.2s;
    }
    body.theme--arcade .tool-btn {
      background: #231b40;
      color: #fff;
      border-color: #3b2e66;
    }
    .tool-btn.active {
      border-color: var(--pink-soft);
      background: #ffe4ec;
      color: #ff4081;
      transform: scale(1.05);
      box-shadow: 0 4px 12px rgba(255, 107, 157, 0.3);
    }
    body.theme--arcade .tool-btn.active {
      border-color: var(--cyan-neon);
      background: rgba(0, 242, 254, 0.2);
      color: var(--cyan-neon);
      box-shadow: 0 4px 12px rgba(0, 242, 254, 0.3);
    }

    /* 🎨 팔레트 */
    .color-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;
    }
    .color-chip {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 10px;
      border: 2px solid rgba(0,0,0,0.15);
      cursor: pointer;
      transition: transform 0.15s ease;
    }
    .color-chip:hover {
      transform: scale(1.15);
    }
    .color-chip.active {
      transform: scale(1.2);
      border-color: #222;
      box-shadow: 0 0 0 2px #fff, 0 4px 8px rgba(0,0,0,0.3);
    }

    /* 🖼️ 캔버스 뷰포트 */
    .canvas-viewport {
      background: #ffffff;
      border: 3px solid #ffb3c6;
      border-radius: 24px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      min-height: 520px;
    }
    body.theme--arcade .canvas-viewport {
      border-color: var(--cyan-neon);
    }

    .canvas-stack-wrapper {
      position: relative;
      width: 100%;
      max-width: 800px;
      aspect-ratio: 4 / 3;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      background: #fff;
    }
    .canvas-stack-wrapper canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    #outlineCanvas {
      z-index: 1;
      pointer-events: none;
      mix-blend-mode: multiply;
    }
    #colorCanvas {
      z-index: 2;
    }

    /* 프리셋 칩 */
    .preset-list {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .preset-btn {
      padding: 6px 12px;
      border-radius: 12px;
      border: 1.5px solid #ffb3c6;
      background: #fff;
      font-family: 'Jua', sans-serif;
      font-size: 0.9rem;
      cursor: pointer;
    }
    body.theme--arcade .preset-btn {
      background: #231b40;
      color: #fff;
      border-color: #3b2e66;
    }

    /* 액션 버튼 */
    .action-row {
      display: flex;
      gap: 10px;
      width: 100%;
      margin-top: 14px;
    }
    .act-btn {
      flex: 1;
      padding: 12px;
      border-radius: 16px;
      font-family: 'Jua', sans-serif;
      font-size: 1.1rem;
      border: none;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      transition: transform 0.2s;
    }
    .act-btn:hover {
      transform: translateY(-2px);
    }
    .btn-print {
      background: linear-gradient(135deg, #a78bfa, #818cf8);
      color: #fff;
    }
    .btn-complete {
      background: linear-gradient(135deg, #ff6b9d, #ff8da1);
      color: #fff;
      box-shadow: 0 4px 15px rgba(255, 107, 157, 0.4);
    }

    /* 🖨️ A4 인쇄 전용 스타일 */
    @media print {
      body * { visibility: hidden; }
      .canvas-viewport, .canvas-viewport * { visibility: visible; }
      .canvas-viewport {
        position: fixed;
        left: 0;
        top: 0;
        width: 100vw;
        height: 100vh;
        border: none;
        box-shadow: none;
      }
      .action-row, .pg-top-nav, .toolbox { display: none !important; }
    }
  </style>
</head>
<body class="theme--hideout">

  <div class="pg-container">
    <!-- 🧭 상단 바 -->
    <div class="pg-top-nav">
      <a href="../index.html" class="pg-back-btn">⬅️ 놀이터 허브로</a>
      <div class="pg-trophy-bar">
        <span>🎨 매직 컬러링 스튜디오</span>
      </div>
    </div>

    <!-- 🌟 타이틀 -->
    <div class="pg-header" style="margin-bottom: 20px;">
      <h1 class="pg-title">
        <span class="neon-text">🎨 매직 밑그림</span> & <span class="accent-text">색칠 공방</span>
      </h1>
      <p class="pg-subtitle">사진을 올리면 흑백 밑그림으로 짠! 웹에서 칠하거나 A4 스케치북으로 인쇄해요 🖨️</p>
    </div>

    <!-- 🛠️ 스튜디오 2열 레이아웃 -->
    <div class="studio-layout">

      <!-- 좌측: 도구함 -->
      <div class="toolbox">
        <!-- 1. 그리기 도구 -->
        <div>
          <div class="tool-group-title">🛠️ 색칠 도구</div>
          <div class="tool-btn-grid">
            <button type="button" class="tool-btn active" data-tool="fill">
              <span style="font-size: 1.5rem;">🪣</span>
              <span>페인트통</span>
            </button>
            <button type="button" class="tool-btn" data-tool="brush">
              <span style="font-size: 1.5rem;">🖍️</span>
              <span>크레파스</span>
            </button>
            <button type="button" class="tool-btn" data-tool="eraser">
              <span style="font-size: 1.5rem;">🧽</span>
              <span>지우개</span>
            </button>
          </div>
        </div>

        <!-- 2. 브러시 굵기 -->
        <div>
          <div class="tool-group-title">📏 브러시 굵기</div>
          <input type="range" id="brushSlider" min="4" max="40" value="14" style="width: 100%; accent-color: #ff6b9d;">
        </div>

        <!-- 3. 컬러 팔레트 -->
        <div>
          <div class="tool-group-title">🎨 무지개 색상</div>
          <div class="color-grid">
            <div class="color-chip active" style="background:#ff6b9d;" data-color="#ff6b9d"></div>
            <div class="color-chip" style="background:#ff4757;" data-color="#ff4757"></div>
            <div class="color-chip" style="background:#ffa502;" data-color="#ffa502"></div>
            <div class="color-chip" style="background:#ffd93d;" data-color="#ffd93d"></div>
            <div class="color-chip" style="background:#2ed573;" data-color="#2ed573"></div>
            <div class="color-chip" style="background:#1e90ff;" data-color="#1e90ff"></div>

            <div class="color-chip" style="background:#a78bfa;" data-color="#a78bfa"></div>
            <div class="color-chip" style="background:#ff9ff3;" data-color="#ff9ff3"></div>
            <div class="color-chip" style="background:#54a0ff;" data-color="#54a0ff"></div>
            <div class="color-chip" style="background:#48dbfb;" data-color="#48dbfb"></div>
            <div class="color-chip" style="background:#c8d6e5;" data-color="#c8d6e5"></div>
            <div class="color-chip" style="background:#576574;" data-color="#576574"></div>

            <div class="color-chip" style="background:#f8c291;" data-color="#f8c291"></div>
            <div class="color-chip" style="background:#e55039;" data-color="#e55039"></div>
            <div class="color-chip" style="background:#78e08f;" data-color="#78e08f"></div>
            <div class="color-chip" style="background:#38ada9;" data-color="#38ada9"></div>
            <div class="color-chip" style="background:#6a89cc;" data-color="#6a89cc"></div>
            <div class="color-chip" style="background:#4a384f;" data-color="#4a384f"></div>
          </div>
        </div>

        <!-- 4. 되돌리기 버튼 -->
        <div style="display: flex; gap: 8px;">
          <button type="button" id="undoBtn" class="preset-btn" style="flex:1;">↩️ 되돌리기</button>
          <button type="button" id="redoBtn" class="preset-btn" style="flex:1;">↪️ 다시실행</button>
        </div>

        <!-- 5. 기본 캐릭터 도안 -->
        <div>
          <div class="tool-group-title">✨ 기본 도안 선택</div>
          <div class="preset-list">
            <button type="button" class="preset-btn" data-preset="cat">🐱 아기 고양이</button>
            <button type="button" class="preset-btn" data-preset="dino">🦕 아기 공룡</button>
            <button type="button" class="preset-btn" data-preset="unicorn">🦄 마법 유니콘</button>
            <button type="button" class="preset-btn" data-preset="spike">🌵 브롤 스파이크</button>
          </div>
        </div>

        <!-- 6. 내 사진 올리기 -->
        <div>
          <div class="tool-group-title">📷 내 사진 올리기</div>
          <input type="file" id="imageUploadInput" accept="image/*" style="font-size: 0.85rem; width: 100%;">
        </div>
      </div>

      <!-- 우측: 캔버스 뷰포트 -->
      <div class="canvas-viewport">
        <div class="canvas-stack-wrapper">
          <canvas id="outlineCanvas"></canvas>
          <canvas id="colorCanvas"></canvas>
        </div>

        <!-- 하단 액션 버튼 -->
        <div class="action-row">
          <button type="button" id="printBtn" class="act-btn btn-print">
            <span>🖨️ A4 도안 인쇄하기</span>
          </button>
          <button type="button" id="completeBtn" class="act-btn btn-complete">
            <span>🎉 색칠 완성! 보상 받기 (🎁 스타드롭)</span>
          </button>
        </div>
      </div>

    </div>
  </div>

  <script src="../starr_drop_engine.js"></script>
  <script src="coloring.js"></script>
  <script>
    // 프로필 테마 동기화
    document.addEventListener('DOMContentLoaded', () => {
      const savedUser = localStorage.getItem('currentUser') || 'daughter';
      if (savedUser === 'son') {
        document.body.className = 'theme--arcade';
      } else {
        document.body.className = 'theme--hideout';
      }
    });
  </script>
</body>
</html>
