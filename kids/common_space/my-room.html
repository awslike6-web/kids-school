<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나만의 마이룸 & 상점</title>
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./my-room.css?v=20261031-room-split">
</head>
<body>

    <div class="top-nav">
        <div class="nav-left" id="user-badge">👦 마이룸</div>
        <div class="nav-right">
            <div class="wealth-badge" id="wealth-display">⏳ 지갑 확인 중...</div>
            <button onclick="if(typeof openScreenTimeReceiptModal === 'function') openScreenTimeReceiptModal();" class="home-btn" style="background: linear-gradient(135deg, #10b981, #059669); color: white; border: none; border-radius: 20px; box-shadow: 0 3px 8px rgba(16,185,129,0.3); cursor: pointer;">⏰ 오늘 폰시간 정산</button>
            
            <!-- 🚪 동선 수정: 한 칸 위(../)에 있는 로비 파일로 연결! -->
            <!-- ⚠️ 주의: 대형 로비 파일 이름이 lobby.html이 아니라면 파일명에 맞게 변경해주세요! -->
            <a href="gallery.html" class="home-btn" style="background: linear-gradient(135deg, #ff758c, #ff7eb3); color: white; border: none; border-radius: 20px; text-decoration: none;">🖼️ 꿈나무 갤러리</a>
            <button onclick="clearRoom()" class="home-btn" style="background:#E57373; color:white; border:none; border-radius:20px; margin-right:5px;">🧹 방 청소하기</button>
<a href="../../lobby.html" class="home-btn" id="exit-btn">🚪 대형 로비로 나가기</a>
            
        </div>
    </div>

    <div class="main-container">
        <!-- 🏠 캔버스: 가구가 배치되는 방 -->
        <div class="room-area" id="my-room">
            <div class="empty-msg" id="empty-msg">보관함에서 가구를 꺼내 방을 꾸며보세요!</div>
        </div>
        <p class="room-edit-hint">💡 방 안 아이템을 누르면 <b>↻ 회전</b> · <b>↔ 좌우반전</b> · 드래그로 위치 이동</p>

        <!-- 🛒 컨트롤러 -->
        <div class="tab-container">
            <div class="tab-buttons">
                <button class="tab-btn active" id="tab-shop-btn" onclick="switchTab('shop')">🛒 상점 (구매)</button>
                <button class="tab-btn" id="tab-inv-btn" onclick="switchTab('inventory')">📦 보관함 (배치)</button>
                <button class="tab-btn" id="tab-map-btn" onclick="switchTab('maps')">🗺️ 맵 (배경)</button>
            </div>
            <div class="dock-area" id="dock-content"></div>
        </div>
    </div>

    <script src="../config.js"></script>
    <script src="./my-room-core.js?v=20261031-room-split"></script>
<script src="./my-room-main.js?v=20261031-room-split"></script>
</body>
</html>
