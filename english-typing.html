<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>반짝반짝 영어 탐험대</title>
    <style>
        :root {
            --bg: #f7fbff; --bg2: #fff7db; --card: rgba(255, 255, 255, 0.92);
            --text: #223047; --muted: #667085; --primary: #6254ff; --primary2: #00b8d9;
            --accent: #ffb703; --success: #16a34a; --danger: #ef4444;
            --line: rgba(98, 84, 255, 0.16); --shadow: 0 24px 60px rgba(35, 52, 90, 0.18); --radius: 28px;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; color: var(--text); font-family: system-ui, sans-serif;
            background: linear-gradient(135deg, var(--bg), var(--bg2)); padding: 24px;
            display: flex; align-items: center; justify-content: center;
        }
        .app-shell { max-width: 700px; width: 100%; }
        .study-card {
            background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
            box-shadow: var(--shadow); padding: 40px 30px; text-align: center; backdrop-filter: blur(12px);
        }
        .mascot { width: 88px; height: 88px; display: grid; place-items: center; margin: 0 auto 14px; font-size: 52px; }
        h1, h2 { margin: 0 0 10px; font-weight: 900; color: #2c3e50; }
        .helper { color: var(--muted); margin-bottom: 25px; font-size: 15px; }
        select { padding: 12px; border-radius: 14px; border: 2px solid var(--line); font-size: 16px; font-weight: 700; color: var(--text); outline: none; margin-bottom: 20px; width: 100%; max-width: 350px; text-align: center; }
        .word-display { min-height: 80px; display: flex; align-items: center; justify-content: center; font-size: 38px; font-weight: 1000; word-break: keep-all; }
        .pos-badge { display: inline-block; padding: 6px 14px; margin: 10px 0 20px; border-radius: 999px; background: rgba(255, 209, 102, 0.3); font-weight: 900; font-size: 14px; }
        .main-input { width: 100%; padding: 16px; border-radius: 20px; border: 3px solid var(--line); font-size: 24px; text-align: center; font-weight: 900; outline: none; background: white; }
        .button-row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 20px; }
        .btn { border: 0; border-radius: 16px; padding: 14px 20px; cursor: pointer; color: white; background: linear-gradient(135deg, var(--primary), var(--primary2)); font-weight: 950; font-size: 16px; }
        .btn.secondary { background: linear-gradient(135deg, #ffb703, #fb7185); }
        .btn.good { background: linear-gradient(135deg, #16a34a, #22c55e); }
        .btn.ghost { background: rgba(120, 130, 160, 0.12); color: var(--text); border: 1px solid var(--line); }
        .feedback { min-height: 24px; margin-top: 15px; font-weight: 900; color: var(--primary); }
    </style>
</head>
<body>

<div class="app-shell">
    <div id="level-select-zone" class="study-card">
        <div class="mascot">🗺️</div>
        <h2>어디로 탐험을 떠날까요?</h2>
        <p class="helper">오늘 도전할 단계와 연습 방식을 선택해 주세요!</p>
        
        <select id="studyModeSelect">
            <option value="copy-eng">✍️ 영어 보고 따라 쓰기 (기초 연습)</option>
            <option value="kor-to-eng">🔤 한글 뜻 보고 영어 맞히기</option>
            <option value="eng-to-kor">📖 영어 보고 한글 뜻 맞히기</option>
            <option value="sound-to-eng">🔊 소리만 듣고 영어 맞히기</option>
        </select>

        <div class="button-row" style="flex-direction: column; max-width: 350px; margin: 0 auto; gap: 12px;">
            <button class="btn" style="width: 100%;" onclick="startAdventure(1)">⭐ 1단계 탐험 (음식과 맛)</button>
            <button class="btn secondary" style="width: 100%;" onclick="startAdventure(2)">⭐⭐ 2단계 탐험 (필수 복습)</button>
            <button class="btn ghost" style="width: 100%;" onclick="location.href='index.html'">🏠 대문으로 돌아가기</button>
        </div>
    </div>

    <div id="game-zone" class="study-card" style="display: none;">
        <div class="mascot" id="mascot">🚀</div>
        <h2 id="questionLabel">탐험을 시작합니다!</h2>
        <div class="word-display" id="questionText">단어 로딩 중...</div>
        <div class="pos-badge" id="posBadge">품사</div>
        <input id="answerInput" class="main-input" type="text" autocomplete="off" placeholder="여기에 답을 입력하세요" onkeydown="handleKey(event)">
        <div class="feedback" id="feedbackText"></div>
        <div class="button-row">
            <button class="btn good" onclick="submitAnswer()">정답 확인</button>
            <button class="btn secondary" onclick="speakCurrentWord()">소리 듣기</button>
            <button class="btn ghost" onclick="skipWord()">건너뛰기</button>
            <button class="btn ghost" onclick="goBackToMenu()">🔙 단계 선택으로</button>
            <button class="btn ghost" onclick="location.href='index.html'">🏠 홈으로 가기</button>
        </div>
    </div>
</div>

<script>
    const sampleWords = [
        { eng: 'bread', kor: '빵', pos: '명사', level: 1 },
        { eng: 'cheese pizza', kor: '치즈 피자', pos: '명사', level: 1 },
        { eng: 'cream', kor: '(우유로 만든)크림, 크림색', pos: '명사', level: 1 },
        { eng: 'curry', kor: '커리', pos: '명사', level: 1 },
        { eng: 'delicious', kor: '맛있는', pos: '형용사', level: 1 },
        { eng: 'drink', kor: '마시다', pos: '동사', level: 1 },
        { eng: 'fruit salad', kor: '과일 샐러드', pos: '명사', level: 1 },
        { eng: "How's your ~?", kor: '[음식]은 어때요?', pos: '문장', level: 1 },
        { eng: "I'd like ~.", kor: '[음식]을 주세요.', pos: '문장', level: 1 },
        { eng: 'ice', kor: '얼음', pos: '명사', level: 1 },
        { eng: 'ice cream', kor: '아이스크림', pos: '명사', level: 1 },
        { eng: "It's ~.", kor: '[맛]이에요.', pos: '문장', level: 1 },
        { eng: 'lemonade', kor: '레모네이드', pos: '명사', level: 1 },
        { eng: 'little', kor: '작은, 어린', pos: '형용사', level: 1 },
        { eng: 'meat', kor: '고기', pos: '명사', level: 1 },
        { eng: 'noodles', kor: '국수', pos: '명사', level: 1 },
        { eng: 'order', kor: '주문하다, 명령하다', pos: '동사', level: 1 },
        { eng: 'pancakes', kor: '팬케이크', pos: '명사', level: 1 },
        { eng: 'salty', kor: '짠, 짭짤한', pos: '형용사', level: 1 },
        { eng: 'sea', kor: '바다', pos: '명사', level: 1 },
        { eng: 'sour', kor: '신, 시큼한', pos: '형용사', level: 1 },
        { eng: 'spicy', kor: '매운, 매콤한', pos: '형용사', level: 1 },
        { eng: 'sweet', kor: '단, 달콤한', pos: '형용사', level: 1 },
        { eng: 'try', kor: '노력하다, 시도하다', pos: '동사', level: 1 },
        { eng: 'vegetable pizza', kor: '야채 피자', pos: '명사', level: 1 },
        { eng: 'wait', kor: '기다리다', pos: '동사', level: 1 },
        { eng: 'What would you like?', kor: '뭐 드시겠어요?', pos: '문장', level: 1 },
        { eng: 'would', kor: '-하다', pos: '동사', level: 1 },
        { eng: 'apple', kor: '사과', pos: '명사', level: 2 }
    ];

    let words = [];
    let currentIndex = 0;
    let currentMode = 'copy-eng';

    window.addEventListener('load', () => {
        const urlParams = new URLSearchParams(window.location.search);
        const level = urlParams.get('level');
        const mode = urlParams.get('mode') || 'copy-eng';

        if (!level) {
            document.getElementById('level-select-zone').style.display = 'block';
            document.getElementById('game-zone').style.display = 'none';
        } else {
            document.getElementById('level-select-zone').style.display = 'none';
            document.getElementById('game-zone').style.display = 'block';
            
            const currentLevel = parseInt(level) || 1;
            currentMode = mode;
            
            // 상단 타이틀 안내 문구 변경
            let modeTitle = "따라 쓰기 탐험";
            if(currentMode === 'kor-to-eng') modeTitle = "뜻 보고 맞히기 탐험";
            if(currentMode === 'eng-to-kor') modeTitle = "한글 뜻 맞히기 탐험";
            if(currentMode === 'sound-to-eng') modeTitle = "소리 듣기 탐험";

            document.getElementById('questionLabel').textContent = `${currentLevel}단계 [${modeTitle}] 시작!`;
            
            words = sampleWords.filter(w => w.level === currentLevel);
            currentIndex = 0;
            renderQuestion();
        }
    });

    function startAdventure(level) {
        const selectedMode = document.getElementById('studyModeSelect').value;
        // 주소창에 레벨과 함께 선택한 모드(공부 방식)를 같이 전달합니다!
        location.href = `english_typing_app1.html?level=${level}&mode=${selectedMode}`;
    }

    function goBackToMenu() {
        location.href = 'english_typing_app1.html';
    }

    function renderQuestion() {
        if (words.length === 0) {
            document.getElementById('questionText').textContent = "단어가 없습니다.";
            return;
        }
        if (currentIndex >= words.length) {
            document.getElementById('questionText').textContent = "🎉 모든 문제를 풀었어요!";
            document.getElementById('answerInput').style.display = 'none';
            return;
        }
        
        const item = words[currentIndex];
        document.getElementById('posBadge').textContent = "품사: " + item.pos;
        document.getElementById('answerInput').value = "";
        document.getElementById('feedbackText').textContent = "";

        // 💡 선택된 모드에 맞춰 화면에 문제 출제!
        if (currentMode === 'copy-eng') {
            document.getElementById('questionText').textContent = item.eng; // 영어 보여주기
            document.getElementById('answerInput').placeholder = `뜻: ${item.kor} (그대로 따라 쓰세요)`;
        } else if (currentMode === 'kor-to-eng') {
            document.getElementById('questionText').textContent = item.kor; // 뜻 보여주기
            document.getElementById('answerInput').placeholder = "영단어·문장을 입력하세요";
        } else if (currentMode === 'eng-to-kor') {
            document.getElementById('questionText').textContent = item.eng; // 영어 보여주기
            document.getElementById('answerInput').placeholder = "한글 뜻을 입력하세요 (예: 빵)";
        } else if (currentMode === 'sound-to-eng') {
            document.getElementById('questionText').textContent = "🔊 소리를 잘 들어보세요";
            document.getElementById('answerInput').placeholder = "들을 영어를 입력하세요";
            setTimeout(speakCurrentWord, 300);
        }

        setTimeout(() => document.getElementById('answerInput').focus(), 50);
    }

    function submitAnswer() {
        if (currentIndex >= words.length) return;
        const input = document.getElementById('answerInput').value.trim().toLowerCase();
        const item = words[currentIndex];
        
        let isCorrect = false;

        // 💡 모드별로 정답 기준 다르게 정하기
        if (currentMode === 'eng-to-kor') {
            // 한글 뜻 맞히기 모드일 때는 한글 뜻에 입력값이 포함되어 있는지 검사합니다.
            const cleanKor = item.kor.replace(/\s+/g, '');
            const cleanInput = input.replace(/\s+/g, '');
            isCorrect = cleanKor.includes(cleanInput) && cleanInput !== "";
        } else {
            // 나머지 모드는 영어가 정답
            isCorrect = (input === item.eng.toLowerCase());
        }

        if (isCorrect) {
            document.getElementById('feedbackText').style.color = "green";
            document.getElementById('feedbackText').textContent = "🎯 정답입니다!";
            currentIndex++;
            setTimeout(renderQuestion, 1000);
        } else {
            document.getElementById('feedbackText').style.color = "red";
            document.getElementById('feedbackText').textContent = "❌ 다시 한번 생각해 보세요!";
        }
    }

    function handleKey(e) { if (e.key === 'Enter') submitAnswer(); }
    function skipWord() { currentIndex++; renderQuestion(); }
    function speakCurrentWord() {
        if (currentIndex >= words.length) return;
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(words[currentIndex].eng);
        utterance.lang = 'en-US';
        window.speechSynthesis.speak(utterance);
    }
</script>
</body>
</html>
