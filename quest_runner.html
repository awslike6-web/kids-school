<!DOCTYPE html>
<html class="dark" lang="ko">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>5-Min Quest Runner 🚀</title>
  
  <meta name="theme-color" content="#120924"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <link rel="icon" type="image/png" href="./icon-192.png"/>

  <!-- Google Fonts & Material Symbols -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""/>
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Plus+Jakarta+Sans:wght@700;800;900&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "lab-bg": "#120924",
            "lab-card": "#1e1338",
            "lab-card-border": "#2d1f4e",
            "neon-green": "#39ff14",
            "neon-green-shadow": "#045300",
            "neon-cyan": "#7df4ff",
            "fire-orange": "#ff7f1c",
            "error-red": "#ff4d4d"
          },
          fontFamily: {
            "jua": ["Jua", "sans-serif"],
            "eng": ["Plus Jakarta Sans", "sans-serif"]
          }
        }
      }
    };
  </script>

  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body {
      background: radial-gradient(circle at 50% 20%, #221340 0%, #120924 80%);
      min-height: 100dvh;
      font-family: 'Jua', sans-serif;
    }

    .material-symbols-outlined {
      font-variation-settings: 'FILL' 1, 'wght' 700, 'GRAD' 0, 'opsz' 24;
      display: inline-block;
      vertical-align: middle;
      line-height: 1;
    }

    /* ======================================================== */
    /* 📐 공부방 공식: 교과서 실물 정품 세로 분수 (Vertical Fraction) */
    /* ======================================================== */
    .inline-frac {
      display: inline-flex;
      flex-direction: column;
      vertical-align: middle;
      text-align: center;
      padding: 0 4px;
      font-size: 1.1em;
      line-height: 1;
      font-weight: 700;
    }
    .inline-frac .num {
      display: block;
      padding-bottom: 2px;
      color: inherit;
      line-height: 1;
    }
    .inline-frac .bar {
      display: block;
      border-top: 2.5px solid currentColor;
      height: 0;
      width: 100%;
      min-width: 16px;
      margin: 2px 0;
      font-size: 0;
    }
    .inline-frac .den {
      display: block;
      padding-top: 2px;
      color: inherit;
      line-height: 1;
    }

    /* 대분수 래퍼 */
    .mixed-frac {
      display: inline-flex;
      align-items: center;
      vertical-align: middle;
      gap: 3px;
      font-weight: 700;
    }
    .mixed-frac .whole {
      font-size: 1.25em;
      line-height: 1;
      color: inherit;
    }

    /* 3D 젤리 버튼 물리 효과 */
    .jelly-btn {
      position: relative;
      transition: all 0.08s ease;
      cursor: pointer;
    }
    .jelly-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 0 var(--depth-color, #045300) !important;
    }

    /* 바텀시트 슬라이드업 */
    @keyframes sheetSlideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    .animate-sheet-up {
      animation: sheetSlideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* 몬스터 응원 바운스 */
    @keyframes cheerBounce {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-8px) scale(1.05); }
    }
    .animate-cheer {
      animation: cheerBounce 2.4s ease-in-out infinite;
    }

    /* 정답 팡파르 몬스터 점프 */
    @keyframes victoryJump {
      0% { transform: translateY(0) scale(1); }
      30% { transform: translateY(-24px) scale(1.15) rotate(5deg); }
      60% { transform: translateY(-4px) scale(0.95) rotate(-3deg); }
      100% { transform: translateY(0) scale(1); }
    }
    .victory-jump {
      animation: victoryJump 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) !important;
    }
  </style>
</head>

<body class="text-white min-h-[100dvh] flex flex-col justify-between overflow-x-hidden p-4 pb-6 max-w-md mx-auto">

  <!-- ================= 1. 상단 HUD: 나가기 + 게이지바 + 하트 라이프 ================= -->
  <header class="flex items-center gap-3 pt-1">
    <!-- 나가기 버튼 -->
    <button class="w-9 h-9 rounded-full bg-lab-card/80 border border-lab-card-border flex items-center justify-center text-gray-400 hover:text-white active:scale-95 transition-transform" onclick="confirmExit()">
      <span class="material-symbols-outlined text-lg">close</span>
    </button>

    <!-- 실시간 진행 게이지 바 -->
    <div class="flex-1 bg-lab-card h-4 rounded-full border border-lab-card-border overflow-hidden p-0.5 relative">
      <div id="progressBar" class="bg-gradient-to-r from-neon-cyan to-neon-green h-full rounded-full transition-all duration-300" style="width: 20%;"></div>
    </div>

    <!-- 하트 라이프 -->
    <div class="flex items-center gap-1 bg-lab-card/80 border border-lab-card-border px-2.5 py-1 rounded-full">
      <span class="text-sm" id="heartIcons">❤️❤️❤️</span>
    </div>
  </header>

  <!-- ================= 2. 중앙 문제 쇼케이스 & 치어리더 몬스터 ================= -->
  <main class="flex-1 flex flex-col justify-center py-4 space-y-4">
    
    <!-- 과목 테마 뱃지 -->
    <div class="flex items-center justify-between">
      <div class="inline-flex items-center gap-1.5 bg-lab-card/80 border border-lab-card-border px-3 py-1 rounded-full text-xs text-neon-cyan font-bold">
        <span id="subjectBadgeIcon">🧮</span>
        <span id="subjectBadgeTitle">수학 분쇄 던전 · 5-2 분수</span>
      </div>
      <span class="text-xs font-eng text-gray-400 font-bold" id="stepCounter">문제 1 / 5</span>
    </div>

    <!-- 문제 카드 -->
    <div class="bg-lab-card border-2 border-lab-card-border rounded-3xl p-5 shadow-2xl relative">
      
      <!-- 오디오 듣기 버튼 (영어 과목일 때 노출) -->
      <div id="audioPlayWrapper" class="hidden mb-3">
        <button class="jelly-btn inline-flex items-center gap-2 bg-yellow-400 text-lab-bg px-4 py-2 rounded-2xl font-bold text-sm shadow-[0_4px_0_0_#997300]" onclick="playQuestionAudio()">
          <span class="material-symbols-outlined text-lg">volume_up</span>
          <span>원어민 발음 듣기</span>
        </button>
      </div>

      <!-- 문제 텍스트 (세로 분수 완벽 지원) -->
      <h2 id="questionText" class="text-lg font-bold text-white leading-relaxed">
        <!-- 동적 렌더링 -->
      </h2>

      <!-- 보조 힌트 / 수식 박스 (세로 분수 수평선 완벽 렌더링) -->
      <div id="formulaBox" class="mt-4 bg-lab-bg/90 border border-lab-card-border rounded-2xl p-4 text-center text-xl md:text-2xl font-bold text-neon-cyan flex items-center justify-center gap-2.5 flex-wrap">
        <!-- 동적 렌더링 -->
      </div>
    </div>

    <!-- 몬스터 치어리더 (좌측 하단 응원단) -->
    <div class="flex items-center gap-3 px-2">
      <div class="relative w-14 h-14 flex items-center justify-center">
        <img 
          id="cheerMonster" 
          src="./kids/assets/images/monsters/purple_monster.png" 
          alt="클레이 바이트" 
          class="animate-cheer w-14 h-14 object-contain filter drop-shadow-md"
        />
      </div>
      <!-- 작은 응원 말풍선 -->
      <div class="flex-1 bg-lab-card/70 border border-lab-card-border px-3.5 py-2 rounded-2xl">
        <p id="cheerSpeech" class="text-xs text-gray-300">
          "민수야, 분모는 그대로 두고 분자끼리 더하면 돼! ⚡"
        </p>
      </div>
    </div>

    <!-- 3D 젤리 선택지 버튼 목록 (세로 분수 완벽 렌더링) -->
    <div id="choicesList" class="space-y-2.5 pt-1">
      <!-- 동적 생성 -->
    </div>

  </main>

  <!-- ================= 3. 하단 확인 버튼 ================= -->
  <footer class="w-full pt-2">
    <button 
      id="checkAnswerBtn"
      class="jelly-btn w-full bg-neon-green text-[#023300] py-4 rounded-2xl text-center shadow-[0_6px_0_0_#045300] font-bold text-lg tracking-wide border border-[#55ff35] disabled:opacity-40 disabled:cursor-not-allowed"
      style="--depth-color: #045300;"
      disabled
      onclick="handleCheckAnswer()"
    >
      확인하기 🚀
    </button>
  </footer>

  <!-- ================= 4. 정답 / 오답 판정 바텀시트 ================= -->
  <div id="feedbackSheet" class="fixed inset-x-0 bottom-0 z-50 hidden animate-sheet-up">
    <div id="feedbackBox" class="max-w-md mx-auto p-5 rounded-t-3xl shadow-[0_-8px_30px_rgba(0,0,0,0.8)] border-t-2 space-y-3">
      
      <!-- 상태 텍스트 & 아이콘 -->
      <div class="flex items-center gap-3">
        <div id="feedbackIconWrapper" class="w-10 h-10 rounded-full flex items-center justify-center text-xl">
          🎉
        </div>
        <div>
          <h4 id="feedbackTitle" class="text-base font-bold">정답입니다!</h4>
          <p id="feedbackDesc" class="text-xs opacity-90">+10 EXP / +3 🪙 획득!</p>
        </div>
      </div>

      <!-- 다음 버튼 -->
      <button 
        id="nextStepBtn"
        class="jelly-btn w-full py-3.5 rounded-2xl font-bold text-base text-center shadow-md active:translate-y-1"
        onclick="goToNextStep()"
      >
        계속하기 ➔
      </button>
    </div>
  </div>

  <!-- ================= 4.5. 나가기 확인 모달 (내 방 연동) ================= -->
  <div id="exitModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden items-center justify-center p-4">
    <div class="bg-lab-card border-2 border-lab-card-border rounded-3xl max-w-xs w-full p-5 text-center space-y-3.5 shadow-2xl">
      <div class="w-14 h-14 rounded-2xl bg-purple-900/60 border border-purple-500/50 mx-auto flex items-center justify-center text-3xl">
        🚪
      </div>
      <div>
        <h3 class="text-lg font-bold text-white">퀘스트를 멈출까요?</h3>
        <p class="text-xs text-gray-300 mt-1">언제든 다시 도전할 수 있어요!</p>
      </div>

      <div class="space-y-2 pt-1">
        <button class="jelly-btn w-full py-3 rounded-xl bg-neon-green text-[#023300] font-bold text-sm shadow-[0_4px_0_0_#045300]" onclick="closeExitModal()">
          계속 공부하기 🚀
        </button>
        <button class="w-full py-2.5 rounded-xl bg-lab-bg border border-lab-card-border text-gray-300 text-xs font-bold hover:text-white" onclick="returnToLab()">
          👾 몬스터 연구실로
        </button>
        <button class="w-full py-2.5 rounded-xl bg-lab-bg border border-neon-cyan/50 text-neon-cyan text-xs font-bold hover:bg-neon-cyan/10" id="exitDeepTrainingBtn" onclick="goToSubjectDeepTraining()">
          🧮 과목 심화 훈련관으로
        </button>
        <button class="w-full py-2.5 rounded-xl bg-lab-bg border border-lab-card-border text-gray-400 text-xs font-bold hover:text-white" onclick="goToLobby()">
          🏠 공부방 로비로
        </button>
      </div>
    </div>
  </div>

  <!-- ================= 4.8. 몬스터 리벤지 배틀 모달 (오답 즉시 구출) ================= -->
  <div id="revengeModal" class="fixed inset-0 bg-black/85 backdrop-blur-md z-50 hidden items-center justify-center p-4">
    <div class="bg-lab-card border-2 border-fire-orange rounded-3xl max-w-xs w-full p-5 text-center space-y-3.5 shadow-2xl animate-sheet-up">
      <div class="w-16 h-16 rounded-2xl bg-fire-orange/20 border-2 border-fire-orange mx-auto flex items-center justify-center text-3xl animate-bounce">
        👾
      </div>
      <div>
        <h3 class="text-lg font-bold text-white">앗! 놓친 몬스터가 나타났다!</h3>
        <p class="text-xs text-gray-300 mt-1">방금 아깝게 놓친 문제를 지금 바로 잡고 보너스 다이아💎를 챙겨가자!</p>
      </div>

      <div class="space-y-2 pt-1">
        <button class="jelly-btn w-full py-3.5 rounded-2xl bg-fire-orange text-white font-bold text-sm shadow-[0_4px_0_0_#602a00]" onclick="startRevengeRound()">
          복수전 출격하기! ⚔️
        </button>
        <button class="w-full py-2.5 rounded-xl bg-lab-bg border border-lab-card-border text-gray-400 text-xs font-bold hover:text-white" onclick="skipRevengeAndClear()">
          다음에 다시 잡기
        </button>
      </div>
    </div>
  </div>

  <!-- ================= 5. 5문제 완료 축하 모달 ================= -->
  <div id="clearModal" class="fixed inset-0 bg-black/85 backdrop-blur-md z-50 hidden items-center justify-center p-4">
    <div class="bg-lab-card border-2 border-neon-green rounded-3xl max-w-sm w-full p-6 text-center space-y-4 shadow-2xl">
      <!-- 팡파르 아이콘 -->
      <div class="w-20 h-20 rounded-full bg-neon-green/20 border-2 border-neon-green mx-auto flex items-center justify-center text-4xl animate-bounce">
        🏆
      </div>
      
      <div>
        <h3 class="text-xl font-bold text-white">5분 퀘스트 완료!</h3>
        <p class="text-xs text-neon-green mt-1 font-bold">🔥 4일 연속 불꽃 스트릭 유지 성공!</p>
      </div>

      <!-- 보상 요약 박스 -->
      <div class="bg-lab-bg border border-lab-card-border rounded-2xl p-3.5 text-left space-y-2">
        <div class="flex justify-between items-center text-xs">
          <span class="text-gray-400">클리어 보너스</span>
          <span class="font-eng font-bold text-neon-cyan">+50 EXP</span>
        </div>
        <div class="flex justify-between items-center text-xs">
          <span class="text-gray-400">골드 획득</span>
          <span class="font-eng font-bold text-yellow-300">🪙 15 코인</span>
        </div>
        <div class="flex justify-between items-center text-xs">
          <span class="text-gray-400">파트너 유대감</span>
          <span class="font-eng font-bold text-neon-green">Lv.12 ➔ 99% 💖</span>
        </div>
      </div>

      <!-- 버튼 3개: 연구실 복귀 & 과목별 심화 훈련 & 공부방 로비 -->
      <div class="space-y-2 pt-1">
        <button class="jelly-btn w-full py-3.5 rounded-2xl bg-neon-green text-[#023300] font-bold text-base shadow-[0_6px_0_0_#045300]" onclick="returnToLab()">
          연구실로 돌아가기 👾
        </button>
        <button class="w-full py-2.5 rounded-2xl bg-lab-bg border border-neon-cyan/50 text-neon-cyan font-bold text-xs hover:bg-neon-cyan/10" id="deepTrainingBtn" onclick="goToSubjectDeepTraining()">
          🧮 과목 심화 실전 훈련관 가기 ➔
        </button>
        <button class="w-full py-2.5 rounded-2xl bg-lab-bg border border-lab-card-border text-gray-300 font-bold text-xs hover:text-white" onclick="goToLobby()">
          🏠 공부방 로비(lobby.html)로 가기 ➔
        </button>
      </div>
    </div>
  </div>

  <!-- ================= 6. 노션 보상 및 학습일지 DB & 요정 음성 코어 모듈 로드 ================= -->
  <script src="./kids/config.js"></script>
  <script src="./kids/core/notion-reward.js"></script>
  <script src="./kids/core/fairy-config.js"></script>
  <script src="./kids/core/fairy-engine.js"></script>

  <!-- ================= 7. 실시간 퀴즈 러너 엔진 스크립트 ================= -->
  <script>
    // ========================================================
    // 📐 공부방 공식 세로 분수 (Vertical Fraction) 렌더러 헬퍼
    // ========================================================
    function renderFrac(num, den) {
      return `<span class="inline-frac"><span class="num">${num}</span><span class="bar"></span><span class="den">${den}</span></span>`;
    }

    function renderMixed(whole, num, den) {
      return `<span class="mixed-frac"><span class="whole">${whole}</span><span class="inline-frac"><span class="num">${num}</span><span class="bar"></span><span class="den">${den}</span></span></span>`;
    }

    // 텍스트 내의 "1/4" 나 "1과 2/7"을 교과서 정품 세로 분수로 자동 치환
    function formatFractions(str) {
      if (typeof str !== 'string') return str;
      return str
        .replace(/(\d+)과\s+(\d+)\/(\d+)/g, (_, w, n, d) => renderMixed(w, n, d))
        .replace(/(\d+)\/(\d+)/g, (_, n, d) => renderFrac(n, d));
    }

    // ========================================================
    // 🧮 [민수 맞춤 기초 필수 연산] 두 자릿수 ÷ 한 자릿수 실전 나눗셈 문제 은행 (14선)
    // 십의 자리 몫, 몫과 나머지, 나누는 수보다 작은 나머지 원리, 바른 검산식 탑재
    // ========================================================
    const mathDivisionBank = [
      // 1. 나누어떨어지는 두 자릿수 ÷ 한 자릿수 (8제)
      {
        id: "div_calc_1",
        q: "48 ÷ 4 를 계산한 몫은 얼마일까요?",
        formula: "48 ÷ 4 = [ ? ]",
        options: ["12", "14", "16", "24"],
        answer: 0,
        hint: "십의 자리 4÷4=1, 일의 자리 8÷4=2 이므로 몫은 12입니다! ⚡"
      },
      {
        id: "div_calc_2",
        q: "72 ÷ 3 을 계산한 몫은 얼마일까요?",
        formula: "72 ÷ 3 = [ ? ]",
        options: ["21", "24", "26", "32"],
        answer: 1,
        hint: "70 안에는 3이 20번 들어가고 12가 남아요. 12÷3=4 이므로 정답은 24! 🎯"
      },
      {
        id: "div_calc_3",
        q: "96 ÷ 4 를 계산한 값으로 알맞은 것은?",
        formula: "96 ÷ 4 = [ ? ]",
        options: ["22", "24", "26", "28"],
        answer: 1,
        hint: "90 안에는 4가 20번(80) 들어가고 16이 남아요. 16÷4=4 이므로 24입니다!"
      },
      {
        id: "div_calc_4",
        q: "84 ÷ 6 을 계산한 몫은 얼마일까요?",
        formula: "84 ÷ 6 = [ ? ]",
        options: ["12", "13", "14", "16"],
        answer: 2,
        hint: "6 × 10 = 60을 빼면 24가 남고, 6 × 4 = 24이므로 정답은 14! 💡"
      },
      {
        id: "div_calc_5",
        q: "65 ÷ 5 를 계산한 결과는 무엇일까요?",
        formula: "65 ÷ 5 = [ ? ]",
        options: ["11", "12", "13", "15"],
        answer: 2,
        hint: "5 × 10 = 50, 남은 15 ÷ 5 = 3이므로 정답은 13입니다!"
      },
      {
        id: "div_calc_6",
        q: "56 ÷ 2 를 계산한 몫은 얼마일까요?",
        formula: "56 ÷ 2 = [ ? ]",
        options: ["26", "28", "32", "38"],
        answer: 1,
        hint: "50의 절반은 25, 6의 절반은 3이므로 25 + 3 = 28! 🏃"
      },
      {
        id: "div_calc_7",
        q: "91 ÷ 7 을 계산한 몫으로 알맞은 것은?",
        formula: "91 ÷ 7 = [ ? ]",
        options: ["11", "12", "13", "14"],
        answer: 2,
        hint: "7 × 10 = 70을 빼면 21이 남아요. 21 ÷ 7 = 3이므로 13입니다!"
      },
      {
        id: "div_calc_8",
        q: "75 ÷ 5 를 계산한 몫은 얼마일까요?",
        formula: "75 ÷ 5 = [ ? ]",

    const ADAPTIVE_STORAGE_KEY = 'MINMIN_ADAPTIVE_QUEUE_V1';

    function getAdaptiveQueue(subj) {
      try {
        const raw = localStorage.getItem(ADAPTIVE_STORAGE_KEY);
        const data = raw ? JSON.parse(raw) : {};
        return data[subj] || [];
      } catch (e) {
        return [];
      }
    }

    function saveAdaptiveQueue(subj, queue) {
      try {
        const raw = localStorage.getItem(ADAPTIVE_STORAGE_KEY);
        const data = raw ? JSON.parse(raw) : {};
        data[subj] = queue;
        localStorage.setItem(ADAPTIVE_STORAGE_KEY, JSON.stringify(data));
      } catch (e) {}
    }

    function recordWrongItem(subj, questionObj) {
      const q = getAdaptiveQueue(subj);
      const existing = q.find(item => item.q === questionObj.q);
      const today = new Date().toISOString().slice(0, 10);
      if (existing) {
        existing.failCount = (existing.failCount || 1) + 1;
        existing.streak = 0;
        existing.lastReviewed = today;
      } else {
        q.push({
          id: questionObj.id || `q_${Date.now()}`,
          q: questionObj.q,
          formula: questionObj.formula,
          options: questionObj.options,
          answer: questionObj.answer,
          hint: questionObj.hint,
          audioText: questionObj.audioText,
          failCount: 1,
          streak: 0,
          box: 1,
          lastReviewed: today
        });
      }
      saveAdaptiveQueue(subj, q);
    }

    function recordCorrectItem(subj, questionObj) {
      const q = getAdaptiveQueue(subj);
      const idx = q.findIndex(item => item.q === questionObj.q);
      if (idx !== -1) {
        q[idx].streak = (q[idx].streak || 0) + 1;
        q[idx].box = Math.min(3, (q[idx].box || 1) + 1);
        q[idx].lastReviewed = new Date().toISOString().slice(0, 10);
        // 3회 연속 성공 시 완전 마스터 졸업!
        if (q[idx].streak >= 3) {
          q.splice(idx, 1);
        }
        saveAdaptiveQueue(subj, q);
      }
    }

            hint: "원통형 쇠통에 빗물을 받아 깊이를 쟀던 '측우기'예요! 🌧️"
          },
          {
            id: "soc_8",
            q: "조선 세종 때 장영실이 만든, 스스로 종과 북을 쳐서 시간을 알려주던 물시계는?",
            formula: "자동 시보 물시계",
            options: ["자격루", "앙부일구", "일성정시의", "혼천의"],
            answer: 0,
            hint: "스스로 격발하여 시간을 알려주는 정밀 물시계 '자격루'예요! ⏰"
          },
          {
            id: "soc_9",
            q: "임진왜란 때 바다에서 왜군을 격파하기 위해 이순신 장군이 만든 철갑선 형태의 전투선은?",
            formula: "조선 수군의 비밀 병기",
            options: ["거북선", "판옥선", "포격선", "비거"],
            answer: 0,
            hint: "용의 머리에서 대포와 연기를 뿜고 등에는 쇠송곳을 꽂은 '거북선'이에요! 🐢"
          },
          {
            id: "soc_10",
            q: "[보스 역사 탐구] 이성계가 명나라를 치러 가던 중 압록강의 섬에서 군사를 돌려 정권을 잡고 조선을 세우게 된 역사적 사건은?",
            formula: "조선 건국의 결정적 계기",
            options: ["위화도 회군", "살수대첩", "귀주대첩", "삼별초의 항쟁"],
            answer: 0,
            hint: "위화도에서 4가지 불가론을 들며 군사를 돌린 '위화도 회군'이에요! 🐎"
          }
        ]
      }
    };

    // 퀘스트 데이터 바인딩
    let currentQuest = getSubjectQuest(currentSubj, currentUnit, currentMode);

    let currentIndex = 0;
    let selectedOptionIndex = null;
    let hearts = 3;
    let isAnswerChecked = false;
    let audioCtx = null;
    let sessionMissedQuestions = [];
    let sessionWrongLogs = [];
    let isRevengeMode = false;

    // Web Audio 사운드 엔진
    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }
    window.addEventListener('pointerdown', initAudio, { once: true });

    function playSound(type) {
      initAudio();
      if (!audioCtx) return;
      const now = audioCtx.currentTime;

      if (type === 'tap') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(540, now);
        osc.frequency.exponentialRampToValueAtTime(160, now + 0.07);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.07);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.08);
      } else if (type === 'correct') {
        [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, now + idx * 0.08);
          gain.gain.setValueAtTime(0.25, now + idx * 0.08);
          gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.28);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now + idx * 0.08);
          osc.stop(now + idx * 0.08 + 0.29);
        });
      } else if (type === 'wrong') {
        [320, 240].forEach((freq, idx) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(freq, now + idx * 0.12);
          gain.gain.setValueAtTime(0.2, now + idx * 0.12);
          gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.12 + 0.2);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now + idx * 0.12);
          osc.stop(now + idx * 0.12 + 0.22);
        });
      } else if (type === 'fanfare') {
        [523.25, 659.25, 783.99, 1046.50, 1318.51].forEach((freq, idx) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, now + idx * 0.1);
          gain.gain.setValueAtTime(0.3, now + idx * 0.1);
          gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.1 + 0.4);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now + idx * 0.1);
          osc.stop(now + idx * 0.1 + 0.45);
        });
      }
    }

    // 초기 화면 렌더링
    function initScreen() {
      if (isMinseo) {
        document.title = "5-Min Sweet Quest Runner 🧸";
        const monster = document.getElementById('cheerMonster');
        if (monster) {
          monster.src = './kids/assets/images/minseo/avatar.png';
          monster.onerror = () => {
            monster.src = './kids/assets/images/monsters/purple_monster.png';
          };
        }
      }

      document.getElementById('subjectBadgeIcon').textContent = currentQuest.icon;
      document.getElementById('subjectBadgeTitle').textContent = currentQuest.title;

      const deepBtn = document.getElementById('deepTrainingBtn');
      const exitDeepBtn = document.getElementById('exitDeepTrainingBtn');
      if (isMinseo) {
        if (currentSubj === 'haru') {
          if (deepBtn) deepBtn.innerHTML = `🎒 슬기로운 하루 탐험관 가기 ➔`;
          if (exitDeepBtn) exitDeepBtn.innerHTML = `🎒 슬기로운 하루 탐험관으로`;
        } else if (currentSubj === 'korean') {
          if (deepBtn) deepBtn.innerHTML = `📖 낱말 베이커리 국어관 가기 ➔`;
          if (exitDeepBtn) exitDeepBtn.innerHTML = `📖 낱말 베이커리 국어관으로`;
        } else if (currentSubj === 'math') {
          if (deepBtn) deepBtn.innerHTML = `🧮 캔디 수학 놀이터 가기 ➔`;
          if (exitDeepBtn) exitDeepBtn.innerHTML = `🧮 캔디 수학 놀이터로`;
        } else if (currentSubj === 'english') {
          if (deepBtn) deepBtn.innerHTML = `🔤 파닉스 영어 기억방 가기 ➔`;
          if (exitDeepBtn) exitDeepBtn.innerHTML = `🔤 파닉스 영어 기억방으로`;
        } else {
          if (deepBtn) deepBtn.innerHTML = `📚 달콤 그림 낱말 사전관 가기 ➔`;
          if (exitDeepBtn) exitDeepBtn.innerHTML = `📚 달콤 그림 낱말 사전관으로`;
        }
      } else {
        if (currentSubj === 'english') {
          if (deepBtn) deepBtn.innerHTML = `🔤 초5 영어 원어민 스피킹관(english.html) 가기 ➔`;
          if (exitDeepBtn) exitDeepBtn.innerHTML = `🔤 초5 영어 원어민 스피킹관으로`;
        } else if (currentSubj === 'math') {
          if (deepBtn) deepBtn.innerHTML = `🧮 5-2 분수 실전 훈련관(fractions_training) 가기 ➔`;
          if (exitDeepBtn) exitDeepBtn.innerHTML = `🧮 5-2 분수 실전 훈련관으로`;
        } else {
          if (deepBtn) deepBtn.innerHTML = `${currentQuest.icon} ${currentQuest.title} 심화관 가기 ➔`;
          if (exitDeepBtn) exitDeepBtn.innerHTML = `${currentQuest.icon} 과목 심화관으로`;
        }
      }

      renderQuestion();
    }

    function renderQuestion() {
      const q = currentQuest.questions[currentIndex];
      selectedOptionIndex = null;
      isAnswerChecked = false;

      // 헤더 상태 갱신
      document.getElementById('stepCounter').textContent = `문제 ${currentIndex + 1} / ${currentQuest.questions.length}`;
      document.getElementById('progressBar').style.width = `${((currentIndex + 1) / currentQuest.questions.length) * 100}%`;
      
      // 문제 텍스트 & 수식 (HTML 세로 분수 렌더링)
      document.getElementById('questionText').innerHTML = q.q;
      document.getElementById('formulaBox').innerHTML = q.formula;
      document.getElementById('cheerSpeech').textContent = isMinseo 
        ? `"민서야 힘내! 예쁜 별빛을 모아보자! 🌸"`
        : `"민수야 조금만 더 집중해봐! ⚡"`;

      // 오디오 버튼 제어 (영어 및 발음 지원 문제)
      const audioWrapper = document.getElementById('audioPlayWrapper');
      if (q.audioText) {
        audioWrapper.classList.remove('hidden');
      } else {
        audioWrapper.classList.add('hidden');
      }

      // 선택지 렌더링 (세로 분수 완벽 지원)
      const list = document.getElementById('choicesList');
      list.innerHTML = '';
      q.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = `jelly-btn w-full bg-lab-card/90 border-2 border-lab-card-border hover:border-neon-cyan/60 py-3 px-4 rounded-2xl flex items-center justify-between text-left text-sm font-bold shadow-md transition-all`;
        btn.id = `opt-${idx}`;
        btn.innerHTML = `
          <div class="flex items-center gap-3">
            <span class="w-6 h-6 rounded-full bg-lab-bg flex items-center justify-center text-xs font-eng text-gray-400 border border-lab-card-border">${idx + 1}</span>
            <span class="text-white text-base">${opt}</span>
          </div>
          <span class="material-symbols-outlined text-transparent text-lg check-icon">check_circle</span>
        `;
        btn.onclick = () => selectChoice(idx);
        list.appendChild(btn);
      });

      // 확인 버튼 초기화
      const checkBtn = document.getElementById('checkAnswerBtn');
      checkBtn.disabled = true;
      checkBtn.className = "jelly-btn w-full bg-neon-green text-[#023300] py-4 rounded-2xl text-center shadow-[0_6px_0_0_#045300] font-bold text-lg tracking-wide border border-[#55ff35] disabled:opacity-40 disabled:cursor-not-allowed";
      
      // 바텀시트 닫기
      document.getElementById('feedbackSheet').classList.add('hidden');
    }

    // 원어민 발음 듣기 (Cloudflare Edge-TTS 실시간 스트리밍 Jenny 원어민 음성)
    function playQuestionAudio() {
      const q = currentQuest.questions[currentIndex];
      if (!q || !q.audioText) return;
      playSound('tap');
      if (typeof speakFairyTTS === 'function') {
        speakFairyTTS(q.audioText, { forceVoice: 'en-US-JennyNeural' });
      } else if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(q.audioText);
        utter.lang = 'en-US';
        utter.rate = 0.85; // 또렷한 아동용 원어민 리스닝 속도
        const voices = window.speechSynthesis.getVoices();
        const enVoice = voices.find(v => v.lang.startsWith('en') && (v.name.includes('Natural') || v.name.includes('Jenny') || v.name.includes('Google') || v.name.includes('Samantha')));
        if (enVoice) utter.voice = enVoice;
        window.speechSynthesis.speak(utter);
      }
    }

    // 보기 선택
    function selectChoice(index) {
      if (isAnswerChecked) return;
      playSound('tap');
      selectedOptionIndex = index;

      currentQuest.questions[currentIndex].options.forEach((_, idx) => {
        const el = document.getElementById(`opt-${idx}`);
        const icon = el.querySelector('.check-icon');
        if (idx === index) {
          el.classList.add('border-neon-green', 'bg-neon-green/10');
          el.classList.remove('border-lab-card-border');
          icon.classList.remove('text-transparent');
          icon.classList.add('text-neon-green');
        } else {
          el.classList.remove('border-neon-green', 'bg-neon-green/10');
          el.classList.add('border-lab-card-border');
          icon.classList.add('text-transparent');
          icon.classList.remove('text-neon-green');
        }
      });

      document.getElementById('checkAnswerBtn').disabled = false;
    }

    // 정답 확인
    function handleCheckAnswer() {
      if (selectedOptionIndex === null || isAnswerChecked) return;
      isAnswerChecked = true;

      const q = currentQuest.questions[currentIndex];
      const isCorrect = selectedOptionIndex === q.answer;

      const sheet = document.getElementById('feedbackSheet');
      const box = document.getElementById('feedbackBox');
      const title = document.getElementById('feedbackTitle');
      const desc = document.getElementById('feedbackDesc');
      const nextBtn = document.getElementById('nextStepBtn');
      const iconWrap = document.getElementById('feedbackIconWrapper');
      const monster = document.getElementById('cheerMonster');

      sheet.classList.remove('hidden');

      if (isCorrect) {
        playSound('correct');
        recordCorrectItem(currentSubj, q);

        if (typeof speakFairyTTS === 'function') {
          speakFairyTTS("정답이야! 대단해!");
        }

        monster.classList.remove('victory-jump');
        void monster.offsetWidth;
        monster.classList.add('victory-jump');

        box.className = "max-w-md mx-auto p-5 rounded-t-3xl shadow-2xl border-t-4 border-neon-green bg-[#112d14] text-white space-y-3";
        title.textContent = "대단해! 정답이야! 🎉";
        title.className = "text-base font-bold text-neon-green";
        desc.textContent = "+10 EXP / +3 🪙 획득!";
        iconWrap.textContent = "✨";
        iconWrap.className = "w-10 h-10 rounded-full bg-neon-green/20 text-neon-green flex items-center justify-center text-xl";
        nextBtn.className = "jelly-btn w-full py-3.5 rounded-2xl font-bold text-base text-center bg-neon-green text-[#023300] shadow-[0_4px_0_0_#045300]";
      } else {
        playSound('wrong');
        recordWrongItem(currentSubj, q);
        if (!sessionMissedQuestions.some(m => m.q === q.q)) {
          sessionMissedQuestions.push(q);
        }

        if (typeof speakFairyTTS === 'function') {
          speakFairyTTS("아쉬워! 다시 힘내보자!");
        }

        // 📝 노션 오답 리포트용 상세 로그 수집
        sessionWrongLogs.push({
          q: q.q,
          chosen: q.options[selectedOptionIndex] || "선택지 확인",
          answer: q.options[q.answer] || ""
        });

        hearts = Math.max(0, hearts - 1);
        updateHearts();

        box.className = "max-w-md mx-auto p-5 rounded-t-3xl shadow-2xl border-t-4 border-fire-orange bg-[#331811] text-white space-y-3";
        title.textContent = "아까워요! 💡";
        title.className = "text-base font-bold text-fire-orange";
        desc.innerHTML = `정답 해설: ${q.hint}`;
        iconWrap.textContent = "💔";
        iconWrap.className = "w-10 h-10 rounded-full bg-fire-orange/20 text-fire-orange flex items-center justify-center text-xl";
        nextBtn.className = "jelly-btn w-full py-3.5 rounded-2xl font-bold text-base text-center bg-fire-orange text-white shadow-[0_4px_0_0_#602a00]";
      }
    }

    function updateHearts() {
      const hStr = "❤️".repeat(hearts) + "🖤".repeat(3 - hearts);
      document.getElementById('heartIcons').textContent = hStr;
    }

    // 다음 문제로 이동 (오답 발생 시 리벤지 배틀 트리거)
    function goToNextStep() {
      playSound('tap');
      if (currentIndex + 1 < currentQuest.questions.length) {
        currentIndex++;
        renderQuestion();
      } else {
        if (sessionMissedQuestions.length > 0 && !isRevengeMode) {
          showRevengeModal();
        } else {
          showClearModal();
        }
      }
    }

    // ⚔️ 몬스터 리벤지 배틀 모달 표시
    function showRevengeModal() {
      playSound('wrong');
      const modal = document.getElementById('revengeModal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    // ⚔️ 놓친 문제 즉시 복수전 시작 (당일 100% 구출 성공)
    function startRevengeRound() {
      playSound('tap');
      document.getElementById('revengeModal').classList.add('hidden');
      document.getElementById('revengeModal').classList.remove('flex');
      isRevengeMode = true;
      currentQuest = {
        title: `⚔️ ${currentQuest.title} · 리벤지 배틀`,
        icon: "👾",
        questions: [...sessionMissedQuestions]
      };
      sessionMissedQuestions = [];
      currentIndex = 0;
      hearts = 3;
      updateHearts();
      renderQuestion();
    }

    // 복수전 스킵하고 클리어 모달로
    function skipRevengeAndClear() {
      playSound('tap');
      document.getElementById('revengeModal').classList.add('hidden');
      document.getElementById('revengeModal').classList.remove('flex');
      showClearModal();
    }

    // 5문제 완독 모달 (노션 인벤토리 보상 DB + 노션 학습일지 DB 자동 전송)
    async function showClearModal() {
      playSound('fanfare');
      if (typeof speakFairyTTS === 'function') {
        speakFairyTTS("퀘스트 완료!");
      }
      const modal = document.getElementById('clearModal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');

      const koreanSubjMap = {
        math: "수학",
        english: "영어",
        korean: "국어",
        science: "과학",
        society: "사회"
      };
      const curKoreanSubj = koreanSubjMap[currentSubj] || "영어";

      // 💎 1. 노션 인벤토리 DB 연동 (보상 +3💎, +50 EXP 지급)
      if (typeof grantRewardAndShowUI === 'function') {
        try {
          window.currentSubject = curKoreanSubj;
          await grantRewardAndShowUI(3, true);
          console.log(`[노션 인벤토리 동기화 완료] ${curKoreanSubj} 보상 +3💎 및 EXP 반영`);
        } catch (e) {
          console.warn("[노션 보상 동기화 알림]", e);
        }
      }

      // 📝 2. 노션 학습일지 DB 연동 (오답 리포트 수집 및 5분 소요시간 전송)
      if (typeof sendStudyLogToNotion === 'function') {
        try {
          const missedSummary = sessionWrongLogs.length > 0
            ? sessionWrongLogs.map(item => `${item.q} (선택: ${item.chosen})`).join(' // ')
            : "오답 없음 (100% 마스터)";

          await sendStudyLogToNotion({
            subject: curKoreanSubj,
            durationMinutes: 5,
            errorReport: missedSummary
          });
          console.log(`[노션 학습일지 동기화 완료] 과목: ${curKoreanSubj} | 오답: ${missedSummary}`);
        } catch (e) {
          console.warn("[노션 학습일지 동기화 알림]", e);
        }
      }
    }

    function returnToLab() {
      playSound('tap');
      window.location.href = `monster_lab.html?user=${currentUser}`;
    }

    // 🎯 과목별 심화 실전 훈련관으로 직결 (수학: 분수관, 영어: 스피킹관, 기타: 과목 메인)
    function goToSubjectDeepTraining() {
      playSound('tap');
      if (isMinseo) {
        if (currentSubj === 'korean') {
          window.location.href = 'kids/subjects/korean/korean.html';
        } else if (currentSubj === 'english') {
          window.location.href = 'kids/subjects/english/english.html';
        } else {
          window.location.href = 'kids/subjects/math/math.html';
        }
      } else {
        if (currentSubj === 'english') {
          window.location.href = 'kids/subjects/english/english.html';
        } else if (currentSubj === 'math') {
          window.location.href = 'kids/subjects/math/fractions_training.html';
        } else {
          window.location.href = `kids/subjects/${currentSubj}/${currentSubj}.html`;
        }
      }
    }
    const goToMathDeepTraining = goToSubjectDeepTraining;

    // 🏠 공부방 메인 로비로 직결
    function goToLobby() {
      playSound('tap');
      window.location.href = `lobby.html?user=${currentUser}`;
    }

    function confirmExit() {
      playSound('tap');
      const modal = document.getElementById('exitModal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeExitModal() {
      playSound('tap');
      const modal = document.getElementById('exitModal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    // 초기 실행
    window.addEventListener('DOMContentLoaded', initScreen);
  </script>
