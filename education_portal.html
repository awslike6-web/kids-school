    <style>
        :root {
            --bg-color: #f0f4f8;

        body {
            font-family: 'Malgun Gothic', sans-serif;

            margin: 0;
            padding: 0;

        }

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            text-decoration: none;
            padding: 20px;
            border-radius: 15px;
            font-size: 22px;
            font-weight: bold;
            color: white;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .menu-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.15);

        .btn-english { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); }

        .btn-korean { background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%); color: #2c3e50; }
